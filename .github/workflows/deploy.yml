# =====================================================================
#  Corelith / Huchu docs — Deploy (PLACEHOLDER)
# =====================================================================
#  Vercel is wired directly to the repository's `main` branch via the
#  Vercel GitHub integration — every push to main triggers a production
#  build there, NOT in GitHub Actions. This file exists so contributors
#  can find the deploy story in one obvious place.
#
#  If we ever move off Vercel (or want CI-driven deploys for previews
#  that are not handled by the Vercel bot), replace this no-op job with
#  the real workflow. A reasonable starting point is below, commented.
# =====================================================================
name: deploy

on:
  push:
    branches: [main]

jobs:
  noop:
    name: vercel handles this
    runs-on: ubuntu-latest
    steps:
      - name: Note
        run: |
          echo "::notice::Production deploy is handled by the Vercel GitHub integration."
          echo "::notice::See https://vercel.com/ for the dashboard."
          echo "::notice::If you need CI-driven deploys, replace this job."

