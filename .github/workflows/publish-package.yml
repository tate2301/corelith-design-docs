name: Publish @corelithzw/react

# Publishes the React package to the public npm registry when:
#   - Push to main touches packages/react/** AND the version in
#     packages/react/package.json hasn't already been published.
#   - A tag matching corelith-v* is pushed.
#   - The workflow is dispatched manually.
#
# The job is a no-op if the current version is already on the registry,
# so re-running on green is safe.

on:
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - '.github/workflows/publish-package.yml'
    tags:
      - 'corelith-v*'
  workflow_dispatch:

permissions:
  contents: write   # required to push the corelith-vX.Y.Z tag + create the Release

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@corelithzw'

      - name: Read package version
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Resolved $name@$version"

      - name: Skip if version already published
        id: skip
        run: |
          name='${{ steps.pkg.outputs.name }}'
          version='${{ steps.pkg.outputs.version }}'
          if npm view "$name" versions --json 2>/dev/null | grep -q "\"$version\""; then
            echo "$name@$version is already on the registry — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: npm install --no-audit --no-fund --no-workspaces

      - name: Build
        if: steps.skip.outputs.skip != 'true'
        run: npm run build

      - name: Test
        if: steps.skip.outputs.skip != 'true'
        run: npm test

      - name: Verify CDN bundle exposes window.Corelith
        if: steps.skip.outputs.skip != 'true'
        run: |
          if ! grep -q "Corelith" dist/cdn.global.js; then
            echo "::error::dist/cdn.global.js does not expose 'Corelith' — build is stale or misconfigured."
            exit 1
          fi
          echo "OK — dist/cdn.global.js references Corelith."

      - name: Verify npm token is configured
        if: steps.skip.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN repository secret. Create an npm automation token with publish access for @corelithzw/react."
            exit 1
          fi

      - name: Publish to npm
        if: steps.skip.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      # ── Tag + Release ─────────────────────────────────────────
      # After a successful publish we cut `corelith-vX.Y.Z` and a matching
      # GitHub Release. The release body comes from the CHANGELOG.md section
      # for this version; if the helper can't find one we fall back to a
      # generic body so the release still lands.
      - name: Extract release notes from CHANGELOG
        id: notes
        if: steps.skip.outputs.skip != 'true'
        run: |
          version='${{ steps.pkg.outputs.version }}'
          if body=$(node scripts/extract-changelog-section.mjs "$version" 2>/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              echo "$body"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag + GitHub Release
        if: steps.skip.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const name = '${{ steps.pkg.outputs.name }}';
            const version = '${{ steps.pkg.outputs.version }}';
            const tag = `corelith-v${version}`;
            const sha = context.sha;

            // Tag — idempotent: if it exists already on this sha, skip.
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Created tag ${tag} on ${sha}`);
            } catch (e) {
              if (String(e.message).includes('Reference already exists')) {
                core.info(`Tag ${tag} already exists — leaving it.`);
              } else {
                throw e;
              }
            }

            // Release body — prefer the CHANGELOG section, fall back gracefully.
            const installSnippet = [
              '```bash',
              `npm install ${name}@${version}`,
              '```',
            ].join('\n');

            let body;
            if (process.env.NOTES_FOUND === 'true' && process.env.NOTES_BODY) {
              body = `${process.env.NOTES_BODY}\n\n---\n\n### Install\n${installSnippet}`;
            } else {
              body = [
                `Released \`${name}@${version}\` to the public npm registry.`,
                ``,
                `### Install`,
                installSnippet,
                ``,
                `View on [npm](https://www.npmjs.com/package/${encodeURIComponent(name).replace('%40', '@')}).`,
              ].join('\n');
            }

            // Release — idempotent: if it exists, update it; otherwise create.
            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `${name} ${version}`,
                body,
                draft: false,
                prerelease: /-(alpha|beta|rc)/.test(version),
              });
              core.info(`Updated existing release ${tag}`);
            } catch (e) {
              if (e.status === 404) {
                const created = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${name} ${version}`,
                  body,
                  draft: false,
                  prerelease: /-(alpha|beta|rc)/.test(version),
                });
                core.info(`Created release ${tag} → ${created.data.html_url}`);
              } else {
                throw e;
              }
            }

      - name: Announce on commit
        if: steps.skip.outputs.skip != 'true' && github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ steps.pkg.outputs.name }}';
            const version = '${{ steps.pkg.outputs.version }}';
            const sha = context.sha;
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/corelith-v${version}`;
            const body = [
              `Published \`${name}@${version}\` to the public npm registry.`,
              ``,
              `**Release:** ${releaseUrl}`,
              ``,
              `Install:`,
              '```bash',
              `npm install ${name}@${version}`,
              '```',
              ``,
              `View on [npm](https://www.npmjs.com/package/${encodeURIComponent(name).replace('%40', '@')}).`,
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body,
            });
