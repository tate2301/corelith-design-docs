name: Publish @corelithzw/react

# Publishes the React package to public npm (registry.npmjs.org).
#
# Triggers:
#   - Push to main that touches packages/react/** (skips publish if the
#     current version is already on npm; the tag + release steps still
#     run idempotently).
#   - A tag matching corelith-v* is pushed.
#   - The workflow is dispatched manually.
#
# Requires the NPM_TOKEN repo secret (a granular access token scoped to
# the @corelithzw scope on npmjs.com, with read+write on packages). The
# workflow fails loudly if it is missing — there is no silent skip.

on:
  push:
    branches: [main]
    paths:
      - 'packages/react/**'
      - '.github/workflows/publish-package.yml'
    tags:
      - 'corelith-v*'
  workflow_dispatch:

permissions:
  contents: write   # required to push the corelith-vX.Y.Z tag + create the Release

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@corelithzw'

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          if [ "$NPM_TOKEN_SET" != "true" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it under Settings → Secrets and variables → Actions before this workflow can publish."
            exit 1
          fi

      - name: Read package version
        id: pkg
        run: |
          version=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Resolved $name@$version"

      - name: Check if version is already on npm
        id: skip
        run: |
          name='${{ steps.pkg.outputs.name }}'
          version='${{ steps.pkg.outputs.version }}'
          if npm view "$name" versions --json 2>/dev/null | grep -q "\"$version\""; then
            echo "$name@$version already published — will skip publish step."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is new — will publish."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-workspaces

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify CDN bundle exposes window.Corelith
        run: |
          if ! grep -q "Corelith" dist/cdn.global.js; then
            echo "::error::dist/cdn.global.js does not expose 'Corelith' — build is stale or misconfigured."
            exit 1
          fi
          echo "OK — dist/cdn.global.js references Corelith."

      - name: Publish to npm
        if: steps.skip.outputs.skip != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version='${{ steps.pkg.outputs.version }}'
          if body=$(node scripts/extract-changelog-section.mjs "$version" 2>/dev/null); then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo 'body<<EOF'
              echo "$body"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag + GitHub Release
        uses: actions/github-script@v7
        env:
          NOTES_FOUND: ${{ steps.notes.outputs.found }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
        with:
          script: |
            const name = '${{ steps.pkg.outputs.name }}';
            const version = '${{ steps.pkg.outputs.version }}';
            const tag = `corelith-v${version}`;
            const sha = context.sha;

            // Tag — idempotent: if it exists already on this sha, skip.
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha,
              });
              core.info(`Created tag ${tag} on ${sha}`);
            } catch (e) {
              if (String(e.message).includes('Reference already exists')) {
                core.info(`Tag ${tag} already exists — leaving it.`);
              } else {
                throw e;
              }
            }

            const installBlock = '### Install\n\n```bash\nnpm install ' + name + '@' + version + '\n```';
            let body;
            if (process.env.NOTES_FOUND === 'true' && process.env.NOTES_BODY) {
              body = `${process.env.NOTES_BODY}\n\n---\n\n${installBlock}`;
            } else {
              body = [
                `Released \`${name}@${version}\`.`,
                ``,
                installBlock,
              ].join('\n');
            }

            // Release — idempotent: if it exists, update it; otherwise create.
            try {
              const release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name: `${name} ${version}`,
                body,
                draft: false,
                prerelease: /-(alpha|beta|rc)/.test(version),
              });
              core.info(`Updated existing release ${tag}`);
            } catch (e) {
              if (e.status === 404) {
                const created = await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  name: `${name} ${version}`,
                  body,
                  draft: false,
                  prerelease: /-(alpha|beta|rc)/.test(version),
                });
                core.info(`Created release ${tag} → ${created.data.html_url}`);
              } else {
                throw e;
              }
            }

      - name: Announce on commit
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const name = '${{ steps.pkg.outputs.name }}';
            const version = '${{ steps.pkg.outputs.version }}';
            const sha = context.sha;
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/corelith-v${version}`;
            const body = [
              `Published \`${name}@${version}\` to npm.`,
              ``,
              `**Release:** ${releaseUrl}`,
              ``,
              `**Install:** \`npm install ${name}@${version}\``,
            ].join('\n');
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
              body,
            });
