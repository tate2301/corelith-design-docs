<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<script src="../../portal-kit-nav.js" defer></script>
<style>
  body { background: var(--gray-100, #F1F3F6); margin: 0; }

  /* === App shell === */
  .ad-stage { background: var(--gray-100, #F1F3F6); min-height: calc(100vh - 47px); padding: 24px; display: grid; place-items: center; }
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .ad-stage { padding: 0; min-height: 100vh; }
  body.is-fullscreen .ad-frame { width: 100vw; height: 100vh; border-radius: 0; border: 0; box-shadow: none; }
  body.is-fullscreen .ad-frame .ad-chrome { display: none; }

  .ad-frame {
    width: 1280px; height: 760px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 30px 60px -20px rgba(22,24,29,0.18);
    overflow: hidden; display: flex; flex-direction: column; flex: none;
  }
  .ad-frame .ad-chrome {
    height: 32px; background: #1A1D24; display: flex; align-items: center; gap: 6px; padding: 0 12px; flex: none;
  }
  .ad-frame .ad-chrome .d { width: 9px; height: 9px; border-radius: 50%; background: #444; flex: none; }
  .ad-frame .ad-chrome .url { margin-left: 14px; padding: 4px 10px; background: rgba(255,255,255,0.06); border-radius: 6px; color: rgba(255,255,255,0.6); font: 500 11px/1 var(--font-mono); flex: 1; max-width: 540px; }
  .ad-frame .ad-chrome .fs { margin-left: auto; padding: 4px 10px; border-radius: 6px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); font: 500 11px/1 var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; border: 0; }
  .ad-frame .ad-chrome .fs:hover { background: rgba(255,255,255,0.16); color: #fff; }
  .ad-frame .ad-screen { flex: 1; background: var(--canvas); display: flex; overflow: hidden; min-height: 0; position: relative; }

  /* === Side rail === */
  .ad-side {
    width: 220px; flex: none; background: var(--canvas); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 16px 12px; min-height: 0;
  }
  .ad-side.dark { background: var(--ink); border-right-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.85); }
  .ad-side .brand { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px; font: 600 15px/1 var(--font-sans); color: var(--text-strong); margin-bottom: 12px; }
  .ad-side.dark .brand { color: #fff; }
  .ad-side .brand .mark { width: 22px; height: 22px; color: var(--brand); display: inline-flex; }
  .ad-side nav { display: grid; gap: 2px; }
  .ad-side .navlink {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px;
    font: 500 13.5px/1 var(--font-sans); color: var(--text-body); text-decoration: none;
    background: transparent; border: 0; cursor: pointer; width: 100%; text-align: left;
  }
  .ad-side .navlink:hover { background: var(--surface-muted); color: var(--text-strong); }
  .ad-side .navlink.active { background: var(--brand-soft); color: var(--brand-strong); }
  .ad-side .navlink svg { width: 16px; height: 16px; color: var(--text-muted); flex: none; }
  .ad-side .navlink.active svg { color: var(--brand); }
  .ad-side.dark .navlink { color: rgba(255,255,255,0.78); }
  .ad-side.dark .navlink:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .ad-side.dark .navlink.active { background: var(--brand); color: #fff; }
  .ad-side.dark .navlink svg { color: rgba(255,255,255,0.6); }
  .ad-side.dark .navlink.active svg { color: #fff; }
  .ad-side .section-h { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); padding: 14px 10px 8px; }
  .ad-side.dark .section-h { color: rgba(255,255,255,0.4); }

  /* Tenant switcher */
  .ad-side .tenant-btn {
    margin: 0; padding: 9px 10px; border-radius: 7px;
    display: flex; align-items: center; gap: 9px; width: 100%;
    background: var(--surface-muted); color: var(--text-strong);
    font: 500 13px/1.2 var(--font-sans); text-align: left; border: 0; cursor: pointer; position: relative;
  }
  .ad-side .tenant-btn:hover { background: var(--surface-sunken); }
  .ad-side.dark .tenant-btn { background: rgba(255,255,255,0.06); color: #fff; }
  .ad-side.dark .tenant-btn:hover { background: rgba(255,255,255,0.1); }
  .ad-side .tenant-btn .ic-t { width: 26px; height: 26px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; flex: none; font: 700 11px/1 var(--font-sans); }
  .ad-side .tenant-btn .nm { font: 600 12.5px/1.2 var(--font-sans); }
  .ad-side .tenant-btn .sb { font: 11px/1.2 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .ad-side.dark .tenant-btn .sb { color: rgba(255,255,255,0.5); }
  .ad-side .tenant-btn .arr { margin-left: auto; color: var(--text-muted); }
  .ad-side.dark .tenant-btn .arr { color: rgba(255,255,255,0.5); }

  .ad-side .tenant-menu {
    position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 14px 30px -10px rgba(22,24,29,0.25); padding: 6px;
    z-index: 30; display: none;
  }
  .ad-side.dark .tenant-menu { background: var(--ink-soft, #262A33); border-color: rgba(255,255,255,0.1); }
  .ad-side .tenant-menu.open { display: block; }
  .ad-side .tenant-menu button {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    width: 100%; text-align: left; border-radius: 6px; background: transparent;
    color: var(--text-strong); font: 500 13px/1.3 var(--font-sans); cursor: pointer; border: 0;
  }
  .ad-side .tenant-menu button:hover { background: var(--surface-muted); }
  .ad-side.dark .tenant-menu button { color: #fff; }
  .ad-side.dark .tenant-menu button:hover { background: rgba(255,255,255,0.08); }
  .ad-side .tenant-menu button.cur { background: var(--brand-soft); color: var(--brand-strong); }
  .ad-side.dark .tenant-menu button.cur { background: var(--brand); color: #fff; }

  .ad-side .ps-foot { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; padding: 12px 10px 4px; }
  .ad-side.dark .ps-foot { border-top-color: rgba(255,255,255,0.08); }
  .ad-side .ps-foot .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .ad-side .ps-foot .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .ad-side .ps-foot .sb { font: 11px/1.2 var(--font-sans); color: var(--text-muted); }
  .ad-side.dark .ps-foot .nm { color: #fff; }
  .ad-side.dark .ps-foot .sb { color: rgba(255,255,255,0.55); }

  /* === Main content === */
  .ad-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--canvas); }
  body.dark-theme .ad-main { background: #0F1115; color: #E4E7EC; }
  body.dark-theme .ad-frame { background: #0F1115; }
  body.dark-theme .ad-frame .ad-screen { background: #0F1115; }
  body.dark-theme .ad-side { background: #16181D; border-right-color: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  body.dark-theme .ad-side .brand { color: #fff; }
  body.dark-theme .ad-side .navlink { color: rgba(255,255,255,0.78); }
  body.dark-theme .ad-side .navlink:hover { background: rgba(255,255,255,0.05); color: #fff; }
  body.dark-theme .ad-side .navlink.active { background: var(--brand); color: #fff; }
  body.dark-theme .ad-side .section-h { color: rgba(255,255,255,0.4); }
  body.dark-theme .ad-side .ps-foot { border-top-color: rgba(255,255,255,0.06); }
  body.dark-theme .ad-side .ps-foot .nm { color: #fff; }
  body.dark-theme .ad-side .ps-foot .sb { color: rgba(255,255,255,0.55); }
  body.dark-theme .ad-side .tenant-btn { background: rgba(255,255,255,0.05); color: #fff; }
  body.dark-theme .ad-side .tenant-btn .sb { color: rgba(255,255,255,0.55); }

  .ad-top { display: flex; align-items: center; gap: 14px; padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--surface); flex: none; }
  body.dark-theme .ad-top { background: #16181D; border-bottom-color: rgba(255,255,255,0.06); }
  .ad-top h1 { font: 700 20px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; letter-spacing: -0.01em; }
  body.dark-theme .ad-top h1 { color: #fff; }
  .ad-top .crumb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); }
  body.dark-theme .ad-top .crumb { color: rgba(255,255,255,0.5); }
  .ad-top .spacer { flex: 1; }
  .ad-top .pill { padding: 4px 10px; border-radius: 9999px; background: var(--surface-muted); font: 500 12px/1 var(--font-sans); color: var(--text-muted); }
  .ad-top .pill.brand { background: var(--brand-soft); color: var(--brand-strong); }
  body.dark-theme .ad-top .pill { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); }
  body.dark-theme .ad-top .pill.brand { background: var(--brand-soft); color: var(--brand-strong); }
  .ad-top .btn-pri { padding: 8px 14px; border-radius: 8px; background: var(--brand); color: #fff; font: 500 13px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; }
  .ad-top .btn-pri:hover { background: var(--brand-strong); }
  .ad-top .btn-alt { padding: 8px 12px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); font: 500 12.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; }
  .ad-top .btn-alt:hover { background: var(--surface-sunken); }
  body.dark-theme .ad-top .btn-alt { background: rgba(255,255,255,0.06); color: #fff; }
  body.dark-theme .ad-top .btn-alt:hover { background: rgba(255,255,255,0.12); }

  .ad-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

  /* === Dashboard === */
  .dash-body { padding: 22px 28px; flex: 1; overflow-y: auto; display: grid; gap: 18px; grid-template-columns: 1fr 360px; grid-template-areas: "kpi snap" "health snap" "audit audit"; align-content: start; }
  body.dark-theme .dash-body { background: #0F1115; }
  .kpi-grid { grid-area: kpi; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 16px; }
  body.dark-theme .kpi { background: #16181D; border-color: rgba(255,255,255,0.08); }
  .kpi .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); }
  body.dark-theme .kpi .lbl { color: rgba(255,255,255,0.45); }
  .kpi .val { font: 700 24px/1.05 var(--font-sans); color: var(--text-strong); margin-top: 10px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  body.dark-theme .kpi .val { color: #fff; }
  .kpi .delta { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font: 500 12px/1 var(--font-sans); }
  .kpi .delta.up { color: var(--tone-success); }
  .kpi .delta.down { color: var(--tone-danger); }
  .kpi .delta.flat { color: var(--text-muted); }

  .health { grid-area: health; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; align-items: center; }
  body.dark-theme .health { background: #16181D; border-color: rgba(255,255,255,0.08); }
  .health .item .lb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); }
  body.dark-theme .health .item .lb { color: rgba(255,255,255,0.45); }
  .health .item .vv { font: 600 16px/1.2 var(--font-mono); color: var(--text-strong); margin-top: 6px; }
  body.dark-theme .health .item .vv { color: #fff; }
  .health .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tone-success); display: inline-block; margin-right: 6px; vertical-align: middle; }
  .health .dot.warn { background: var(--tone-warn); }

  .audit-card { grid-area: audit; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: clip; }
  body.dark-theme .audit-card { background: #16181D; border-color: rgba(255,255,255,0.08); }
  .audit-card .h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); }
  body.dark-theme .audit-card .h { border-bottom-color: rgba(255,255,255,0.06); }
  .audit-card .h h3 { font: 600 14px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; }
  body.dark-theme .audit-card .h h3 { color: #fff; }
  .audit-card .h .sb { font: 12px/1 var(--font-sans); color: var(--text-muted); margin-left: 10px; }
  .audit-card .h .spacer { flex: 1; }
  .audit-card .h a { font: 500 12.5px/1 var(--font-sans); color: var(--brand-strong); text-decoration: none; cursor: pointer; }
  .audit-row-d { display: grid; grid-template-columns: 88px 30px 1fr 120px 100px; gap: 12px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--border-subtle); font: 13px/1.4 var(--font-sans); }
  body.dark-theme .audit-row-d { border-bottom-color: rgba(255,255,255,0.05); }
  .audit-row-d:last-child { border-bottom: 0; }
  .audit-row-d .ts { font: 12px/1.2 var(--font-mono); color: var(--text-muted); }
  .audit-row-d .av { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); }
  .audit-row-d .ev { color: var(--text-strong); }
  body.dark-theme .audit-row-d .ev { color: #fff; }
  .audit-row-d .ev .who { color: var(--text-muted); }
  .audit-row-d .ip { font: 12px/1.2 var(--font-mono); color: var(--text-muted); }
  .audit-row-d .sev { display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11px/1 var(--font-sans); justify-self: end; }
  .audit-row-d .sev.info { background: var(--surface-muted); color: var(--text-muted); }
  .audit-row-d .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .audit-row-d .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }

  .snap { grid-area: snap; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; align-self: start; }
  body.dark-theme .snap { background: #16181D; border-color: rgba(255,255,255,0.08); }
  .snap .h { display: flex; align-items: center; gap: 10px; }
  .snap .h .ic { width: 36px; height: 36px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; }
  .snap .h .nm { font: 600 15px/1.2 var(--font-sans); color: var(--text-strong); }
  body.dark-theme .snap .h .nm { color: #fff; }
  .snap .h .sb { font: 12px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .snap .row { display: flex; justify-content: space-between; align-items: baseline; font: 13px/1.4 var(--font-sans); }
  .snap .row .k { color: var(--text-muted); }
  .snap .row .v { font: 500 13px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  body.dark-theme .snap .row .v { color: #fff; }
  .snap .seats { background: var(--surface-muted); border-radius: 10px; padding: 12px 14px; }
  body.dark-theme .snap .seats { background: rgba(255,255,255,0.04); }
  .snap .seats .top { display: flex; justify-content: space-between; font: 12px/1 var(--font-sans); color: var(--text-muted); }
  .snap .seats .bar { height: 6px; background: var(--surface-sunken); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  body.dark-theme .snap .seats .bar { background: rgba(255,255,255,0.08); }
  .snap .seats .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 4px; }
  .snap .seats .lab { display: flex; justify-content: space-between; font: 600 13px/1 var(--font-sans); color: var(--text-strong); margin-top: 8px; font-variant-numeric: tabular-nums; }
  body.dark-theme .snap .seats .lab { color: #fff; }
  .snap .cta { width: 100%; padding: 9px 12px; border-radius: 8px; background: var(--ink); color: #fff; font: 500 13px/1 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; }
  .snap .cta:hover { background: var(--ink-soft, #262A33); }

  /* === Users === */
  .filter-bar { display: flex; gap: 10px; padding: 12px 28px; border-bottom: 1px solid var(--border-subtle); background: var(--surface); align-items: center; flex: none; }
  body.dark-theme .filter-bar { background: #16181D; border-bottom-color: rgba(255,255,255,0.06); }
  .filter-bar .search { flex: 1; max-width: 380px; position: relative; }
  .filter-bar .search input { width: 100%; height: 34px; padding: 0 12px 0 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font: 13px var(--font-sans); outline: none; color: var(--text-strong); }
  .filter-bar .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .filter-bar .search > [data-icon] { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); }
  .filter-bar .chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 9999px; background: var(--surface-muted); font: 500 12.5px/1 var(--font-sans); color: var(--text-muted); cursor: pointer; border: 0; }
  .chip.active { background: var(--brand-soft); color: var(--brand-strong); }
  .chip .cn { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: 0.8; }
  .filter-bar .spacer { flex: 1; }

  .bulk-bar { display: flex; align-items: center; gap: 10px; padding: 10px 28px; background: var(--ink); color: #fff; font: 13px/1 var(--font-sans); flex: none; }
  .bulk-bar .ct { font: 600 13px/1 var(--font-sans); }
  .bulk-bar .spacer { flex: 1; }
  .bulk-bar button { padding: 6px 12px; border-radius: 7px; background: rgba(255,255,255,0.10); color: #fff; font: 500 12.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; }
  .bulk-bar button:hover { background: rgba(255,255,255,0.16); }
  .bulk-bar button.danger { background: rgba(255, 90, 90, 0.18); color: #FF9C9C; }
  .bulk-bar button.danger:hover { background: rgba(255, 90, 90, 0.28); }

  .users-split { flex: 1; display: grid; grid-template-columns: 1fr; overflow: hidden; min-height: 0; }
  .users-split.has-panel { grid-template-columns: 1fr 380px; }
  .table-wrap { overflow-y: auto; min-width: 0; }

  table.ut { width: 100%; border-collapse: collapse; font: 13.5px/1.4 var(--font-sans); background: var(--surface); }
  body.dark-theme table.ut { background: #16181D; color: #E4E7EC; }
  table.ut thead th { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; text-align: left; font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); z-index: 1; cursor: pointer; user-select: none; }
  body.dark-theme table.ut thead th { background: #16181D; border-bottom-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); }
  table.ut thead th .sort-ic { display: inline-block; margin-left: 4px; color: var(--text-subtle); font-size: 9px; }
  table.ut thead th.sorted { color: var(--text-strong); }
  body.dark-theme table.ut thead th.sorted { color: #fff; }
  table.ut td { padding: 10px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; cursor: pointer; }
  body.dark-theme table.ut td { border-bottom-color: rgba(255,255,255,0.05); }
  table.ut tr:hover td { background: var(--surface-muted); }
  body.dark-theme table.ut tr:hover td { background: rgba(255,255,255,0.04); }
  table.ut tr.sel td { background: var(--brand-50); }
  body.dark-theme table.ut tr.sel td { background: rgba(11,93,240,0.12); }
  table.ut .cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--border); background: var(--surface); display: inline-grid; place-items: center; vertical-align: middle; cursor: pointer; }
  table.ut .cb.checked { background: var(--brand); border-color: var(--brand); color: #fff; }
  table.ut .who { display: flex; align-items: center; gap: 10px; }
  table.ut .av { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); flex: none; }
  table.ut .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  body.dark-theme table.ut .nm { color: #fff; }

  /* === Drawer (side panel for user detail / invite / etc) === */
  .drawer-scrim {

    z-index: 40; opacity: 0; pointer-events: none; transition: opacity 200ms;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .ad-drawer {
    position: absolute; top: 0; bottom: 0; right: 0;
    width: 420px; max-width: 90%;
    background: var(--surface); border-left: 1px solid var(--border);
    box-shadow: -16px 0 36px -10px rgba(22,24,29,0.18);
    transform: translateX(100%); transition: transform 240ms cubic-bezier(0.2, 0, 0.1, 1);
    display: flex; flex-direction: column;
    z-index: 50;
  }
  body.dark-theme .ad-drawer { background: #16181D; border-left-color: rgba(255,255,255,0.08); color: #E4E7EC; }
  .ad-drawer.open { transform: translateX(0); }
  .ad-drawer .dh { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 12px; }
  body.dark-theme .ad-drawer .dh { border-bottom-color: rgba(255,255,255,0.08); }
  .ad-drawer .dh .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); }
  .ad-drawer .dh h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 6px 0 2px; }
  body.dark-theme .ad-drawer .dh h3 { color: #fff; }

  .ad-drawer .dh .close { margin-left: auto; width: 28px; height: 28px; border-radius: 7px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; border: 0; cursor: pointer; }
  .ad-drawer .dh .close:hover { background: var(--surface-sunken); }
  body.dark-theme .ad-drawer .dh .close { background: rgba(255,255,255,0.06); color: #fff; }
  .ad-drawer .db { padding: 16px 20px; flex: 1; overflow-y: auto; display: grid; gap: 14px; }
  .ad-drawer .field { display: grid; gap: 6px; }
  .ad-drawer .field label { font: 500 12px/1 var(--font-sans); color: var(--text-muted); }
  .ad-drawer .field input, .ad-drawer .field select, .ad-drawer .field textarea {
    width: 100%; height: 36px; border: 1px solid var(--border); border-radius: 8px;
    padding: 0 12px; background: var(--surface); font: 13px var(--font-sans); outline: none; color: var(--text-strong);
    box-sizing: border-box;
  }
  body.dark-theme .ad-drawer .field input, body.dark-theme .ad-drawer .field select, body.dark-theme .ad-drawer .field textarea { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); color: #fff; }
  .ad-drawer .field textarea { height: auto; padding: 10px 12px; resize: vertical; min-height: 72px; }
  .ad-drawer .field input:focus, .ad-drawer .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .ad-drawer .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ad-drawer .roles label { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font: 13px/1.3 var(--font-sans); color: var(--text-body); cursor: pointer; }
  .ad-drawer .roles label.on { border-color: var(--brand); background: var(--brand-50); color: var(--brand-strong); }
  body.dark-theme .ad-drawer .roles label { border-color: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75); }
  body.dark-theme .ad-drawer .roles label.on { background: rgba(11,93,240,0.18); color: #fff; border-color: var(--brand); }
  .ad-drawer .perm { font: 12px/1.5 var(--font-sans); color: var(--text-muted); background: var(--surface-muted); border-radius: 8px; padding: 10px 12px; }
  body.dark-theme .ad-drawer .perm { background: rgba(255,255,255,0.05); }
  .ad-drawer .df { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  body.dark-theme .ad-drawer .df { border-top-color: rgba(255,255,255,0.08); }
  .ad-drawer .df .btn { flex: 1; padding: 10px 12px; border-radius: 8px; font: 500 13px/1 var(--font-sans); border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

  .ad-drawer .df .btn.danger { background: var(--tone-danger); color: #fff; }
  .ad-drawer .df .btn.danger:hover { background: #B91C1C; }

  /* User detail panel */

  .udetail .head { display: flex; align-items: center; gap: 12px; }
  .udetail .head .av { width: 52px; height: 52px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 18px/1 var(--font-sans); }

  body.dark-theme .udetail .head .nm { color: #fff; }

  /* === Audit === */
  .alert-banner { display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: var(--tone-danger-bg); color: var(--tone-danger); border-bottom: 1px solid var(--border-subtle); flex: none; }

  .filter-strip { display: flex; gap: 10px; padding: 12px 28px; border-bottom: 1px solid var(--border-subtle); background: var(--surface); align-items: center; flex-wrap: wrap; flex: none; }

  .at-wrap { flex: 1; overflow-y: auto; }

  body.dark-theme table.at { background: #16181D; color: #E4E7EC; }
  table.at thead th { position: sticky; top: 0; background: var(--surface); padding: 9px 14px; text-align: left; font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); border-bottom: 1px solid var(--border); z-index: 1; }
  body.dark-theme table.at thead th { background: #16181D; border-bottom-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); }
  table.at td { padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); vertical-align: middle; cursor: pointer; }
  body.dark-theme table.at td { border-bottom-color: rgba(255,255,255,0.05); }

  body.dark-theme table.at tr:hover td { background: rgba(255,255,255,0.04); }
  table.at tr.open td { background: var(--brand-50); }
  body.dark-theme table.at tr.open td { background: rgba(11,93,240,0.12); }
  table.at .ts { font: 12px/1.2 var(--font-mono); color: var(--text-muted); white-space: nowrap; }
  table.at .actor { display: flex; align-items: center; gap: 8px; }
  table.at .actor .av { width: 22px; height: 22px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 10px/1 var(--font-sans); flex: none; }
  table.at .actor .nm { font: 500 12.5px/1.2 var(--font-sans); color: var(--text-strong); }
  body.dark-theme table.at .actor .nm { color: #fff; }
  table.at .event { font: 13px/1.3 var(--font-sans); color: var(--text-strong); }
  body.dark-theme table.at .event { color: #fff; }
  table.at .event .tg { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--surface-muted); font: 11px/1.2 var(--font-mono); color: var(--text-muted); margin-left: 6px; }
  body.dark-theme table.at .event .tg { background: rgba(255,255,255,0.08); }
  table.at .ip { font: 12px/1.2 var(--font-mono); color: var(--text-muted); }
  table.at .sev { display: inline-flex; padding: 2px 7px; border-radius: 9999px; font: 500 11px/1 var(--font-sans); }
  table.at .sev.info { background: var(--surface-muted); color: var(--text-muted); }
  table.at .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  table.at .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }

  .diff-block { background: var(--ink); color: #E4E7EC; border-radius: 8px; padding: 12px 14px; font: 12px/1.55 var(--font-mono); white-space: pre-wrap; overflow-x: auto; word-break: break-word; }
  .diff-block .add { color: #6EE7A8; display: block; }
  .diff-block .rem { color: #FF9C9C; display: block; }
  .diff-block .neu { color: #B8C2D0; display: block; }

  /* === Billing === */
  .bill-body { padding: 22px 28px; flex: 1; overflow-y: auto; display: grid; gap: 18px; grid-template-columns: 1.5fr 1fr; grid-template-areas: "plan side" "invoices invoices"; align-content: start; }
  body.dark-theme .bill-body { background: #0F1115; }
  .plan-card { grid-area: plan; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  .plan-card .right { display: flex; flex-direction: column; gap: 18px; }

  .seat-card .sub { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 8px; }

  .estimate { background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deeper) 100%); color: #fff; border-radius: 12px; padding: 16px 18px; position: relative; overflow: hidden; }
  .estimate::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .estimate .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }

  .bill-side { grid-area: side; display: flex; flex-direction: column; gap: 14px; align-self: start; }
  .side-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  body.dark-theme .side-card { background: #16181D; border-color: rgba(255,255,255,0.08); }
  .side-card h3 { font: 600 14px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; }
  body.dark-theme .side-card h3 { color: #fff; }
  .pm { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--surface-muted); border-radius: 10px; }

  .pm .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }

  .side-card .add-btn { margin-top: 10px; padding: 8px 12px; border-radius: 7px; background: var(--surface-muted); color: var(--text-strong); font: 500 12.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px; border: 0; cursor: pointer; width: 100%; justify-content: center; }

  body.dark-theme .credit-row .v { color: #fff; }
  .credit-row .sub { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px; }

  .inv-row .num { font: 500 13px/1.2 var(--font-mono); color: var(--text-strong); }

/* ============================================================
   Toast & modal
   ============================================================ */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2600);
}

function openModal(html) { state.modal = html; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

function openConfirm({ title, body, confirmLabel = 'Confirm', danger = false, onConfirm }) {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${escapeHtml(title)}</h3>
      <p class="sub">${body}</p>
      <div class="acts">
        <button class="alt" data-cancel>Cancel</button>
        <button class="${danger ? 'danger' : 'ok'}" data-ok>${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `);
  $('[data-cancel]').addEventListener('click', closeModal);
  $('[data-ok]').addEventListener('click', () => { closeModal(); onConfirm && onConfirm(); });
}

  if (state.userFilter === 'invited')   list = list.filter(u => u.status === 'inv');
  if (state.userSearch) {
    const q = state.userSearch.toLowerCase();
    list = list.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.branch.toLowerCase().includes(q));
  }
  const k = state.userSort.key;
  const dir = state.userSort.dir === 'asc' ? 1 : -1;
  list.sort((a, b) => (a[k] || '').localeCompare(b[k] || '') * dir);
  return list;
}

/* ============================================================
   Wiring (per-route event listeners)
   ============================================================ */
function wire() {
  // Fullscreen
  const fs = $('#fs-btn'); if (fs) fs.addEventListener('click', toggleFullscreen);

  // Nav
  $$('[data-route]').forEach(b => b.addEventListener('click', () => go(b.dataset.route)));
  $$('[data-go]').forEach(b => b.addEventListener('click', (e) => { e.preventDefault(); go(b.dataset.go); }));

  // Tenant switcher
  const tt = $('#tenant-toggle');
  if (tt) tt.addEventListener('click', (e) => {
    e.stopPropagation();
    state.tenantMenuOpen = !state.tenantMenuOpen;
    render();
  });
  $$('[data-tenant]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = b.dataset.tenant;
    if (id === 'new') {
      state.tenantMenuOpen = false;
      toast('Tenant creation requires platform-owner role', 'warn');
      render();
      return;
    }
    const t = TENANTS.find(x => x.id === id);
    if (t) {
      state.tenant = t;
      state.tenantMenuOpen = false;
      toast(`Switched to ${t.name}`, 'success');
      render();
    }
  }));
  document.addEventListener('click', (e) => {
    if (state.tenantMenuOpen && !e.target.closest('#tenant-toggle, #tenant-menu')) {
      state.tenantMenuOpen = false;
      const m = $('#tenant-menu'); if (m) m.classList.remove('open');
    }
  }, { once: true });

  // Drawer scrim close
  const ds = $('#drawer-scrim'); if (ds) ds.addEventListener('click', closeDrawer);
  $$('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawer));

  switch (state.route) {
    case 'users':        wireUsers(); break;
    case 'audit':        wireAudit(); break;
    case 'billing':      wireBilling(); break;
    case 'integrations': wireIntegrations(); break;
    case 'settings':     wireSettings(); break;
  }
}

function closeDrawer() {
  state.userPanel = null;
  state.inviteOpen = false;
  state.integrationOpen = null;
  render();
}

/* === Users wiring === */
function wireUsers() {
  $$('[data-filter]').forEach(b => b.addEventListener('click', () => {
    state.userFilter = b.dataset.filter; render();
  }));
  const s = $('#user-search'); if (s) s.addEventListener('input', (e) => {
    state.userSearch = e.target.value;
    // Soft re-render to keep focus
    const list = filteredUsers();
    const tbody = $('table.ut tbody');
    if (tbody) {
      tbody.innerHTML = list.map(u => {
        const sel = state.userSelected.has(u.id);
        return `
          <tr class="${sel ? 'sel' : ''}" data-row="${u.id}">
            <td><span class="cb ${sel ? 'checked' : ''}" data-toggle="${u.id}">${sel ? '<span data-icon="check" data-icon-size="10"></span>' : ''}</span></td>
            <td><div class="who"><span class="av">${initials(u.name)}</span><div><div class="nm">${escapeHtml(u.name)}</div><div class="em">${escapeHtml(u.email)}</div></div></div></td>
            <td><span class="role ${u.role}">${escapeHtml(u.roleLabel)}</span></td>
            <td><span class="status ${u.status === 'sus' ? 'sus' : u.status === 'inv' ? 'inv' : ''}"><span class="d"></span>${u.status === 'sus' ? 'Suspended' : u.status === 'inv' ? 'Invited · 2d' : 'Active'}</span></td>
            <td class="last">${escapeHtml(u.last)}</td>
            <td class="branch">${escapeHtml(u.branch)}</td>
          </tr>
        `;
      }).join('');
      if (window.Icons) window.Icons.render(tbody);
      rewireRows();
    }
  });
  $$('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (state.userSort.key === k) state.userSort.dir = state.userSort.dir === 'asc' ? 'desc' : 'asc';
    else state.userSort = { key: k, dir: 'asc' };
    render();
  }));
  const inv = $('#invite-btn'); if (inv) inv.addEventListener('click', () => {
    state.inviteOpen = true; state.userPanel = null; state.integrationOpen = null; render();
  });

  // Invite drawer wire (if open)
  const send = $('#inv-send');
  if (send) {
    send.addEventListener('click', () => {
      const name = $('#inv-name').value.trim() || 'New invitee';
      const email = $('#inv-email').value.trim() || `${name.toLowerCase().replace(/\s+/g, '.')}@mukamba.co.zw`;
      const branch = $('#inv-branch').value;
      const roleEl = $('input[name="invrole"]:checked');
      const role = roleEl ? roleEl.value : 'op';
      const roleLabel = role === 'admin' ? 'Branch admin' : role === 'view' ? 'Read-only' : 'Operator';
      state.users.unshift({
        id: 'u_' + Math.random().toString(36).slice(2, 6),
        name, email, role, roleLabel, status: 'inv', last: '— never', branch,
      });
      closeDrawer();
      toast(`Invite sent to ${email}`, 'success');
    });
    $$('#inv-roles label').forEach(lab => lab.addEventListener('click', () => {
      $$('#inv-roles label').forEach(l => l.classList.remove('on'));
      lab.classList.add('on');
      const r = lab.querySelector('input').value;
      const perms = {
        admin: 'Branch admins manage their branch staff, pricing, and reports — they cannot change billing or tenant settings.',
        op: 'Operators can ring sales, accept payments, and run shift reports — but cannot edit pricing, items, or user accounts.',
        view: 'Viewers see dashboards, audit log, and invoices in read-only mode. Cannot perform any write action.',
      };
      $('#inv-perm').textContent = perms[r];
    }));
  }

  rewireRows();

  // Bulk
  $$('[data-bulk]').forEach(b => b.addEventListener('click', () => {
    const action = b.dataset.bulk;
    if (action === 'delete') {
      openConfirm({
        title: `Delete ${state.userSelected.size} users?`,
        body: 'This permanently removes the accounts and revokes their sessions. The audit log keeps a record.',
        confirmLabel: 'Delete',
        danger: true,
        onConfirm: () => {
          state.users = state.users.filter(u => !state.userSelected.has(u.id));
          const n = state.userSelected.size;
          state.userSelected.clear();
          toast(`${n} user(s) deleted`, 'success');
          render();
        }
      });
    } else if (action === 'disable') {
      state.users.forEach(u => { if (state.userSelected.has(u.id)) u.status = 'sus'; });
      const n = state.userSelected.size; state.userSelected.clear();
      toast(`${n} user(s) disabled`, 'success'); render();
    } else if (action === 'reset') {
      toast(`Password reset email sent to ${state.userSelected.size} users`, 'success');
    } else if (action === 'role') {
      toast('Role change scheduled — confirm via email link', 'success');
    }
  }));

  // User detail wire
  const edit = $('[data-edit-user]'); if (edit) edit.addEventListener('click', () => {
    state.userPanel.editing = true; render();
  });
  const cancel = $('[data-cancel-edit]'); if (cancel) cancel.addEventListener('click', () => {
    state.userPanel.editing = false; render();
  });
  const save = $('[data-save-edit]'); if (save) save.addEventListener('click', () => {
    const u = state.userPanel.user;
    u.name = $('#edit-name').value.trim() || u.name;
    u.email = $('#edit-email').value.trim() || u.email;
    u.branch = $('#edit-branch').value;
    const roleEl = $('input[name="urole"]:checked');
    if (roleEl) {
      u.role = roleEl.value;
      u.roleLabel = u.role === 'admin' ? 'Branch admin' : u.role === 'view' ? 'Read-only' : u.role === 'owner' ? 'Owner' : 'Operator';
    }
    state.userPanel.editing = false;
    toast('User updated', 'success');
    render();
  });
  const dis = $('[data-disable]'); if (dis) dis.addEventListener('click', () => {
    const id = dis.dataset.disable;
    openConfirm({
      title: 'Disable this user?',
      body: 'They will be signed out and unable to access any branch until reactivated.',
      confirmLabel: 'Disable',
      danger: true,
      onConfirm: () => {
        const u = state.users.find(x => x.id === id);
        if (u) u.status = 'sus';
        state.userPanel = null;
        toast('User disabled', 'success');
        render();
      }
    });
  });
}

function rewireRows() {
  $$('[data-row]').forEach(tr => tr.addEventListener('click', (e) => {
    if (e.target.closest('[data-toggle]')) return;
    const u = state.users.find(x => x.id === tr.dataset.row);
    if (!u) return;
    state.userPanel = { user: u, editing: false };
    state.inviteOpen = false;
    state.integrationOpen = null;
    render();
  }));
  $$('[data-toggle]').forEach(cb => cb.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = cb.dataset.toggle;
    if (state.userSelected.has(id)) state.userSelected.delete(id);
    else state.userSelected.add(id);
    render();
  }));
}

    const type = $('#pm-type').value;
    const num = $('#pm-num').value.trim() || '•••• •••• •••• ••••';
    const name = $('#pm-name').value.trim() || 'Tendai Ncube';
    state.payments.push({
      id: 'pm_' + Math.random().toString(36).slice(2, 6),
      brand: type === 'card' ? 'NMB Bank' : type === 'ecocash' ? 'EcoCash' : type === 'onemoney' ? 'OneMoney' : 'Bank transfer',
      sub: `${num.slice(-4).padStart(8, '••••')} · ${name}`,
      tag: '',
      cls: type === 'ecocash' ? 'ecocash' : '',
    });
    closeModal();
    toast('Payment method added', 'success');
    render();
  });
}

/* === Integrations wiring === */
function wireIntegrations() {
  $$('[data-cat]').forEach(b => b.addEventListener('click', () => {
    state.integrationCat = b.dataset.cat; render();
  }));
  $$('[data-int]').forEach(b => b.addEventListener('click', () => {
    state.integrationOpen = b.dataset.int;
    state.userPanel = null; state.inviteOpen = false;
    render();
  }));
  const ba = $('#browse-all'); if (ba) ba.addEventListener('click', (e) => {
    e.preventDefault(); state.browseAll = true; render();
  });
  const bb = $('[data-back-marketplace]'); if (bb) bb.addEventListener('click', () => {
    state.browseAll = false; render();
  });
  const rq = $('#request-int'); if (rq) rq.addEventListener('click', () => toast('Integration request sent to the platform team', 'success'));
  const as = $('#all-search'); if (as) as.addEventListener('input', (e) => {
    if (e.target.value.length > 2) toast(`Searched the marketplace for "${e.target.value}"`, 'default');
  });

  // Drawer
  const mt = $('#mask-toggle');
  if (mt) mt.addEventListener('click', () => {
    const inp = $('#api-key');
    if (inp.type === 'password') { inp.type = 'text'; mt.innerHTML = '<span data-icon="x" data-icon-size="12"></span> Hide'; }
    else { inp.type = 'password'; mt.innerHTML = '<span data-icon="search" data-icon-size="12"></span> Show'; }
    if (window.Icons) window.Icons.render(mt);
  });
  const tc = $('#test-conn');
  if (tc) tc.addEventListener('click', () => {
    tc.innerHTML = '<span class="pulse"></span> Testing…';
    setTimeout(() => {
      tc.innerHTML = '<span class="pulse"></span> Test connection';
      if (window.Icons) window.Icons.render(tc);
      toast('Connection successful · round-trip 142ms', 'success');
    }, 900);
  });
  const dc = $('#disconnect-int');
  if (dc) dc.addEventListener('click', () => {
    const i = INTEGRATIONS.find(x => x.id === state.integrationOpen);
    openConfirm({
      title: `Disconnect ${i.nm}?`,
      body: 'Active webhooks and scheduled jobs will stop immediately. Historical data is retained.',
      confirmLabel: 'Disconnect',
      danger: true,
      onConfirm: () => {
        i.badge = 'av';
        state.integrationOpen = null;
        toast(`${i.nm} disconnected`, 'success');
        render();
      }
    });
  });
  const co = $('#do-connect');
  if (co) co.addEventListener('click', () => {
    const i = INTEGRATIONS.find(x => x.id === state.integrationOpen);
    i.badge = 'on';
    state.integrationOpen = null;
    toast(`${i.nm} connected`, 'success');
    render();
  });
}

/* === Settings wiring === */
function wireSettings() {
  const td = $('#t-dark'); if (td) td.addEventListener('click', () => {
    state.settings.darkTheme = !state.settings.darkTheme;
    document.body.classList.toggle('dark-theme', state.settings.darkTheme);
    render();
  });
  const t2 = $('#t-2fa'); if (t2) t2.addEventListener('click', () => {
    state.settings.twoFactor = !state.settings.twoFactor;
    toast(state.settings.twoFactor ? '2FA enabled' : '2FA disabled — re-enable recommended', state.settings.twoFactor ? 'success' : 'warn');
    render();
  });
  $$('[data-cadence]').forEach(lab => lab.addEventListener('click', () => {
    state.settings.cadence = lab.dataset.cadence;
    toast(`Notifications set to ${lab.dataset.cadence}`, 'success');
    render();
  }));
  $$('[data-tok]').forEach(b => b.addEventListener('click', () => {
    openConfirm({
      title: 'Revoke this token?',
      body: 'Scripts using this token will start failing immediately. You cannot un-revoke.',
      confirmLabel: 'Revoke',
      danger: true,
      onConfirm: () => toast('Token revoked', 'success'),
    });
  }));
  const nt = $('#new-token'); if (nt) nt.addEventListener('click', () => {
    const key = 'huc_new_' + Math.random().toString(36).slice(2, 14);
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>New API token</h3>
        <p class="sub">Copy this token now — you won't see it again. Stored hashed at rest.</p>
        <div style="background: var(--surface-muted); border-radius: 8px; padding: 12px 14px; font: 500 13px/1.4 var(--font-mono); color: var(--text-strong); word-break: break-all; user-select: all;">${key}</div>
        <div class="acts">
          <button class="ok" data-ok>I've copied it</button>
        </div>
      </div>
    `);
    $('[data-ok]').addEventListener('click', () => { closeModal(); toast('Token created', 'success'); });
  });
}

/* ============================================================
   Init
   ============================================================ */
function init() {
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  const r = (location.hash.replace(/^#\/?/, '') || 'dashboard');
  if (NAV.some(n => n.route === r)) state.route = r;
  // Pre-select a couple of users so bulk bar shows by default
  state.userSelected.add('u_001');
  state.userSelected.add('u_004');
  state.userSelected.add('u_006');
  // Apply theme from state
  document.body.classList.toggle('dark-theme', state.settings.darkTheme);
  render();
}

window.addEventListener('hashchange', () => {
  const r = (location.hash.replace(/^#\/?/, '') || 'dashboard');
  if (NAV.some(n => n.route === r) && r !== state.route) {
    state.route = r; render();
  }
});

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
