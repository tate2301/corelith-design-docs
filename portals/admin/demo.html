<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Admin portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  /* ===========================================================
     Admin Portal — MOBILE-FIRST stylesheet
     Default rules = phone. Progressively enhanced at 720px and 1024px.
     Dark-mode only (body.dark-theme always on).
     =========================================================== */

  body { background: #0F1115; margin: 0; color: #E4E7EC; }
  body.dark-theme { background: #0F1115; color: #E4E7EC; }

  /* === App stage / browser-chrome frame === */
  .ad-stage { background: #0F1115; min-height: calc(100vh - 47px); padding: 0; display: block; }
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .ad-stage { padding: 0; min-height: 100vh; }
  body.is-fullscreen .ad-frame { width: 100vw; height: 100vh; border-radius: 0; border: 0; box-shadow: none; }
  body.is-fullscreen .ad-frame .ad-chrome { display: none; }

  .ad-frame {
    width: 100%; min-height: calc(100vh - 47px);
    background: #0F1115; border: 0; border-radius: 0;
    box-shadow: none; overflow: hidden; display: flex; flex-direction: column;
  }
  .ad-frame .ad-chrome { display: none; }
  .ad-frame .ad-screen { flex: 1; background: #0F1115; display: flex; overflow: hidden; min-height: 0; position: relative; }

  /* === Side rail (hidden on phone, shown ≥1024px) === */
  .ad-side { display: none; }

  /* === Main content === */
  .ad-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #0F1115; width: 100%; }

  /* Top bar — compact on phones */
  .ad-top {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    border-bottom: 1px solid rgba(255,255,255,0.06); background: #16181D; flex: none;
    position: sticky; top: 0; z-index: 20;
  }
  .ad-top h1 { font: 700 17px/1.2 var(--font-sans); color: #fff; margin: 0; letter-spacing: -0.01em; flex: 1; min-width: 0; }
  .ad-top .crumb { display: none; }
  .ad-top .spacer { display: none; }
  .ad-top .pill { display: none; }
  .ad-top .btn-pri {
    padding: 0; width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: #fff;
    font: 500 13px/1 var(--font-sans); display: inline-flex; align-items: center; justify-content: center;
    gap: 0; border: 0; cursor: pointer; flex: none;
  }
  .ad-top .btn-pri span:not([data-icon]) { display: none; }
  .ad-top .btn-pri:hover { background: var(--brand-strong); }
  .ad-top .btn-alt {
    padding: 0; width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.06); color: #fff;
    font: 500 13px/1 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 0;
    border: 0; cursor: pointer; flex: none;
  }
  .ad-top .btn-alt span:not([data-icon]) { display: none; }
  .ad-top .btn-alt:hover { background: rgba(255,255,255,0.12); }
  .ad-top .burger { display: none; }

  .ad-body {
    flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column;
    padding-bottom: calc(72px + env(safe-area-inset-bottom)); /* leave room for bottom-tab nav */
  }

  /* === Bottom tab nav (design-system .b-bottom-tabs) — dark overrides === */
  .b-bottom-tabs {
    background: #16181D;
    border-top: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 -6px 18px -8px rgba(0,0,0,0.45);
  }
  .b-bottom-tabs button { color: rgba(255,255,255,0.6); }
  .b-bottom-tabs button:hover { color: #fff; }
  .b-bottom-tabs button.active { color: var(--brand); }
  .b-bottom-tabs button.active .b-bt-ic { color: var(--brand); }

  /* === Bottom sheet (design-system .x-bottom-sheet) — dark overrides === */
  .x-bs-scrim { background: rgba(0,0,0,0.55); }
  .x-bottom-sheet {
    background: #16181D;
    box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.5);
  }
  .x-bottom-sheet .x-bs-grab { background: rgba(255,255,255,0.18); }
  .x-bottom-sheet .x-bs-head {
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: #16181D;
  }
  .x-bottom-sheet .x-bs-head h3 { color: #fff; }
  .x-bottom-sheet .x-bs-head .x-bs-close {
    background: rgba(255,255,255,0.06); color: #fff;
  }
  .x-bottom-sheet .x-bs-head .x-bs-close:hover { background: rgba(255,255,255,0.12); }
  .x-bottom-sheet .x-bs-body { color: #E4E7EC; }
  .x-bottom-sheet .x-bs-foot {
    border-top: 1px solid rgba(255,255,255,0.06);
    background: #16181D;
  }
  .x-bottom-sheet .x-bs-foot button.alt {
    background: rgba(255,255,255,0.08); color: #fff;
  }
  .x-bottom-sheet .x-bs-foot button.alt:hover { background: rgba(255,255,255,0.14); }

  /* === b-filter-chips — dark overrides === */
  .b-filter-chips .b-fc {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.78);
  }
  .b-filter-chips .b-fc:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .b-filter-chips .b-fc .b-fc-ct {
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7);
  }
  .b-filter-chips .b-fc.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .b-filter-chips .b-fc.on .b-fc-ct { background: rgba(255,255,255,0.22); color: #fff; }

  /* === b-row-card — dark overrides === */
  .b-row-card {
    background: #16181D;
    border-color: rgba(255,255,255,0.08);
    color: #E4E7EC;
  }
  .b-row-card:hover, .b-row-card:active {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.16);
  }
  .b-row-card .b-rc-nm { color: #fff; }
  .b-row-card .b-rc-sb { color: rgba(255,255,255,0.6); }
  .b-row-card .b-rc-val { color: #fff; }
  .b-row-card .b-rc-meta .b-rc-m-l { color: rgba(255,255,255,0.5); }
  .b-row-card .b-rc-meta .b-rc-m-v { color: #fff; }

  /* === b-stat-hero — dark overrides === */
  .b-stat-hero .b-sh-s {
    background: #16181D;
    border-color: rgba(255,255,255,0.08);
  }
  .b-stat-hero .b-sh-s .b-sh-l { color: rgba(255,255,255,0.55); }
  .b-stat-hero .b-sh-s .b-sh-v { color: #fff; }
  .b-stat-hero .b-sh-s .b-sh-sb { color: rgba(255,255,255,0.6); }

  /* === b-day-list — dark overrides === */
  .b-day-list .b-dl-l { color: #E4E7EC; border-bottom-color: rgba(255,255,255,0.06); }
  .b-day-list .b-dl-v { color: #fff; border-bottom-color: rgba(255,255,255,0.06); }

  /* Custom row-card variants used in admin (user card + audit timeline) */
  .b-row-card.user-row .b-rc-top { align-items: center; }
  .b-row-card.user-row .b-rc-av {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(11,93,240,0.18); color: var(--brand);
    display: grid; place-items: center;
    font: 600 14px/1 var(--font-sans); flex: none;
  }
  .b-row-card.user-row.sel { background: rgba(11,93,240,0.15); border-color: var(--brand); }
  .b-row-card.user-row .b-rc-em {
    font: 12.5px/1.3 var(--font-mono);
    color: rgba(255,255,255,0.55);
    margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .b-row-card.user-row .b-rc-tags {
    display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center;
  }
  .b-row-card.user-row .b-rc-tags .role {
    display: inline-flex; padding: 3px 8px; border-radius: 9999px;
    font: 500 11px/1 var(--font-sans);
  }
  .b-row-card.user-row .b-rc-tags .role.admin,
  .b-row-card.user-row .b-rc-tags .role.owner { background: rgba(11,93,240,0.22); color: #6EA8FF; }
  .b-row-card.user-row .b-rc-tags .role.op { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
  .b-row-card.user-row .b-rc-tags .role.view { background: rgba(124,58,237,0.22); color: #C4B5FD; }
  .b-row-card.user-row .b-rc-tags .status {
    display: inline-flex; align-items: center; gap: 4px; font: 11.5px var(--font-sans);
    color: rgba(255,255,255,0.7);
  }
  .b-row-card.user-row .b-rc-tags .status .d { width: 6px; height: 6px; border-radius: 50%; background: var(--tone-success); }
  .b-row-card.user-row .b-rc-tags .status.sus .d { background: rgba(255,255,255,0.4); }
  .b-row-card.user-row .b-rc-tags .status.inv .d { background: var(--tone-warn); }
  .b-row-card.user-row .b-rc-tags .last { font: 11.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.5); }
  .b-row-card.user-row .b-rc-cb {
    width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.2);
    background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .b-row-card.user-row .b-rc-cb.checked { background: var(--brand); border-color: var(--brand); color: #fff; }
  .b-row-card.user-row .b-rc-menu {
    width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.06);
    color: #fff; display: grid; place-items: center; border: 0; cursor: pointer; flex: none;
  }
  .b-row-card.user-row .b-rc-menu:hover { background: rgba(255,255,255,0.12); }

  .b-row-card.timeline .b-rc-top { align-items: center; }
  .b-row-card.timeline .b-rc-av {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(11,93,240,0.18); color: var(--brand);
    display: grid; place-items: center;
    font: 600 12px/1 var(--font-sans); flex: none;
  }
  .b-row-card.timeline .verb { font: 14px/1.45 var(--font-sans); color: #fff; margin-top: 8px; }
  .b-row-card.timeline .verb .tg {
    display: inline-block; padding: 1px 6px; border-radius: 4px;
    background: rgba(255,255,255,0.08); font: 11px/1.2 var(--font-mono);
    color: rgba(255,255,255,0.7); margin-left: 4px;
  }
  .b-row-card.timeline .sev {
    display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11px/1 var(--font-sans);
  }
  .b-row-card.timeline .sev.info { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
  .b-row-card.timeline .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .b-row-card.timeline .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .b-row-card.timeline .details-btn {
    align-self: flex-start; min-height: 36px; padding: 6px 12px;
    background: rgba(255,255,255,0.06); color: #fff;
    border: 0; border-radius: 8px; cursor: pointer;
    font: 500 13px/1 var(--font-sans);
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 8px;
  }
  .b-row-card.timeline .details-btn:hover { background: rgba(255,255,255,0.12); }
  .b-row-card.timeline .details {
    padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 8px;
    display: none;
  }
  .b-row-card.timeline.open .details { display: block; }

  .sheet-link {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px;
    background: transparent; border: 0; cursor: pointer; text-align: left;
    color: #fff; font: 500 15px/1.2 var(--font-sans);
    min-height: 56px; border-radius: 10px;
  }
  .sheet-link:hover, .sheet-link:active { background: rgba(255,255,255,0.06); }
  .sheet-link.active { background: rgba(11,93,240,0.18); color: #fff; }
  .sheet-link span[data-icon] { width: 22px; height: 22px; color: rgba(255,255,255,0.7); flex: none; }
  .sheet-link.active span[data-icon] { color: var(--brand); }
  .sheet-link .sl-tail { margin-left: auto; color: rgba(255,255,255,0.4); }
  .sheet-section { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); padding: 18px 16px 6px; }

  /* === Modal scrim (re-used by sheets) === */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 100; display: flex; align-items: flex-end; justify-content: center;
    padding: 0; animation: scrimIn 160ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #16181D; color: #E4E7EC;
    width: 100%; max-width: 100%; max-height: 95vh;
    border-radius: 16px 16px 0 0;
    display: flex; flex-direction: column;
    box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.5);
    animation: sheetIn 260ms cubic-bezier(0.2, 0, 0.1, 1);
    padding-bottom: env(safe-area-inset-bottom);
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    position: relative;
  }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.18); margin: 8px auto 4px; flex: none; }
  .modal h3 { font: 600 17px/1.2 var(--font-sans); color: #fff; margin: 4px 16px 4px; padding-right: 16px; flex: none; }
  .modal .sub { font: 13.5px/1.5 var(--font-sans); color: rgba(255,255,255,0.7); margin: 0 16px 12px; flex: none; }
  .modal .mbody { padding: 0 16px; flex: 1; }
  .modal > .field, .modal > div:not(.acts):not(.plans-grid) { padding: 0 16px; }
  .modal .plans-grid { padding: 0 16px; }
  .modal .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .modal .field label { font: 500 12.5px/1 var(--font-sans); color: rgba(255,255,255,0.7); }
  .modal .field input, .modal .field select, .modal .field textarea {
    min-height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; padding: 0 12px;
    font: 14px var(--font-sans); outline: none; color: #fff;
    background: rgba(255,255,255,0.06); box-sizing: border-box; width: 100%;
  }
  .modal .field textarea { min-height: 100px; padding: 10px 12px; resize: vertical; }
  .modal .field input:focus, .modal .field select:focus, .modal .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,93,240,0.25); }
  .modal .acts {
    display: flex; gap: 8px; flex-direction: column-reverse;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.06); background: #16181D; flex: none;
    position: sticky; bottom: 0; margin-top: auto;
  }
  .modal .acts button {
    min-height: 48px; padding: 0 18px; border-radius: 10px;
    font: 600 14px var(--font-sans); cursor: pointer; border: 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%;
  }
  .modal .acts .ok { background: var(--brand); color: #fff; }
  .modal .acts .ok:hover { background: var(--brand-strong); }
  .modal .acts .alt { background: rgba(255,255,255,0.08); color: #fff; }
  .modal .acts .alt:hover { background: rgba(255,255,255,0.14); }
  .modal .acts .danger { background: var(--tone-danger); color: #fff; }

  /* === Dashboard — phone first === */
  .dash-body {
    padding: 16px; flex: 1; overflow-y: auto;
    display: grid; gap: 12px; grid-template-columns: 1fr;
    grid-template-areas: "kpi" "health" "audit" "snap";
    align-content: start;
  }

  .kpi-grid {
    grid-area: kpi; display: grid; grid-template-columns: 1fr; gap: 10px;
  }
  .kpi {
    background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 18px 18px 18px; cursor: pointer; min-height: 96px;
    display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center;
  }
  .kpi:active { background: rgba(255,255,255,0.04); }
  .kpi .lbl { font: 500 12px/1.2 var(--font-sans); color: rgba(255,255,255,0.55); grid-column: 1; }
  .kpi .val { font: 700 28px/1.05 var(--font-sans); color: #fff; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; grid-column: 1; }
  .kpi .delta { display: inline-flex; align-items: center; gap: 4px; font: 500 12px/1 var(--font-sans); grid-column: 1; }
  .kpi .delta.up { color: var(--tone-success); }
  .kpi .delta.down { color: var(--tone-danger); }
  .kpi .delta.flat { color: rgba(255,255,255,0.55); }
  .kpi .kpi-chevron { grid-column: 2; grid-row: 1 / span 3; color: rgba(255,255,255,0.3); align-self: center; }
  .kpi .sparkline { grid-column: 2; grid-row: 1 / span 3; align-self: center; }

  .health {
    grid-area: health; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; align-items: center;
  }
  .health .item .lb { font: 500 11px/1.2 var(--font-sans); letter-spacing: 0.04em; color: rgba(255,255,255,0.55); }
  .health .item .vv { font: 600 15px/1.2 var(--font-mono); color: #fff; margin-top: 4px; }
  .health .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tone-success); display: inline-block; margin-right: 6px; vertical-align: middle; }
  .health .dot.warn { background: var(--tone-warn); }

  .audit-card {
    grid-area: audit; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: clip;
  }
  .audit-card .h { display: flex; align-items: center; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-wrap: wrap; gap: 4px; }
  .audit-card .h h3 { font: 600 15px/1.2 var(--font-sans); color: #fff; margin: 0; }
  .audit-card .h .sb { font: 12px/1 var(--font-sans); color: rgba(255,255,255,0.55); margin-left: 8px; }
  .audit-card .h .spacer { flex: 1; }
  .audit-card .h a { font: 600 13px/1 var(--font-sans); color: var(--brand); text-decoration: none; cursor: pointer; }
  .audit-row-d {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 4px 12px;
    align-items: start; padding: 14px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05); font: 13.5px/1.4 var(--font-sans);
  }
  .audit-row-d:last-child { border-bottom: 0; }
  .audit-row-d .ts { font: 12px/1.2 var(--font-mono); color: rgba(255,255,255,0.55); grid-column: 2; }
  .audit-row-d .av {
    width: 32px; height: 32px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand);
    display: grid; place-items: center; font: 600 12px/1 var(--font-sans);
    grid-column: 1; grid-row: 1 / span 2;
  }
  .audit-row-d .ev { color: #fff; grid-column: 2; font: 500 13.5px/1.4 var(--font-sans); }
  .audit-row-d .ev .who { color: rgba(255,255,255,0.6); font-weight: 400; }
  .audit-row-d .ip { display: none; }
  .audit-row-d .sev {
    display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11px/1 var(--font-sans);
    grid-column: 3; grid-row: 1; align-self: start; white-space: nowrap;
  }
  .audit-row-d .sev.info { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
  .audit-row-d .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .audit-row-d .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }

  .snap {
    grid-area: snap; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }
  .snap .h { display: flex; align-items: center; gap: 10px; }
  .snap .h .ic { width: 40px; height: 40px; border-radius: 10px; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; flex: none; }
  .snap .h .nm { font: 600 15px/1.2 var(--font-sans); color: #fff; }
  .snap .h .sb { font: 12px/1.3 var(--font-mono); color: rgba(255,255,255,0.5); margin-top: 2px; }
  .snap .row { display: flex; justify-content: space-between; align-items: baseline; font: 13.5px/1.4 var(--font-sans); }
  .snap .row .k { color: rgba(255,255,255,0.55); }
  .snap .row .v { font: 500 13.5px/1 var(--font-mono); color: #fff; font-variant-numeric: tabular-nums; }
  .snap .seats { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 14px; }
  .snap .seats .top { display: flex; justify-content: space-between; font: 12px/1 var(--font-sans); color: rgba(255,255,255,0.55); }
  .snap .seats .bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; margin-top: 10px; overflow: hidden; }
  .snap .seats .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
  .snap .seats .lab { display: flex; justify-content: space-between; font: 600 14px/1 var(--font-sans); color: #fff; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .snap .cta {
    width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: #fff;
    font: 600 14px/1 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border: 0; cursor: pointer;
  }
  .snap .cta:hover { background: rgba(255,255,255,0.12); }

  /* Tiny inline sparkline */
  .sparkline { width: 60px; height: 24px; opacity: 0.7; }
  .sparkline path { stroke: var(--brand); stroke-width: 1.5; fill: none; }
  .sparkline.down path { stroke: var(--tone-danger); }
  .sparkline.up path { stroke: var(--tone-success); }

  /* === Users — phone first === */
  .filter-bar {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); background: #16181D;
    flex: none;
  }
  .filter-bar .search { width: 100%; position: relative; }
  .filter-bar .search input {
    width: 100%; height: 44px; padding: 0 14px 0 40px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06);
    font: 14px var(--font-sans); outline: none; color: #fff; box-sizing: border-box;
  }
  .filter-bar .search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,93,240,0.25); }
  .filter-bar .search > [data-icon] { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }
  .filter-bar .search .count { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font: 12px var(--font-mono); color: rgba(255,255,255,0.5); }
  .filter-bar .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .filter-bar .chips::-webkit-scrollbar { display: none; }
  .filter-bar .spacer { display: none; }

  .chip {
    padding: 8px 14px; border-radius: 9999px; background: rgba(255,255,255,0.06);
    font: 500 13px/1 var(--font-sans); color: rgba(255,255,255,0.7); cursor: pointer; border: 0;
    white-space: nowrap; min-height: 36px;
  }
  .chip.active { background: var(--brand); color: #fff; }
  .chip .cn { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: 0.8; }

  /* Sticky bulk action bar (bottom) */
  .bulk-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 70;
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    background: var(--ink); color: #fff;
    border-top: 1px solid rgba(255,255,255,0.1);
    flex-wrap: wrap;
  }
  .bulk-bar .ct { font: 600 14px/1 var(--font-sans); flex: 1; min-width: 80px; }
  .bulk-bar button {
    min-height: 40px; padding: 0 12px; border-radius: 8px;
    background: rgba(255,255,255,0.12); color: #fff;
    font: 600 13px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 6px;
    border: 0; cursor: pointer; flex: none;
  }
  .bulk-bar button:hover { background: rgba(255,255,255,0.2); }
  .bulk-bar button.danger { background: rgba(255, 90, 90, 0.22); color: #FF9C9C; }
  .bulk-bar button.danger:hover { background: rgba(255, 90, 90, 0.32); }
  .bulk-bar .spacer { display: none; }

  /* On phones the users layout is a stack of cards, not a table */
  .users-split { flex: 1; display: block; overflow: visible; min-height: 0; }
  .users-split.has-panel { grid-template-columns: 1fr; }
  .table-wrap { overflow: visible; min-width: 0; padding: 12px 16px 24px; display: grid; gap: 10px; }
  table.ut { display: none; } /* table hidden on phones */
  .user-card {
    background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 14px; display: grid; grid-template-columns: 44px 1fr auto; gap: 8px 12px; align-items: center;
    cursor: pointer;
  }
  .user-card.sel { background: rgba(11,93,240,0.15); border-color: var(--brand); }
  .user-card .cb {
    width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.2);
    background: transparent; display: grid; place-items: center; cursor: pointer; flex: none;
    grid-column: 1; grid-row: 1; align-self: center;
  }
  .user-card .cb.checked { background: var(--brand); border-color: var(--brand); color: #fff; }
  .user-card .av {
    width: 44px; height: 44px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand);
    display: grid; place-items: center; font: 600 14px/1 var(--font-sans); flex: none;
    grid-column: 1; grid-row: 1 / span 2; align-self: start;
  }
  .user-card.has-sel .av { grid-row: 2; }
  .user-card .info { grid-column: 2; grid-row: 1 / span 2; min-width: 0; }
  .user-card .nm { font: 600 15px/1.3 var(--font-sans); color: #fff; }
  .user-card .em { font: 12.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-card .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
  .user-card .role {
    display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11px/1 var(--font-sans);
  }
  .user-card .role.admin, .user-card .role.owner { background: rgba(11,93,240,0.22); color: #6EA8FF; }
  .user-card .role.op { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
  .user-card .role.view { background: rgba(124,58,237,0.22); color: #C4B5FD; }
  .user-card .last { font: 11.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.5); }
  .user-card .status { display: inline-flex; align-items: center; gap: 4px; font: 11.5px var(--font-sans); }
  .user-card .status .d { width: 6px; height: 6px; border-radius: 50%; background: var(--tone-success); }
  .user-card .status.sus .d { background: rgba(255,255,255,0.4); }
  .user-card .status.inv .d { background: var(--tone-warn); }
  .user-card .menu {
    grid-column: 3; grid-row: 1 / span 2; align-self: center;
    width: 40px; height: 40px; border-radius: 10px; background: rgba(255,255,255,0.06);
    color: #fff; display: grid; place-items: center; border: 0; cursor: pointer;
  }
  .user-card .menu:hover { background: rgba(255,255,255,0.12); }

  /* === Drawer / side panel — converts to bottom sheet on phones === */
  .drawer-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 80; opacity: 0; pointer-events: none; transition: opacity 200ms;
  }
  .drawer-scrim.open { opacity: 1; pointer-events: auto; }
  .ad-drawer {
    position: fixed; left: 0; right: 0; bottom: 0;
    width: 100%; max-width: 100%; height: 95vh;
    background: #16181D; color: #E4E7EC;
    border-radius: 16px 16px 0 0;
    border: 0; box-shadow: 0 -10px 40px -10px rgba(0,0,0,0.5);
    transform: translateY(100%); transition: transform 260ms cubic-bezier(0.2, 0, 0.1, 1);
    display: flex; flex-direction: column;
    z-index: 81;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .ad-drawer::before {
    content: ""; display: block; width: 40px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,0.18); margin: 8px auto 4px; flex: none;
  }
  .ad-drawer.open { transform: translateY(0); }
  .ad-drawer .dh {
    padding: 12px 16px 14px; border-bottom: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: flex-start; gap: 12px; flex: none;
    position: sticky; top: 0; background: #16181D; z-index: 1;
  }
  .ad-drawer .dh .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .ad-drawer .dh h3 { font: 600 17px/1.2 var(--font-sans); color: #fff; margin: 6px 0 2px; }
  .ad-drawer .dh .sb { font: 13px/1.3 var(--font-sans); color: rgba(255,255,255,0.6); }
  .ad-drawer .dh .close {
    margin-left: auto; width: 40px; height: 40px; border-radius: 10px;
    background: rgba(255,255,255,0.06); color: #fff; display: grid; place-items: center;
    border: 0; cursor: pointer; flex: none;
  }
  .ad-drawer .dh .close:hover { background: rgba(255,255,255,0.12); }
  .ad-drawer .db { padding: 16px; flex: 1; overflow-y: auto; display: grid; gap: 14px; -webkit-overflow-scrolling: touch; }
  .ad-drawer .field { display: grid; gap: 6px; }
  .ad-drawer .field label { font: 500 12.5px/1 var(--font-sans); color: rgba(255,255,255,0.7); }
  .ad-drawer .field input, .ad-drawer .field select, .ad-drawer .field textarea {
    width: 100%; min-height: 44px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    padding: 0 12px; background: rgba(255,255,255,0.06); font: 14px var(--font-sans); outline: none; color: #fff;
    box-sizing: border-box;
  }
  .ad-drawer .field textarea { min-height: 80px; padding: 10px 12px; resize: vertical; }
  .ad-drawer .field input:focus, .ad-drawer .field select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,93,240,0.25); }
  .ad-drawer .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ad-drawer .roles label {
    display: flex; align-items: center; gap: 8px; padding: 12px;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    font: 14px/1.3 var(--font-sans); color: rgba(255,255,255,0.78); cursor: pointer; min-height: 44px;
  }
  .ad-drawer .roles label.on { border-color: var(--brand); background: rgba(11,93,240,0.18); color: #fff; }
  .ad-drawer .perm { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.7); background: rgba(255,255,255,0.05); border-radius: 10px; padding: 12px; }
  .ad-drawer .df {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; gap: 8px; flex-direction: column-reverse; flex: none;
    background: #16181D; position: sticky; bottom: 0; z-index: 1;
  }
  .ad-drawer .df .btn {
    width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px;
    font: 600 14px/1 var(--font-sans); border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .ad-drawer .df .btn.pri { background: var(--brand); color: #fff; }
  .ad-drawer .df .btn.pri:hover { background: var(--brand-strong); }
  .ad-drawer .df .btn.sec { background: rgba(255,255,255,0.08); color: #fff; }
  .ad-drawer .df .btn.sec:hover { background: rgba(255,255,255,0.14); }
  .ad-drawer .df .btn.danger { background: var(--tone-danger); color: #fff; }

  .udetail { display: grid; gap: 14px; }
  .udetail .head { display: flex; align-items: center; gap: 14px; }
  .udetail .head .av { width: 56px; height: 56px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; font: 600 20px/1 var(--font-sans); }
  .udetail .head .nm { font: 600 17px/1.2 var(--font-sans); color: #fff; }
  .udetail .head .sb { font: 12.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); }
  .udetail .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font: 14px var(--font-sans); }
  .udetail .row .k { color: rgba(255,255,255,0.55); flex: none; }
  .udetail .row .v { font-weight: 500; color: #fff; text-align: right; }
  .udetail .sect { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-top: 8px; }

  /* === Audit — timeline cards on phone === */
  .alert-banner {
    display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px;
    background: var(--tone-danger-bg); color: var(--tone-danger);
    border-bottom: 1px solid rgba(255,255,255,0.06); flex: none; flex-wrap: wrap;
  }
  .alert-banner .ic { width: 32px; height: 32px; border-radius: 50%; background: var(--tone-danger); color: #fff; display: grid; place-items: center; flex: none; }
  .alert-banner .msg { font: 500 14px/1.4 var(--font-sans); flex: 1; min-width: 200px; }
  .alert-banner .msg strong { color: var(--tone-danger); }
  .alert-banner .spacer { display: none; }
  .alert-banner .cta {
    padding: 10px 16px; min-height: 44px; border-radius: 10px;
    background: var(--tone-danger); color: #fff; font: 600 13px/1 var(--font-sans);
    border: 0; cursor: pointer; width: 100%;
  }

  .filter-strip {
    display: flex; gap: 8px; padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06); background: #16181D;
    align-items: center; flex-wrap: nowrap; overflow-x: auto; flex: none;
  }
  .filter-strip::-webkit-scrollbar { display: none; }
  .filter-strip .spacer { display: none; }
  .filter-strip .search { display: none; }
  .fchip {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
    min-height: 36px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04); font: 500 13px/1 var(--font-sans); color: #fff;
    cursor: pointer; white-space: nowrap; flex: none;
  }
  .fchip .k { color: rgba(255,255,255,0.55); font-weight: 500; }
  .fchip.active { border-color: var(--brand); background: rgba(11,93,240,0.2); color: #fff; }

  .at-wrap { flex: 1; padding: 12px 16px; display: grid; gap: 10px; }
  table.at { display: none; } /* tables hidden on phones */
  .timeline-card {
    background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 14px; display: grid; gap: 8px;
  }
  .timeline-card .row1 { display: flex; align-items: center; gap: 10px; }
  .timeline-card .av {
    width: 36px; height: 36px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand);
    display: grid; place-items: center; font: 600 12px/1 var(--font-sans); flex: none;
  }
  .timeline-card .actor-nm { font: 600 14px/1.2 var(--font-sans); color: #fff; flex: 1; min-width: 0; }
  .timeline-card .ts { font: 11.5px/1.2 var(--font-mono); color: rgba(255,255,255,0.5); }
  .timeline-card .sev {
    display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11px/1 var(--font-sans);
  }
  .timeline-card .sev.info { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
  .timeline-card .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .timeline-card .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .timeline-card .verb { font: 14px/1.45 var(--font-sans); color: #fff; }
  .timeline-card .verb .tg { display: inline-block; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); font: 11px/1.2 var(--font-mono); color: rgba(255,255,255,0.7); margin-left: 4px; }
  .timeline-card .meta-row { display: flex; gap: 12px; flex-wrap: wrap; font: 11.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.5); }
  .timeline-card .details-btn {
    align-self: flex-start; min-height: 36px; padding: 6px 12px;
    background: rgba(255,255,255,0.06); color: #fff;
    border: 0; border-radius: 8px; cursor: pointer;
    font: 500 13px/1 var(--font-sans);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .timeline-card .details-btn:hover { background: rgba(255,255,255,0.12); }
  .timeline-card .details {
    padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); margin-top: 4px;
    display: none;
  }
  .timeline-card.open .details { display: block; }

  .diff-block {
    background: #0F1115; color: #E4E7EC; border-radius: 10px; padding: 12px 14px;
    font: 12px/1.6 var(--font-mono); white-space: pre-wrap; overflow-x: auto; word-break: break-word;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .diff-block .add { color: #6EE7A8; display: block; }
  .diff-block .rem { color: #FF9C9C; display: block; }
  .diff-block .neu { color: #B8C2D0; display: block; }

  /* === Billing — phone first === */
  .bill-body {
    padding: 16px; flex: 1; overflow-y: auto;
    display: grid; gap: 14px; grid-template-columns: 1fr;
    grid-template-areas: "plan" "side" "invoices";
    align-content: start;
  }
  .plan-card {
    grid-area: plan; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    padding: 18px; display: grid; gap: 18px; grid-template-columns: 1fr;
  }
  .plan-card .left .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .plan-card .left h2 { font: 700 22px/1.2 var(--font-sans); color: #fff; margin: 6px 0 4px; letter-spacing: -0.01em; }
  .plan-card .left .pr { font: 700 28px/1.05 var(--font-sans); color: #fff; margin-top: 10px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .plan-card .left .pr .sub { font: 500 13px/1 var(--font-sans); color: rgba(255,255,255,0.55); margin-left: 6px; }
  .plan-card .left .meta { display: flex; gap: 14px; margin-top: 10px; font: 12.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.6); flex-wrap: wrap; }
  .plan-card .left .meta strong { color: #fff; font-weight: 500; }
  .plan-card .left .feats { margin-top: 14px; display: grid; gap: 8px; padding: 0; }
  .plan-card .left .feats li { display: flex; align-items: center; gap: 8px; font: 13.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.78); list-style: none; }
  .plan-card .left .feats li .ck { width: 18px; height: 18px; border-radius: 50%; background: rgba(34,197,94,0.18); color: var(--tone-success); display: grid; place-items: center; flex: none; }
  .plan-card .right { display: flex; flex-direction: column; gap: 14px; }

  .seat-card { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 16px; }
  .seat-card .top { display: flex; justify-content: space-between; align-items: baseline; }
  .seat-card .top .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .seat-card .top .lab { font: 600 13px/1 var(--font-sans); color: #fff; font-variant-numeric: tabular-nums; }
  .seat-card .big { font: 700 28px/1.05 var(--font-sans); color: #fff; margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .seat-card .bar { height: 8px; background: rgba(255,255,255,0.08); border-radius: 6px; margin-top: 10px; overflow: hidden; }
  .seat-card .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 6px; }
  .seat-card .sub { font: 12.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.55); margin-top: 8px; }

  .estimate {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deeper, #0840A8) 100%);
    color: #fff; border-radius: 12px; padding: 16px; position: relative; overflow: hidden;
  }
  .estimate::after { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .estimate .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .estimate .big { font: 700 28px/1.05 var(--font-sans); margin-top: 8px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .estimate .sb { font: 13px/1.4 var(--font-sans); opacity: 0.9; margin-top: 4px; }
  .estimate .due { display: inline-flex; gap: 6px; align-items: center; margin-top: 10px; padding: 5px 12px; border-radius: 9999px; background: rgba(255,255,255,0.15); font: 500 12px/1 var(--font-sans); }

  .bill-side { grid-area: side; display: flex; flex-direction: column; gap: 14px; }
  .side-card { background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; }
  .side-card h3 { font: 600 15px/1.2 var(--font-sans); color: #fff; margin: 0 0 12px; }
  .pm { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 10px; min-height: 56px; }
  .pm.primary { border: 1px solid var(--brand); background: rgba(11,93,240,0.18); }
  .pm .brnd { width: 44px; height: 30px; border-radius: 6px; background: linear-gradient(135deg, #0B5394, #1E40AF); color: #fff; display: grid; place-items: center; font: 700 10px/1 var(--font-sans); letter-spacing: 0.04em; flex: none; }

  .panel > h3 { font: 600 15px/1.2 var(--font-sans); color: #fff; margin: 0 0 6px; }
  .panel > .ds { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); margin: 0 0 14px; }

  /* === Roles & permissions === */
  .role-grid { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
  .role-list { display: grid; gap: 6px; }
  .role-list button {
    display: flex; align-items: center; gap: 10px; padding: 14px; min-height: 56px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); cursor: pointer; text-align: left; width: 100%;
    color: #fff;
  }
  .role-list button.on { border-color: var(--brand); background: rgba(11,93,240,0.18); }
  .role-list .swatch { width: 8px; height: 28px; border-radius: 3px; background: var(--brand); flex: none; }
  .role-list .nm { font: 600 14px/1.2 var(--font-sans); color: #fff; }
  .role-list .ct { font: 12px/1.3 var(--font-sans); color: rgba(255,255,255,0.6); margin-top: 2px; }
  .role-list .add { color: var(--brand); font: 600 14px/1.2 var(--font-sans); justify-content: center; }
  .perm-matrix { background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow-x: auto; }
  .perm-matrix table { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); min-width: 500px; }
  .perm-matrix th, .perm-matrix td { padding: 12px 14px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .perm-matrix th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.04); }
  .perm-matrix .res { font: 500 13.5px/1.3 var(--font-sans); color: #fff; }
  .perm-matrix .cell { text-align: center; cursor: pointer; user-select: none; }
  .perm-matrix .pip { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.14); color: transparent; }
  .perm-matrix .pip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* === Branches === */
  .branch-list { display: grid; gap: 10px; }
  .branch-card {
    display: grid; grid-template-columns: 44px 1fr; gap: 12px;
    padding: 14px; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
    align-items: start;
  }
  .branch-card .ic { width: 44px; height: 44px; border-radius: 10px; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; flex: none; }
  .branch-card .nm { font: 600 15px/1.3 var(--font-sans); color: #fff; }
  .branch-card .meta { font: 12.5px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
  .branch-card .meta strong { color: #fff; font-weight: 500; }
  .branch-card .actions { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .branch-card .actions .pill-tag { padding: 4px 10px; border-radius: 9999px; font: 500 11px/1 var(--font-sans); background: rgba(11,93,240,0.22); color: #6EA8FF; }
  .branch-card .actions button {
    padding: 8px 12px; min-height: 36px; border-radius: 8px;
    background: rgba(255,255,255,0.06); color: #fff;
    font: 600 12.5px/1 var(--font-sans); border: 0; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .branch-card .actions button:hover { background: rgba(255,255,255,0.12); }

  /* === Feature flags === */
  .flag-row { display: grid; gap: 14px; padding: 16px 0; border-top: 1px solid rgba(255,255,255,0.06); }
  .flag-row:first-of-type { border-top: 0; padding-top: 0; }
  .flag-row .info .nm { font: 600 14px/1.2 var(--font-mono); color: #fff; word-break: break-all; }
  .flag-row .info .ds { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); margin-top: 6px; }
  .flag-row .info .meta { font: 11.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.4); margin-top: 6px; }
  .flag-row .envs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .flag-env { display: grid; gap: 8px; padding: 12px 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; background: rgba(255,255,255,0.04); text-align: center; }
  .flag-env .e-lb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .flag-env .toggle { margin: 0 auto; }

  /* === Alerts === */
  .alert-rule { display: grid; gap: 10px; padding: 14px; background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; }
  .alert-rule .nm { font: 600 14px/1.3 var(--font-sans); color: #fff; }
  .alert-rule .cond { font: 12px/1.4 var(--font-mono); color: rgba(255,255,255,0.6); margin-top: 4px; }
  .alert-rule .route { font: 12.5px/1.3 var(--font-sans); color: rgba(255,255,255,0.78); display: flex; gap: 6px; flex-wrap: wrap; }
  .alert-rule .route .ch { padding: 3px 10px; border-radius: 9999px; background: rgba(255,255,255,0.08); font: 500 11px/1 var(--font-sans); }
  .alert-rule .sev { display: inline-flex; padding: 3px 9px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); justify-self: start; }
  .alert-rule .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .alert-rule .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .alert-rule .sev.info { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

  /* === Backups === */
  .bk-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .bk-card { background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 16px; }
  .bk-card .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); }
  .bk-card .v { font: 700 22px/1.05 var(--font-sans); color: #fff; margin-top: 8px; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .bk-card .meta { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); margin-top: 6px; }
  .bk-card .meta strong { color: #fff; font-weight: 500; }
  .bk-history-row {
    display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px 16px;
    font: 13px var(--font-sans); border-bottom: 1px solid rgba(255,255,255,0.06); align-items: center;
  }
  .bk-history-row .when { font: 12.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.6); }
  .bk-history-row .dest { font: 12.5px/1.3 var(--font-mono); color: #fff; word-break: break-all; }
  .bk-history-row .size { font: 12.5px/1.3 var(--font-mono); color: #fff; }

  /* === Status === */
  .status-strip { display: flex; gap: 12px; padding: 16px; background: var(--tone-success-bg); border: 1px solid var(--tone-success); border-radius: 14px; flex-wrap: wrap; align-items: flex-start; }
  .status-strip.warn { background: var(--tone-warn-bg); border-color: var(--tone-warn); }
  .status-strip .pulse {
    width: 14px; height: 14px; border-radius: 50%; background: var(--tone-success); flex: none; margin-top: 4px;
    box-shadow: 0 0 0 0 var(--tone-success); animation: pulseGood 2s infinite;
  }
  .status-strip.warn .pulse { background: var(--tone-warn); box-shadow: 0 0 0 0 var(--tone-warn); animation-name: pulseWarn; }
  @keyframes pulseGood { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); } 70% { box-shadow: 0 0 0 14px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }
  @keyframes pulseWarn { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5); } 70% { box-shadow: 0 0 0 14px rgba(245,158,11,0); } 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } }
  .status-strip h3 { font: 700 16px/1.2 var(--font-sans); color: var(--tone-success); margin: 0; }
  .status-strip.warn h3 { color: var(--tone-warn); }
  .status-strip .ds { font: 13px/1.4 var(--font-sans); color: rgba(255,255,255,0.7); margin-top: 4px; }

  .incident-timeline { position: relative; padding-left: 22px; }
  .incident-timeline::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: rgba(255,255,255,0.1); }
  .incident-item { position: relative; padding: 8px 0 16px; }
  .incident-item::before { content: ""; position: absolute; left: -22px; top: 12px; width: 14px; height: 14px; border-radius: 50%; background: #0F1115; border: 2px solid var(--brand); }
  .incident-item.resolved::before { background: var(--tone-success); border-color: var(--tone-success); }
  .incident-item.investigating::before { background: var(--tone-warn); border-color: var(--tone-warn); }
  .incident-item.identified::before { background: var(--tone-danger); border-color: var(--tone-danger); }
  .incident-item .ts { font: 12px/1.2 var(--font-mono); color: rgba(255,255,255,0.55); }
  .incident-item .ttl { font: 600 14px/1.3 var(--font-sans); color: #fff; margin-top: 4px; }
  .incident-item .ds { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); margin-top: 4px; }
  .incident-item .links { font: 12.5px/1.2 var(--font-sans); color: var(--brand); margin-top: 6px; }

  /* === Help === */
  .help-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .help-card {
    display: grid; gap: 10px; padding: 16px;
    background: #16181D; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; cursor: pointer;
  }
  .help-card:hover { border-color: var(--brand); }
  .help-card .ic { width: 40px; height: 40px; border-radius: 10px; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; }
  .help-card h3 { font: 600 15px/1.2 var(--font-sans); color: #fff; margin: 0; }
  .help-card .ds { font: 13px/1.5 var(--font-sans); color: rgba(255,255,255,0.6); }

  /* === Skeleton === */
  .skel { display: inline-block; background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(255,255,255,0.1), rgba(255,255,255,0.04)); background-size: 200% 100%; border-radius: 6px; animation: skel 1.4s ease infinite; }
  @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* === API keys === */
  .key-row {
    display: grid; grid-template-columns: 1fr auto; gap: 8px 10px;
    align-items: start; padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
    font: 14px var(--font-sans);
  }
  .key-row .nm { font: 600 14px/1.3 var(--font-sans); color: #fff; }
  .key-row .key-val { font: 12px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); margin-top: 4px; }
  .key-row .scope { font: 11.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); display: inline-flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .key-row .scope .ch { padding: 2px 7px; background: rgba(255,255,255,0.06); border-radius: 4px; }

  /* ===========================================================
     TABLET (≥ 720px)
     =========================================================== */
  @media (min-width: 720px) {
    .ad-stage { padding: 16px; }
    .ad-frame { min-height: calc(100vh - 47px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); }

    .ad-top { padding: 16px 24px; }
    .ad-top h1 { font-size: 19px; }
    .ad-top .crumb { display: block; font: 12px/1.3 var(--font-sans); color: rgba(255,255,255,0.5); flex: none; margin-right: 6px; }
    .ad-top .spacer { display: block; flex: 1; }
    .ad-top .pill { display: inline-flex; padding: 4px 10px; border-radius: 9999px; background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.75); font: 500 12px/1 var(--font-sans); }
    .ad-top .pill.brand { background: rgba(11,93,240,0.22); color: #6EA8FF; }
    .ad-top .btn-pri { width: auto; padding: 0 16px; height: 40px; gap: 6px; }
    .ad-top .btn-pri span:not([data-icon]) { display: inline; }
    .ad-top .btn-alt { width: auto; padding: 0 14px; height: 40px; gap: 6px; }
    .ad-top .btn-alt span:not([data-icon]) { display: inline; }

    /* Modals become centered dialogs */
    .modal-scrim { align-items: center; padding: 24px; }
    .modal { max-width: 480px; border-radius: 16px; max-height: calc(100vh - 48px); animation: modalIn 220ms cubic-bezier(0.2,0,0.1,1); }
    .modal::before { display: none; }
    .modal.wide { max-width: 760px; }
    @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal h3 { margin: 20px 22px 6px; }
    .modal .sub { margin: 0 22px 14px; }
    .modal .mbody { padding: 0 22px; }
    .modal .acts { flex-direction: row; justify-content: flex-end; padding: 14px 22px; }
    .modal .acts button { width: auto; min-height: 40px; }

    /* Drawer becomes side panel */
    .ad-drawer {
      top: 0; bottom: 0; right: 0; left: auto;
      width: 480px; max-width: 90%; height: auto;
      border-radius: 0; border-left: 1px solid rgba(255,255,255,0.08);
      transform: translateX(100%);
    }
    .ad-drawer.open { transform: translateX(0); }
    .ad-drawer::before { display: none; }
    .ad-drawer .df { flex-direction: row; }
    .ad-drawer .df .btn { width: auto; flex: 1; }

    /* Dashboard 2-col KPI grid */
    .dash-body { padding: 20px 24px; gap: 14px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }

    /* Users table */
    .table-wrap { padding: 16px 24px; display: block; }
    table.ut { display: table; width: 100%; border-collapse: collapse; font: 13.5px/1.4 var(--font-sans); background: #16181D; color: #E4E7EC; }
    table.ut thead th { position: sticky; top: 0; background: #16181D; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 14px; text-align: left; font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45); z-index: 1; cursor: pointer; user-select: none; }
    table.ut thead th .sort-ic { display: inline-block; margin-left: 4px; color: rgba(255,255,255,0.4); font-size: 9px; }
    table.ut thead th.sorted { color: #fff; }
    table.ut td { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; cursor: pointer; }
    table.ut tr:hover td { background: rgba(255,255,255,0.04); }
    table.ut tr.sel td { background: rgba(11,93,240,0.12); }
    table.ut .cb { width: 18px; height: 18px; border-radius: 4px; border: 1.5px solid rgba(255,255,255,0.2); background: transparent; display: inline-grid; place-items: center; vertical-align: middle; cursor: pointer; }
    table.ut .cb.checked { background: var(--brand); border-color: var(--brand); color: #fff; }
    table.ut .who { display: flex; align-items: center; gap: 10px; }
    table.ut .av { width: 30px; height: 30px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); flex: none; }
    table.ut .nm { font: 600 13.5px/1.3 var(--font-sans); color: #fff; }
    table.ut .em { font: 12px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); margin-top: 1px; }
    table.ut .role { display: inline-flex; padding: 3px 8px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); }
    table.ut .role.admin, table.ut .role.owner { background: rgba(11,93,240,0.22); color: #6EA8FF; }
    table.ut .role.op { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
    table.ut .role.view { background: rgba(124,58,237,0.22); color: #C4B5FD; }
    table.ut .status { display: inline-flex; align-items: center; gap: 6px; font: 13px/1 var(--font-sans); color: rgba(255,255,255,0.75); }
    table.ut .status .d { width: 7px; height: 7px; border-radius: 50%; background: var(--tone-success); }
    table.ut .status.sus .d { background: rgba(255,255,255,0.4); }
    table.ut .status.inv .d { background: var(--tone-warn); }
    table.ut .last, table.ut .branch { font: 12.5px/1.3 var(--font-mono); color: rgba(255,255,255,0.55); }
    .table-wrap { padding: 0; overflow-y: auto; }
    .users-split { display: grid; grid-template-columns: 1fr; }
    .users-split.has-panel { grid-template-columns: 1fr 380px; }

    /* Hide user-cards (table mode) — actually keep them as fallback if data attribute */
    .user-card.tablet-hide,
    .b-row-card.user-row.tablet-hide { display: none; }

    /* Filter bar row layout */
    .filter-bar { flex-direction: row; padding: 14px 24px; gap: 12px; align-items: center; }
    .filter-bar .search { max-width: 380px; flex: 1; }
    .filter-bar .search input { height: 38px; padding-left: 36px; }
    .filter-bar .chips { flex-wrap: wrap; overflow-x: visible; }

    .bulk-bar { position: static; flex-wrap: nowrap; padding: 12px 24px; }
    .bulk-bar .spacer { display: block; flex: 1; }

    /* Audit table */
    .at-wrap { padding: 0; display: block; overflow-y: auto; }
    table.at { display: table; width: 100%; border-collapse: collapse; font: 13px/1.3 var(--font-sans); background: #16181D; color: #E4E7EC; }
    table.at thead { display: table-header-group; }
    table.at thead th { position: sticky; top: 0; background: #16181D; padding: 10px 14px; text-align: left; font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.45); border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 1; }
    table.at td { padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: middle; cursor: pointer; }
    table.at tr:hover td { background: rgba(255,255,255,0.04); }
    table.at tr.open td { background: rgba(11,93,240,0.12); }
    table.at .ts { font: 12px/1.2 var(--font-mono); color: rgba(255,255,255,0.55); white-space: nowrap; }
    table.at .actor { display: flex; align-items: center; gap: 8px; }
    table.at .actor .av { width: 22px; height: 22px; border-radius: 50%; background: rgba(11,93,240,0.18); color: var(--brand); display: grid; place-items: center; font: 600 10px/1 var(--font-sans); flex: none; }
    table.at .actor .nm { font: 500 12.5px/1.2 var(--font-sans); color: #fff; }
    table.at .event { font: 13px/1.3 var(--font-sans); color: #fff; }
    table.at .event .tg { display: inline-block; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); font: 11px/1.2 var(--font-mono); color: rgba(255,255,255,0.65); margin-left: 6px; }
    table.at .ip { font: 12px/1.2 var(--font-mono); color: rgba(255,255,255,0.55); }
    table.at .sev { display: inline-flex; padding: 2px 7px; border-radius: 9999px; font: 500 11px/1 var(--font-sans); }
    table.at .sev.info { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
    table.at .sev.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
    table.at .sev.high { background: var(--tone-danger-bg); color: var(--tone-danger); }
    .timeline-card.tablet-hide,
    .b-row-card.timeline.tablet-hide { display: none; }

    .filter-strip { padding: 12px 24px; flex-wrap: wrap; overflow-x: visible; }
    .filter-strip .spacer { display: block; flex: 1; }
    .filter-strip .search { display: block; position: relative; width: 280px; }
    .filter-strip .search > [data-icon] { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); }
    .filter-strip .search input { width: 100%; height: 38px; padding: 0 12px 0 32px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: #fff; font: 13px var(--font-sans); outline: none; box-sizing: border-box; }

    .alert-banner { flex-wrap: nowrap; padding: 14px 24px; }
    .alert-banner .spacer { display: block; flex: 1; }
    .alert-banner .cta { width: auto; padding: 8px 14px; min-height: 40px; }

    /* Billing */
    .bill-body { padding: 20px 24px; gap: 16px; grid-template-columns: 1.5fr 1fr; grid-template-areas: "plan side" "invoices invoices"; }
    .plan-card { grid-template-columns: 1fr 1fr; padding: 22px; gap: 22px; }
    .inv-row {
      display: grid; grid-template-columns: 130px 1fr 130px 110px 130px 90px; gap: 12px;
      align-items: center; padding: 12px 18px;
    }
    .inv-row .num { grid-column: 1; }
    .inv-row .desc { grid-column: 2; }
    .inv-row .amt { grid-column: 3; }
    .inv-row .stat { grid-column: 4; grid-row: 1; }
    .inv-row .date { grid-column: 5; }
    .inv-row .pdf { grid-column: 6; grid-row: 1; }

    /* Integrations 2-up */
    .igrid { grid-template-columns: repeat(2, 1fr); padding: 18px 24px; gap: 14px; }

    /* Settings — wider, larger */
    .settings-body { padding: 20px 24px; max-width: 760px; padding-bottom: 24px; }
    .settings-savebar { position: static; padding: 14px 0 0; background: transparent; border-top: 0; }
    .settings-savebar .btn { flex: none; padding: 0 22px; }
    .cadence { grid-template-columns: repeat(4, 1fr); }

    /* Bottom-tab nav can stay (still useful on tablet portrait) */

    /* Roles split */
    .role-grid { grid-template-columns: 280px 1fr; }

    /* Help */
    .help-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }

    /* Backups grid */

/* ============================================================
   Toast & modal
   ============================================================ */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2600);
}

function openModal(html) { state.modal = html; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

function openConfirm({ title, body, confirmLabel = 'Confirm', danger = false, onConfirm }) {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <h3>${escapeHtml(title)}</h3>
      <p class="sub">${body}</p>
      <div class="acts">
        <button class="alt" data-cancel>Cancel</button>
        <button class="${danger ? 'danger' : 'ok'}" data-ok>${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `);
  $('[data-cancel]').addEventListener('click', closeModal);
  $('[data-ok]').addEventListener('click', () => { closeModal(); onConfirm && onConfirm(); });
}

   ============================================================ */
function renderDashboard() {
  // Tiny sparkline polyline. 60×24.
  const spark = (pts, dir) => {
    const max = Math.max.apply(null, pts);
    const min = Math.min.apply(null, pts);
    const range = (max - min) || 1;
    const path = pts.map((v, i) => {
      const x = (i / (pts.length - 1)) * 58 + 1;
      const y = 22 - ((v - min) / range) * 20;
      return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg class="sparkline ${dir || ''}" viewBox="0 0 60 24" aria-hidden="true"><path d="${path}"/></svg>`;
  };
  const usersCount = state.users.length;
  const adminsCount = state.users.filter(u => u.role === 'admin' || u.role === 'owner').length;
  const chev = '<span class="kpi-chevron" data-icon="forward" data-icon-size="14"></span>';
  return `
    <section class="ad-main">
      <div class="ad-top">
        <span class="crumb">${escapeHtml(state.tenant.id)} · home</span>

function filteredUsers() {
  let list = state.users.slice();
  if (state.userFilter === 'admins')    list = list.filter(u => u.role === 'admin' || u.role === 'owner');
  if (state.userFilter === 'operators') list = list.filter(u => u.role === 'op');
  if (state.userFilter === 'suspended') list = list.filter(u => u.status === 'sus');
  if (state.userFilter === 'invited')   list = list.filter(u => u.status === 'inv');
  if (state.userSearch) {
    const q = state.userSearch.toLowerCase();
    list = list.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || u.branch.toLowerCase().includes(q));
  }
  const k = state.userSort.key;
  const dir = state.userSort.dir === 'asc' ? 1 : -1;
  list.sort((a, b) => (a[k] || '').localeCompare(b[k] || '') * dir);
  return list;
}

function userCounts() {
  return {
    all: state.users.length,
    admins: state.users.filter(u => u.role === 'admin' || u.role === 'owner').length,
    operators: state.users.filter(u => u.role === 'op').length,
    suspended: state.users.filter(u => u.status === 'sus').length,
    invited: state.users.filter(u => u.status === 'inv').length,
  };
}

function openUserActionSheet(user) {
  const host = $('#sheet-host');
  host.innerHTML = `
    <div class="x-bs-scrim open" data-sheet-scrim>
      <div class="x-bottom-sheet" role="dialog" aria-label="Actions" onclick="event.stopPropagation()">
        <div class="x-bs-grab"></div>
        <div class="x-bs-head">
          <h3>${escapeHtml(user.name)}</h3>
          <button class="x-bs-close" data-sheet-close aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button>
        </div>
        <div class="x-bs-body">
          <button class="sheet-link" data-ua="edit"><span data-icon="edit" data-icon-size="20"></span><span>Edit</span></button>
          <button class="sheet-link" data-ua="reset"><span data-icon="lock" data-icon-size="20"></span><span>Reset password</span></button>
          <button class="sheet-link" data-ua="role"><span data-icon="shield" data-icon-size="20"></span><span>Make admin</span></button>
          <button class="sheet-link" data-ua="disable"><span data-icon="x" data-icon-size="20"></span><span>${user.status === 'sus' ? 'Turn back on' : 'Disable'}</span></button>
        </div>
      </div>
    </div>
  `;
  if (window.Icons) window.Icons.render(host);
  $('[data-sheet-scrim]').addEventListener('click', closeMoreSheet);
  $('[data-sheet-close]').addEventListener('click', closeMoreSheet);
  $$('[data-ua]').forEach(b => b.addEventListener('click', () => {
    const act = b.dataset.ua;
    closeMoreSheet();
    if (act === 'edit') {
      state.userPanel = { user, editing: true };
      render();
    } else if (act === 'reset') {
      toast(`Password reset email sent to ${user.email}`, 'success');
    } else if (act === 'role') {
      user.role = 'admin'; user.roleLabel = 'Branch admin';
      toast(`${user.name} is now an admin`, 'success');
      render();
    } else if (act === 'disable') {
      if (user.status === 'sus') { user.status = 'active'; toast('User turned back on', 'success'); }
      else { user.status = 'sus'; toast('User turned off', 'success'); }
      render();
    }
  }));
}

/* ============================================================
   Wiring (per-route event listeners)
   ============================================================ */
function wire() {
  // Fullscreen
  const fs = $('#fs-btn'); if (fs) fs.addEventListener('click', toggleFullscreen);

  // Nav
  $$('[data-route]').forEach(b => b.addEventListener('click', () => go(b.dataset.route)));
  $$('[data-go]').forEach(b => b.addEventListener('click', (e) => { e.preventDefault(); go(b.dataset.go); }));

  // Tenant switcher
  const tt = $('#tenant-toggle');
  if (tt) tt.addEventListener('click', (e) => {
    e.stopPropagation();
    state.tenantMenuOpen = !state.tenantMenuOpen;
    render();
  });
  $$('[data-tenant]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = b.dataset.tenant;
    if (id === 'new') {
      state.tenantMenuOpen = false;
      toast('Only Owners can add a new business', 'warn');
      render();
      return;
    }
    const t = TENANTS.find(x => x.id === id);
    if (t) {
      state.tenant = t;
      state.tenantMenuOpen = false;
      toast(`Now showing ${t.name}`, 'success');
      render();
    }
  }));
  document.addEventListener('click', (e) => {
    if (state.tenantMenuOpen && !e.target.closest('#tenant-toggle, #tenant-menu')) {
      state.tenantMenuOpen = false;
      const m = $('#tenant-menu'); if (m) m.classList.remove('open');
    }
  }, { once: true });

  // Drawer scrim close
  const ds = $('#drawer-scrim'); if (ds) ds.addEventListener('click', closeDrawer);
  $$('[data-close-drawer]').forEach(b => b.addEventListener('click', closeDrawer));

  // Hamburger
  const burgerEl = $('#burger-btn'); if (burgerEl) burgerEl.addEventListener('click', () => {
    if (window.HuchuNav && typeof window.HuchuNav.toggle === 'function') window.HuchuNav.toggle();
  });

  // User menu (sign out)
  const ut = $('#user-toggle'); if (ut) ut.addEventListener('click', (e) => {
    e.stopPropagation();
    state.userMenuOpen = !state.userMenuOpen;
    render();
  });
  $$('[data-um]').forEach(b => b.addEventListener('click', (e) => {
    e.stopPropagation();
    const act = b.dataset.um;
    state.userMenuOpen = false;
    if (act === 'signout' || act === 'signout-all') {
      openConfirm({
        title: act === 'signout-all' ? 'Sign out everywhere?' : 'Sign out?',
        body: act === 'signout-all'
          ? 'You will be signed out on every device — this one, your phone, and anywhere else you are signed in.'
          : 'You can sign in again any time.',
        confirmLabel: act === 'signout-all' ? 'Sign out everywhere' : 'Sign out',
        danger: act === 'signout-all',
        onConfirm: () => {
          state.authed = false;
          state.authStep = 'credentials';
          persist();
          render();
          toast(act === 'signout-all' ? 'Signed out of all 3 devices' : 'Signed out', 'success');
        }
      });
    } else if (act === 'help') { go('help'); }
    else if (act === 'settings') { go('settings'); }
    else { toast('Profile editor — coming soon', 'default'); render(); }
  }));
  document.addEventListener('click', (e) => {
    if (state.userMenuOpen && !e.target.closest('#user-toggle, #user-menu')) {
      state.userMenuOpen = false;
      const m = $('#user-menu'); if (m) m.classList.remove('open');
    }
  }, { once: true });

  switch (state.route) {
    case 'users':        wireUsers(); break;
    case 'roles':        wireRoles(); break;
    case 'audit':        wireAudit(); break;
    case 'billing':      wireBilling(); break;
    case 'integrations': wireIntegrations(); break;
    case 'branches':     wireBranches(); break;
    case 'flags':        wireFlags(); break;
    case 'alerts':       wireAlerts(); break;
    case 'backups':      wireBackups(); break;
    case 'status':       wireStatus(); break;
    case 'keys':         wireKeys(); break;
    case 'settings':     wireSettings(); break;
    case 'help':         wireHelp(); break;
  }
}

function closeDrawer() {
  state.userPanel = null;
  state.inviteOpen = false;
  state.integrationOpen = null;
  render();
}

/* === Users wiring === */
function wireUsers() {
  $$('[data-filter]').forEach(b => b.addEventListener('click', () => {
    state.userFilter = b.dataset.filter; render();
  }));
  const s = $('#user-search');
  if (s) {
    let t = null;
    s.addEventListener('input', (e) => {
      state.userSearch = e.target.value;
      if (t) clearTimeout(t);
      t = setTimeout(() => { render(); const ns = $('#user-search'); if (ns) { ns.focus(); ns.setSelectionRange(ns.value.length, ns.value.length); } }, 180);
    });
  }
  $$('[data-sort]').forEach(th => th.addEventListener('click', () => {
    const k = th.dataset.sort;
    if (state.userSort.key === k) state.userSort.dir = state.userSort.dir === 'asc' ? 'desc' : 'asc';
    else state.userSort = { key: k, dir: 'asc' };
    render();
  }));
  const inv = $('#invite-btn'); if (inv) inv.addEventListener('click', () => {
    state.inviteOpen = true; state.userPanel = null; state.integrationOpen = null; render();
  });

  // Invite drawer wire (if open)
  const send = $('#inv-send');
  if (send) {
    send.addEventListener('click', () => {
      const name = $('#inv-name').value.trim() || 'New invitee';
      const email = $('#inv-email').value.trim() || `${name.toLowerCase().replace(/\s+/g, '.')}@mukamba.co.zw`;
      const branch = $('#inv-branch').value;
      const roleEl = $('input[name="invrole"]:checked');
      const role = roleEl ? roleEl.value : 'op';
      const roleLabel = role === 'admin' ? 'Branch admin' : role === 'view' ? 'Read-only' : 'Operator';
      state.users.unshift({
        id: 'u_' + Math.random().toString(36).slice(2, 6),
        name, email, role, roleLabel, status: 'inv', last: '— never', branch,
      });
      closeDrawer();
      toast(`Invite sent to ${email}`, 'success');
    });
    $$('#inv-roles label').forEach(lab => lab.addEventListener('click', () => {
      $$('#inv-roles label').forEach(l => l.classList.remove('on'));
      lab.classList.add('on');
      const r = lab.querySelector('input').value;
      const perms = {
        admin: 'Branch admins manage their branch staff, prices, and reports — but cannot change billing or business-wide settings.',
        op: 'Operators can ring up sales, take payments, and close the till — but cannot change prices, items, or user accounts.',
        view: 'View-only users can see dashboards, activity history, and invoices. They cannot change anything.',
      };
      $('#inv-perm').textContent = perms[r];
    }));
  }

  rewireRows();

  // Bulk
  $$('[data-bulk]').forEach(b => b.addEventListener('click', () => {
    const action = b.dataset.bulk;
    if (action === 'delete') {
      openConfirm({
        title: `Remove ${state.userSelected.size} users?`,
        body: 'This deletes the accounts for good and signs them out. The activity history will still show what they did.',
        confirmLabel: 'Remove',
        danger: true,
        onConfirm: () => {
          state.users = state.users.filter(u => !state.userSelected.has(u.id));
          const n = state.userSelected.size;
          state.userSelected.clear();
          toast(`${n} user(s) removed`, 'success');
          render();
        }
      });
    } else if (action === 'disable') {
      state.users.forEach(u => { if (state.userSelected.has(u.id)) u.status = 'sus'; });
      const n = state.userSelected.size; state.userSelected.clear();
      toast(`${n} user(s) turned off`, 'success'); render();
    } else if (action === 'reset') {
      toast(`Password reset email sent to ${state.userSelected.size} users`, 'success');
    } else if (action === 'role') {
      toast('Role change started — check your email to confirm', 'success');
    }
  }));

  // User detail wire
  const edit = $('[data-edit-user]'); if (edit) edit.addEventListener('click', () => {
    state.userPanel.editing = true; render();
  });
  const cancel = $('[data-cancel-edit]'); if (cancel) cancel.addEventListener('click', () => {
    state.userPanel.editing = false; render();
  });
  const save = $('[data-save-edit]'); if (save) save.addEventListener('click', () => {
    const u = state.userPanel.user;
    u.name = $('#edit-name').value.trim() || u.name;
    u.email = $('#edit-email').value.trim() || u.email;
    u.branch = $('#edit-branch').value;
    const roleEl = $('input[name="urole"]:checked');
    if (roleEl) {
      u.role = roleEl.value;
      u.roleLabel = u.role === 'admin' ? 'Branch admin' : u.role === 'view' ? 'Read-only' : u.role === 'owner' ? 'Owner' : 'Operator';
    }
    state.userPanel.editing = false;
    toast('User saved', 'success');
    render();
  });
  const dis = $('[data-disable]'); if (dis) dis.addEventListener('click', () => {
    const id = dis.dataset.disable;
    openConfirm({
      title: 'Turn off this user?',
      body: 'They will be signed out and locked out of all branches until you turn them back on.',
      confirmLabel: 'Turn off',
      danger: true,
      onConfirm: () => {
        const u = state.users.find(x => x.id === id);
        if (u) u.status = 'sus';
        state.userPanel = null;
        toast('User turned off', 'success');
        render();
      }
    });
  });
}

function rewireRows() {
  $$('[data-row]').forEach(tr => tr.addEventListener('click', (e) => {
    if (e.target.closest('[data-toggle]') || e.target.closest('[data-menu]')) return;
    const u = state.users.find(x => x.id === tr.dataset.row);
    if (!u) return;
    state.userPanel = { user: u, editing: false };
    state.inviteOpen = false;
    state.integrationOpen = null;
    render();
  }));
  $$('[data-toggle]').forEach(cb => cb.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = cb.dataset.toggle;
    if (state.userSelected.has(id)) state.userSelected.delete(id);
    else state.userSelected.add(id);
    render();
  }));
  $$('[data-menu]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const u = state.users.find(x => x.id === btn.dataset.menu);
    if (u) openUserActionSheet(u);
  }));
}

/* === Roles wiring === */
function wireRoles() {
  $$('[data-role]').forEach(b => b.addEventListener('click', () => {
    state.roleSelected = b.dataset.role; render();
  }));
  $$('[data-perm]').forEach(td => td.addEventListener('click', () => {
    const [res, letter] = td.dataset.perm.split(':');
    const role = state.roles.find(r => r.id === state.roleSelected);
    if (!role) return;
    if (role.id === 'owner') { toast('Owner role permissions are locked', 'warn'); return; }
    let p = role.perms[res] || '';
    if (p.indexOf(letter) >= 0) p = p.replace(letter, '');
    else p = ('CRUD'.split('').filter(L => p.indexOf(L) >= 0 || L === letter)).join('');
    role.perms[res] = p;
    render();
  }));
  $$('[data-default-role]').forEach(b => b.addEventListener('click', () => {
    state.defaultInviteRole = b.dataset.defaultRole;
    toast('Default invite role updated', 'success');
    render();
  }));
  const nr = $('#new-role'); if (nr) nr.addEventListener('click', openNewRoleModal);
  const nr2 = $('#new-role-2'); if (nr2) nr2.addEventListener('click', openNewRoleModal);
  const cl = $('#clone-role'); if (cl) cl.addEventListener('click', () => {
    const src = state.roles.find(r => r.id === state.roleSelected);
    if (!src) return;
    const id = 'custom_' + Math.random().toString(36).slice(2, 6);
    state.roles.push({ id, name: src.name + ' (copy)', color: '#0EA5E9', members: 0, builtin: false, perms: { ...src.perms } });
    state.roleSelected = id;
    toast('Role cloned', 'success'); render();
  });
}

/* ============================================================
   Init
   ============================================================ */
function init() {
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  const r = (location.hash.replace(/^#\/?/, '') || 'dashboard');
  if (NAV.some(n => n.route === r)) state.route = r;
  // Dark-mode-only portal
  document.body.classList.add('dark-theme');
  render();
}

window.addEventListener('hashchange', () => {
  const r = (location.hash.replace(/^#\/?/, '') || 'dashboard');
  if (NAV.some(n => n.route === r) && r !== state.route) {
    state.route = r; render();
  }
});

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
