        </div>` : `<div style="padding: 12px; color: var(--text-muted); font: 13.5px var(--font-sans);">No shifts logged yet today.</div>`}
      </div>
      <div class="card">
        <h3>Walk-in buys today</h3>
        ${todayBuys.length ? `<table class="tbl">
          <thead><tr><th>Ref</th><th>Owner</th><th class="num">Weight</th><th class="num">Paid</th></tr></thead>
          <tbody>${todayBuys.map(b => `<tr><td><span class="nm">${b.id}</span></td><td>${escapeHtml(b.supplierNm)}</td><td class="num">${b.wt.toFixed(1)} g</td><td class="num">${money(b.total)}</td></tr>`).join('')}</tbody>
        </table>` : `<div style="padding: 12px; color: var(--text-muted); font: 13.5px var(--font-sans);">No buys yet today.</div>`}
      </div>
      <div class="card">
        <h3>Your gold handling today</h3>
        <div class="ledger">
          <div class="row"><span>Pours you wrote</span><span class="v">${today.length}</span></div>
          <div class="row"><span>Fine gold from pours</span><span class="v">${grams(todayFine)}</span></div>
          <div class="row"><span>Walk-in gold bought</span><span class="v">${todayBuysWt.toFixed(2)} g</span></div>
          <div class="row gold"><span>Total gold passing through you</span><span class="v">${grams(todayFine + todayBuysWt * 0.9)}</span></div>
          <div class="row"><span>Cash paid out (buys)</span><span class="v">${money(todayBuys.filter(b=>b.method==='Cash').reduce((s,b)=>s+b.total,0))}</span></div>
          <div class="row"><span>Mobile money paid out</span><span class="v">${money(todayBuys.filter(b=>b.method!=='Cash').reduce((s,b)=>s+b.total,0))}</span></div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ====== Dispatch (manager) ====== */
function renderDispatch() {
  const ready = state.batches.filter(b => b.status === 'open' && b.pours.length);
  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Dispatch</h1>
        <p class="lede">Batches ready to leave for the refinery. Pick the refinery, the courier, then confirm dispatch. Moves to Shipments after.</p>
        <div class="pills"><span class="p b">${ready.length} ready</span><span class="p">${state.shipments.filter(s=>s.stage<3).length} on the road</span></div>
      </div>
      <div class="acts"><button class="btn quiet" data-go="batches"><span data-icon="box" data-icon-size="13"></span> Batches</button></div>
    </div>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Batch</th><th>Pours</th><th class="num">Fine wt</th><th>Suggested refinery</th><th>Suggested courier</th><th>Expected pickup</th><th></th></tr></thead>
        <tbody>
          ${ready.map(b => {
            const pours = state.pours.filter(p => b.pours.includes(p.id));
            const fine = pours.reduce((s,p)=>s+pourFineWt(p), 0);
            const ref = REFINERIES[(state.batches.indexOf(b)) % REFINERIES.length];
            return `<tr>
              <td><span class="nm">${b.id}</span><div class="sb">${b.site}</div></td>
              <td>${pours.length}</td>
              <td class="num">${kg(fine)}</td>
              <td>${ref.nm}<div class="sb">${ref.loc}</div></td>
              <td>G4S Cash Solutions ZW</td>
              <td class="num">Today · 16:00</td>
              <td style="text-align:right;"><button class="btn gold sm" data-dispatch="${b.id}"><span data-icon="truck" data-icon-size="12"></span> Confirm dispatch</button></td>
            </tr>`;
          }).join('') || `<tr><td colspan="7" style="padding: 18px; text-align:center; color: var(--text-muted);">No batches ready to ship.</td></tr>`}
        </tbody>
      </table>
    </div>
    <div class="card" style="margin-top: 18px;">
      <h3>Recent dispatches</h3>
      <table class="tbl">
        <thead><tr><th>Shipment</th><th>Date</th><th>Refinery</th><th>Courier</th><th class="num">Fine</th><th>Status</th></tr></thead>
        <tbody>
          ${state.shipments.slice(0,5).map(s => {
            const ref = REFINERIES.find(r => r.id === s.refinery);
            const stages = ['Shipped','Arrived','Fineness done','Priced','Paid','Books match'];
            return `<tr class="clickable" data-ship="${s.id}">
              <td><span class="nm">${s.id}</span></td>
              <td class="num">${formatDate(s.date)}</td>
              <td>${ref.nm}</td>
              <td>${s.courier}</td>
              <td class="num">${kg(s.fineWt)}</td>
              <td><span class="badge ${s.stage>=4?'ok':(s.stage>=2?'gold':'warn')}"><span class="dot"></span> ${stages[s.stage]}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function wireDispatchPage() {
  $$('[data-dispatch]').forEach(b => b.addEventListener('click', () => openDispatchModal(b.dataset.dispatch)));
  $$('[data-ship]').forEach(r => r.addEventListener('click', () => {
    state.settlementId = r.dataset.ship; state.route = 'settlements'; location.hash = '#/settlements'; render();
  }));
}

/* ====== Sales (manager) ====== */
function renderSales() {
  const data = state.pricing.slice(-30);
  const last = data[data.length - 1];
  const min = Math.min(...data.map(d => d.lbma)) - 0.3;
  const max = Math.max(...data.map(d => d.lbma)) + 0.3;
  const w = 600, h = 120;
  const x = i => (i / (data.length - 1)) * w;
  const y = v => h - ((v - min) / (max - min)) * h;
  const pth = data.map((p, i) => `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(p.lbma).toFixed(1)}`).join(' ');
  const offers = [
    { id: 'OF-201', ref: 'rand',   wt: 5360, ppg: 75.02, status: 'open' },
    { id: 'OF-202', ref: 'metcon', wt: 5360, ppg: 74.78, status: 'open' },
    { id: 'OF-203', ref: 'fbc',    wt: 5360, ppg: 74.42, status: 'open' },
  ];
  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Sales</h1>
        <p class="lede">Refinery offers and payouts coming in. Watch the spot price, pick the best offer, send for settlement.</p>
        <div class="pills"><span class="p b">${money(last.lbma)}/g · world</span><span class="p s">${offers.length} live offers</span></div>
      </div>
      <div class="acts"><button class="btn quiet" data-go="pricing"><span data-icon="chart" data-icon-size="13"></span> Full price page</button></div>
    </div>
    <div class="stat-row">
      <div class="stat gold"><div class="l">Spot · today</div><div class="v">${money(last.lbma)}<span class="u">/g</span></div><div class="d up">+ ${money(last.lbma - data[0].lbma)} over 30 days</div></div>
      <div class="stat"><div class="l">Best offer today</div><div class="v">${money(Math.max(...offers.map(o=>o.ppg)))}<span class="u">/g</span></div></div>
      <div class="stat"><div class="l">Open lot · ready to sell</div><div class="v">${kg(5360)}<span class="u"></span></div></div>
      <div class="stat"><div class="l">Likely net (best offer)</div><div class="v">${money(Math.max(...offers.map(o=>o.ppg)) * 5360 * 0.70)}<span class="u"></span></div></div>
    </div>
    <div class="card" style="margin-bottom: 18px;">
      <h3>Spot · last 30 days <span class="sub">USD/g</span></h3>
      <div style="height: 120px; position: relative;">
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%; height:100%;">
          <defs>
            <linearGradient id="salesGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#D4A641" stop-opacity="0.25"/>
              <stop offset="100%" stop-color="#D4A641" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <path d="${pth} L ${w} ${h} L 0 ${h} Z" fill="url(#salesGrad)"/>
          <path d="${pth}" fill="none" stroke="#D4A641" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="${x(data.length-1)}" cy="${y(last.lbma)}" r="4" fill="#D4A641"/>
        </svg>
      </div>
    </div>
    <div class="card" style="padding: 0;">
      <h3 style="padding: 14px 16px;">Refinery offers <span class="sub">on 5.36 kg fine bar lot</span></h3>
      <table class="tbl">
        <thead><tr><th>Offer</th><th>Refinery</th><th class="num">Quote /g</th><th class="num">Vs spot</th><th class="num">Gross USD</th><th></th></tr></thead>
        <tbody>
          ${offers.map(o => {
            const ref = REFINERIES.find(r => r.id === o.ref);
            const diff = o.ppg - last.lbma;
            return `<tr>
              <td><span class="nm">${o.id}</span></td>
              <td>${ref.nm}<div class="sb">${ref.loc}</div></td>
              <td class="num">${money(o.ppg)}</td>
              <td class="num" style="color: ${diff>=0?'var(--tone-success)':'var(--tone-danger)'};">${diff>=0?'+':''}${money(diff)}</td>
              <td class="num">${money(o.ppg * o.wt)}</td>
              <td style="text-align:right;">
                <button class="btn sm quiet" data-offer-decline="${o.id}">Decline</button>
                <button class="btn sm gold" data-offer-accept="${o.id}|${o.ref}|${o.wt}|${o.ppg}"><span data-icon="check" data-icon-size="12"></span> Accept</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function wireSales() {
  $$('[data-offer-decline]').forEach(b => b.addEventListener('click', () => toast('Offer ' + b.dataset.offerDecline + ' declined', 'warn')));
  $$('[data-offer-accept]').forEach(b => b.addEventListener('click', () => {
    const [oid, refId, wt, ppg] = b.dataset.offerAccept.split('|');
    const id = 'SH-' + (2841 + state.shipments.length);
    state.shipments.unshift({
      id, date: todayStr(), refinery: refId,
      courier: 'G4S Cash Solutions ZW', driver: 'T Murehwa', seal: 'ZW-' + (184224 + state.shipments.length),
      stage: 3, fineWt: +wt, gross: +wt * 1.05,
    });
    logAction('Accepted refinery offer ' + oid, `${kg(+wt)} @ ${money(+ppg)}/g`);
    persist();
    toast('Offer ' + oid + ' accepted · settlement ' + id + ' created', 'gold');
    state.settlementId = id; state.route = 'settlements'; location.hash = '#/settlements'; render();
  }));
}

/* ====== Drawer & modal ====== */
function renderDrawer() {
  const host = $('#drawer-host');
  if (!state.drawer) { host.innerHTML = ''; return; }
  host.innerHTML = `
    <div class="drawer-scrim open" data-close-drawer></div>
    <aside class="drawer open">
      <div class="dh">
        <h3>${escapeHtml(state.drawer.title)}</h3>
        <button data-close-drawer><span data-icon="back" data-icon-size="14"></span></button>
      </div>
      <div class="db">${state.drawer.body}</div>
      <div class="df">${state.drawer.actions || ''}</div>
    </aside>
  `;
  if (window.Icons) window.Icons.render(host);
  $$('[data-close-drawer], [data-close]', host).forEach(b => b.addEventListener('click', () => { state.drawer = null; renderDrawer(); }));
  $$('[data-amend]', host).forEach(b => b.addEventListener('click', () => { const id = b.dataset.amend; state.drawer = null; renderDrawer(); amendPour(id); }));
}

function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  const m = state.modal;
  if (m.sheet) {
    host.innerHTML = `<div class="x-bs-scrim open" data-close-modal role="dialog" aria-modal="true"><div class="x-bottom-sheet" onclick="event.stopPropagation()">${m.html}</div></div>`;
  } else {
    host.innerHTML = `<div class="modal-scrim" data-close-modal><div class="${m.cls || 'modal'}" onclick="event.stopPropagation()">${m.html}</div></div>`;
  }
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-close-modal]').addEventListener('click', (e) => { if (e.target.dataset.closeModal !== undefined) closeModal(); });
  $$('[data-close]', host).forEach(b => b.addEventListener('click', closeModal));
  $$('[data-dispatch-go]', host).forEach(b => b.addEventListener('click', () => doDispatch(b.dataset.dispatchGo)));
  $$('[data-amend-save]', host).forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.amendSave;
    const p = state.pours.find(x => x.id === id);
    const newAu = parseFloat($('#am-fineAu').value);
    const newSt = $('#am-status').value;
    logAction('Amended pour ' + id, `Au ${p.fineAu} → ${newAu} · status → ${newSt}`);
    p.fineAu = newAu; p.status = newSt;
    closeModal(); toast('Pour ' + id + ' amended · audit logged', 'success'); renderRoute();
  }));
}

function closeModal() { state.modal = null; renderModal(); }

function openPinModal({ title, sub, onAccept, validPin = '4321' }) {
  let pin = ''; let error = false;
  function paint() {
    state.modal = { cls: 'modal', html: `
      <h3>${escapeHtml(title)}</h3>
      <p class="sub">${escapeHtml(sub)}</p>
      <div class="otp" role="group" aria-label="4-digit PIN">
        ${[0,1,2,3].map(i => `<input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-d="${i}" value="${pin[i] || ''}" aria-label="Digit ${i+1}" ${error ? 'aria-invalid="true"' : ''} />`).join('')}
      </div>
      ${error ? `<div class="pin-err">Incorrect PIN. Try again.</div>` : ''}
      <div class="acts">
        <button class="alt" data-close>Cancel</button>
      </div>
    `};
    renderModal();
    const cells = $$('.modal [data-d]');
    const refresh = () => {
      pin = cells.map(c => c.value).join('').replace(/\D/g, '').slice(0, 4);
      if (pin.length === 4) {
        setTimeout(() => {
          if (pin === validPin) { closeModal(); onAccept(); }
          else { error = true; pin = ''; paint(); }
        }, 220);
      }
    };
    cells.forEach((cell, idx) => {
      cell.addEventListener('input', (e) => {
        const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
        e.target.value = v;
        error = false;
        if (v && cells[idx + 1]) cells[idx + 1].focus();
        refresh();
      });
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; }
        if (e.key === 'ArrowLeft' && cells[idx - 1]) cells[idx - 1].focus();
        if (e.key === 'ArrowRight' && cells[idx + 1]) cells[idx + 1].focus();
      });
    });
    if (cells[pin.length] || cells[0]) (cells[pin.length] || cells[0]).focus();
  }
  paint();
}

/* ====== Toast ====== */
function toast(msg, kind = 'default') {
  const host = $('#toast-host'); if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const ic = kind === 'danger' ? 'info' : (kind === 'warn' ? 'info' : 'check');
  el.innerHTML = `<span data-icon="${ic}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2600);
}

/* ====== Dispatch action ====== */
function doDispatch(batchId) {
  const b = state.batches.find(x => x.id === batchId);
  if (!b) return;
  const id = 'SH-' + (2841 + state.shipments.length);
  const pours = state.pours.filter(p => b.pours.includes(p.id));
  const fine = pours.reduce((s,p)=>s+pourFineWt(p),0);
  const gross = pours.reduce((s,p)=>s+p.net,0);
  state.shipments.unshift({
    id, date: new Date().toISOString().slice(0,10),
    refinery: $('#dp-ref').value, courier: $('#dp-cou').value,
    driver: $('#dp-drv').value, seal: $('#dp-seal').value, stage: 1, fineWt: fine, gross,
  });
  b.status = 'dispatched'; b.dispatch = id;
  pours.forEach(p => { p.status = 'shipped'; p.dispatch = id; });
  logAction('Dispatched ' + id, `${pours.length} pours · ${kg(fine)} fine`);
  closeModal(); toast(`Dispatch ${id} sealed · ticket printed`, 'gold');
  state.route = 'shipments'; location.hash = '#/shipments'; render();
}

/* ====== Wire route ====== */
function wireRoute() {
  $$('[data-go]').forEach(b => b.addEventListener('click', () => {
    const r = b.dataset.go;
    if (!canSee(r)) { toast('Manager only — switch role at the top', 'warn'); return; }
    if (b.dataset.ship) state.settlementId = b.dataset.ship;
    state.route = r; location.hash = '#/' + r; render();
  }));
  // Inline role-switch buttons (e.g. from manager-locked page) — only those inside #gd-main
  $$('#gd-main [data-role]').forEach(b => b.addEventListener('click', () => {
    state.role = b.dataset.role; persist();
    toast(state.role === 'manager' ? 'Switched to Manager view' : 'Switched to Clerk view', 'gold');
    render();
  }));
  $$('[data-step]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.step;
    state.dayOpen[k] = true;
    if (state.dayOpen.handover && state.dayOpen.security && state.dayOpen.shift) state.dayOpen.open = true;
    logAction('Day-open step', k);
    toast('Step "' + k + '" confirmed', 'success');
    persist(); renderRoute();
  }));
  $$('[data-close-shift]').forEach(b => b.addEventListener('click', () => openPinModal({
    title: 'Supervisor PIN required',
    sub: 'Closing the shift hands over to next clerk. Use 4321 for demo.',
    onAccept: () => { state.endOfDay.closed = true; persist(); logAction('Closed shift Day-2', 'Handed over'); toast('Shift closed · handover delivered', 'success'); renderRoute(); }
  })));
  $$('[data-remit]').forEach(b => b.addEventListener('click', () => openPinModal({
    title: 'RBZ remit requires supervisor PIN',
    sub: 'Routes funds to RBZ FCRA account. Use 4321 for demo.',
    onAccept: () => { logAction('RBZ retention remitted', 'Q2 batch'); toast('RBZ remit queued · USD 22.26M', 'gold'); },
  })));
  $$('[data-export-submit]').forEach(b => b.addEventListener('click', () => openPinModal({
    title: 'Sign with supervisor PIN',
    sub: 'Co-signs the ZIMRA Schedule 14 / MMCZ pack. Use 4321 for demo.',
    onAccept: () => { logAction('Submitted ZIMRA Q2', 'Schedule 14 + MMCZ'); toast('Submitted to ZIMRA · ref ZIMRA-MMCZ-184318', 'success'); },
  })));
  $$('[data-intake]').forEach(b => b.addEventListener('click', () => toast('Intake purchase flow — KYC + assay + payout', 'gold')));

  switch (state.route) {
    case 'pour-log':     wirePourLog(); break;
    case 'pours':        wirePoursRegister(); break;
    case 'batches':      wireBatches(); break;
    case 'shipments':    wireShipments(); break;
    case 'settlements':  wireSettlements(); break;
    case 'exceptions':   wireExceptions(); break;
    case 'shifts':       wireShifts(); break;
    case 'shift-detail': wireShiftDetail(); break;
    case 'groups':       wireGroups(); break;
    case 'people':       wirePeople(); break;
    case 'buy-gold':     wireBuyGold(); break;
    case 'dispatch':     wireDispatchPage(); break;
    case 'sales':        wireSales(); break;
  }
  renderBottomTabs();
}

/* ====== Init ====== */
function init() {
  if (/[?&]fullscreen=1/.test(location.search)) document.body.classList.add('is-fullscreen');
  window.addEventListener('hashchange', () => {
    state.route = location.hash.replace(/^#\/?/, '') || 'pours';
    if (state.signedIn) render();
  });
  window.addEventListener('beforeunload', persist);
  render();
}

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
</body>
