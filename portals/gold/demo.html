<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gold Mine Clerk demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  body { background: var(--gray-100); margin: 0; font-variant-numeric: tabular-nums; }

  /* ====== App shell ====== */
  .gd-app {
    display: grid;
    grid-template-columns: 232px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "side bar" "side main";
    height: calc(100vh - 47px);
    min-height: 640px;
    background: var(--canvas);
  }
  body.is-fullscreen .pk-nav, body.is-fullscreen .hx-main-nav, body.is-fullscreen .hx-kit-nav { display: none !important; }
  body.is-fullscreen { background: var(--ink); }
  body.is-fullscreen .gd-app { height: 100vh; height: 100dvh; }

  /* Sign-in (no app shell) */
  body.signin .gd-app { display: none; }
  .signin-page {
    display: none;
    min-height: calc(100vh - 47px);
    background: linear-gradient(135deg, #1A1610 0%, #2B2418 100%);
    padding: 40px 20px; align-items: center; justify-content: center;
  }
  body.signin .signin-page { display: flex; }
  .signin-card {
    background: var(--surface); border-radius: 16px; padding: 36px;
    max-width: 420px; width: 100%;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .signin-card .crest {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, #F4C15B, #D4A641);
    display: grid; place-items: center; color: #6B5119;
    margin-bottom: 18px;
  }
  .signin-card h1 { font: 700 22px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; letter-spacing: -0.01em; }
  .signin-card .sub { font: 13.5px/1.5 var(--font-sans); color: var(--text-muted); margin: 0 0 24px; }
  .signin-card .fld { display: grid; gap: 6px; margin-bottom: 12px; }
  .signin-card .fld label { font: 500 12px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .signin-card .fld input { height: 42px; padding: 0 14px; border: 1px solid var(--border); border-radius: 9px; font: 500 14px var(--font-sans); background: var(--canvas); color: var(--text-strong); }
  .signin-card .fld input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .signin-card .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .signin-card .submit { width: 100%; padding: 14px; border-radius: 10px; background: var(--ink); color: #fff; font: 600 14px var(--font-sans); cursor: pointer; margin-top: 8px; }
  .signin-card .submit:hover { background: #000; }
  .signin-card .hint { font: 12px/1.5 var(--font-sans); color: var(--text-subtle); margin-top: 14px; text-align: center; }
  .signin-card .hint code { background: var(--surface-muted); padding: 1px 5px; border-radius: 4px; color: var(--text-strong); font: 500 11px var(--font-mono); }
  .signin-card .meta-row { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
  .signin-card .meta-row .p { padding: 3px 8px; border-radius: 9999px; background: var(--surface-muted); font: 500 11px/1 var(--font-sans); color: var(--text-muted); }
  .signin-err { color: var(--tone-danger); font: 500 12.5px/1.4 var(--font-sans); margin-top: 4px; }

  /* Top bar */
  .gd-bar { grid-area: bar; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 18px; font: 500 13px/1 var(--font-sans); color: var(--text-strong); }
  .gd-bar .br { font-weight: 600; }
  .gd-bar .sep { color: var(--text-subtle); }
  .gd-bar .pill { padding: 4px 10px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); background: var(--surface-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .gd-bar .pill.live { background: var(--tone-success-bg); color: var(--tone-success); }
  .gd-bar .pill.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .gd-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .gd-bar .spacer { flex: 1; }
  .gd-bar .bar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 7px;
    background: var(--surface-muted); color: var(--text-strong);
    border: 0; cursor: pointer;
    font: 500 12px/1 var(--font-sans);
  }
  .gd-bar .bar-btn:hover { background: var(--surface-sunken); }
  .gd-bar .clerk { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
  .gd-bar .clerk .av { width: 26px; height: 26px; border-radius: 50%; background: #FEF4DA; color: #6B5119; display: grid; place-items: center; font: 600 11px/1 var(--font-sans); }
  .gd-bar .live-price {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px;
    background: linear-gradient(135deg, rgba(244,193,91,0.18), rgba(212,166,65,0.12));
    border: 1px solid #E9D9B0; color: #6B5119;
    font: 600 12px/1 var(--font-mono);
  }
  .gd-bar .live-price .dot { width: 6px; height: 6px; border-radius: 50%; background: #D4A641; animation: pulseGold 1.6s infinite; }
  @keyframes pulseGold { 50% { opacity: 0.4; transform: scale(1.3); } }

  /* Side rail */
  .gd-side { grid-area: side; background: var(--ink); color: rgba(255,255,255,0.85); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-y: auto; }
  .gd-side .brand { display: inline-flex; align-items: center; gap: 9px; padding: 4px 8px 10px; font: 600 14px/1 var(--font-sans); color: #fff; }
  .gd-side .brand .m { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, #F4C15B, #D4A641); display: grid; place-items: center; color: #6B5119; flex: none; }
  .gd-side .brand .sb { font: 11px/1.3 var(--font-sans); color: rgba(255,255,255,0.5); margin-top: 2px; display: block; font-weight: 400; }
  .gd-side .grp { font: 500 10px/1 var(--font-sans); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.32); padding: 14px 10px 6px; }
  .nav-it {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: 7px;
    color: rgba(255,255,255,0.78); text-decoration: none;
    font: 500 13px/1 var(--font-sans);
    border: 0; background: transparent; cursor: pointer; width: 100%; text-align: left;
  }
  .nav-it:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .nav-it.active { background: #D4A641; color: #fff; }
  .nav-it .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: currentColor; flex: none; }
  .nav-it .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-it .tag { padding: 1px 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); font: 600 10px/1 var(--font-mono); color: #fff; }
  .nav-it .tag.danger { background: var(--tone-danger); }
  .nav-it .tag.warn { background: var(--tone-warn); }
  .gd-side .foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,0.08); font: 11.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.5); }
  .gd-side .foot strong { color: rgba(255,255,255,0.85); font-weight: 600; display: block; }

  /* Main */
  .gd-main { grid-area: main; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }

  /* Page chrome */
  .page { width: 100%; height: 100%; padding: 22px 26px; overflow-y: auto; min-width: 0; }
  .page-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .page-head .meta { flex: 1; min-width: 0; }
  .page-head h1 { font: 700 22px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .page-head .lede { font: 14px/1.55 var(--font-sans); color: var(--text-muted); margin: 4px 0 0; }
  .page-head .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .page-head .pills .p { padding: 4px 10px; border-radius: 9999px; background: var(--surface-muted); font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .page-head .pills .p.b { background: #FEF4DA; color: #6B5119; }
  .page-head .pills .p.s { background: var(--tone-success-bg); color: var(--tone-success); }
  .page-head .pills .p.w { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .page-head .acts { display: flex; gap: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 7px; font: 500 13px/1 var(--font-sans); cursor: pointer; border: 1px solid transparent; background: var(--surface-muted); color: var(--text-strong); }
  .btn:hover { background: var(--surface-sunken); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.primary:hover { background: #000; }
  .btn.gold { background: linear-gradient(135deg, #F4C15B, #D4A641); color: #4A381A; border-color: #D4A641; }
  .btn.gold:hover { background: linear-gradient(135deg, #E8B547, #C29A36); }
  .btn.quiet { background: transparent; color: var(--text-muted); }
  .btn.quiet:hover { background: var(--surface-muted); color: var(--text-strong); }
  .btn.danger { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .btn.danger:hover { background: rgba(220,38,38,0.18); }
  .btn.sm { padding: 5px 9px; font-size: 11.5px; }

  /* Stat tiles */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .stat .l { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .stat .v { font: 700 22px/1.1 var(--font-sans); color: var(--text-strong); margin: 8px 0 4px; letter-spacing: -0.01em; }
  .stat .v .u { font: 500 13px/1 var(--font-sans); color: var(--text-muted); margin-left: 4px; }
  .stat .d { font: 500 12px/1.3 var(--font-sans); color: var(--text-muted); }
  .stat .d.up { color: var(--tone-success); }
  .stat .d.dn { color: var(--tone-danger); }
  .stat.gold { background: linear-gradient(135deg, #FEF4DA, #FDE8B0); border-color: #E9D9B0; }
  .stat.gold .l { color: #6B5119; }
  .stat.gold .v { color: #4A381A; font-family: var(--font-mono); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 .sub { font: 500 12px/1 var(--font-sans); color: var(--text-muted); }
  .card-grid { display: grid; gap: 16px; }
  .card-grid.cols-2 { grid-template-columns: 1fr 1fr; }
  .card-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }

  /* Tables */
  .tbl { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); }
  .tbl th, .tbl td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  .tbl th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-muted); position: sticky; top: 0; }
  .tbl td.num, .tbl th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tbl tr.clickable { cursor: pointer; }
  .tbl tr.clickable:hover { background: var(--surface-muted); }
  .tbl .nm { font: 600 13px/1.2 var(--font-mono); color: var(--text-strong); }
  .tbl .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  /* Ledger-style locked cell + leader/group cell (matches kits/import-ledger.html) */
  .tbl .lock-cell { display: inline-flex; align-items: center; gap: 5px; }
  .tbl .lock-cell svg { color: var(--text-subtle); }
  .tbl .lead-cell { display: grid; gap: 2px; }
  .tbl .lead-cell .nm { font: 500 13px/1.2 var(--font-sans); color: var(--text-strong); }
  .tbl .lead-cell .sb { font: 11px/1.3 var(--font-sans); color: var(--text-muted); }
  .tbl tfoot td { padding: 12px; background: var(--surface-muted); color: var(--text-strong); font-weight: 500; border-top: 1px solid var(--border); }
  .tbl tfoot td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tbl-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .tbl-toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; }
  .tbl-toolbar .search { flex: 1; min-width: 180px; position: relative; }
  .tbl-toolbar .search input { width: 100%; height: 32px; padding: 0 10px 0 30px; border: 1px solid var(--border); border-radius: 6px; font: 13px var(--font-sans); background: var(--canvas); }
  .tbl-toolbar .search input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .tbl-toolbar .search [data-icon] { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); }
  .chip { padding: 5px 10px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); font: 500 12px/1 var(--font-sans); color: var(--text-strong); cursor: pointer; }
  .chip:hover { background: var(--surface-muted); }
  .chip.on { background: #D4A641; color: #fff; border-color: #D4A641; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 9999px; font: 600 11px/1.4 var(--font-sans); background: var(--surface-muted); color: var(--text-muted); }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.ok { background: var(--tone-success-bg); color: var(--tone-success); }
  .badge.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .badge.danger { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .badge.gold { background: #FEF4DA; color: #6B5119; }
  .badge.brand { background: var(--brand-soft); color: var(--brand-strong); }

  /* Forms */
  .field { display: grid; gap: 5px; }
  .field > label { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; }
  .field > input, .field > select, .field > textarea {
    height: 38px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 7px;
    font: 500 13.5px var(--font-sans); color: var(--text-strong);
    background: var(--canvas);
    font-variant-numeric: tabular-nums;
  }
  .field > textarea { height: 80px; padding: 10px 12px; resize: vertical; font-family: var(--font-sans); }
  .field > input:focus, .field > select:focus, .field > textarea:focus { outline: 0; border-color: #D4A641; box-shadow: 0 0 0 3px rgba(212,166,65,0.18); }
  .field.mono > input { font-family: var(--font-mono); }
  .field .hint { font: 11.5px/1.3 var(--font-sans); color: var(--text-subtle); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  /* Pour log form */
  .pour-form { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .pour-form { grid-template-columns: 1fr; } }
  .pour-form .pf-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
  .pour-form .pf-card h3 { font: 600 15px var(--font-sans); margin: 0 0 14px; color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
  .pour-form .pf-card .calc { background: #FEF4DA; border: 1px solid #E9D9B0; border-radius: 10px; padding: 14px 18px; margin-top: 14px; }
  .pour-form .pf-card .calc .l { font: 500 11px/1 var(--font-sans); color: #6B5119; letter-spacing: 0.04em; text-transform: uppercase; }
  .pour-form .pf-card .calc .v { font: 700 32px/1 var(--font-mono); color: #4A381A; margin-top: 6px; }
  .pour-form .pf-card .calc .sb { font: 12px/1.4 var(--font-sans); color: #6B5119; margin-top: 4px; }
  .pour-form .pf-side { display: flex; flex-direction: column; gap: 14px; }
  .pour-form .pf-side .card { padding: 16px; }
  .pour-form .photo-drop { border: 2px dashed var(--border-strong); border-radius: 10px; padding: 24px; text-align: center; cursor: pointer; transition: all 120ms; }
  .pour-form .photo-drop:hover { background: var(--surface-muted); border-color: #D4A641; }
  .pour-form .photo-drop.has { background: #FEF4DA; border-color: #D4A641; border-style: solid; padding: 14px; text-align: left; }
  .pour-form .photo-drop .ic { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-muted); color: var(--text-muted); display: grid; place-items: center; margin: 0 auto 8px; }
  .pour-form .photo-drop.has .ic { background: #D4A641; color: #fff; margin: 0; display: inline-grid; }
  .pour-form .photo-drop .nm { font: 500 13px var(--font-sans); color: var(--text-strong); }
  .pour-form .photo-drop .sb { font: 12px var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .sig-pad { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--surface-muted); text-align: center; cursor: pointer; min-height: 70px; display: grid; place-items: center; gap: 4px; }
  .sig-pad:hover { background: var(--surface-sunken); }
  .sig-pad.signed { background: var(--tone-success-bg); border-color: var(--tone-success); }
  .sig-pad .nm { font: 600 14px var(--font-sans); color: var(--text-strong); }
  .sig-pad.signed .nm { color: var(--tone-success); font-family: cursive; font-style: italic; font-size: 18px; }
  .sig-pad .sb { font: 11.5px var(--font-sans); color: var(--text-muted); }

  .submit-bar { position: sticky; bottom: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 14px 18px; display: flex; gap: 10px; justify-content: flex-end; margin: 22px -26px -22px; }
  .submit-bar .summary { flex: 1; font: 12.5px var(--font-sans); color: var(--text-muted); }
  .submit-bar .summary strong { color: var(--text-strong); font-weight: 600; }

  /* Settlement lifecycle */
  .lifecycle { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; position: relative; padding: 24px 0 8px; }
  .lifecycle::before { content: ""; position: absolute; left: 30px; right: 30px; top: 44px; height: 2px; background: var(--border); z-index: 0; }
  .lifecycle .step { position: relative; z-index: 1; text-align: center; padding: 0 4px; cursor: pointer; }
  .lifecycle .step .marker { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: grid; place-items: center; margin: 0 auto 8px; color: var(--text-muted); font: 700 14px var(--font-sans); }
  .lifecycle .step.done .marker { background: var(--tone-success); border-color: var(--tone-success); color: #fff; }
  .lifecycle .step.active .marker { background: #D4A641; border-color: #D4A641; color: #fff; box-shadow: 0 0 0 4px rgba(212,166,65,0.18); }
  .lifecycle .step .nm { font: 600 12.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .lifecycle .step .ts { font: 11px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 3px; }
  .lifecycle .step.pending .nm { color: var(--text-muted); }

  /* Ledger */
  .ledger { display: grid; gap: 4px; padding: 6px 0; }
  .ledger .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border-subtle); font: 13px var(--font-sans); color: var(--text-body); }
  .ledger .row.tot { font-weight: 700; color: var(--text-strong); border-bottom: 0; border-top: 2px solid var(--border); padding-top: 12px; margin-top: 6px; font-size: 14px; }
  .ledger .row .v { font-family: var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .ledger .row.deduct .v { color: var(--tone-danger); }
  .ledger .row.gold { color: #6B5119; background: #FEF4DA; padding-left: 10px; padding-right: 10px; border-radius: 6px; border-color: transparent; }
  .ledger .row.gold .v { color: #4A381A; }

  /* Flag row body — sits inside .b-row-card so the chrome comes from the
     design-system block. These rules only style the inner body content
     (icon tile, description tags, playbook block, action stack). */
  .excp-body { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: flex-start; }
  .excp-body .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .excp-body.crit .ic { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .excp-body.warn .ic { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .excp-body.info .ic { background: var(--brand-soft); color: var(--brand-strong); }

  }

})();

// Ledger arithmetic: Bal = Gross − Diesel − Shoots − LCD − Workers − Company.
// A non-zero Bal flags an Anomaly (matches the import-ledger statuses).
function ledgerBal(d) {
  const g = +d.gross_g || 0, di = +d.diesel_g || 0, sh = +d.shoots_g || 0,
        lc = +d.lcd_g || 0, w = +d.workers_g || 0, c = +d.company_g || 0;
  return +(g - di - sh - lc - w - c).toFixed(3);
}

function persist() {
  const { signedIn, clerk, role, dayOpen, pours, batches, shipments, exceptions, vault, auditLog, suppliers, people, groups, shifts, buys, settings, endOfDay } = state;

}

function logAction(act, diff) {
  state.auditLog.unshift({ actor: state.clerk.id, who: state.clerk.name, act, diff, ts: new Date().toISOString().slice(0,16).replace('T',' ') });

function isMgrRoute(route) {
  const n = NAV.find(x => x.route === route);
  return !!(n && n.mgrOnly);
}
function canSee(route) {
  if (!isMgrRoute(route)) return true;
  return state.role === 'manager';
}

/* ====== Helpers ====== */
function pourFineWt(p) { return p.net * p.fineAu / 100; }
function settlementValue(sh) {
  const ref = REFINERIES.find(r => r.id === sh.refinery);
  const gross = sh.fineWt * ref.fix;
  const fee = gross * ref.fee / 100;
  const royalty = gross * state.settings.royaltyPct / 100;
  const retention = gross * state.settings.retentionPct / 100;
  const net = gross - fee - royalty - retention;
  return { gross, fee, royalty, retention, net, fineWt: sh.fineWt, fix: ref.fix };
}

function wireShell() {
  $$('[data-go]').forEach(b => b.addEventListener('click', (e) => {
    const r = b.dataset.go; if (!r) return;
    if (!canSee(r)) { toast('Manager only — switch role at the top', 'warn'); return; }
    state.route = r; location.hash = '#/' + r; render();
  }));
  const fs = $('#bar-fs'); if (fs) fs.addEventListener('click', () => document.body.classList.toggle('is-fullscreen'));
  const bp = $('#bar-pour'); if (bp) bp.addEventListener('click', () => { state.route = 'pour-log'; location.hash = '#/pour-log'; render(); });
  $$('.gd-bar [data-role]').forEach(b => b.addEventListener('click', () => {
    state.role = b.dataset.role;
    persist();
    toast(state.role === 'manager' ? 'Switched to Manager view' : 'Switched to Clerk view', 'gold');
    render();
  }));
  renderBottomTabs();
  renderMoreSheet();
}

function renderBottomTabs() {
  const host = $('#gd-tabs'); if (!host) return;
  const r = state.route;
  host.innerHTML = MOBILE_TABS.map(t => {
    const active = (t.route === r) || (t.route === 'pours' && r === 'pour-log');

      ${t.label}

  }).join('');
  if (window.Icons) window.Icons.render(host);
  $$('[data-tab]', host).forEach(b => b.addEventListener('click', () => {

    if (tgt === 'more') { state.moreOpen = true; renderMoreSheet(); return; }
    state.route = tgt; location.hash = '#/' + tgt; render();

function renderMoreSheet() {
  const host = $('#more-host'); if (!host) return;
  if (!state.moreOpen) { host.innerHTML = ''; return; }
  const r = state.route;
  // Build sections from NAV, excluding bottom-tab routes (they're already on the bar)
  const onTabs = new Set(MOBILE_TABS.map(t => t.route));
  let html = '<div class="x-bs-scrim open" data-close-more role="dialog" aria-modal="true" aria-label="More destinations">';
  html += '<div class="x-bottom-sheet" onclick="event.stopPropagation()">';
  html += '<div class="x-bs-grab"></div>';
  html += '<div class="x-bs-head"><h3>More</h3><button class="x-bs-close" data-close-more aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button></div>';
  html += '<div class="x-bs-body">';
  let bufGrp = null;
  let bufItems = '';
  const flush = () => {
    if (bufItems) {
      html += bufGrp ? `<div class="ms-grp">${escapeHtml(bufGrp)}</div>` : '';
      html += bufItems;
    }
    bufItems = '';
  };
  NAV.forEach(n => {
    if (n.grp) { flush(); bufGrp = (n.mgrOnly && state.role !== 'manager') ? n.grp + ' · manager only' : n.grp; return; }
    if (onTabs.has(n.route)) return;
    const locked = n.mgrOnly && state.role !== 'manager';
    const active = (n.route === r);
    const pill = n.mgrOnly ? `<span class="pill">Manager</span>` : '';
    bufItems += `<button class="ms-it${active?' active':''}${locked?' locked':''}" data-ms="${n.route}" ${locked?'data-locked':''}>
      <span class="ic" data-icon="${n.icon}" data-icon-size="16"></span>
      <span class="lbl">${n.label}</span>${pill}
    </button>`;
  });
  flush();
  // Add a role switch row at the bottom
  html += `<div class="ms-grp">View as</div>
    <div style="display:flex; gap:8px; padding: 4px 10px 8px;">
      <button class="btn ${state.role==='clerk'?'gold':'quiet'}" style="flex:1; justify-content:center;" data-ms-role="clerk">Clerk</button>

    </div>`;
  html += '</div></div></div>';
  host.innerHTML = html;
  if (window.Icons) window.Icons.render(host);
  $$('[data-close-more]', host).forEach(b => b.addEventListener('click', () => { state.moreOpen = false; renderMoreSheet(); }));
  $$('[data-ms]', host).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.locked !== undefined) { toast('Manager only — change view at the bottom', 'warn'); return; }

    state.moreOpen = false;
    state.route = tgt; location.hash = '#/' + tgt; render();

  $$('[data-ms-role]', host).forEach(b => b.addEventListener('click', () => {
    state.role = b.dataset.msRole; persist();
    toast(state.role === 'manager' ? 'Switched to Manager view' : 'Switched to Clerk view', 'gold');
    render();
  }));
}

function nextPourId() {
  const top = state.pours[0]?.id || 'P-2842';
  const n = parseInt(top.split('-')[1], 10) + 1;
  return 'P-' + n;
}

function wirePourLog() {
  const d = state.pourDraft;
  const keys = [
    'gross','tare','fineAu','fineAg','meltLoss','batch','foreman','site','witness',
    // Ledger fields
    'leader','gross_g','diesel_g','shoots_g','lcd_g','workers_g','company_g',
  ];
  keys.forEach(k => {
    const el = $('#pf-' + k); if (!el) return;
    el.addEventListener('input', () => { d[k] = el.value; renderRoute(); });
    el.addEventListener('change', () => { d[k] = el.value; renderRoute(); });
  });
  const ph = $('#pf-photo'); if (ph) ph.addEventListener('click', () => { d.photo = !d.photo; renderRoute(); toast(d.photo ? 'Pour slip added' : 'Photo removed'); });
  const sg = $('#pf-sig');   if (sg) sg.addEventListener('click', () => { d.signed = !d.signed; renderRoute(); });
  $$('[data-pf-split]').forEach(b => b.addEventListener('click', () => {
    const m = b.dataset.pfSplit;
    if (m === '5050') { d.splitMode = '5050'; d.splitW = 50; d.splitC = 50; }
    else { d.splitMode = 'override'; if (d.splitW === 50) { d.splitW = 60; d.splitC = 40; } }
    renderRoute();
  }));
  const sw = $('#pf-splitW'); if (sw) sw.addEventListener('input', () => {
    const w = Math.max(0, Math.min(100, +sw.value || 0));
    d.splitW = w; d.splitC = 100 - w;
    const sc = $('#pf-splitC'); if (sc) sc.value = d.splitC;
  });
  const sc = $('#pf-splitC'); if (sc) sc.addEventListener('input', () => {
    const c = Math.max(0, Math.min(100, +sc.value || 0));
    d.splitC = c; d.splitW = 100 - c;
    const sw2 = $('#pf-splitW'); if (sw2) sw2.value = d.splitW;
  });
  $$('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'reset' || a === 'cancel') { state.pourDraft = emptyDraft(); renderRoute(); toast('Pour cleared'); }
    if (a === 'save') savePour();
  }));
}

function savePour() {
  const d = state.pourDraft;
  if (!d.gross || !d.tare || !d.fineAu) { toast('Weights and fineness Au are needed', 'danger'); return; }
  if (!d.photo) { toast('Add the pour slip photo first', 'danger'); return; }
  if (!d.signed) { toast('Witness must sign first', 'danger'); return; }
  const id = nextPourId();
  const net = +d.gross - +d.tare;

  // Apply split override: if non-50/50, recompute W/C from Bal (Gross − Diesel − Shoots − LCD)
  if (d.splitMode === 'override' && (+d.splitW + +d.splitC === 100)) {
    const g = +d.gross_g || 0, di = +d.diesel_g || 0, sh = +d.shoots_g || 0, lc = +d.lcd_g || 0;
    const balToSplit = +(g - di - sh - lc).toFixed(3);
    if (balToSplit > 0) {
      d.workers_g = (balToSplit * +d.splitW / 100).toFixed(3);
      d.company_g = (balToSplit * +d.splitC / 100).toFixed(3);
    }
  }
  const bal = ledgerBal(d);
  const p = {
    id, date: new Date().toISOString().slice(0,10), shift: 'Day-2',
    site: d.site, batch: d.batch || 'B-0419', foreman: d.foreman,
    gross: +d.gross, tare: +d.tare, net,
    fineAu: +d.fineAu, fineAg: +d.fineAg || 0, meltLoss: +d.meltLoss || 0,
    status: bal === 0 ? 'sampling' : 'variance',
    dispatch: null, photo: true, witness: d.witness || 'Foreman',
    // Ledger split — matches import-ledger row
    leader: d.leader || 'Musa',
    gross_g: +d.gross_g || 0,
    diesel_g: +d.diesel_g || 0,
    shoots_g: +d.shoots_g || 0,
    lcd_g:    +d.lcd_g    || 0,
    workers_g:+d.workers_g|| 0,
    company_g:+d.company_g|| 0,
    bal_g: bal,
    splitW: +d.splitW || 50, splitC: +d.splitC || 50,
  };
  state.pours.unshift(p);
  // If this pour came from a shift, attach it
  let backRoute = 'pours';
  if (d._shiftId) {
    const sh = shiftById(d._shiftId);
    if (sh) { sh.pours.unshift(id); backRoute = 'shift-detail'; state.shiftView = sh.id; }
  }
  state.pourDraft = emptyDraft();
  logAction('Wrote pour ' + id, `net ${net.toFixed(0)}g · ${d.fineAu}% Au`);
  toast(`Pour ${id} saved · ${(net * d.fineAu / 100).toFixed(2)} g fine`, 'gold');
  persist();
  state.route = backRoute; location.hash = '#/' + backRoute; render();
}

function badgeForPour(status) {

    sampling: { c: 'warn', t: 'Sampling' },
    assayed:  { c: 'brand', t: 'Fineness done' },
    shipped:  { c: 'gold', t: 'Shipped' },
    settled:  { c: 'ok', t: 'Paid' },
    variance: { c: 'danger', t: 'Difference' },
  };
  const m = map[status] || map.assayed;
  return `<span class="badge ${m.c}"><span class="dot"></span> ${m.t}</span>`;
}

function formatDate(s) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

}

      <button class="b-fc ${tab==='warn'?'on':''}" type="button" role="tab" aria-selected="${tab==='warn'}" data-extab="warn">Watch <span class="b-fc-ct">${state.exceptions.filter(e=>e.sev==='warn').length}</span></button>

function wireExceptions() {
  $$('[data-extab]').forEach(b => b.addEventListener('click', () => { state.excpTab = b.dataset.extab; renderRoute(); }));
  $$('[data-exres]').forEach(b => b.addEventListener('click', () => {
    state.exceptions = state.exceptions.filter(e => e.id !== b.dataset.exres);

}

/* ====== 10. Pricing ====== */
function renderPricing() {
  const data = state.pricing;
  const last = data[data.length - 1];
  const w = 800, h = 200;
  const min = Math.min(...data.flatMap(d => [d.lbma, d.rand, d.realised])) - 0.5;
  const max = Math.max(...data.flatMap(d => [d.lbma, d.rand, d.realised])) + 0.5;
  const x = i => (i / (data.length - 1)) * w;
  const y = v => h - ((v - min) / (max - min)) * h;
  const path = (key, color, dashed) => {
    const d = data.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(p[key]).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${color}" stroke-width="${dashed ? 1.6 : 2}" ${dashed ? 'stroke-dasharray="4 4"' : ''} stroke-linecap="round" stroke-linejoin="round" />`;
  };
  const areaPath = data.map((p, i) => `${i === 0 ? 'M' : 'L'} ${x(i).toFixed(1)} ${y(p.lbma).toFixed(1)}`).join(' ') + ` L ${w} ${h} L 0 ${h} Z`;
  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Price history</h1>
        <p class="lede">World price (LBMA PM) vs Rand Refinery quote vs what Mazowe got. Forwards, hedges, and the refinery quote sheet.</p>
        <div class="pills"><span class="p b">World price · ${money(last.lbma)}/g</span><span class="p">RR ${money(last.rand)}/g</span><span class="p s">We got ${money(last.realised)}/g</span></div>
      </div>
      <div class="acts"><button class="btn quiet"><span data-icon="filter" data-icon-size="13"></span> Compare refineries</button><button class="btn gold"><span data-icon="refresh" data-icon-size="13"></span> Get today's price</button></div>
    </div>
    <div class="stat-row">
      <div class="stat gold"><div class="l">World price today</div><div class="v">${money(last.lbma)}<span class="u">/g</span></div><div class="d up">+ ${money(last.lbma - data[data.length-2].lbma)} d/d</div></div>
      <div class="stat"><div class="l">Rand Refinery quote</div><div class="v">${money(last.rand)}<span class="u">/g</span></div><div class="d dn">– ${money(last.lbma - last.rand)} vs world</div></div>
      <div class="stat"><div class="l">We got · year avg</div><div class="v">${money(73.92)}<span class="u">/g</span></div><div class="d dn">– 0.18 vs world</div></div>
      <div class="stat"><div class="l">USD / ZWG (RBZ)</div><div class="v">32.00<span class="u"></span></div><div class="d">Auction · 03 Jun</div></div>
    </div>
    <div class="card">
      <h3>Price by day · last 60 days <span class="sub">USD/g</span></h3>
      <div class="price-chart">
        <div class="legend">
          <span class="k"><span class="sw" style="background: #D4A641;"></span>World price</span>
          <span class="k"><span class="sw" style="background: repeating-linear-gradient(90deg, #9A9485 0 4px, transparent 4px 8px);"></span>Rand Refinery</span>
          <span class="k"><span class="sw" style="background: #0B5DF0;"></span>What we got</span>
        </div>
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
          <defs>
            <linearGradient id="goldGrad" x1="0" x2="0" y1="0" y2="1">
              <stop offset="0%" stop-color="#D4A641" stop-opacity="0.28"/>
              <stop offset="100%" stop-color="#D4A641" stop-opacity="0"/>
            </linearGradient>
          </defs>
          ${[0,1,2,3,4].map(i => `<line x1="0" y1="${i*h/4}" x2="${w}" y2="${i*h/4}" stroke="${i===0||i===4?'#E5E7EB':'#F3F4F6'}" stroke-width="1" />`).join('')}
          <path d="${areaPath}" fill="url(#goldGrad)"/>
          ${path('rand', '#9A9485', true)}
          ${path('realised', '#0B5DF0', false)}
          ${path('lbma', '#D4A641', false)}
          <circle cx="${x(data.length-1)}" cy="${y(last.lbma)}" r="4" fill="#D4A641"/>
        </svg>
      </div>
    </div>
    <div class="card-grid cols-2" style="margin-top: 18px;">
      <div class="card">
        <h3>Recent payouts vs world price</h3>
        <table class="tbl">
          <thead><tr><th>Shipment</th><th class="num">Fine</th><th class="num">We got</th><th class="num">World</th><th class="num">Gap</th></tr></thead>
          <tbody>
            ${state.shipments.filter(s=>s.stage>=4).map(s => {
              const ref = REFINERIES.find(r=>r.id===s.refinery);
              const realised = ref.fix - 0.18;
              const spread = (realised - ref.fix) / ref.fix * 100;
              return `<tr><td><span class="nm">${s.id}</span><div class="sb">${ref.nm}</div></td><td class="num">${kg(s.fineWt)}</td><td class="num">${money(realised)}/g</td><td class="num">${money(ref.fix)}/g</td><td class="num" style="color: ${spread < -0.2 ? 'var(--tone-danger)' : 'var(--tone-success)'};">${spread.toFixed(2)}%</td></tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3>Refinery quote sheet</h3>
        <table class="tbl">
          <thead><tr><th>Refinery</th><th class="num">Quote (USD/g)</th><th>Fee</th><th>Status</th></tr></thead>
          <tbody>
            ${REFINERIES.map(r => `<tr><td><span class="nm">${r.nm}</span><div class="sb">${r.loc}</div></td><td class="num">${money(r.fix)}</td><td><span class="badge gold"><span class="dot"></span> ${r.fee}%</span></td><td><span class="badge ok"><span class="dot"></span> live</span></td></tr>`).join('')}
          </tbody>
        </table>

        </div>
      </div>
    </div>
  </div>`;
}

/* ====== 12. Royalty & retention ====== */

    const v = settlementValue(s);
    acc.gross += v.gross; acc.royalty += v.royalty; acc.retention += v.retention; acc.aids += v.gross * 0.03;
    return acc;
  }, { gross: 0, royalty: 0, retention: 0, aids: 0 });
  const cap = 27830000;
  const pctHit = totals.retention / cap * 100;
  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Royalty &amp; RBZ keep-back</h1>
        <p class="lede">What's owed, as paid shipments come in. ZIMRA royalty, RBZ 25% keep-back, AIDS levy. Pay when the cap is hit.</p>
        <div class="pills"><span class="p b">Q2 2026</span><span class="p w">RBZ ${pctHit.toFixed(0)}% of cap</span><span class="p s">Royalty up to date</span></div>

      <div class="stat"><div class="l">ZIMRA royalty (5%)</div><div class="v">${money(totals.royalty)}<span class="u"></span></div><div class="d up">Up to date · paid weekly</div></div>
      <div class="stat"><div class="l">RBZ keep-back (25%)</div><div class="v">${money(totals.retention)}<span class="u"></span></div><div class="d dn">${pctHit.toFixed(0)}% of Q2 cap</div></div>
      <div class="stat"><div class="l">AIDS levy (3%)</div><div class="v">${money(totals.aids)}<span class="u"></span></div><div class="d">Every quarter</div></div>

        <h3>Keep-back so far · Q2 cap ${money(cap)}</h3>
        <div style="height: 28px; background: var(--surface-muted); border-radius: 9999px; overflow: hidden; position: relative; margin: 12px 0;">
          <div style="height: 100%; width: ${Math.min(pctHit,100)}%; background: linear-gradient(90deg, #D4A641, #B8862B); border-radius: 9999px; transition: width 400ms;"></div>
          <span style="position: absolute; inset: 0; display: grid; place-items: center; font: 700 12px var(--font-mono); color: ${pctHit > 50 ? '#fff' : 'var(--text-strong)'}; mix-blend-mode: ${pctHit > 50 ? 'difference' : 'normal'};">${money(totals.retention)} / ${money(cap)}</span>
        </div>
        <div style="font: 12.5px var(--font-sans); color: var(--text-muted);">At this pace, the cap is hit on <strong style="color: var(--text-strong);">24 Jun 2026</strong>. Payments may go weekly.</div>

        <h3>What's due, when</h3>

          <thead><tr><th>Due</th><th>Who</th><th class="num">Amount</th><th>Status</th></tr></thead>
          <tbody>

/* ====== Helpers for new modules ====== */
function nextId(prefix, list) {
  const nums = list.map(x => parseInt((x.id || '').split('-').pop(), 10) || 0);
  const n = (nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + String(n).padStart(3, '0');
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function isToday(d) { return d === todayStr() || d === '2026-06-03'; }
function personById(id) { return state.people.find(p => p.id === id); }
function groupById(id) { return state.groups.find(g => g.id === id); }
function shiftById(id) { return state.shifts.find(s => s.id === id); }
function shiftFineWt(sh) {
  return sh.pours.reduce((s, pid) => {
    const p = state.pours.find(x => x.id === pid); return s + (p ? pourFineWt(p) : 0);
  }, 0);
}

          <div class="b-rc-sb">${formatDate(s.date)} · ${grp ? escapeHtml(grp.nm) : 'no group'} · ${present}/${s.members.length} workers · ${s.pours.length} pour${s.pours.length===1?'':'s'}</div>
        </div>
        <div>
          <div class="b-rc-val">${grams(fine)}</div>
          <div class="b-rc-delta ${s.status==='open'?'':'up'}">${statusLbl}${(s.splitW !== 50) ? ` · ${s.splitW}/${s.splitC}` : ''}</div>
        </div>
      </div>
    </button>`;
}

function wireShifts() {
  $$('[data-new-shift]').forEach(b => b.addEventListener('click', openNewShiftModal));
  $$('[data-shift]').forEach(b => b.addEventListener('click', () => {
    state.shiftView = b.dataset.shift;
    state.route = 'shift-detail'; location.hash = '#/shift-detail'; render();

}

function openNewShiftModal() {

        <select id="ns-group">
          <option value="">— blank shift —</option>

/* ====== Shift detail (attendance + pours + split override) ====== */
function renderShiftDetail() {
  const s = shiftById(state.shiftView) || state.shifts[0];
  if (!s) return `<div class="page"><div class="page-head"><h1>No shift picked</h1></div><button class="btn gold" data-go="shifts">Back to shifts</button></div>`;
  state.shiftView = s.id;
  const present = s.members.length - s.absent.length;
  const pours = state.pours.filter(p => s.pours.includes(p.id));
  const fine = pours.reduce((sum,p) => sum + pourFineWt(p), 0);
  const grp = groupById(s.groupId);
  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Shift · ${s.id}</h1>
        <p class="lede">${escapeHtml(s.leader)} · ${escapeHtml(s.name)} · ${formatDate(s.date)} · ${grp ? escapeHtml(grp.nm) : 'no group'}</p>
        <div class="pills">
          <span class="p ${s.status==='open'?'w':'s'}">${s.status==='open'?'Open':'Closed'}</span>
          <span class="p b">${present}/${s.members.length} workers</span>
          <span class="p">${grams(fine)} fine</span>
          ${(s.splitW !== 50) ? `<span class="p w">${s.splitW}/${s.splitC} split</span>` : `<span class="p">50/50 split</span>`}
        </div>
      </div>
      <div class="acts">
        <button class="btn quiet" data-go="shifts"><span data-icon="back" data-icon-size="13"></span> All shifts</button>
        <button class="btn gold" data-shift-pour="${s.id}"><span data-icon="plus" data-icon-size="13"></span> Add pour</button>
        ${s.status==='open' ? `<button class="btn primary" data-shift-close="${s.id}"><span data-icon="check" data-icon-size="13"></span> Close shift</button>` : ''}
      </div>
    </div>
    <div class="card-grid cols-2">
      <div class="card" style="padding: 0;">
        <h3 style="padding: 14px 16px 8px; margin: 0; display:flex; justify-content:space-between;">Attendance <span class="sub">tick off who didn't show up</span></h3>
        ${s.members.length === 0 ? `<div style="padding: 18px; color: var(--text-muted); font: 13.5px var(--font-sans);">No members yet. <button class="btn sm" data-shift-addmem="${s.id}" style="margin-left:8px;">Add members</button></div>` :
          s.members.map(wid => {
            const w = personById(wid); if (!w) return '';
            const here = !s.absent.includes(wid);
            return `<div class="att-row ${here?'on':'off'}">
              <div class="av">${w.nm.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
              <div style="flex:1; min-width:0;"><div class="nm">${escapeHtml(w.nm)}</div><div class="sb">${escapeHtml(w.role)} · ${escapeHtml(w.phone)}</div></div>
              <button class="toggle" data-att="${s.id}|${wid}" aria-label="Toggle ${here?'absent':'present'}"></button>
            </div>`;
          }).join('')}
        <div style="padding: 12px 16px; border-top: 1px solid var(--border-subtle); display:flex; justify-content:space-between; align-items:center;">
          <div style="font: 12.5px var(--font-sans); color: var(--text-muted);">${present} present · ${s.absent.length} away</div>
          <button class="btn sm quiet" data-shift-addmem="${s.id}"><span data-icon="plus" data-icon-size="12"></span> Add worker</button>
        </div>
      </div>
      <div class="card">
        <h3>Split <span class="sub">how to divide the gold after expenses</span></h3>
        <div class="seg" style="margin-bottom: 12px;">
          <button class="${s.splitW===50?'on':''}" data-shift-split="${s.id}|50">50/50</button>
          <button class="${s.splitW!==50?'on':''}" data-shift-split="${s.id}|override">Override</button>
        </div>
        <div class="row2">
          <div class="field mono"><label>W. workers %</label><input type="number" id="ss-w" value="${s.splitW}" min="0" max="100" ${s.splitW===50?'readonly':''} style="${s.splitW===50?'background:var(--surface-muted);':''}" /></div>
          <div class="field mono"><label>C. company %</label><input type="number" id="ss-c" value="${s.splitC}" min="0" max="100" ${s.splitW===50?'readonly':''} style="${s.splitW===50?'background:var(--surface-muted);':''}" /></div>
        </div>
        <div style="margin-top: 12px; font: 12.5px var(--font-sans); color: var(--text-muted);">Every new pour on this shift starts with this split. The pour can still override it on its own.</div>
        <hr style="border:0; border-top: 1px solid var(--border-subtle); margin: 16px 0;" />
        <h3 style="margin-top: 8px;">Notes</h3>
        <textarea id="ss-notes" style="width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--border); border-radius: 7px; font: 13px var(--font-sans);" placeholder="Anything to note for this shift…">${escapeHtml(s.notes || '')}</textarea>
      </div>
    </div>
    <div class="card" style="margin-top: 18px;">
      <h3>Pours on this shift <span class="sub">${pours.length} · ${grams(fine)} fine</span></h3>
      ${pours.length ? `
        <table class="tbl">
          <thead><tr><th>Pour</th><th class="num">Gross</th><th class="num">Net</th><th class="num">Fineness</th><th class="num">Fine g</th><th>Status</th></tr></thead>
          <tbody>
            ${pours.map(p => `<tr class="clickable" data-pour="${p.id}">
              <td><span class="nm">${p.id}</span><div class="sb">${p.batch}</div></td>
              <td class="num">${p.gross} g</td>
              <td class="num">${p.net} g</td>
              <td class="num">${p.fineAu.toFixed(1)}%</td>
              <td class="num">${pourFineWt(p).toFixed(2)} g</td>
              <td>${badgeForPour(p.status)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      ` : `<div style="padding: 18px; text-align:center; color: var(--text-muted); font: 13.5px var(--font-sans);">No pours yet. <button class="btn sm gold" data-shift-pour="${s.id}" style="margin-left:8px;">Add the first pour</button></div>`}
    </div>
  </div>`;
}

function wireShiftDetail() {
  const sId = state.shiftView;
  $$('[data-att]').forEach(b => b.addEventListener('click', () => {
    const [shId, wId] = b.dataset.att.split('|');
    const s = shiftById(shId); if (!s) return;
    if (s.absent.includes(wId)) s.absent = s.absent.filter(x => x !== wId);
    else s.absent.push(wId);
    persist(); renderRoute();
  }));
  $$('[data-shift-split]').forEach(b => b.addEventListener('click', () => {
    const [shId, kind] = b.dataset.shiftSplit.split('|');
    const s = shiftById(shId); if (!s) return;
    if (kind === '50') { s.splitW = 50; s.splitC = 50; }
    else { if (s.splitW === 50) { s.splitW = 60; s.splitC = 40; } }
    persist(); renderRoute();
  }));
  ['ss-w','ss-c'].forEach(id => { const el = $('#'+id); if (el) el.addEventListener('input', () => {
    const s = shiftById(sId); if (!s) return;
    const w = Math.max(0, Math.min(100, +$('#ss-w').value || 0));
    const c = 100 - w;
    s.splitW = w; s.splitC = c; $('#ss-c').value = c; persist();
  });});
  const notes = $('#ss-notes'); if (notes) notes.addEventListener('input', () => { const s = shiftById(sId); if (s) { s.notes = notes.value; persist(); } });
  $$('[data-shift-pour]').forEach(b => b.addEventListener('click', () => {
    const s = shiftById(b.dataset.shiftPour); if (!s) return;
    // Pre-load pour draft with the shift's leader + split
    state.pourDraft = emptyDraft();
    state.pourDraft.leader = s.leader;
    state.pourDraft._shiftId = s.id;
    state.route = 'pour-log'; location.hash = '#/pour-log'; render();
  }));
  $$('[data-shift-close]').forEach(b => b.addEventListener('click', () => {
    const s = shiftById(b.dataset.shiftClose); if (!s) return;
    s.status = 'closed'; persist();
    logAction('Closed shift ' + s.id, `${s.pours.length} pours · ${grams(shiftFineWt(s))} fine`);
    toast('Shift ' + s.id + ' closed', 'success');
    renderRoute();
  }));
  $$('[data-shift-addmem]').forEach(b => b.addEventListener('click', () => openAddMemberModal(b.dataset.shiftAddmem, 'shift')));
  $$('[data-pour]').forEach(r => r.addEventListener('click', () => openPourDrawer(r.dataset.pour)));
}

function openAddMemberModal(targetId, kind) {
  // kind: 'shift' or 'group'
  const target = kind === 'shift' ? shiftById(targetId) : groupById(targetId);
  if (!target) return;
  const eligible = state.people.filter(p => p.status === 'active' && !target.members.includes(p.id));
  state.modal = { cls: 'modal lg', html: `
    <h3>Add workers to ${kind === 'shift' ? 'this shift' : 'group'}</h3>
    <p class="sub">Tick the ones to add. Filter by leader if there are many.</p>
    <div class="field" style="margin-bottom: 10px;"><label>Filter by leader</label>
      <select id="amm-ldr"><option value="">All leaders</option>${LEDGER_LEADERS.map(l => `<option ${l===target.leader?'selected':''}>${l}</option>`).join('')}</select>
    </div>
    <div id="amm-list" style="max-height: 320px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;">
      ${eligible.map(p => `<label class="att-row on" style="cursor:pointer;">
        <input type="checkbox" data-pid="${p.id}" data-ldr="${escapeHtml(p.leader)}" />
        <div class="av">${p.nm.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
        <div style="flex:1; min-width:0;"><div class="nm">${escapeHtml(p.nm)}</div><div class="sb">${escapeHtml(p.role)} · ${escapeHtml(p.leader)}</div></div>
      </label>`).join('')}
    </div>
    <div class="acts"><button class="alt" data-close>Cancel</button><button class="ok" data-amm-add="${kind}|${target.id}">Add picked</button></div>
  `};
  renderModal();
  const filter = $('#amm-ldr'); if (filter) filter.addEventListener('change', () => {
    const v = filter.value;
    $$('#amm-list .att-row').forEach(r => {
      const ldr = r.querySelector('input').dataset.ldr;
      r.style.display = (!v || v === ldr) ? '' : 'none';
    });
  });
  $$('[data-amm-add]').forEach(b => b.addEventListener('click', () => {
    const [k, id] = b.dataset.ammAdd.split('|');
    const tgt = k === 'shift' ? shiftById(id) : groupById(id);
    const picks = $$('#amm-list input[type=checkbox]').filter(c => c.checked).map(c => c.dataset.pid);
    if (!picks.length) { toast('Tick at least one worker', 'warn'); return; }
    picks.forEach(pid => { if (!tgt.members.includes(pid)) tgt.members.push(pid); });
    logAction('Added workers to ' + k + ' ' + id, picks.join(', '));
    persist(); closeModal(); toast(`${picks.length} added`, 'success'); render();
  }));
}

/* ====== Groups CRUD ====== */

  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Groups</h1>
        <p class="lede">A group is a leader plus their crew with a saved split. Pick one when starting a shift and everything pre-fills.</p>
        <div class="pills"><span class="p b">${state.groups.length} groups</span><span class="p">${state.groups.reduce((s,g)=>s+g.members.length, 0)} members</span></div>
      </div>
      <div class="acts">
        <button class="btn quiet" data-go="shifts"><span data-icon="clock" data-icon-size="13"></span> Shifts</button>

      </div>
    </div>
    <div class="card-grid cols-2">
      ${state.groups.map(g => {
        const members = g.members.map(personById).filter(Boolean);
        return `
          <div class="card">
            <h3>${escapeHtml(g.nm)}<span class="badge ${g.splitW!==50?'gold':''}"><span class="dot"></span> ${g.splitW}/${g.splitC}</span></h3>
            <div style="display:flex; gap: 8px; flex-wrap:wrap; align-items:center; margin-bottom: 10px;">
              <span class="badge brand"><span class="dot"></span> Leader · ${escapeHtml(g.leader)}</span>
              <span class="badge"><span class="dot"></span> ${members.length} members</span>
            </div>
            <div style="display:grid; gap:4px; margin-bottom: 12px;">
              ${members.slice(0,5).map(m => `<div style="font: 12.5px var(--font-sans); color: var(--text-body);">${escapeHtml(m.nm)} · <span style="color: var(--text-muted);">${escapeHtml(m.role)}</span></div>`).join('')}
              ${members.length > 5 ? `<div style="font: 12.5px var(--font-sans); color: var(--text-subtle);">+ ${members.length - 5} more</div>` : ''}
            </div>
            ${g.notes ? `<div style="padding: 8px 10px; background: var(--surface-muted); border-radius: 6px; font: 12px var(--font-sans); color: var(--text-muted); margin-bottom: 10px;">${escapeHtml(g.notes)}</div>` : ''}
            <div style="display:flex; gap: 6px;">
              <button class="btn sm" data-edit-group="${g.id}"><span data-icon="edit" data-icon-size="12"></span> Edit</button>
              <button class="btn sm gold" data-start-shift="${g.id}"><span data-icon="play" data-icon-size="12"></span> Start shift</button>
              <button class="btn sm danger" data-del-group="${g.id}"><span data-icon="trash" data-icon-size="12"></span> Delete</button>
            </div>
          </div>

function wireGroups() {
  $$('[data-new-group]').forEach(b => b.addEventListener('click', () => openGroupDrawer(null)));
  $$('[data-edit-group]').forEach(b => b.addEventListener('click', () => openGroupDrawer(b.dataset.editGroup)));
  $$('[data-del-group]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.delGroup;
    const g = groupById(id); if (!g) return;
    state.modal = { cls: 'modal', html: `
      <h3>Delete ${escapeHtml(g.nm)}?</h3>
      <p class="sub">The members stay in the workers list. Past shifts keep their record.</p>
      <div class="acts"><button class="alt" data-close>Keep</button><button class="ok" data-confirm-del-group="${id}" style="background: var(--tone-danger);">Delete group</button></div>
    `};
    renderModal();
    $$('[data-confirm-del-group]').forEach(b => b.addEventListener('click', () => {
      state.groups = state.groups.filter(x => x.id !== id);
      logAction('Deleted group ' + id, g.nm);
      persist(); closeModal(); toast('Group deleted', 'success'); renderRoute();
    }));
  }));
  $$('[data-start-shift]').forEach(b => b.addEventListener('click', () => {
    const g = groupById(b.dataset.startShift); if (!g) return;
    const id = nextId('SH-D-', state.shifts);
    state.shifts.unshift({
      id, date: todayStr(), name: 'Day-2', groupId: g.id, leader: g.leader,
      members: g.members.slice(), absent: [], pours: [], splitW: g.splitW, splitC: g.splitC,
      status: 'open', notes: '',
    });
    logAction('Started shift ' + id + ' from group ' + g.id, g.nm);
    persist();
    state.shiftView = id; state.route = 'shift-detail'; location.hash = '#/shift-detail'; render();
    toast('Shift ' + id + ' started · ' + g.nm, 'gold');
  }));
}

function openGroupDrawer(id) {
  const isNew = !id;
  const g = isNew
    ? { id: nextId('G-', state.groups), nm: '', leader: 'Musa', members: [], splitW: 50, splitC: 50, notes: '' }
    : Object.assign({}, groupById(id));
  state.groupDraft = g;
  state.drawer = {
    title: isNew ? 'New group' : 'Edit · ' + g.nm,
    body: groupDrawerBody(g, isNew),
    actions: `
      ${!isNew ? `<button class="btn danger" data-drawer-del="${g.id}"><span data-icon="trash" data-icon-size="13"></span> Delete</button>` : ''}
      <button class="btn quiet" data-close>Cancel</button>
      <button class="btn gold" data-drawer-save-group>${isNew?'Create group':'Save changes'}</button>
    `,
  };
  renderDrawer();
  wireGroupDrawer(isNew);
}

function groupDrawerBody(g, isNew) {
  const members = g.members.map(personById).filter(Boolean);
  return `
    <div style="display:grid; gap: 12px;">
      <div class="field"><label>Group name</label><input id="gd-nm" value="${escapeHtml(g.nm)}" placeholder="e.g. Musa's pit team" /></div>
      <div class="field"><label>Leader</label>
        <select id="gd-ldr">${LEDGER_LEADERS.map(l => `<option ${g.leader===l?'selected':''}>${l}</option>`).join('')}</select>
      </div>
      <div>
        <label style="font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; display:block; margin-bottom: 6px;">Default split (after expenses)</label>
        <div class="seg" style="margin-bottom: 8px;">
          <button class="${g.splitW===50?'on':''}" data-gd-split="50">50/50</button>
          <button class="${g.splitW!==50?'on':''}" data-gd-split="override">Override</button>
        </div>
        <div class="row2">
          <div class="field mono"><label>W. workers %</label><input type="number" id="gd-w" value="${g.splitW}" min="0" max="100" ${g.splitW===50?'readonly':''} style="${g.splitW===50?'background:var(--surface-muted);':''}" /></div>
          <div class="field mono"><label>C. company %</label><input type="number" id="gd-c" value="${g.splitC}" min="0" max="100" ${g.splitW===50?'readonly':''} style="${g.splitW===50?'background:var(--surface-muted);':''}" /></div>
        </div>
      </div>
      <div>
        <label style="font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          Members · ${members.length}
          <button class="btn sm" data-gd-addmem><span data-icon="plus" data-icon-size="11"></span> Add</button>
        </label>
        <div style="border: 1px solid var(--border); border-radius: 8px; max-height: 280px; overflow-y: auto;">
          ${members.length ? members.map(m => `<div class="att-row on">
            <div class="av">${m.nm.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
            <div style="flex:1; min-width:0;"><div class="nm">${escapeHtml(m.nm)}</div><div class="sb">${escapeHtml(m.role)} · ${escapeHtml(m.phone)}</div></div>
            <button class="btn sm quiet" data-gd-rm="${m.id}" aria-label="Remove ${escapeHtml(m.nm)}"><span data-icon="trash" data-icon-size="12"></span></button>
          </div>`).join('') : `<div style="padding: 18px; text-align:center; color: var(--text-muted); font: 13px var(--font-sans);">No members yet — tap Add.</div>`}
        </div>
      </div>
      <div class="field"><label>Notes</label><textarea id="gd-notes" placeholder="e.g. day shift · stamp mill">${escapeHtml(g.notes || '')}</textarea></div>
    </div>
  `;
}

function wireGroupDrawer(isNew) {
  const g = state.groupDraft;
  const repaint = () => {
    const drawer = $('.drawer .db'); if (drawer) drawer.innerHTML = groupDrawerBody(g, isNew);
    if (window.Icons) window.Icons.render(drawer);
    wireGroupDrawer(isNew);
  };
  $$('.drawer #gd-nm').forEach(el => el.addEventListener('input', () => { g.nm = el.value; }));
  $$('.drawer #gd-ldr').forEach(el => el.addEventListener('change', () => { g.leader = el.value; }));
  $$('.drawer [data-gd-split]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.gdSplit === '50') { g.splitW = 50; g.splitC = 50; }
    else if (g.splitW === 50) { g.splitW = 60; g.splitC = 40; }
    repaint();
  }));
  $$('.drawer #gd-w').forEach(el => el.addEventListener('input', () => {
    const w = Math.max(0, Math.min(100, +el.value || 0));
    g.splitW = w; g.splitC = 100 - w;
    const c = $('.drawer #gd-c'); if (c) c.value = g.splitC;
  }));
  $$('.drawer [data-gd-rm]').forEach(b => b.addEventListener('click', () => {
    g.members = g.members.filter(x => x !== b.dataset.gdRm); repaint();
  }));
  $$('.drawer [data-gd-addmem]').forEach(b => b.addEventListener('click', () => {
    // open a quick worker-picker on top of the drawer
    const eligible = state.people.filter(p => p.status === 'active' && !g.members.includes(p.id));
    state.modal = { cls: 'modal lg', html: `
      <h3>Add members to ${escapeHtml(g.nm || 'new group')}</h3>
      <p class="sub">Pick from active workers.</p>
      <div id="gam-list" style="max-height: 360px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px;">
        ${eligible.map(p => `<label class="att-row on" style="cursor:pointer;">
          <input type="checkbox" data-pid="${p.id}" />
          <div class="av">${p.nm.split(' ').map(x=>x[0]).join('').slice(0,2)}</div>
          <div style="flex:1; min-width:0;"><div class="nm">${escapeHtml(p.nm)}</div><div class="sb">${escapeHtml(p.role)} · ${escapeHtml(p.leader)}</div></div>
        </label>`).join('')}
      </div>
      <div class="acts"><button class="alt" data-close>Cancel</button><button class="ok" data-gam-add>Add picked</button></div>
    `};
    renderModal();
    $$('[data-gam-add]').forEach(bb => bb.addEventListener('click', () => {
      const picks = $$('#gam-list input[type=checkbox]').filter(c => c.checked).map(c => c.dataset.pid);
      picks.forEach(pid => { if (!g.members.includes(pid)) g.members.push(pid); });
      closeModal(); repaint();
    }));
  }));
  $$('.drawer #gd-notes').forEach(el => el.addEventListener('input', () => { g.notes = el.value; }));
  $$('[data-drawer-save-group]').forEach(b => b.addEventListener('click', () => {
    if (!g.nm) { toast('Give the group a name', 'danger'); return; }
    if (g.splitW + g.splitC !== 100) { toast('W % + C % must add up to 100', 'danger'); return; }
    const existing = groupById(g.id);
    if (existing) { Object.assign(existing, g); logAction('Edited group ' + g.id, g.nm); }
    else { state.groups.unshift(g); logAction('Created group ' + g.id, g.nm + ' · ' + g.leader); }
    persist(); state.drawer = null; renderDrawer();
    toast(isNew ? 'Group created' : 'Group saved', 'success');
    render();
  }));
  $$('[data-drawer-del]').forEach(b => b.addEventListener('click', () => {
    state.groups = state.groups.filter(x => x.id !== b.dataset.drawerDel);
    logAction('Deleted group ' + b.dataset.drawerDel, g.nm);
    persist(); state.drawer = null; renderDrawer();
    toast('Group deleted', 'success'); render();
  }));
}

      <div class="meta">
        <h1>Mine workers</h1>
        <p class="lede">Who works at Mazowe and under which leader. Hire someone new, suspend, or mark them as left.</p>
        <div class="pills"><span class="p s">${active} active</span><span class="p w">${susp} suspended</span><span class="p">${left} left</span></div>
      </div>
      <div class="acts">

    <div class="stat-row">

      <div class="stat"><div class="l">Active</div><div class="v">${active}<span class="u"></span></div></div>

        <h3 style="padding: 14px 16px; margin: 0; border-bottom: 1px solid var(--border-subtle); display:flex; justify-content:space-between;">

          <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Started</th><th>Status</th><th style="width: 220px;"></th></tr></thead>
          <tbody>
            ${crew.map(p => `

                <td><span class="nm">${escapeHtml(p.nm)}</span><div class="sb">${p.id}</div></td>

                <td style="text-align: right;">
                  ${p.status==='active' ? `<button class="btn sm" data-suspend="${p.id}">Suspend</button> <button class="btn sm danger" data-fire="${p.id}">Mark left</button>` :
                    p.status==='suspended' ? `<button class="btn sm" data-reinstate="${p.id}">Reinstate</button> <button class="btn sm danger" data-fire="${p.id}">Mark left</button>` :
                    `<button class="btn sm quiet" data-rehire="${p.id}">Re-hire</button>`}

function wirePeople() {
  $$('[data-hire]').forEach(b => b.addEventListener('click', openHireModal));
  $$('[data-suspend]').forEach(b => b.addEventListener('click', () => {
    const p = personById(b.dataset.suspend); if (!p) return;
    p.status = 'suspended'; logAction('Suspended worker ' + p.id, p.nm); persist();
    toast(p.nm + ' suspended', 'warn'); renderRoute();
  }));
  $$('[data-reinstate]').forEach(b => b.addEventListener('click', () => {
    const p = personById(b.dataset.reinstate); if (!p) return;
    p.status = 'active'; logAction('Reinstated worker ' + p.id, p.nm); persist();
    toast(p.nm + ' is back on the books', 'success'); renderRoute();
  }));
  $$('[data-rehire]').forEach(b => b.addEventListener('click', () => {
    const p = personById(b.dataset.rehire); if (!p) return;
    p.status = 'active'; delete p.reason; logAction('Re-hired worker ' + p.id, p.nm); persist();
    toast(p.nm + ' re-hired', 'success'); renderRoute();
  }));
  $$('[data-fire]').forEach(b => b.addEventListener('click', () => openFireModal(b.dataset.fire)));
}

function openFireModal(pid) {
  const p = personById(pid); if (!p) return;
  state.modal = { cls: 'modal', html: `
    <h3>Mark ${escapeHtml(p.nm)} as left?</h3>
    <p class="sub">They come off the active list. Past records keep their name.</p>
    <div class="field"><label>Reason</label>

    <div class="acts"><button class="alt" data-close>Cancel</button><button class="ok" data-fire-save="${pid}" style="background: var(--tone-danger);">Mark as left</button></div>
  `};
  renderModal();
  $$('[data-fire-save]').forEach(b => b.addEventListener('click', () => {

}

/* ====== Buy gold (walk-in) ====== */
function renderBuyGold() {
  const d = state.buyDraft;

  const todayWt = todayBuys.reduce((s,b) => s + b.wt, 0);
  const limit = +state.settings.dailyBuyLimit || 500;

  return `
  <div class="page">
    <div class="page-head">
      <div class="meta">
        <h1>Buy gold · walk-in</h1>
        <p class="lede">Small buys from walk-in mine owners. Weigh, test fineness, agree price, pay on the spot. Trail kept for ZIMRA.</p>
        <div class="pills">
          <span class="p b">${todayBuys.length} buys today</span>
          <span class="p ${pctUsed>=80?'w':'s'}">${todayWt.toFixed(1)} / ${limit} g daily limit</span>
        </div>
      </div>
      <div class="acts"><button class="btn quiet" data-go="suppliers"><span data-icon="user" data-icon-size="13"></span> Owners book</button></div>

      <h3>Today's buy limit <span class="sub">${pctUsed.toFixed(0)}% used</span></h3>

      ${pctUsed >= 80 ? `<div style="margin-top: 10px; padding: 10px 12px; background: var(--tone-warn-bg); color: var(--tone-warn); border-radius: 8px; font: 500 12.5px var(--font-sans); display:flex; gap:8px; align-items:center;">
        <span data-icon="info" data-icon-size="14"></span>
        ${pctUsed >= 100 ? 'Limit reached — manager must OK any more buys today.' : 'Close to the daily limit. Slow down and ring the boss.'}
      </div>` : ''}

    <div class="card-grid cols-2">
      <div class="card">
        <h3><span data-icon="plus" data-icon-size="14"></span> New buy</h3>
        <div class="field" style="margin-bottom: 10px;"><label>Owner</label>
          <select id="bg-supp">
            <option value="">— walk-in (no record) —</option>
            ${state.suppliers.map(s => `<option value="${s.id}" ${d.supplierId===s.id?'selected':''}>${escapeHtml(s.nm)} · ${s.id_no}</option>`).join('')}
          </select>
        </div>
        ${!d.supplierId ? `<div class="field" style="margin-bottom: 10px;"><label>Walk-in name (write it down)</label><input id="bg-suppnm" value="${escapeHtml(d.supplierNm)}" placeholder="e.g. J. Mada · ID 63-...-22" /></div>` : ''}
        <div class="row2">
          <div class="field mono"><label>Weight (g)</label><input type="number" step="0.01" id="bg-wt" value="${d.wt}" placeholder="0.00" /></div>
          <div class="field mono"><label>Fineness %
            <button type="button" class="btn sm quiet" data-bg-fineset="91.6" style="margin-left: 6px;">22ct · 91.6%</button>
          </label><input type="number" step="0.1" id="bg-fineness" value="${d.fineness}" /></div>
        </div>
        <div class="row2" style="margin-top: 10px;">
          <div class="field mono"><label>Price · USD per gram</label><input type="number" step="0.01" id="bg-ppg" value="${d.ppg}" placeholder="62.00" /></div>
          <div class="field"><label>Payment</label>
            <select id="bg-method"><option ${d.method==='Cash'?'selected':''}>Cash</option><option ${d.method==='EcoCash'?'selected':''}>EcoCash</option><option ${d.method==='OneMoney'?'selected':''}>OneMoney</option></select>
          </div>

          <div style="font: 500 11px/1 var(--font-sans); color: #6B5119; letter-spacing: 0.04em; text-transform: uppercase;">Total to pay</div>
          <div style="font: 700 28px/1 var(--font-mono); color: #4A381A; margin-top: 6px;">${money(total)}</div>
          <div style="font: 12px/1.4 var(--font-sans); color: #6B5119; margin-top: 4px;">${((+d.wt||0) * (+d.fineness||0) / 100).toFixed(2)} g fine · at ${money(+d.ppg||0)}/g</div>
        </div>
        <div class="card" style="padding: 12px; margin-top: 14px;">
          <h3 style="font-size: 13px; margin-bottom: 8px;"><span data-icon="camera" data-icon-size="13"></span> ID + gold photo</h3>
          <div class="photo-drop ${d.photo ? 'has' : ''}" id="bg-photo" style="margin: 0;">
            ${d.photo
              ? `<div style="display:flex; align-items:center; gap:10px;"><span class="ic" data-icon="check" data-icon-size="16"></span><div><div class="nm">Photo added</div><div class="sb">Owner's ID + the gold on the scale</div></div></div>`

                <td class="num">${b.fineness.toFixed(1)}%</td>
                <td class="num">${money(b.total)}</td>
                <td>${b.method}</td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="2">${state.buys.length} buys</td>
              <td class="num">${state.buys.reduce((s,b)=>s+b.wt,0).toFixed(1)} g</td>
              <td colspan="2" class="num">${money(state.buys.reduce((s,b)=>s+b.total,0))}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  </div>`;
}

function wireBuyGold() {
  const d = state.buyDraft;
  ['wt','fineness','ppg'].forEach(k => { const el = $('#bg-'+k); if (el) el.addEventListener('input', () => { d[k] = el.value; renderRoute(); }); });
  const supp = $('#bg-supp'); if (supp) supp.addEventListener('change', () => {
    d.supplierId = supp.value;
    const s = state.suppliers.find(x => x.id === supp.value);
    d.supplierNm = s ? s.nm : '';
    renderRoute();
  });
  const sn = $('#bg-suppnm'); if (sn) sn.addEventListener('input', () => { d.supplierNm = sn.value; });
  const meth = $('#bg-method'); if (meth) meth.addEventListener('change', () => { d.method = meth.value; });
  $$('[data-bg-fineset]').forEach(b => b.addEventListener('click', () => { d.fineness = b.dataset.bgFineset; renderRoute(); }));
  const ph = $('#bg-photo'); if (ph) ph.addEventListener('click', () => { d.photo = !d.photo; renderRoute(); toast(d.photo?'Photo added':'Photo removed'); });
  $$('[data-bg-reset]').forEach(b => b.addEventListener('click', () => { state.buyDraft = emptyBuyDraft(); renderRoute(); toast('Cleared'); }));
  $$('[data-bg-save]').forEach(b => b.addEventListener('click', () => {
    if (!d.wt || !d.ppg) { toast('Weight and price are needed', 'danger'); return; }
    if (!d.supplierId && !d.supplierNm) { toast('Write the walk-in name', 'danger'); return; }
    const todayWt = state.buys.filter(b => isToday(b.date)).reduce((s,b)=>s+b.wt, 0);
    const limit = +state.settings.dailyBuyLimit || 500;
    if (todayWt + (+d.wt) > limit && state.role !== 'manager') { toast('Over the daily limit — manager must OK', 'danger'); return; }
    const buy = {
      id: nextId('BG-', state.buys),
      date: todayStr(),
      supplierId: d.supplierId || null,
      supplierNm: d.supplierNm || 'Walk-in',
      wt: +d.wt,
      fineness: +d.fineness,
      ppg: +d.ppg,
      total: +(((+d.wt) * (+d.fineness) / 100) * (+d.ppg)).toFixed(2),
      method: d.method,
      photo: !!d.photo,
    };
    state.buys.unshift(buy);
    logAction('Bought gold ' + buy.id, `${buy.wt}g · ${buy.fineness}% · ${money(buy.total)}`);
    state.buyDraft = emptyBuyDraft();
    persist(); toast('Buy ' + buy.id + ' recorded · paid ' + money(buy.total), 'gold');
    renderRoute();
  }));
}

          <tbody>${today.map(p => `<tr><td><span class="nm">${p.id}</span></td><td>${escapeHtml(p.leader || p.foreman)}</td><td class="num">${p.net} g</td><td class="num">${pourFineWt(p).toFixed(1)} g</td></tr>`).join('')}</tbody>
