<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Owner / Manager demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  /* ============================================================
     Owner / Manager Portal — Executive cockpit
     Desktop-first. Dark by default. Dense, data-rich.
     ============================================================ */

  :root {
    --ow-bg:        #0E1015;
    --ow-bg-soft:   #14171E;
    --ow-surface:   #16191F;
    --ow-surface-2: #1B1F26;
    --ow-surface-3: #232831;
    --ow-border:    rgba(255,255,255,0.07);
    --ow-border-2:  rgba(255,255,255,0.12);
    --ow-text:      #E4E7EC;
    --ow-text-mute: rgba(228,231,236,0.62);
    --ow-text-sub:  rgba(228,231,236,0.4);
    --ow-brand:     #5B8DEF;
    --ow-brand-2:   #2563EB;
    --ow-brand-soft:rgba(91,141,239,0.16);
    --ow-good:      #22C55E;
    --ow-good-soft: rgba(34,197,94,0.14);
    --ow-warn:      #F59E0B;
    --ow-warn-soft: rgba(245,158,11,0.16);
    --ow-bad:       #EF4444;
    --ow-bad-soft:  rgba(239,68,68,0.16);
    --ow-info:      #38BDF8;
    --ow-info-soft: rgba(56,189,248,0.14);
    --ow-purple:    #A78BFA;
    --ow-purple-soft:rgba(167,139,250,0.14);
  }

  body { background: var(--ow-bg); margin: 0; color: var(--ow-text); }

  /* ===== Fullscreen mode ===== */
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .ow-app { height: 100vh; height: 100dvh; }

  /* ===== Shell ===== */
  .ow-app {
    display: grid;
    grid-template-columns: 232px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "side bar" "side main";
    height: calc(100vh - 47px);
    min-height: 640px;
    background: var(--ow-bg);
    color: var(--ow-text);
    font-family: var(--font-sans);
  }

  /* ===== Top bar ===== */
  .ow-bar {
    grid-area: bar;
    background: var(--ow-bg-soft);
    border-bottom: 1px solid var(--ow-border);
    display: flex; align-items: center; gap: 12px;
    padding: 0 16px;
    font: 500 13px/1 var(--font-sans);
    color: var(--ow-text);
  }
  .ow-bar .br { font-weight: 600; color: #fff; }
  .ow-bar .sep { color: var(--ow-text-sub); }
  .ow-bar .pill {
    padding: 3px 10px; border-radius: 9999px;
    font: 500 11.5px/1 var(--font-sans);
    background: rgba(255,255,255,0.06); color: var(--ow-text-mute);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .ow-bar .pill.live { background: var(--ow-good-soft); color: var(--ow-good); }
  .ow-bar .pill.warn { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .ow-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ow-bar .spacer { flex: 1; }
  .ow-bar .bar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 7px;
    background: rgba(255,255,255,0.05); color: var(--ow-text);
    border: 0; cursor: pointer; font: 500 12px/1 var(--font-sans);
  }
  .ow-bar .bar-btn:hover { background: rgba(255,255,255,0.1); }
  .ow-bar .bar-btn.brand-btn { background: var(--ow-brand-soft); color: var(--ow-brand); }
  .ow-bar .bar-btn.brand-btn:hover { background: rgba(91,141,239,0.26); }
  .ow-bar .who {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 4px 10px 4px 4px; border-radius: 9999px;
    background: rgba(255,255,255,0.04); cursor: pointer;
  }
  .ow-bar .who:hover { background: rgba(255,255,255,0.1); }
  .ow-bar .who .av {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #5B8DEF, #8B5CF6); color: #fff;
    display: grid; place-items: center; font: 600 11px/1 var(--font-sans);
  }
  .ow-bar .who .nm { font: 600 12.5px/1 var(--font-sans); color: #fff; }
  .ow-bar .who .rl { font: 11px/1 var(--font-sans); color: var(--ow-text-mute); margin-top: 2px; }
  .ow-bar .kbd {
    padding: 2px 6px; border-radius: 5px;
    background: rgba(255,255,255,0.08); color: var(--ow-text-mute);
    font: 600 10.5px/1 var(--font-mono);
    border: 1px solid var(--ow-border);
  }

  /* ===== Side rail ===== */
  .ow-side {
    grid-area: side;
    background: #0A0C10;
    border-right: 1px solid var(--ow-border);
    padding: 14px 10px;
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0; overflow-y: auto;
  }
  .ow-side .brand {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 4px 8px 14px; color: #fff;
    font: 600 14px/1 var(--font-sans);
    text-decoration: none;
  }
  .ow-side .brand .m { color: var(--ow-brand); }
  .ow-side .tenant {
    margin: 0 4px 12px;
    padding: 10px;
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 9px;
    cursor: pointer;
    display: flex; align-items: center; gap: 9px;
    transition: background 120ms;
  }
  .ow-side .tenant:hover { background: var(--ow-surface-2); }
  .ow-side .tenant .av {
    width: 30px; height: 30px; border-radius: 7px;
    background: linear-gradient(135deg, #5B8DEF, #A78BFA);
    color: #fff; display: grid; place-items: center;
    font: 700 12px/1 var(--font-sans); flex: none;
  }
  .ow-side .tenant .nm { font: 600 12.5px/1.2 var(--font-sans); color: #fff; }
  .ow-side .tenant .sb { font: 11px/1.2 var(--font-sans); color: var(--ow-text-mute); margin-top: 2px; }
  .ow-side .tenant .ar { margin-left: auto; color: var(--ow-text-sub); }

  .ow-side .h {
    font: 600 10px/1 var(--font-sans);
    letter-spacing: 0.13em; text-transform: uppercase;
    color: var(--ow-text-sub);
    padding: 14px 10px 6px;
  }
  .ow-side .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 7px;
    color: var(--ow-text-mute); text-decoration: none;
    font: 500 13px/1 var(--font-sans);
    border: 0; background: transparent; cursor: pointer;
    width: 100%; text-align: left;
  }
  .ow-side .nav-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
  .ow-side .nav-item.active { background: var(--ow-brand-soft); color: var(--ow-brand); }
  .ow-side .nav-item.active .ic { color: var(--ow-brand); }
  .ow-side .nav-item .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--ow-text-sub); }
  .ow-side .nav-item .cnt {
    margin-left: auto;
    padding: 1px 7px; border-radius: 9999px;
    background: rgba(255,255,255,0.08); color: var(--ow-text-mute);
    font: 600 10px/1 var(--font-mono);
  }
  .ow-side .nav-item .cnt.warn { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .ow-side .nav-item .cnt.bad  { background: var(--ow-bad-soft); color: var(--ow-bad); }
  .ow-side .foot {
    margin-top: auto;
    padding: 12px 10px 4px;
    border-top: 1px solid var(--ow-border);
    font: 11.5px/1.4 var(--font-sans);
    color: var(--ow-text-sub);
  }
  .ow-side .foot strong { color: var(--ow-text-mute); font-weight: 600; display: block; }
  .ow-side .foot a { color: var(--ow-brand); text-decoration: none; }

  /* ===== Main ===== */
  .ow-main {
    grid-area: main;
    min-width: 0; min-height: 0;
    overflow: auto;
    background: var(--ow-bg);
  }
  .ow-page { padding: 18px 22px 80px; }
  .ow-page-head { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; }
  .ow-page-head .crumb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ow-text-sub); }
  .ow-page-head h2 { font: 700 22px/1.1 var(--font-sans); color: #fff; margin: 6px 0 0; letter-spacing: -0.015em; }
  .ow-page-head .sub { font: 13.5px/1.4 var(--font-sans); color: var(--ow-text-mute); margin-top: 4px; max-width: 640px; }
  .ow-page-head .spacer { flex: 1; }
  .ow-page-head .head-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  /* Common */
  .btn {
    padding: 7px 12px; border-radius: 7px;
    background: rgba(255,255,255,0.05); color: var(--ow-text);
    font: 500 12.5px/1 var(--font-sans);
    border: 1px solid var(--ow-border);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn.primary { background: var(--ow-brand-2); color: #fff; border-color: var(--ow-brand-2); }
  .btn.primary:hover { background: var(--ow-brand); }
  .btn.ghost { background: transparent; }
  .btn.danger { background: var(--ow-bad-soft); color: var(--ow-bad); border-color: rgba(239,68,68,0.3); }
  .btn.sm { padding: 5px 9px; font-size: 11.5px; }
  .seg {
    display: inline-flex; padding: 2px;
    background: rgba(255,255,255,0.05); border-radius: 7px;
    border: 1px solid var(--ow-border);
  }
  .seg button { padding: 5px 11px; border-radius: 5px; font: 500 12px var(--font-sans); color: var(--ow-text-mute); background: transparent; cursor: pointer; border: 0; }
  .seg button.on { background: var(--ow-surface-2); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .seg button:hover:not(.on) { color: #fff; }

  /* KPI tiles */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .kpi {
    background: var(--ow-surface); border: 1px solid var(--ow-border);
    border-radius: 12px; padding: 14px 16px; cursor: pointer;
    transition: border-color 120ms, background 120ms;
    position: relative;
  }
  .kpi:hover { border-color: var(--ow-border-2); background: var(--ow-surface-2); }
  .kpi .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ow-text-sub); }
  .kpi .v { font: 700 28px/1 var(--font-sans); color: #fff; margin-top: 10px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi .v .cent { font-size: 18px; color: var(--ow-text-mute); }
  .kpi .meta { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; gap: 10px; }
  .kpi .delta { font: 500 12px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 4px; }
  .kpi .delta.up { color: var(--ow-good); }
  .kpi .delta.dn { color: var(--ow-bad); }
  .kpi .delta.flat { color: var(--ow-text-mute); }
  .kpi .target { font: 500 11px/1.3 var(--font-sans); color: var(--ow-text-sub); text-align: right; }
  .kpi .target .pct { font: 600 12px var(--font-mono); color: var(--ow-text); }
  .kpi .spark { display: block; }
  .kpi.warn { border-color: rgba(245,158,11,0.3); }
  .kpi.warn .v { color: var(--ow-warn); }
  .kpi.bad  { border-color: rgba(239,68,68,0.3); }
  .kpi.bad .v { color: var(--ow-bad); }

  /* Cards / panels */
  .ow-card {
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 12px; padding: 14px 16px;
  }
  .ow-card.flat { background: transparent; border: 1px solid var(--ow-border); }
  .ow-card .ttl { font: 600 13.5px/1.2 var(--font-sans); color: #fff; }
  .ow-card .sub { font: 12px/1.4 var(--font-sans); color: var(--ow-text-mute); margin-top: 3px; }
  .ow-card .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ow-card .hdr .spacer { flex: 1; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .col-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
  .col-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
  @media (max-width: 1080px) {
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .col-2-1, .col-1-2 { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .ow-app {
      grid-template-columns: 1fr;
      grid-template-rows: 52px 1fr;
      grid-template-areas: "bar" "main";
    }
    .ow-side { display: none; }
    .ow-side.open {
      display: flex; position: fixed; inset: 47px 0 0 0;
      z-index: 90; height: calc(100vh - 47px);
    }
    body.is-fullscreen .ow-side.open { inset: 0; height: 100vh; }
    .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .ow-page { padding: 14px; }
    .ow-bar .bar-btn-label, .ow-bar .who .rl { display: none; }
    .ow-bar { gap: 8px; padding: 0 10px; font-size: 12px; }
    .ow-bar .sep, .ow-bar .day-pill { display: none; }
  }

  /* Tables */
  .ow-table { width: 100%; border-collapse: collapse; font: 13px/1.4 var(--font-sans); }
  .ow-table th {
    text-align: left; padding: 8px 10px; font: 500 11px/1 var(--font-sans);
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--ow-text-sub);
    border-bottom: 1px solid var(--ow-border);
    background: transparent;
  }
  .ow-table td {
    padding: 9px 10px; border-bottom: 1px solid var(--ow-border);
    color: var(--ow-text); vertical-align: middle;
  }
  .ow-table tr:last-child td { border-bottom: 0; }
  .ow-table tr:hover td { background: rgba(255,255,255,0.03); }
  .ow-table td.num, .ow-table th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .ow-table .nm { font: 600 13px/1.3 var(--font-sans); color: #fff; }
  .ow-table .sb { font: 11.5px/1.3 var(--font-sans); color: var(--ow-text-mute); margin-top: 2px; }
  .ow-table .pill { padding: 2px 8px; border-radius: 9999px; font: 500 11px/1.3 var(--font-sans); display: inline-block; }
  .pill.ok { background: var(--ow-good-soft); color: var(--ow-good); }
  .pill.warn { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .pill.bad { background: var(--ow-bad-soft); color: var(--ow-bad); }
  .pill.info { background: var(--ow-info-soft); color: var(--ow-info); }
  .pill.neutral { background: rgba(255,255,255,0.08); color: var(--ow-text-mute); }

  .health-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .health-dot.ok { background: var(--ow-good); }
  .health-dot.warn { background: var(--ow-warn); }
  .health-dot.bad { background: var(--ow-bad); }

  /* Sparkline / svg */
  .sk-line { fill: none; stroke-width: 1.5; }
  .sk-area { opacity: 0.18; }

  /* Vertical tile */
  .vt-card {
    background: var(--ow-surface); border: 1px solid var(--ow-border);
    border-radius: 12px; padding: 14px; cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .vt-card:hover { border-color: var(--ow-border-2); background: var(--ow-surface-2); }
  .vt-card .top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .vt-card .icn {
    width: 30px; height: 30px; border-radius: 8px;
    display: grid; place-items: center; flex: none; color: #fff;
  }
  .vt-card .vnm { font: 600 14px/1 var(--font-sans); color: #fff; }
  .vt-card .ssn { font: 11.5px/1.2 var(--font-sans); color: var(--ow-text-mute); margin-top: 2px; }
  .vt-card .val { font: 700 21px/1 var(--font-sans); color: #fff; font-variant-numeric: tabular-nums; margin-top: 12px; letter-spacing: -0.01em; }
  .vt-card .row { display: flex; gap: 14px; margin-top: 10px; }
  .vt-card .row .l { font: 11px/1 var(--font-sans); color: var(--ow-text-sub); letter-spacing: 0.06em; text-transform: uppercase; }
  .vt-card .row .x { font: 600 13px/1 var(--font-mono); color: var(--ow-text); margin-top: 4px; }

  /* Leaderboard rank */
  .rank {
    display: inline-grid; place-items: center;
    width: 22px; height: 22px; border-radius: 6px;
    background: rgba(255,255,255,0.05);
    font: 700 11px/1 var(--font-mono); color: var(--ow-text-mute);
  }
  .rank.gold { background: rgba(245,158,11,0.18); color: var(--ow-warn); }
  .rank.silver { background: rgba(167,139,250,0.18); color: var(--ow-purple); }
  .rank.bronze { background: rgba(184,127,87,0.18); color: #DA8A5C; }

  /* Charts */
  .chart-wrap { position: relative; }
  .chart-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
  .chart-legend .lg { font: 12px/1 var(--font-sans); color: var(--ow-text-mute); display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .lg .sw { width: 10px; height: 10px; border-radius: 2px; }

  /* Bar list */
  .bar-row { display: grid; grid-template-columns: 110px 1fr 80px; gap: 10px; align-items: center; padding: 6px 0; }
  .bar-row .lb { font: 500 12.5px var(--font-sans); color: var(--ow-text); }
  .bar-row .tk { background: rgba(255,255,255,0.05); height: 8px; border-radius: 9999px; overflow: hidden; }
  .bar-row .tk .fl { height: 100%; background: var(--ow-brand); border-radius: 9999px; transition: width 240ms; }
  .bar-row.warn .tk .fl { background: var(--ow-warn); }
  .bar-row.bad .tk .fl  { background: var(--ow-bad); }
  .bar-row.good .tk .fl { background: var(--ow-good); }
  .bar-row .vl { text-align: right; font: 600 12.5px var(--font-mono); color: var(--ow-text); font-variant-numeric: tabular-nums; }

  /* Flag row */
  .flag-row {
    display: grid; grid-template-columns: 8px 80px 1fr auto auto;
    gap: 12px; align-items: center;
    padding: 11px 14px;
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 10px; margin-bottom: 8px;
    transition: background 120ms;
  }
  .flag-row:hover { background: var(--ow-surface-2); }
  .flag-row.crit .sev-dot { background: var(--ow-bad); box-shadow: 0 0 0 4px rgba(239,68,68,0.18); }
  .flag-row.warn .sev-dot { background: var(--ow-warn); }
  .flag-row.info .sev-dot { background: var(--ow-info); }
  .flag-row .sev-dot { width: 8px; height: 8px; border-radius: 50%; }
  .flag-row .sev {
    padding: 2px 8px; border-radius: 9999px; text-align: center;
    font: 500 10.5px/1.4 var(--font-sans); letter-spacing: 0.04em;
  }
  .flag-row.crit .sev { background: var(--ow-bad-soft); color: var(--ow-bad); }
  .flag-row.warn .sev { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .flag-row.info .sev { background: var(--ow-info-soft); color: var(--ow-info); }
  .flag-row .ttl { font: 600 13.5px/1.3 var(--font-sans); color: #fff; }
  .flag-row .mt  { font: 12px/1.3 var(--font-sans); color: var(--ow-text-mute); margin-top: 3px; }
  .flag-row .ag  { font: 11.5px/1 var(--font-mono); color: var(--ow-text-sub); }

  /* Sign in (full viewport overlay) */
  .ow-login {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg, #0A0C10 0%, #14181F 50%, #1A1F2A 100%);
    display: grid; place-items: center;
    padding: 20px;
  }
  body:not(.is-fullscreen) .ow-login { top: 47px; }
  .ow-login .card {
    width: 100%; max-width: 380px;
    background: var(--ow-surface-2);
    border: 1px solid var(--ow-border);
    border-radius: 14px;
    padding: 28px;
    color: var(--ow-text);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
  }
  .ow-login h1 { font: 700 22px/1.1 var(--font-sans); color: #fff; margin: 0; letter-spacing: -0.015em; }
  .ow-login .lead { font: 13.5px/1.5 var(--font-sans); color: var(--ow-text-mute); margin-top: 6px; }
  .ow-login .field { display: block; margin-top: 16px; }
  .ow-login .field label { font: 500 12px/1 var(--font-sans); color: var(--ow-text-mute); display: block; margin-bottom: 6px; }
  .ow-login .field input {
    width: 100%; height: 40px; padding: 0 12px;
    background: var(--ow-surface); color: #fff;
    border: 1px solid var(--ow-border-2); border-radius: 8px;
    font: 500 14px/1 var(--font-sans);
    box-sizing: border-box;

const LS = 'huchu-owner-demo:v1';

function saveState() {

  try {

/* ===== Toast / modal / drawer ===== */
function toast(msg, kind='default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind!=='default' ? ' '+kind : '');
  const icon = kind==='success' ? 'check' : kind==='danger' ? 'x' : kind==='warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 240); }, 2400);
}
function openModal(html) { state.modal = html; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const h = $('#modal-host');
  if (!state.modal) { h.innerHTML = ''; return; }
  h.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(h);
  h.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}
function openDrawer(html) { state.drawer = html; renderDrawer(); }
function closeDrawer() { state.drawer = null; renderDrawer(); }
function renderDrawer() {
  const h = $('#drawer-host');
  if (!state.drawer) { h.innerHTML = ''; return; }
  h.innerHTML = `<div class="drawer-scrim" data-scrim>${state.drawer}</div>`;
  if (window.Icons) window.Icons.render(h);
  h.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeDrawer();
  });
  // close button
  const cl = h.querySelector('[data-drawer-close]');
  if (cl) cl.addEventListener('click', closeDrawer);
}
function openConfirm({title, sub, okLabel='Confirm', danger=false, onOk}) {
  openModal(`

/* ===== Fullscreen ===== */
function toggleFullscreen() {
  const isFs = !!document.fullscreenElement || document.body.classList.contains('is-fullscreen');
  if (isFs) {
    document.exitFullscreen && document.exitFullscreen().catch(()=>{});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  }
  render();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.cmdkOpen) { state.cmdkOpen = false; renderCmdk(); return; }
    if (state.drawer)   { closeDrawer(); return; }
    if (state.modal)    { closeModal();  return; }
    if (document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
      document.body.classList.remove('is-fullscreen'); render();
    }
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    state.cmdkOpen = !state.cmdkOpen;
    state.cmdkQuery = '';
    renderCmdk();
  }
});

/* ===== SVG helpers ===== */
function svgSparkline(values, opts={}) {
  const w = opts.w || 88, h = opts.h || 22;
  const c = opts.color || '#22C55E';
  const min = Math.min(...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-3) - 1.5).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function svgArea(values, opts={}) {
  const w = opts.w || 320, h = opts.h || 80;
  const c = opts.color || '#5B8DEF';
  const min = Math.min(0, ...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-6) - 3).toFixed(1)}`);
  const line = pts.join(' ');
  const fill = `0,${h} ` + pts.join(' ') + ` ${w},${h}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
    <polygon points="${fill}" fill="${c}" opacity="0.18"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}
function svgBars(values, labels, opts={}) {
  const w = opts.w || 320, h = opts.h || 120;
  const c = opts.color || '#5B8DEF';
  const max = Math.max(...values) || 1;
  const bw = w / values.length * 0.62;
  const gap = w / values.length * 0.38;
  let out = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h+20}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
  values.forEach((v,i)=>{
    const bh = (v / max) * (h - 8);
    const x = i*(bw+gap) + gap/2;
    const y = h - bh;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${c}" rx="2"/>`;
    if (labels && labels[i]) out += `<text x="${(x+bw/2).toFixed(1)}" y="${h+14}" text-anchor="middle" font-size="10" fill="rgba(228,231,236,0.5)" font-family="ui-sans-serif,system-ui">${escapeHtml(labels[i])}</text>`;
  });
  out += '</svg>';
  return out;
}
function svgMultiLine(serieses, opts={}) {
  const w = opts.w || 480, h = opts.h || 180;
  const all = serieses.flatMap(s=>s.values);
  const min = Math.min(0, ...all), max = Math.max(...all);
  const rng = max - min || 1;
  const n = serieses[0].values.length;
  const sx = w / (n - 1);
  let out = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
  // grid lines
  for (let i=0;i<5;i++) {
    const y = (h-20) * (i/4) + 10;
    out += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  }
  serieses.forEach(s => {
    const pts = s.values.map((v,i)=>`${(i*sx).toFixed(1)},${(h - 10 - ((v - min)/rng)*(h-20)).toFixed(1)}`).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  });
  out += '</svg>';
  return out;
}
function svgDonut(parts, opts={}) {
  const size = opts.size || 120;
  const cx = size/2, cy = size/2;
  const r = size/2 - 8;
  const ir = r - 16;
  const total = parts.reduce((s,p)=>s+p.value,0) || 1;
  let a0 = -Math.PI/2;
  let out = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" xmlns="http://www.w3.org/2000/svg">`;
  parts.forEach(p => {
    const ang = (p.value/total) * Math.PI * 2;
    const a1 = a0 + ang;
    const large = ang > Math.PI ? 1 : 0;
    const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
    const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
    const x0i = cx + ir*Math.cos(a0), y0i = cy + ir*Math.sin(a0);
    const x1i = cx + ir*Math.cos(a1), y1i = cy + ir*Math.sin(a1);
    out += `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} L ${x1i} ${y1i} A ${ir} ${ir} 0 ${large} 0 ${x0i} ${y0i} Z" fill="${p.color}"/>`;
    a0 = a1;
  });
  out += '</svg>';
  return out;
}

function wireShell() {
  $$('.ow-side [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const rd = $('#reset-demo'); if (rd) rd.addEventListener('click', (e) => { e.preventDefault(); openConfirm({title:'Reset demo?', sub:'Clears persisted state — settings, annotations, tenant selection.', okLabel:'Reset', danger:true, onOk: resetDemo}); });
  const fs = $('#fs-toggle'); if (fs) fs.addEventListener('click', toggleFullscreen);
  const cm = $('#cmdk-btn'); if (cm) cm.addEventListener('click', () => { state.cmdkOpen = true; state.cmdkQuery=''; renderCmdk(); });
  const of = $('#offline-toggle'); if (of) of.addEventListener('click', () => {
    state.forceOffline = !state.forceOffline;
    toast(state.forceOffline ? 'Offline mode on · cached data' : 'Back online', state.forceOffline?'warn':'success');
    render();
  });
  const tb = $('#tenant-btn'); if (tb) tb.addEventListener('click', () => go('tenants'));
  const wb = $('#who-btn'); if (wb) wb.addEventListener('click', openSignOutModal);
  const rt = $('#rail-toggle'); if (rt) rt.addEventListener('click', () => {
    const s = $('.ow-side'); if (s) s.classList.toggle('open');
  });
}

function openSignOutModal() {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <h3>Sign out?</h3>
      <p class="sub">You'll be returned to the executive sign-in screen. Cached annotations stay on this device.</p>
      <div class="acts">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn primary" data-ok>Sign out</button>
      </div>
    </div>`);
  $('.modal [data-cancel]').addEventListener('click', closeModal);
  $('.modal [data-ok]').addEventListener('click', () => {
    closeModal(); state.signedIn = false; state.step = 'creds'; render();
  });
}

function renderRoute() {
  switch (state.route) {
    case 'today':       return renderToday();
    case 'verticals':   return renderVerticals();
    case 'branches':    return renderBranches();
    case 'cash':        return renderCash();
    case 'ar':          return renderAR();
    case 'ap':          return renderAP();
    case 'flags':       return renderFlags();
    case 'pnl':         return renderPnL();
    case 'forecast':    return renderForecast();
    case 'customers':   return renderCustomers();
    case 'products':    return renderProducts();
    case 'people':      return renderPeople();
    case 'operations':  return renderOperations();
    case 'compliance':  return renderCompliance();
    case 'churn':       return renderChurn();
    case 'okrs':        return renderOkrs();
    case 'reports':     return renderReports();
    case 'annotate':    return renderAnnotate();
    case 'tenants':     return renderTenants();
    case 'settings':    return renderSettings();
    case 'help':        return renderHelp();
    case 'signin':      state.signedIn = false; render(); return '';
    default:            return renderToday();
  }
}
function wireRoute() {
  switch (state.route) {
    case 'today':       wireToday(); break;
    case 'verticals':   wireVerticals(); break;
    case 'branches':    wireBranches(); break;
    case 'cash':        wireCash(); break;
    case 'ar':          wireAR(); break;
    case 'ap':          wireAP(); break;
    case 'flags':       wireFlags(); break;
    case 'pnl':         wirePnL(); break;
    case 'forecast':    wireForecast(); break;
    case 'customers':   wireCustomers(); break;
    case 'products':    wireProducts(); break;
    case 'people':      wirePeople(); break;
    case 'operations':  wireOperations(); break;
    case 'compliance':  wireCompliance(); break;
    case 'churn':       wireChurn(); break;
    case 'okrs':        wireOkrs(); break;
    case 'reports':     wireReports(); break;
    case 'annotate':    wireAnnotate(); break;
    case 'tenants':     wireTenants(); break;
    case 'settings':    wireSettings(); break;
    case 'help':        wireHelp(); break;

function wireSignIn() {
  if (state.step === 'otp') {

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
function renderCmdk() {
  const host = $('#cmdk-host');
  if (!state.cmdkOpen) { host.innerHTML = ''; return; }
  const q = state.cmdkQuery.toLowerCase();
  const all = [
    ...ROUTES.filter(r => r !== 'signin').map(r => ({ kind:'Page', label: r[0].toUpperCase()+r.slice(1), route: r, icon:'grid' })),
    ...BRANCHES.map(b => ({ kind:'Branch', label: b.name, route: 'branches', icon:'shop' })),
    ...TOP_CUSTOMERS.map(c => ({ kind:'Customer', label: c.name, route: 'customers', icon:'user' })),
    ...FLAGS.map(f => ({ kind:'Flag', label: f.ttl, route: 'flags', icon:'bell' })),
    ...VERTICALS.map(v => ({ kind:'Vertical', label: v.name, route: 'verticals', icon:'grid' })),
  ];
  const matches = q ? all.filter(x => x.label.toLowerCase().includes(q)).slice(0, 12) : all.slice(0, 12);
  const groups = {};
  matches.forEach(m => { (groups[m.kind] = groups[m.kind] || []).push(m); });
  host.innerHTML = `
    <div class="cmdk-scrim" data-scrim>
      <div class="cmdk" onclick="event.stopPropagation()">
        <div class="srch">
          <span data-icon="search" data-icon-size="16"></span>
          <input id="cmdk-input" placeholder="Search branches, KPIs, flags, customers…" value="${escapeHtml(state.cmdkQuery)}" />
          <span class="kbd" style="background:rgba(255,255,255,0.08);padding:2px 6px;border-radius:5px;border:1px solid var(--ow-border);color:var(--ow-text-mute);font:600 10.5px var(--font-mono);">Esc</span>
        </div>
        <div class="lst">
          ${Object.keys(groups).length === 0 ? `<div style="padding:30px 16px;text-align:center;color:var(--ow-text-mute);font:13px var(--font-sans);">No matches</div>` : ''}
          ${Object.entries(groups).map(([k,arr])=>`
            <div class="ph">${k}</div>
            ${arr.map(m=>`<div class="it" data-cmdk-go="${m.route}">
              <span class="ic" data-icon="${m.icon}" data-icon-size="14"></span>
              <span>${escapeHtml(m.label)}</span>
              <span class="ms">${m.kind}</span>
            </div>`).join('')}
          `).join('')}
        </div>
        <div class="ft"><span>↑ ↓ navigate</span><span>↵ open</span><span>esc close</span></div>
      </div>
    </div>
  `;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => { if (e.target.dataset.scrim !== undefined) { state.cmdkOpen = false; renderCmdk(); } });
  const inp = $('#cmdk-input');
  inp.focus();
  inp.addEventListener('input', () => { state.cmdkQuery = inp.value; renderCmdk(); });
  $$('[data-cmdk-go]').forEach(b => b.addEventListener('click', () => { state.cmdkOpen = false; renderCmdk(); go(b.dataset.cmdkGo); }));
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  const r = (location.hash.replace(/^#\/?/, '') || 'today');
  if (r === 'signin') { state.signedIn = false; state.step = 'creds'; }
  else if (ROUTES.includes(r)) state.route = r;
  render();
}
if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
