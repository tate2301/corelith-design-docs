<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Owner / Manager demo · Huchu</title>
<!-- Owner / Manager portal — mobile-first, vertical-agnostic, dark only -->

<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  /* ============================================================
     Owner / Manager Portal — Owner's view
     MOBILE FIRST. Dark only. Bottom tab bar up to 1024 px,
     left sidebar at 1024 px and above.
     ============================================================ */

  :root {
    --ow-bg:        #0E1015;
    --ow-bg-soft:   #14171E;
    --ow-surface:   #16191F;
    --ow-surface-2: #1B1F26;
    --ow-surface-3: #232831;
    --ow-border:    rgba(255,255,255,0.07);
    --ow-border-2:  rgba(255,255,255,0.12);
    --ow-text:      #E4E7EC;
    --ow-text-mute: rgba(228,231,236,0.62);
    --ow-text-sub:  rgba(228,231,236,0.4);
    --ow-brand:     #5B8DEF;
    --ow-brand-2:   #2563EB;
    --ow-brand-soft:rgba(91,141,239,0.16);
    --ow-good:      #22C55E;
    --ow-good-soft: rgba(34,197,94,0.14);
    --ow-warn:      #F59E0B;
    --ow-warn-soft: rgba(245,158,11,0.16);
    --ow-bad:       #EF4444;
    --ow-bad-soft:  rgba(239,68,68,0.16);
    --ow-info:      #38BDF8;
    --ow-info-soft: rgba(56,189,248,0.14);
    --ow-purple:    #A78BFA;
    --ow-purple-soft:rgba(167,139,250,0.14);
    --tap: 44px;
  }

  html, body { margin: 0; padding: 0; }
  body { background: var(--ow-bg); color: var(--ow-text); font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }

  /* ===== Fullscreen mode ===== */
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .ow-app { height: 100vh; height: 100dvh; }

  /* ============================================================
     PHONE LAYOUT (default, no media query)
     ============================================================ */
  .ow-app {
    display: flex; flex-direction: column;
    background: var(--ow-bg); color: var(--ow-text);
    min-height: calc(100vh - 47px); min-height: calc(100dvh - 47px);
  }
  body.is-fullscreen .ow-app { min-height: 100vh; min-height: 100dvh; }

  .ow-side { display: none; }

  /* Top bar — slim on phones */
  .ow-bar {
    position: sticky; top: 0; z-index: 40;
    background: var(--ow-bg-soft);
    border-bottom: 1px solid var(--ow-border);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    font: 500 13px/1 var(--font-sans);
    color: var(--ow-text);
    min-height: 48px;
  }
  .ow-bar .br { font: 600 14px/1.2 var(--font-sans); color: #fff; }
  .ow-bar .sub { font: 11.5px/1.2 var(--font-sans); color: var(--ow-text-mute); margin-top: 2px; }
  .ow-bar .who-w { flex: 1; min-width: 0; }
  .ow-bar .pill {
    padding: 3px 9px; border-radius: 9999px;
    font: 500 11px/1 var(--font-sans);
    background: rgba(255,255,255,0.06); color: var(--ow-text-mute);
    display: inline-flex; align-items: center; gap: 5px;
    flex: none;
  }
  .ow-bar .pill.live { background: var(--ow-good-soft); color: var(--ow-good); }
  .ow-bar .pill.warn { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .ow-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .ow-bar .bar-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: var(--tap); min-height: var(--tap);
    padding: 8px; border-radius: 9px;
    background: transparent; color: var(--ow-text);
    border: 0; cursor: pointer;
  }
  .ow-bar .bar-btn:hover { background: rgba(255,255,255,0.08); }
  .ow-bar .bar-btn-label { display: none; }
  .ow-bar .kbd { display: none; }
  .ow-bar .who-block { display: none; }

  /* Main scroll area */
  .ow-main {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--ow-bg);
    /* Leave room for bottom tab bar on phones */
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }
  .ow-page { padding: 16px 16px 24px; }
  .ow-page-head { margin-bottom: 14px; }
  .ow-page-head .crumb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ow-text-sub); }
  .ow-page-head h2 { font: 700 22px/1.15 var(--font-sans); color: #fff; margin: 6px 0 0; letter-spacing: -0.015em; }
  .ow-page-head .sub { font: 13.5px/1.5 var(--font-sans); color: var(--ow-text-mute); margin-top: 6px; max-width: 640px; }
  .ow-page-head .head-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }

  /* ===== Bottom tab bar — dark-theme overrides for design-system .b-bottom-tabs.
     Owner's sidebar only appears at ≥1024px, so we keep the tab bar visible
     between 901-1023px (where the DS default would hide it). ===== */
  .b-bottom-tabs {
    background: var(--ow-bg-soft);
    border-top: 1px solid var(--ow-border);
    z-index: 90;
  }
  .b-bottom-tabs button {
    color: var(--ow-text-mute);
    font-weight: 500;
  }
  .b-bottom-tabs button:hover { color: #fff; }
  .b-bottom-tabs button.active { color: var(--ow-brand); }
  .b-bottom-tabs button.active .b-bt-ic { color: var(--ow-brand); }
  .b-bottom-tabs .b-bt-badge { background: var(--ow-bad); }
  @media (min-width: 901px) and (max-width: 1023.98px) {
    .b-bottom-tabs { display: flex; }
  }

  /* ===== Dark-theme overrides for shared design-system blocks ===== */
  .b-row-card {
    background: var(--ow-surface);
    border-color: var(--ow-border);
    color: var(--ow-text);
  }
  .b-row-card:hover,
  .b-row-card:active {
    background: var(--ow-surface-2);
    border-color: var(--ow-border-2);
  }
  .b-row-card .b-rc-nm { color: #fff; }
  .b-row-card .b-rc-sb { color: var(--ow-text-mute); }
  .b-row-card .b-rc-val { color: #fff; }
  .b-row-card .b-rc-delta { color: var(--ow-text-mute); }
  .b-row-card .b-rc-delta.up { color: var(--ow-good); }
  .b-row-card .b-rc-delta.dn { color: var(--ow-bad); }
  .b-row-card .b-rc-meta .b-rc-m-l { color: var(--ow-text-sub); }
  .b-row-card .b-rc-meta .b-rc-m-v { color: var(--ow-text); }

  .b-stat-hero .b-sh-lead {
    background: linear-gradient(135deg, var(--ow-brand) 0%, var(--ow-brand-2) 100%);
  }
  .b-stat-hero .b-sh-s {
    background: var(--ow-surface);
    border-color: var(--ow-border);
  }
  .b-stat-hero .b-sh-s .b-sh-l { color: var(--ow-text-sub); }
  .b-stat-hero .b-sh-s .b-sh-v { color: #fff; }
  .b-stat-hero .b-sh-s .b-sh-sb { color: var(--ow-text-mute); }

  .b-day-list .b-dl-l { color: var(--ow-text); border-bottom-color: var(--ow-border); }
  .b-day-list .b-dl-v { color: #fff; border-bottom-color: var(--ow-border); }
  .b-day-list .b-dl-v.up { color: var(--ow-good); }
  .b-day-list .b-dl-v.dn { color: var(--ow-bad); }

  .b-filter-chips { padding: 0; }
  .b-filter-chips .b-fc {
    background: rgba(255,255,255,0.05);
    border-color: var(--ow-border);
    color: var(--ow-text);
    min-height: 36px;
  }
  .b-filter-chips .b-fc:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .b-filter-chips .b-fc .b-fc-ct {
    background: rgba(255,255,255,0.08); color: var(--ow-text-mute);
  }
  .b-filter-chips .b-fc.on {
    background: var(--ow-brand-2); border-color: var(--ow-brand-2); color: #fff;
  }
  .b-filter-chips .b-fc.on .b-fc-ct { background: rgba(255,255,255,0.22); color: #fff; }

  /* x-bottom-sheet dark-theme overrides */
  .x-bs-scrim { background: rgba(0,0,0,0.55); z-index: 100; }
  .x-bottom-sheet {
    background: var(--ow-surface-2);
    color: var(--ow-text);
  }
  .x-bottom-sheet .x-bs-grab { background: var(--ow-border-2); }
  .x-bottom-sheet .x-bs-head { border-bottom-color: var(--ow-border); }
  .x-bottom-sheet .x-bs-head h3 { color: #fff; }
  .x-bottom-sheet .x-bs-head .x-bs-close {
    background: rgba(255,255,255,0.06); color: var(--ow-text);
  }
  .x-bottom-sheet .x-bs-head .x-bs-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .x-bottom-sheet .x-bs-foot {
    background: var(--ow-surface-2);
    border-top-color: var(--ow-border);
  }
  .x-bottom-sheet .x-bs-foot button.alt {
    background: rgba(255,255,255,0.05);
    color: var(--ow-text);
    border: 1px solid var(--ow-border);
  }
  .x-bottom-sheet .x-bs-foot button.alt:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .x-bottom-sheet .x-bs-foot button.primary { background: var(--ow-brand-2); }
  .x-bottom-sheet .x-bs-foot button.primary:hover { background: var(--ow-brand); }

  /* ===== Common primitives ===== */
  .btn {
    min-height: var(--tap);
    padding: 10px 14px; border-radius: 9px;
    background: rgba(255,255,255,0.05); color: var(--ow-text);
    font: 500 13px/1 var(--font-sans);
    border: 1px solid var(--ow-border);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn.primary { background: var(--ow-brand-2); color: #fff; border-color: var(--ow-brand-2); }
  .btn.primary:hover { background: var(--ow-brand); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { background: var(--ow-bad-soft); color: var(--ow-bad); border-color: rgba(239,68,68,0.3); }
  .btn.sm { min-height: 36px; padding: 6px 10px; font-size: 12px; }
  .btn.block { width: 100%; }
  .seg {
    display: inline-flex; padding: 3px;
    background: rgba(255,255,255,0.05); border-radius: 9px;
    border: 1px solid var(--ow-border);
    width: 100%;
  }
  .seg button {
    flex: 1; min-height: 38px;
    padding: 7px 10px; border-radius: 7px;
    font: 500 12.5px var(--font-sans); color: var(--ow-text-mute);
    background: transparent; cursor: pointer; border: 0;
  }
  .seg button.on { background: var(--ow-surface-2); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.4); }
  .seg button:hover:not(.on) { color: #fff; }

  /* ===== Cards / panels — single column on phone ===== */
  .ow-card {
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 12px; padding: 14px 16px;
    margin-bottom: 12px;
  }
  .ow-card .ttl { font: 600 14px/1.2 var(--font-sans); color: #fff; }
  .ow-card .sub { font: 12.5px/1.45 var(--font-sans); color: var(--ow-text-mute); margin-top: 4px; }
  .ow-card .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .ow-card .hdr .spacer { flex: 1; }
  .grid-stack { display: flex; flex-direction: column; gap: 12px; }

  /* ===== Hero KPI cards (Today) — full-width, large ===== */
  .hero-card {
    display: block; width: 100%;
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
    text-align: left;
    color: var(--ow-text); font-family: var(--font-sans);
    cursor: pointer;
    transition: border-color 120ms, background 120ms;
  }
  .hero-card:hover, .hero-card:active { border-color: var(--ow-border-2); background: var(--ow-surface-2); }
  .hero-card .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ow-text-sub); display: flex; align-items: center; gap: 8px; }
  .hero-card .lbl .ic { width: 18px; height: 18px; display: grid; place-items: center; color: var(--ow-text-mute); }
  .hero-card .v { font: 700 28px/1 var(--font-sans); color: #fff; margin-top: 12px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .hero-card .meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .hero-card .delta { font: 500 12.5px/1 var(--font-sans); display: inline-flex; align-items: center; gap: 4px; }
  .hero-card .delta.up { color: var(--ow-good); }
  .hero-card .delta.dn { color: var(--ow-bad); }
  .hero-card .delta.flat { color: var(--ow-text-mute); }
  .hero-card .hint { font: 12px/1.3 var(--font-sans); color: var(--ow-text-mute); flex: 1; text-align: right; }
  .hero-card.warn { border-color: rgba(245,158,11,0.3); }
  .hero-card.warn .v { color: var(--ow-warn); }
  .hero-card.bad  { border-color: rgba(239,68,68,0.3); }
  .hero-card.bad .v { color: var(--ow-bad); }

  /* Quick-jump pills */
  .qj-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .qj {
    min-height: var(--tap);
    padding: 10px 14px; border-radius: 9999px;
    background: var(--ow-surface); border: 1px solid var(--ow-border);
    color: var(--ow-text); font: 500 13px var(--font-sans);
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer;
  }
  .qj:hover { background: var(--ow-surface-2); border-color: var(--ow-border-2); color: #fff; }
  .qj .ic { color: var(--ow-text-sub); }

  /* Pills / health dots */
  .pill {
    padding: 3px 9px; border-radius: 9999px;
    font: 500 11.5px/1.3 var(--font-sans);
    display: inline-block;
    background: rgba(255,255,255,0.08); color: var(--ow-text-mute);
  }
  .pill.ok { background: var(--ow-good-soft); color: var(--ow-good); }
  .pill.warn { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .pill.bad { background: var(--ow-bad-soft); color: var(--ow-bad); }
  .pill.info { background: var(--ow-info-soft); color: var(--ow-info); }
  .pill.neutral { background: rgba(255,255,255,0.08); color: var(--ow-text-mute); }
  .status-dot {
    width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none;
    background: var(--ow-text-sub);
  }
  .status-dot.ok { background: var(--ow-good); }
  .status-dot.warn { background: var(--ow-warn); }
  .status-dot.bad { background: var(--ow-bad); }

  /* Bar list (used for AR ageing on small) */
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 8px 0; align-items: center; }
  .bar-row .lb { font: 500 13px var(--font-sans); color: var(--ow-text); }
  .bar-row .vl { text-align: right; font: 600 13px var(--font-mono); color: var(--ow-text); font-variant-numeric: tabular-nums; }
  .bar-row .tk { grid-column: 1 / -1; background: rgba(255,255,255,0.05); height: 8px; border-radius: 9999px; overflow: hidden; }
  .bar-row .tk .fl { height: 100%; background: var(--ow-brand); border-radius: 9999px; transition: width 240ms; }
  .bar-row.warn .tk .fl { background: var(--ow-warn); }
  .bar-row.bad  .tk .fl { background: var(--ow-bad); }
  .bar-row.good .tk .fl { background: var(--ow-good); }

  /* Flag row */
  .flag-row {
    background: var(--ow-surface);
    border: 1px solid var(--ow-border);
    border-radius: 11px;
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .flag-row .top { display: flex; align-items: center; gap: 8px; }
  .flag-row .sev {
    padding: 3px 9px; border-radius: 9999px;
    font: 500 11px/1.4 var(--font-sans); letter-spacing: 0.04em;
  }
  .flag-row.crit .sev { background: var(--ow-bad-soft); color: var(--ow-bad); }
  .flag-row.warn .sev { background: var(--ow-warn-soft); color: var(--ow-warn); }
  .flag-row.info .sev { background: var(--ow-info-soft); color: var(--ow-info); }
  .flag-row .ag { font: 11.5px/1 var(--font-mono); color: var(--ow-text-sub); margin-left: auto; }
  .flag-row .ttl { font: 600 14px/1.3 var(--font-sans); color: #fff; }
  .flag-row .mt  { font: 12.5px/1.4 var(--font-sans); color: var(--ow-text-mute); }
  .flag-row .acts { display: flex; gap: 8px; margin-top: 6px; }
  .flag-row .acts .btn { flex: 1; }

  /* Chart wrapper: phones scroll horizontally inside; tablet/desktop fits */
  .chart-wrap { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
  .chart-wrap svg { display: block; min-width: 320px; }
  .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .chart-legend .lg { font: 12px/1 var(--font-sans); color: var(--ow-text-mute); display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .lg .sw { width: 10px; height: 10px; border-radius: 2px; }

  /* Hidden on phone, visible on ≥720px */
  .desktop-only { display: none; }
  .phone-only   { display: block; }

  /* Tables — by default we DON'T use them on phones; only ≥720px */

  /* Sign in (full viewport overlay) */
  .ow-login {
    position: fixed; inset: 0; z-index: 50;
    background: linear-gradient(160deg, #0A0C10 0%, #14181F 50%, #1A1F2A 100%);
    display: grid; place-items: center;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  body:not(.is-fullscreen) .ow-login { top: 47px; }
  .ow-login .card {
    width: 100%; max-width: 380px;
    background: var(--ow-surface-2);
    border: 1px solid var(--ow-border);
    border-radius: 14px;
    padding: 24px;
    color: var(--ow-text);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
  }
  .ow-login h1 { font: 700 22px/1.15 var(--font-sans); color: #fff; margin: 0; letter-spacing: -0.015em; }
  .ow-login .lead { font: 13.5px/1.5 var(--font-sans); color: var(--ow-text-mute); margin-top: 6px; }
  .ow-login .field { display: block; margin-top: 14px; }
  .ow-login .field label { font: 500 12px/1 var(--font-sans); color: var(--ow-text-mute); display: block; margin-bottom: 6px; }
  .ow-login .field input {
    width: 100%; min-height: var(--tap); padding: 0 12px;
    background: var(--ow-surface); color: #fff;
    border: 1px solid var(--ow-border-2); border-radius: 9px;
    font: 500 15px/1 var(--font-sans);
    box-sizing: border-box;
  }
  .ow-login .field input:focus { outline: 0; border-color: var(--ow-brand); box-shadow: 0 0 0 3px var(--ow-brand-soft); }
  .ow-login .otp { display: flex; gap: 6px; justify-content: space-between; }
  .ow-login .otp input { flex: 1; padding: 0; box-sizing: border-box; text-align: center; font-size: 18px; }
  .ow-login .full {
    width: 100%; margin-top: 16px; min-height: var(--tap);
    background: var(--ow-brand-2); color: #fff;
    border: 0; border-radius: 9px; cursor: pointer;
    font: 600 14px/1 var(--font-sans);
  }
  .ow-login .full:hover { background: var(--ow-brand); }
  .ow-login .meta { font: 12px/1.5 var(--font-sans); color: var(--ow-text-sub); margin-top: 12px; text-align: center; }
  .ow-login .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px;
    background: var(--ow-brand-soft); color: var(--ow-brand);
    font: 500 11px var(--font-sans); margin-bottom: 12px;
  }

  /* ===== Modal — BOTTOM SHEET on phones ===== */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.55);
    display: flex; justify-content: center; align-items: flex-end;
    animation: scrimIn 180ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%;
    background: var(--ow-surface-2);
    color: var(--ow-text);
    border-top: 1px solid var(--ow-border-2);
    border-top-left-radius: 16px;
    border-top-right-radius: 16px;
    padding: 6px 0 calc(16px + env(safe-area-inset-bottom, 0px));
    max-height: 95vh;
    display: flex; flex-direction: column;
    box-shadow: 0 -16px 40px -10px rgba(0,0,0,0.55);
    animation: sheetIn 260ms cubic-bezier(0.2, 0, 0.1, 1);
  }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal .handle {
    width: 36px; height: 4px; margin: 6px auto 10px;
    background: var(--ow-border-2); border-radius: 9999px;
    flex: none;
  }
  .modal .sheet-hd {
    padding: 4px 18px 12px;
    border-bottom: 1px solid var(--ow-border);
    flex: none;

/* ===== Toast / modal ===== */
function toast(msg, kind='default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind!=='default' ? ' '+kind : '');
  const icon = kind==='success' ? 'check' : kind==='danger' ? 'x' : kind==='warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 240); }, 2400);
}
function openSheet(innerHtml, opts={}) {
  /* Generic bottom-sheet / modal. innerHtml = body of .modal. */
  state.modal = innerHtml;
  renderModal();
}
function openModal(html) { state.modal = html; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const h = $('#modal-host');
  if (!state.modal) { h.innerHTML = ''; return; }
  h.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(h);
  h.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
  const cl = h.querySelector('[data-sheet-close]');
  if (cl) cl.addEventListener('click', closeModal);
}
function openConfirm({title, sub, okLabel='Confirm', danger=false, onOk}) {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="handle"></div>
      <div class="sheet-hd"><h3>${escapeHtml(title)}</h3><p class="sub">${escapeHtml(sub||'')}</p></div>
      <div class="sheet-bd"></div>
      <div class="acts">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn ${danger?'danger':'primary'}" data-ok>${escapeHtml(okLabel)}</button>
      </div>
    </div>`);
  $('.modal [data-cancel]').addEventListener('click', closeModal);
  $('.modal [data-ok]').addEventListener('click', () => { closeModal(); onOk && onOk(); });
}

/* ===== Fullscreen ===== */
function toggleFullscreen() {
  const isFs = !!document.fullscreenElement || document.body.classList.contains('is-fullscreen');
  if (isFs) {
    document.exitFullscreen && document.exitFullscreen().catch(()=>{});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  }
  render();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.moreSheetOpen) { state.moreSheetOpen = false; render(); return; }
    if (state.modal)    { closeModal();  return; }
    if (document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
      document.body.classList.remove('is-fullscreen'); render();
    }
  }
});

/* ===== SVG helpers (only used at ≥720px now) ===== */
function svgSparkline(values, opts={}) {
  const w = opts.w || 88, h = opts.h || 22;
  const c = opts.color || '#22C55E';
  const min = Math.min(...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-3) - 1.5).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function svgArea(values, opts={}) {
  const w = opts.w || 320, h = opts.h || 80;
  const c = opts.color || '#5B8DEF';
  const min = Math.min(0, ...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-6) - 3).toFixed(1)}`);
  const line = pts.join(' ');
  const fill = `0,${h} ` + pts.join(' ') + ` ${w},${h}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
    <polygon points="${fill}" fill="${c}" opacity="0.18"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
}
function svgBars(values, labels, opts={}) {
  const w = opts.w || 320, h = opts.h || 120;
  const c = opts.color || '#5B8DEF';
  const max = Math.max(...values) || 1;
  const bw = w / values.length * 0.62;
  const gap = w / values.length * 0.38;
  let out = `<svg width="${w}" height="${h+20}" viewBox="0 0 ${w} ${h+20}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
  values.forEach((v,i)=>{
    const bh = (v / max) * (h - 8);
    const x = i*(bw+gap) + gap/2;
    const y = h - bh;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${c}" rx="2"/>`;
    if (labels && labels[i]) out += `<text x="${(x+bw/2).toFixed(1)}" y="${h+14}" text-anchor="middle" font-size="10" fill="rgba(228,231,236,0.5)" font-family="ui-sans-serif,system-ui">${escapeHtml(labels[i])}</text>`;
  });
  out += '</svg>';
  return out;
}
function svgMultiLine(serieses, opts={}) {
  const w = opts.w || 480, h = opts.h || 180;
  const all = serieses.flatMap(s=>s.values);
  const min = Math.min(0, ...all), max = Math.max(...all);
  const rng = max - min || 1;
  const n = serieses[0].values.length;
  const sx = w / (n - 1);
  let out = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
  for (let i=0;i<5;i++) {
    const y = (h-20) * (i/4) + 10;
    out += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>`;
  }
  serieses.forEach(s => {
    const pts = s.values.map((v,i)=>`${(i*sx).toFixed(1)},${(h - 10 - ((v - min)/rng)*(h-20)).toFixed(1)}`).join(' ');
    out += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="1.8" stroke-linejoin="round"/>`;
  });
  out += '</svg>';
  return out;
}

/* ===== Render shell ===== */
function render() {
  saveState();
  if (!state.signedIn) {
    $('#app').innerHTML = renderSignIn();
    if (window.Icons) window.Icons.render($('#app'));
    wireSignIn();
    return;
  }
  hydrateSeeds();
  $('#app').innerHTML = `
    <div class="ow-app">
      ${renderSide()}
      ${renderBar()}
      <div class="ow-main">
        ${state.forceOffline ? `<div class="offline-banner"><span data-icon="wifi" data-icon-size="14"></span><strong>Working offline</strong> · Showing saved numbers from 09:42. Live numbers come back when you reconnect.</div>` : ''}
        ${renderRoute()}
      </div>
      ${renderTabs()}
      ${renderMoreSheet()}
    </div>
  `;
  if (window.Icons) window.Icons.render($('#app'));
  wireShell();
  wireRoute();
}

function wireShell() {
  $$('.ow-side [data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const rd = $('#reset-demo'); if (rd) rd.addEventListener('click', (e) => { e.preventDefault(); openConfirm({title:'Reset demo?', sub:'Wipes saved settings, notes, and the business you picked.', okLabel:'Reset', danger:true, onOk: resetDemo}); });
  const fs = $('#fs-toggle'); if (fs) fs.addEventListener('click', toggleFullscreen);
  const of = $('#offline-toggle'); if (of) of.addEventListener('click', () => {
    state.forceOffline = !state.forceOffline;
    toast(state.forceOffline ? 'Working offline · showing saved numbers' : 'Back online', state.forceOffline?'warn':'success');
    render();
  });
  const tb = $('#tenant-btn'); if (tb) tb.addEventListener('click', () => go('tenants'));
  const wb = $('#who-btn'); if (wb) wb.addEventListener('click', openSignOutModal);
  /* Bottom-tab wiring */
  $$('.b-bottom-tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.tab;
    if (id === 'more') { state.moreSheetOpen = true; render(); return; }
    const t = TABS.find(x=>x.id===id); if (t) go(t.route);
  }));
  const ms = $('[data-more-scrim]'); if (ms) ms.addEventListener('click', (e) => {
    if (e.target.dataset.moreScrim !== undefined) { state.moreSheetOpen = false; render(); }
  });
  $$('[data-more-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.moreGo)));
  const so = $('#more-signout'); if (so) so.addEventListener('click', () => { state.moreSheetOpen = false; openSignOutModal(); });
  const mr = $('#more-reset'); if (mr) mr.addEventListener('click', (e) => { e.preventDefault(); state.moreSheetOpen = false; openConfirm({title:'Reset demo?', sub:'Wipes saved settings, notes, and the business you picked.', okLabel:'Reset', danger:true, onOk: resetDemo}); });
}

function openSignOutModal() {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="handle"></div>
      <div class="sheet-hd"><h3>Sign out?</h3><p class="sub">You'll be sent back to the owner sign-in screen. Your saved notes stay on this device.</p></div>
      <div class="sheet-bd"></div>
      <div class="acts">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn primary" data-ok>Sign out</button>
      </div>
    </div>`);
  $('.modal [data-cancel]').addEventListener('click', closeModal);
  $('.modal [data-ok]').addEventListener('click', () => {
    closeModal(); state.signedIn = false; state.step = 'creds'; render();
  });
}

function renderRoute() {
  switch (state.route) {
    case 'today':       return renderToday();
    case 'lobs':        return renderLobs();
    case 'verticals':   state.route = 'lobs'; history.replaceState(null, '', '#/lobs'); return renderLobs();
    case 'branches':    return renderBranches();
    case 'cash':        return renderCash();
    case 'ar':          return renderAR();
    case 'ap':          return renderAP();
    case 'flags':       return renderFlags();
    case 'pnl':         return renderPnL();
    case 'forecast':    return renderForecast();
    case 'customers':   return renderCustomers();
    case 'products':    return renderProducts();
    case 'people':      return renderPeople();
    case 'operations':  return renderOperations();
    case 'compliance':  return renderCompliance();
    case 'okrs':        return renderOkrs();
    case 'reports':     return renderReports();
    case 'annotate':    return renderAnnotate();
    case 'tenants':     return renderTenants();
    case 'settings':    return renderSettings();
    case 'help':        return renderHelp();
    case 'signin':      state.signedIn = false; render(); return '';
    default:            return renderToday();
  }
}
function wireRoute() {
  switch (state.route) {
    case 'today':       wireToday(); break;
    case 'lobs':        wireLobs(); break;
    case 'branches':    wireBranches(); break;
    case 'cash':        wireCash(); break;
    case 'ar':          wireAR(); break;
    case 'ap':          wireAP(); break;
    case 'flags':       wireFlags(); break;
    case 'pnl':         wirePnL(); break;
    case 'forecast':    wireForecast(); break;
    case 'customers':   wireCustomers(); break;
    case 'products':    wireProducts(); break;
    case 'people':      wirePeople(); break;
    case 'operations':  wireOperations(); break;
    case 'compliance':  wireCompliance(); break;
    case 'okrs':        wireOkrs(); break;
    case 'reports':     wireReports(); break;
    case 'annotate':    wireAnnotate(); break;
    case 'tenants':     wireTenants(); break;
    case 'settings':    wireSettings(); break;
    case 'help':        wireHelp(); break;
  }
}

              ${[0,1,2,3,4,5].map(i => `<input maxlength="1" data-otp="${i}" inputmode="numeric" autocomplete="one-time-code" autofocus="${i===0?'true':'false'}" aria-label="Digit ${i+1}" />`).join('')}
            </div>
          </div>
          <button class="full" id="otp-go">Check code &amp; sign in</button>

        </div>
      </div>`;
  }
  return `

      <div class="card">
        <div class="badge"><span data-icon="corelith" data-icon-size="12"></span> Sunrise Trading</div>
        <h1>Owner sign in</h1>
        <div class="lead">Owner portal. You need your password and a code from your phone.</div>
        <div class="field"><label>Email or owner ID</label>
          <input type="text" id="si-email" value="tendai@sunrisetrading.co.zw" autocomplete="username" />
        </div>
        <div class="field"><label>Password</label>
          <input type="password" id="si-pass" value="•••••••••••" autocomplete="current-password" />
        </div>
        <button class="full" id="si-go">Next · get code on phone</button>
        <div class="meta">Demo · tap Next · fingerprint step shown after the code</div>
      </div>
    </div>`;
}
function wireSignIn() {
  if (state.step === 'otp') {
    $$('[data-otp]').forEach((inp,i,arr) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && i < arr.length - 1) arr[i+1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) arr[i-1].focus();
        if (e.key === 'ArrowLeft' && i > 0) arr[i-1].focus();
        if (e.key === 'ArrowRight' && i < arr.length - 1) arr[i+1].focus();
      });
    });
    $('#otp-go').addEventListener('click', () => {
      state.signedIn = true; state.step = 'creds'; toast('Signed in', 'success'); render();
    });
    $('#otp-back').addEventListener('click', (e) => { e.preventDefault(); state.step='creds'; render(); });
    return;
  }
  $('#si-go').addEventListener('click', () => { state.step = 'otp'; render(); });
}

/* ============================================================
   DETAIL SHEET — generic drill (mobile-first bottom sheet)
   ============================================================ */
function openDetailSheet(opts) {
  /* opts: { crumb, title, stats:[{l,v}], body, primaryLabel, onPrimary }
     Uses the design-system .x-bottom-sheet pattern.
     Renders directly into #modal-host (bypassing renderModal's outer
     .modal-scrim) so the DS .x-bs-scrim wraps the sheet on its own. */
  const stats = (opts.stats||[]).map(s => `<div class="s"><div class="l">${escapeHtml(s.l)}</div><div class="v">${escapeHtml(s.v)}</div></div>`).join('');
  state.modal = '__bs__'; /* sentinel so Escape / state-driven close still works */
  const h = $('#modal-host');
  h.innerHTML = `
    <div class="x-bs-scrim open" data-bs-scrim>
      <div class="x-bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="bs-title">
        <div class="x-bs-grab"></div>
        <div class="x-bs-head">
          <div style="flex:1;min-width:0;">
            <div style="font:500 11px/1 var(--font-sans);letter-spacing:0.1em;text-transform:uppercase;color:var(--ow-text-sub);margin-bottom:4px;">${escapeHtml(opts.crumb || '')}</div>
            <h3 id="bs-title">${escapeHtml(opts.title || '')}</h3>
          </div>
          <button class="x-bs-close" type="button" data-sheet-close aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button>
        </div>
        <div class="x-bs-body">
          ${stats ? `<div class="stat-row">${stats}</div>` : ''}
          ${opts.body || ''}
        </div>
        <div class="x-bs-foot">
          <button class="alt" type="button" data-sheet-close>Close</button>
          ${opts.primaryLabel ? `<button class="primary" type="button" id="sheet-primary">${escapeHtml(opts.primaryLabel)}</button>` : ''}
        </div>
      </div>
    </div>`;
  if (window.Icons) window.Icons.render(h);
  /* Close on scrim tap (outside sheet) */
  const scrim = h.querySelector('[data-bs-scrim]');
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(); });
  h.querySelectorAll('[data-sheet-close]').forEach(b => b.addEventListener('click', closeModal));
  if (opts.onPrimary) {
    const p = $('#sheet-primary');
    if (p) p.addEventListener('click', () => { closeModal(); opts.onPrimary(); });
  }
}

/* ============================================================
   P&L — by line of business
   ============================================================ */
function renderPnL() {
  const p = state.period;
  const lobs = state.linesOfBusiness || LOBS;
  /* Build the table from the LOBS revenue + costs. */
  const revRows = lobs.map(l => ({
    kind: 'rev', label: l.name + ' · sales',
    mtd: l.rev, qtd: Math.round(l.rev*3*0.96), ytd: Math.round(l.rev*6*0.92),
    lastMtd: Math.round(l.rev * (1 - l.delta/100)),
  }));
  const totalRev = lobs.reduce((s,l)=>s+l.rev,0);
  const totalCosts = lobs.reduce((s,l)=>s+l.costs,0);
  const rows = [
    ...revRows,
    { kind:'tot', label:'Total sales',
      mtd: totalRev, qtd: Math.round(totalRev*3*0.96), ytd: Math.round(totalRev*6*0.92),
      lastMtd: Math.round(totalRev*0.94) },
    { kind:'cost', label:'Cost of sales (stock, materials)',
      mtd: -Math.round(totalCosts*0.62), qtd: -Math.round(totalCosts*0.62*3), ytd: -Math.round(totalCosts*0.62*6),
      lastMtd: -Math.round(totalCosts*0.62*0.96) },
    { kind:'cost', label:'Wages',
      mtd: -Math.round(totalRev * 0.186),
      qtd: -Math.round(totalRev * 0.186 * 3),
      ytd: -Math.round(totalRev * 0.186 * 6),
      lastMtd: -Math.round(totalRev * 0.186 * 0.96) },
    { kind:'cost', label:'Rent, electricity, internet, fuel',
      mtd: -Math.round(totalCosts*0.18), qtd: -Math.round(totalCosts*0.18*3), ytd: -Math.round(totalCosts*0.18*6),
      lastMtd: -Math.round(totalCosts*0.18*0.96) },
    { kind:'tot', label:'Profit',
      mtd: totalRev - totalCosts, qtd: (totalRev - totalCosts)*3, ytd: (totalRev - totalCosts)*6,
      lastMtd: Math.round((totalRev - totalCosts)*0.94) },
  ];
  const k = p === 'mtd' ? 'mtd' : p === 'qtd' ? 'qtd' : 'ytd';
  return `
    <div class="ow-page">
      <div class="ow-page-head">
        <div class="crumb">Profit &amp; loss · ${p.toUpperCase()}</div>
        <h2>Profit &amp; loss</h2>
        <div class="sub">By line of business. Switch period · tap any row for detail.</div>

            ${r.auto ? `<span class="pill ok">Auto</span>` : `<span class="pill neutral">Manual</span>`}

}
function wireReports() {
  $$('#rep-seg [data-r]').forEach(b => b.addEventListener('click', () => { state.reportFilter = b.dataset.r; render(); }));
  $$('[data-run]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); toast(`Running ${b.dataset.run}…`); setTimeout(()=>toast('Report ready','success'), 900); }));
  $$('[data-share]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); openConfirm({title:'Share report?', sub:'Sends to your share list (3 people).', okLabel:'Share', onOk:()=>toast('Report shared','success')}); }));
  $$('[data-report]').forEach(b => b.addEventListener('click', (e) => {
    if (e.target.closest('[data-run]') || e.target.closest('[data-share]')) return;
    const r = REPORTS.find(x=>x.id===b.dataset.report); if (!r) return;
    openDetailSheet({
      crumb: 'Report',
      title: r.name,
      stats: [
        { l: 'Cadence',    v: r.kind },
        { l: 'Schedule',   v: r.schedule },
        { l: 'Last run',   v: r.last },
        { l: 'Auto-run',   v: r.auto ? 'Yes' : 'No' },
      ],
    });
  }));
  $('#new-rep').addEventListener('click', () => {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <div class="handle"></div>
        <div class="sheet-hd"><h3>New report</h3><p class="sub">Pick what goes in it and how often.</p></div>
        <div class="sheet-bd">
          <div class="row"><input placeholder="Report name" /></div>
          <div class="row"><select><option>Daily</option><option>Weekly</option><option>Monthly</option></select></div>
        </div>
        <div class="acts"><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-ok>Create</button></div>
      </div>`);
    $('.modal [data-cancel]').addEventListener('click', closeModal);
    $('.modal [data-ok]').addEventListener('click', () => { closeModal(); toast('Report created','success'); });
  });
}

        <div class="sheet-hd"><h3>New note</h3><p class="sub">Pin a note to today's screen.</p></div>
        <div class="sheet-bd">
          <div class="row"><textarea id="ann-tx" placeholder="What you noticed…" autofocus></textarea></div>

function wireSettings() {

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  hydrateSeeds();
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  let r = (location.hash.replace(/^#\/?/, '') || 'today');
  /* Backward redirect: old #/verticals -> #/lobs */
  if (r === 'verticals') { history.replaceState(null, '', '#/lobs'); r = 'lobs'; }
  if (r === 'signin') { state.signedIn = false; state.step = 'creds'; }
  else if (ROUTES.includes(r)) state.route = r;
  render();
}
if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
