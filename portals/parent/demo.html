<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Parent portal demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  /* ============================================================
     Parent portal interactive demo — mobile-first
     ============================================================ */
  body { background: var(--gray-100); margin: 0; }

  /* Stage: centred phone-sized canvas on desktop, full bleed on mobile */
  .pd-stage {
    min-height: calc(100vh - 47px); /* minus pk-nav */
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--gray-100);
  }
  .pd-frame {
    width: 390px; height: 844px;
    border-radius: 48px;
    background: #0F1115;
    padding: 12px;
    box-shadow: 0 30px 60px -20px rgba(22,24,29,0.25), 0 0 0 1px rgba(22,24,29,0.08);
    position: relative;
  }
  .pd-frame::before {
    content: ""; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; background: #0F1115; border-radius: 0 0 18px 18px; z-index: 20;
  }
  .pd-screen {
    width: 100%; height: 100%;
    border-radius: 36px;
    overflow: hidden;
    background: var(--canvas);
    position: relative;
    display: flex; flex-direction: column;
  }

  /* Fullscreen mode hides pk-nav & device frame entirely */
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen { background: #000; }
  body.is-fullscreen .pd-stage { padding: 0; min-height: 100vh; min-height: 100dvh; }
  body.is-fullscreen .pd-frame {
    width: 100vw; height: 100vh; height: 100dvh;
    border-radius: 0; padding: 0; box-shadow: none;
  }
  body.is-fullscreen .pd-frame::before { display: none; }
  body.is-fullscreen .pd-screen { border-radius: 0; }

  /* Mobile: drop the device chrome and use the whole viewport */
  @media (max-width: 720px) {
    .pd-stage { padding: 0; min-height: calc(100dvh - 47px); }
    .pd-frame {
      width: 100%; height: calc(100dvh - 47px);
      border-radius: 0; padding: 0; box-shadow: none;
    }
    .pd-frame::before { display: none; }
    .pd-screen { border-radius: 0; }
  }

  /* Fullscreen toggle button (floats top-right of stage) */
  .pd-fs-toggle {
    position: fixed; top: 56px; right: 16px; z-index: 50;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-strong); cursor: pointer;
    display: grid; place-items: center;
    box-shadow: 0 4px 12px -4px rgba(0,0,0,0.15);
  }
  .pd-fs-toggle:hover { background: var(--surface-muted); }
  body.is-fullscreen .pd-fs-toggle {
    top: env(safe-area-inset-top, 14px); right: 14px;
    background: rgba(255,255,255,0.92);
  }

  /* App bar custom — has child avatar (tap = child switcher) */
  .pa-bar {
    height: 52px; padding: 0 8px 0 12px;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .pa-bar .back {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 8px; color: var(--text-strong); cursor: pointer;
  }
  .pa-bar .back:hover { background: var(--surface-muted); }
  .pa-bar h1 { margin: 0; font: 600 16px/1.1 var(--font-sans); color: var(--text-strong); flex: 1; letter-spacing: -0.01em; }
  .pa-bar .actions { display: inline-flex; align-items: center; gap: 4px; }
  .pa-bar .actions button {
    width: 36px; height: 36px; border-radius: 8px;
    color: var(--text-strong); display: grid; place-items: center; cursor: pointer;
    position: relative;
  }
  .pa-bar .actions button:hover { background: var(--surface-muted); }
  .pa-bar .actions .pip {
    position: absolute; top: 6px; right: 6px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--tone-danger); border: 2px solid var(--surface);
  }
  .pa-bar .child-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px 4px 4px; border-radius: 9999px;
    background: var(--brand-soft); color: var(--brand-strong);
    cursor: pointer;
    font: 600 12px/1 var(--font-sans);
  }
  .pa-bar .child-btn .av {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: grid; place-items: center;
    font: 700 10.5px/1 var(--font-sans);
  }
  .pa-bar .child-btn:hover { background: var(--brand-100); }

  /* Bottom tab bar */
  .pa-tabs {
    height: 72px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 10px));
    display: flex; align-items: stretch;
    background: var(--surface); border-top: 1px solid var(--border);
    flex: none;
  }
  .pa-tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; border-radius: 8px; padding: 4px 0;
    color: var(--text-subtle); background: transparent; cursor: pointer;
    font: 500 11px/1 var(--font-sans); position: relative;
  }
  .pa-tabs button.active { color: var(--brand); }
  .pa-tabs button .ic { width: 22px; height: 22px; display: grid; place-items: center; }
  .pa-tabs button .bdg {
    position: absolute; top: 2px; right: calc(50% - 18px);
    min-width: 16px; height: 16px; padding: 0 4px;
    background: var(--tone-danger); color: #fff; border-radius: 9999px;
    font: 600 10px/16px var(--font-mono); text-align: center;
  }

  /* Scrollable area */
  .pa-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pa-scroll::-webkit-scrollbar { width: 0; }

  /* ── HOME ──────────────────────────────────────────────── */
  .greet { padding: 16px 16px 6px; }
  .greet .hi { font: 500 13px/1.3 var(--font-sans); color: var(--text-muted); }
  .greet h2 { font: 700 22px/1.15 var(--font-sans); letter-spacing: -0.02em; margin: 4px 0 0; color: var(--text-strong); }
  .greet .school { font: 12.5px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px; }

  /* Fee hero */
  .fee-hero {
    margin: 12px 16px 0;
    background: linear-gradient(135deg, #166534, #14532D);
    color: #fff; border-radius: 14px;
    padding: 18px 18px 16px;
    position: relative; overflow: clip;
  }
  .fee-hero::before {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%);
  }
  .fee-hero .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .fee-hero .val { font: 700 34px/1.05 var(--font-sans); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 10px; }
  .fee-hero .val .c { font-size: 17px; opacity: 0.85; margin-right: 4px; font-weight: 500; }
  .fee-hero .due { font: 13px/1.4 var(--font-sans); opacity: 0.9; margin-top: 6px; }
  .fee-hero .progress { margin-top: 14px; }
  .fee-hero .progress .bar { height: 6px; background: rgba(255,255,255,0.18); border-radius: 9999px; overflow: hidden; }
  .fee-hero .progress .bar > span { display: block; height: 100%; background: #fff; border-radius: inherit; transition: width 320ms ease; }
  .fee-hero .progress .meta { display: flex; justify-content: space-between; font: 500 11px/1 var(--font-sans); opacity: 0.9; margin-top: 8px; }
  .fee-hero .actions { display: flex; gap: 8px; margin-top: 14px; }
  .fee-hero .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px; border-radius: 9999px;
    background: rgba(255,255,255,0.18); color: #fff;
    font: 600 13px/1 var(--font-sans); cursor: pointer;
  }
  .fee-hero .btn:hover { background: rgba(255,255,255,0.28); }
  .fee-hero .btn.solid { background: #fff; color: #166534; }
  .fee-hero .btn.solid:hover { background: rgba(255,255,255,0.9); }
  .fee-hero.paid { background: linear-gradient(135deg, #1E40AF, #1D4ED8); }
  .fee-hero.paid.cleared { background: linear-gradient(135deg, #166534, #14532D); }

  .section-h { padding: 18px 20px 8px; font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); display: flex; align-items: center; justify-content: space-between; }
  .section-h a, .section-h button { font: 500 12px/1 var(--font-sans); color: var(--brand-strong); text-decoration: none; letter-spacing: 0; text-transform: none; background: none; cursor: pointer; }

  .card-block { margin: 0 16px; }

  /* List rows */
  .pl-row.cl { cursor: pointer; }
  .pl-row.cl:hover { background: var(--surface-muted); }
  .pl-row .badge-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--brand);
    display: inline-block; margin-left: 4px;
  }
  .pl-row .unread { background: var(--brand-soft); color: var(--brand-strong); font: 600 10px/1 var(--font-mono); padding: 3px 7px; border-radius: 9999px; }

  /* Timetable timeline */
  .tt-row {
    display: grid; grid-template-columns: 56px 1fr auto;
    gap: 12px; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);
  }
  .tt-row:last-child { border-bottom: 0; }
  .tt-row .time { font: 600 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .tt-row .time .ap { display: block; font: 500 10px/1 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .tt-row .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .tt-row .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .tt-row .now {
    font: 600 9.5px/1 var(--font-mono); letter-spacing: 0.08em;
    background: var(--tone-success-bg); color: var(--tone-success);
    padding: 3px 6px; border-radius: 4px;
  }

  /* Quick stat tiles */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .stat-tile:hover { border-color: var(--brand-200); background: var(--brand-50); }
  .stat-tile .l { font: 500 11px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.04em; }
  .stat-tile .v { font: 700 22px/1.1 var(--font-sans); color: var(--text-strong); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stat-tile .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .stat-tile.brand { background: var(--brand-soft); border-color: var(--brand-100); }
  .stat-tile.brand .v { color: var(--brand-strong); }

  /* ── NOTICES ───────────────────────────────────────────── */
  .notice-row {
    display: grid; grid-template-columns: 36px 1fr auto;
    gap: 12px; padding: 14px 16px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer; align-items: flex-start;
  }
  .notice-row:hover { background: var(--surface-muted); }
  .notice-row:last-child { border-bottom: 0; }
  .notice-row .ic {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand-strong);
    display: grid; place-items: center;
  }
  .notice-row .ic.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .notice-row .ic.danger { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .notice-row .ic.success { background: var(--tone-success-bg); color: var(--tone-success); }
  .notice-row.unread .nm { color: var(--text-strong); font-weight: 600; }
  .notice-row .nm { font: 500 14px/1.3 var(--font-sans); color: var(--text-body); }
  .notice-row .sb { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .notice-row .meta { font: 11px/1 var(--font-mono); color: var(--text-subtle); margin-top: 6px; }
  .notice-row .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); margin-top: 8px; }

  /* Notice detail */
  .notice-detail { padding: 16px 18px 24px; }
  .notice-detail h2 { font: 700 19px/1.25 var(--font-sans); color: var(--text-strong); margin: 0 0 6px; letter-spacing: -0.01em; }
  .notice-detail .meta-row { display: flex; align-items: center; gap: 8px; font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-bottom: 14px; }
  .notice-detail .meta-row .pill {
    padding: 3px 8px; border-radius: 9999px; background: var(--surface-muted);
    font: 500 10.5px/1 var(--font-sans);
  }
  .notice-detail .body { font: 14px/1.55 var(--font-sans); color: var(--text-body); }
  .notice-detail .body p { margin: 0 0 12px; }
  .notice-detail .attach {
    margin: 14px 0;
    display: grid; gap: 6px;
  }
  .notice-detail .attach a {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: var(--surface-muted); border-radius: 8px;
    color: var(--text-strong); text-decoration: none; font: 500 13px/1.3 var(--font-sans);
  }
  .notice-detail .attach a .ic { width: 28px; height: 28px; border-radius: 6px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; flex: none; }
  .notice-detail .attach a .sz { margin-left: auto; font: 11px/1 var(--font-mono); color: var(--text-muted); }
  .notice-detail .rsvp { display: flex; gap: 8px; margin: 14px 0 4px; }
  .notice-detail .rsvp button {
    flex: 1; padding: 11px; border-radius: 10px;
    font: 600 13px/1 var(--font-sans); cursor: pointer;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-strong);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .notice-detail .rsvp button:hover { background: var(--surface-muted); }
  .notice-detail .rsvp button.on.yes { background: var(--tone-success); color: #fff; border-color: var(--tone-success); }
  .notice-detail .rsvp button.on.no  { background: var(--tone-danger); color: #fff; border-color: var(--tone-danger); }
  .notice-detail .rsvp button.on.maybe { background: var(--tone-warn); color: #fff; border-color: var(--tone-warn); }

  .comments { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border-subtle); }
  .comments h3 { font: 600 13px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 10px; }
  .comment {
    display: grid; grid-template-columns: 32px 1fr;
    gap: 10px; padding: 8px 0;
  }
  .comment .av {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand-strong);
    display: grid; place-items: center;
    font: 600 11px/1 var(--font-sans);
  }
  .comment.staff .av { background: var(--tone-success-bg); color: var(--tone-success); }
  .comment .ct {
    background: var(--surface-muted); padding: 8px 12px; border-radius: 12px;
  }
  .comment .nm { font: 600 12px/1.3 var(--font-sans); color: var(--text-strong); }
  .comment .nm .when { font: 500 10.5px/1 var(--font-mono); color: var(--text-muted); margin-left: 6px; font-weight: 500; }
  .comment .bd { font: 13px/1.4 var(--font-sans); color: var(--text-body); margin-top: 2px; }

  .comment-input {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 0 0;
  }
  .comment-input input {
    flex: 1; height: 38px; padding: 0 14px;
    border: 1px solid var(--border); border-radius: 9999px;
    background: var(--surface); font: 13px/1 var(--font-sans);
  }
  .comment-input input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .comment-input button {
    width: 38px; height: 38px; border-radius: 9999px;
    background: var(--brand); color: #fff;
    display: grid; place-items: center; cursor: pointer;
  }
  .comment-input button:hover { background: var(--brand-strong); }

  /* ── FEES ──────────────────────────────────────────────── */
  .breakdown {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: clip;
    margin: 0 16px;
  }
  .breakdown-row {
    display: grid; grid-template-columns: 1fr auto;
    gap: 8px 12px; padding: 12px 14px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .breakdown-row:hover { background: var(--surface-muted); }
  .breakdown-row:last-child { border-bottom: 0; }
  .breakdown-row .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .breakdown-row .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .breakdown-row .v { font: 600 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; align-self: center; }
  .breakdown-row.total { background: var(--surface-muted); cursor: default; }
  .breakdown-row.paid .v { color: var(--tone-success); }
  .breakdown-row.paid .v::before { content: "−"; margin-right: 3px; }
  .breakdown-row .chk {
    width: 18px; height: 18px; border-radius: 5px;
    border: 1.5px solid var(--border-strong); flex: none;
    display: grid; place-items: center;
    margin-right: 8px;
    background: var(--surface);
  }
  .breakdown-row.picked .chk { background: var(--brand); border-color: var(--brand); color: #fff; }
  .breakdown-row .nm-wrap { display: flex; align-items: flex-start; }
  .breakdown-row .nm-body { flex: 1; min-width: 0; }

  .pay-bar {
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    flex: none;
  }
  .pay-bar .meta { flex: 1; min-width: 0; }
  .pay-bar .meta .l { font: 11px/1 var(--font-sans); color: var(--text-muted); }
  .pay-bar .meta .v { font: 700 17px/1 var(--font-mono); color: var(--text-strong); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .pay-bar button {
    padding: 11px 18px; border-radius: 10px;
    background: var(--brand); color: #fff;
    font: 600 14px/1 var(--font-sans); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pay-bar button:hover { background: var(--brand-strong); }
  .pay-bar button:disabled { background: var(--surface-muted); color: var(--text-muted); cursor: not-allowed; }

  /* Split chooser */
  .split-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 16px; }
  .split-row button {
    padding: 11px 8px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    font: 600 13px/1.2 var(--font-sans); color: var(--text-strong);
    cursor: pointer; display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .split-row button:hover { border-color: var(--brand-200); background: var(--brand-50); }
  .split-row button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
  .split-row button .sb { font: 500 10.5px/1 var(--font-sans); color: var(--text-muted); }
  .split-row button.on .sb { color: var(--brand-strong); opacity: 0.8; }

  /* Method chooser */
  .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px; }
  .method-btn {
    padding: 12px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 6px;
    cursor: pointer; text-align: left;
  }
  .method-btn:hover { border-color: var(--brand-200); background: var(--brand-50); }
  .method-btn.on { border-color: var(--brand); background: var(--brand-soft); }
  .method-btn .ic-tile {
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--surface-muted); color: var(--text-strong);
    display: grid; place-items: center;
  }
  .method-btn.on .ic-tile { background: var(--brand); color: #fff; }
  .method-btn .nm { font: 600 13px/1.2 var(--font-sans); color: var(--text-strong); }
  .method-btn .sb { font: 11px/1.3 var(--font-sans); color: var(--text-muted); }

  /* Sim payment box */
  .sim-box {
    margin: 0 16px; padding: 14px;
    background: var(--surface-muted); border-radius: 12px; text-align: center;
    color: var(--text-muted); font: 13px/1.4 var(--font-sans);
    border: 1px dashed var(--border-strong);
  }
  .sim-box strong { color: var(--text-strong); display: block; font: 600 13.5px/1 var(--font-sans); margin-bottom: 6px; }
  .sim-box .pulse {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand); margin-right: 6px;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.4; transform: scale(1.3); } }

  /* Receipt */
  .receipt-card {
    margin: 16px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px;
  }
  .receipt-card .succ-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; background: var(--tone-success-bg);
    border-radius: 10px; margin-bottom: 14px;
  }
  .receipt-card .succ-banner .ic {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--tone-success); color: #fff;
    display: grid; place-items: center; flex: none;
    animation: pop 320ms ease;
  }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }

// Initialize mutable notice state
NOTICES.forEach(n => {
  state.notices[n.id] = {
    unread: n.unread,
    rsvp: null,                  // 'yes' | 'no' | 'maybe'
    comments: n.comments.slice(),
  };
});

function currentChild() { return CHILDREN.find(c => c.id === state.childId); }
function feeTotal(child) { return child.fees.invoices.reduce((s, i) => s + i.amount, 0); }
function feeBalance(child) { return +(feeTotal(child) - child.fees.paid).toFixed(2); }
function pickedTotal(child) {
  return child.fees.invoices.reduce((s, i) => s + (state.pay.picked[i.id] ? i.amount : 0), 0);
}
function payAmount(child) {
  const base = pickedTotal(child) || feeBalance(child);
  if (state.pay.splitMode === 'half') return +(base / 2).toFixed(2);
  if (state.pay.splitMode === 'min')  return +Math.min(base, 150).toFixed(2);
  return +base.toFixed(2);
}
function unreadCount() { return Object.values(state.notices).filter(n => n.unread).length; }

/* ============================================================
   Routing
   ============================================================ */
function go(route, opts = {}) {
  state.route = route;
  if (opts.noticeId !== undefined) state.noticeId = opts.noticeId;
  if (opts.subjectIdx !== undefined) state.subjectIdx = opts.subjectIdx;
  closeModal();
  history.replaceState(null, '', '#/' + route + (opts.suffix || ''));
  render();
  const sc = $('.pa-scroll'); if (sc) sc.scrollTop = 0;
}
window.addEventListener('hashchange', () => {
  const r = (location.hash.replace(/^#\/?/, '') || 'home');
  if (state.route !== r) { state.route = r; render(); }
});

/* ============================================================
   Toast & modal helpers
   ============================================================ */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2400);
}

function openModal(content, opts = {}) {
  state.modal = { content, center: !!opts.center };
  renderModal();
}
function closeModal() {
  state.modal = null;
  renderModal();
}
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="scrim ${state.modal.center ? 'center' : ''}" data-scrim>${state.modal.content}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

/* ============================================================
   Fullscreen
   ============================================================ */
function toggleFullscreen() {
  const isFs = !!document.fullscreenElement || document.body.classList.contains('is-fullscreen');
  if (isFs) {
    document.exitFullscreen().catch(() => {});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
  // Update icon
  const btn = $('#fs-toggle');
  if (btn) {
    const fs = document.body.classList.contains('is-fullscreen');
    btn.innerHTML = `<span data-icon="${fs ? 'x' : 'grid'}" data-icon-size="16"></span>`;
    btn.title = fs ? 'Exit fullscreen' : 'Fullscreen preview';
    btn.setAttribute('aria-label', btn.title);
    if (window.Icons) window.Icons.render(btn);
  }
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  const btn = $('#fs-toggle');
  if (btn) {
    const fs = document.body.classList.contains('is-fullscreen');
    btn.innerHTML = `<span data-icon="${fs ? 'x' : 'grid'}" data-icon-size="16"></span>`;
    if (window.Icons) window.Icons.render(btn);
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
    document.body.classList.remove('is-fullscreen');
    const btn = $('#fs-toggle');
    if (btn) { btn.innerHTML = `<span data-icon="grid" data-icon-size="16"></span>`; if (window.Icons) window.Icons.render(btn); }
  }
});

/* ============================================================
   Render: shell
   ============================================================ */
function render() {
  $('#app').innerHTML = renderShell();
  if (window.Icons) window.Icons.render($('#app'));
  wireShell();
  wireRoute();
}

function topTabId() {
  if (state.route.startsWith('fees')) return 'fees';
  if (state.route.startsWith('notice')) return 'notices';
  if (state.route === 'attendance' || state.route.startsWith('marks')) return 'attendance';
  if (state.route === 'profile') return 'profile';
  return 'home';
}

function renderShell() {
  const child = currentChild();
  return `
    ${renderAppBar(child)}
    <div class="pa-scroll" id="pa-scroll">${renderRoute()}</div>
    ${renderPayBar()}
    ${renderBottomTabs()}
  `;
}

function renderPayBar() {
  if (state.route !== 'fees') return '';
  const child = currentChild();
  const picked = pickedTotal(child);
  const amount = picked || feeBalance(child);
  return `
    <div class="pay-bar">
      <div class="meta">
        <div class="l">${picked ? 'Selected items' : 'Outstanding balance'}</div>
        <div class="v">${money(amount)}</div>
      </div>
      <button id="open-pay" ${amount > 0 ? '' : 'disabled'}>
        Pay <span data-icon="arrow" data-icon-size="14"></span>
      </button>
    </div>
  `;
}

function renderAppBar(child) {
  const r = state.route;
  // Routes with back arrow
  const withBack = (
    r === 'fees/pay' || r === 'fees/method' || r === 'fees/receipt' ||
    r.startsWith('notice/') ||
    r.startsWith('marks/')
  );
  const titles = {
    'home':         'Hi, Mrs ' + child.name.split(' ').slice(-1)[0],
    'fees':         'Fees',
    'fees/pay':     'Pay fees',
    'fees/method':  'Payment method',
    'fees/receipt': 'Receipt',
    'notices':      'Notices',
    'attendance':   'Attendance & marks',
    'profile':      'Profile',
  };
  let title = titles[r] || '';
  if (r.startsWith('notice/')) title = 'Notice';
  if (r.startsWith('marks/'))  title = 'Subject detail';

  const back = withBack
    ? (r === 'fees/pay' ? 'fees'
      : r === 'fees/method' ? 'fees/pay'
      : r === 'fees/receipt' ? 'home'
      : r.startsWith('notice/') ? 'notices'
      : r.startsWith('marks/') ? 'attendance'
      : 'home')
    : null;

  const unread = unreadCount();

  return `
    <header class="pa-bar">
      ${withBack
        ? `<span class="back" data-back="${back}" role="button" tabindex="0"><span data-icon="back" data-icon-size="18"></span></span>`
        : ''}
      <h1>${escapeHtml(title)}</h1>
      <div class="actions">
        <button data-child-switcher class="child-btn" title="Switch child">
          <span class="av">${initials(child.name)}</span>
          ${child.short}
        </button>
        <button data-go-notices title="Notices">
          <span data-icon="bell" data-icon-size="18"></span>
          ${unread > 0 ? '<span class="pip"></span>' : ''}
        </button>
      </div>
    </header>
  `;
}

const TABS = [
  { id: 'home',       label: 'Home',     icon: 'home',     route: 'home' },
  { id: 'fees',       label: 'Fees',     icon: 'card',     route: 'fees' },
  { id: 'notices',    label: 'Notices',  icon: 'bell',     route: 'notices' },
  { id: 'profile',    label: 'Profile',  icon: 'user',     route: 'profile' },
];

function renderBottomTabs() {
  const cur = topTabId();
  const unread = unreadCount();
  return `
    <nav class="pa-tabs">
      ${TABS.map(t => `
        <button class="${cur === t.id ? 'active' : ''}" data-go="${t.route}">
          <span class="ic" data-icon="${t.icon}" data-icon-size="20"></span>
          <span>${t.label}</span>
          ${t.id === 'notices' && unread > 0 ? `<span class="bdg">${unread}</span>` : ''}
        </button>
      `).join('')}
    </nav>
  `;
}

function wireShell() {
  $$('[data-back]').forEach(b => b.addEventListener('click', () => go(b.dataset.back)));
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  const cs = $('[data-child-switcher]'); if (cs) cs.addEventListener('click', openChildSwitcher);
  const gn = $('[data-go-notices]'); if (gn) gn.addEventListener('click', () => go('notices'));
}

/* ============================================================
   Route renderer
   ============================================================ */
function renderRoute() {
  const r = state.route;
  if (r === 'home') return renderHome();
  if (r === 'fees') return renderFees();
  if (r === 'fees/pay') return renderFeesPay();
  if (r === 'fees/method') return renderFeesMethod();
  if (r === 'fees/receipt') return renderFeesReceipt();
  if (r === 'notices') return renderNotices();
  if (r.startsWith('notice/')) return renderNoticeDetail();
  if (r === 'attendance') return renderAttendance();
  if (r.startsWith('marks/')) return renderMarkDetail();
  if (r === 'profile') return renderProfile();
  return renderHome();
}

function wireRoute() {
  const r = state.route;
  if (r === 'home') wireHome();
  if (r === 'fees') wireFees();
  if (r === 'fees/pay') wireFeesPay();
  if (r === 'fees/method') wireFeesMethod();
  if (r === 'fees/receipt') wireFeesReceipt();
  if (r === 'notices') wireNotices();
  if (r.startsWith('notice/')) wireNoticeDetail();
  if (r === 'attendance') wireAttendance();
  if (r.startsWith('marks/')) wireMarkDetail();
  if (r === 'profile') wireProfile();
}

function completePayment() {
  const c = currentChild();
  const amount = payAmount(c);
  // Apply payment to child's balance
  c.fees.paid = +(c.fees.paid + amount).toFixed(2);
  // Mark fee reminder notice as read
  if (state.notices.n3) state.notices.n3.unread = false;
  // Build receipt
  state.pay.receipt = {
    ref: 'PR-' + Math.floor(100000 + Math.random() * 900000),
    when: new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    method: state.pay.method,
    amount,
    child: c.name,
    school: c.school,
    term: c.fees.term,
    items: c.fees.invoices.filter(i => state.pay.picked[i.id]),
    splitMode: state.pay.splitMode,
  };
  state.pay.processing = false;
  go('fees/receipt');
  toast('Payment successful · ' + money(amount), 'success');
}

const TERMS = [
  { id: 't1-2026', label: 'Term 1 · 2026' },
  { id: 't2-2026', label: 'Term 2 · 2026' },
  { id: 't3-2026', label: 'Term 3 · 2026' },

function renderAttendance() {
  const c = currentChild();
  // Build a deterministic 6x5 grid based on child id + term
  const seed = (c.id + state.termId).split('').reduce((s, ch) => s + ch.charCodeAt(0), 0);
  const weeks = 6;
  const days = ['Mon','Tue','Wed','Thu','Fri'];
  const grid = [];
  let counter = seed;
  for (let w = 0; w < weeks; w++) {
    const row = [];
    for (let d = 0; d < 5; d++) {
      counter = (counter * 9301 + 49297) % 233280;
      const r = counter / 233280;
      let kind = 'p';
      if (w === weeks - 1 && d > 0) kind = 'h'; // future (current week, partial)
      else if (r < 0.04) kind = 'a';
      else if (r < 0.08) kind = 'l';
      row.push(kind);
    }
    grid.push(row);
  }
  // Override last row to be "today is Wed", everything Wed+ is empty
  grid[weeks - 1] = ['p', 'p', 'p', 'h', 'h'];

  const present = grid.flat().filter(k => k === 'p').length;
  const absent  = grid.flat().filter(k => k === 'a').length;
  const late    = grid.flat().filter(k => k === 'l').length;
  const counted = present + absent + late;
  const attPct  = counted ? Math.round((present / counted) * 100) : 0;

  return `
    <div class="term-select">
      ${TERMS.map(t => `<button class="${state.termId === t.id ? 'on' : ''}" data-term="${t.id}">${t.label}</button>`).join('')}
    </div>

    <div class="att-card">
      <div class="summary">
        <span class="v">${attPct}%</span>
        <span class="lbl">attendance · ${escapeHtml(c.short)}</span>
      </div>
      <div class="sb">${present} present · ${late} late · ${absent} absent — ${counted} school days so far this term.</div>
      <div class="att-grid">
        <span class="wk"></span>
        ${days.map(d => `<span class="day">${d}</span>`).join('')}
        ${grid.map((row, wi) => `
          <span class="wk">W${wi + 1}</span>
          ${row.map((k, di) => `
            <span class="dot ${k}" title="${days[di]} · W${wi+1} · ${({p:'present',a:'absent',l:'late',h:'—'})[k]}">${({p:'P',a:'A',l:'L',h:''})[k]}</span>
          `).join('')}
        `).join('')}
      </div>
      <div class="att-legend">
        <span class="l-p">Present</span>
        <span class="l-l">Late</span>
        <span class="l-a">Absent</span>
      </div>
    </div>

    <div class="section-h">Subject marks<span style="font: 500 11px/1 var(--font-mono); color: var(--text-muted); letter-spacing: 0;">${c.marks.length} subjects</span></div>
    <div style="padding: 0 16px;">
      ${c.marks.map((m, idx) => {
        const pct = m.mark;
        return `
          <div class="subj-card" data-mark="${idx}">
            <div class="hd">
              <span class="ic" data-icon="${m.icon}" data-icon-size="16"></span>
              <div style="flex:1; min-width:0;">
                <div class="nm">${escapeHtml(m.subj)}</div>
                <div class="sb">${escapeHtml(m.teacher)}</div>
              </div>
              <span class="v ${m.grade}">${pct}<span style="font-size: 11px; color: var(--text-muted); margin-left: 4px;">%</span></span>
            </div>
            <div class="bar"><span class="${m.grade}" style="width: ${pct}%;"></span></div>
          </div>
        `;
      }).join('')}
    </div>

    <div style="height: 24px;"></div>
  `;
}
function wireAttendance() {
  $$('[data-term]').forEach(b => b.addEventListener('click', () => {
    state.termId = b.dataset.term;
    render();
  }));
  $$('[data-mark]').forEach(b => b.addEventListener('click', () => {

    document.body.classList.add('is-fullscreen');

  const r = (location.hash.replace(/^#\/?/, '') || 'home');
  state.route = r;
  // Wire fullscreen toggle once (it lives outside #app)

  if (fs) fs.addEventListener('click', toggleFullscreen);

}
if (document.readyState !== 'loading') init();
