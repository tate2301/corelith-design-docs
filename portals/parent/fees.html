<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><title>Fees · Parent portal · Huchu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="app.js" defer></script>
<style>
  body { background: var(--gray-100); margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; }
  .device { width: 390px; height: 844px; border-radius: 48px; background: #0F1115; padding: 12px; box-shadow: 0 30px 60px -20px rgba(22,24,29,0.25), 0 0 0 1px rgba(22,24,29,0.08); position: relative; }
  .device::before { content: ""; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 110px; height: 30px; background: #0F1115; border-radius: 0 0 18px 18px; z-index: 20; }
  .device .screen { width: 100%; height: 100%; border-radius: 36px; overflow: hidden; background: var(--canvas); position: relative; display: flex; flex-direction: column; }

  .balance-card { padding: 22px 18px; background: linear-gradient(135deg, #166534, #14532D); color: #fff; border-radius: 14px; margin: 12px 16px 8px; position: relative; overflow: clip; }
  .balance-card::before { content: ""; position: absolute; right: -50px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.16), transparent 70%); }
  .balance-card .lbl { font: 500 12px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .balance-card .val { font: 700 38px/1 var(--font-sans); letter-spacing: -0.025em; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .balance-card .val .c { font-size: 18px; opacity: 0.85; margin-right: 4px; font-weight: 500; }
  .balance-card .due { font: 13.5px/1.4 var(--font-sans); opacity: 0.85; margin-top: 8px; }
  .balance-card .progress { margin-top: 16px; }
  .balance-card .progress .bar { height: 6px; background: rgba(255,255,255,0.18); border-radius: 9999px; overflow: hidden; }
  .balance-card .progress .bar > span { display: block; height: 100%; background: #fff; border-radius: inherit; }
  .balance-card .progress .meta { display: flex; justify-content: space-between; font: 500 11px/1 var(--font-sans); opacity: 0.85; margin-top: 8px; }

  .pay-button { display: block; margin: 8px 16px 4px; padding: 14px; background: #fff; color: #166534; border-radius: 12px; text-align: center; font: 600 15px/1 var(--font-sans); border: 1px solid #fff; }

  .breakdown-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); font: var(--type-body-sm); }
  .breakdown-row:last-child { border-bottom: 0; }
  .breakdown-row .nm { font: 500 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .breakdown-row .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .breakdown-row .v { font: 600 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .breakdown-row.total { background: var(--surface-muted); }
  .breakdown-row.paid .v { color: var(--tone-success); }
  .breakdown-row.paid .v::before { content: "−"; margin-right: 4px; }
</style>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-kit-nav="parent" data-parent-page="fees">

<div class="device">
<div class="screen">
<div class="ps-screen">
  <div class="ps-statusbar"><span>9:41</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

  <div class="ps-appbar">
    <button class="nav-btn" onclick="history.back()"><span data-icon="back" data-icon-size="20"></span></button>
    <h1>Fees</h1>
    <div class="right">
      <span data-parent-slot="kid-chip"></span>
      <a class="nav-btn" href="payment-history.html" aria-label="Payment history"><span data-icon="download" data-icon-size="18"></span></a>
    </div>
  </div>

  <div class="ps-scroll">
    <!-- Active child indicator -->
    <div style="padding: 14px 16px 4px; display: flex; align-items: center; gap: 10px;">
      <span data-parent-slot="kid-av" style="width: 36px; height: 36px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 13px/1 var(--font-sans);">TM</span>
      <div>
        <div style="font: 500 14px/1.3 var(--font-sans); color: var(--text-strong);" data-parent-slot="kid-name">—</div>
        <div style="font: 12px/1.3 var(--font-sans); color: var(--text-muted);" data-parent-slot="kid-sub">—</div>
      </div>
    </div>

    <!-- Balance card -->
    <div class="balance-card">
      <div class="lbl">Outstanding balance</div>
      <div class="val" data-parent-slot="bal-value">$0.00</div>
      <div class="due" data-parent-slot="bal-due">—</div>
      <div class="progress">
        <div class="bar"><span data-parent-slot="bal-bar" style="width: 0%;"></span></div>
        <div class="meta"><span data-parent-slot="bal-paid">Paid · $0</span><span data-parent-slot="bal-total">Total · $0</span></div>
      </div>
    </div>
    <button class="pay-button" type="button" data-parent-slot="pay-cta" style="cursor:pointer;">Pay</button>
    <div style="padding: 6px 16px 0;">
      <button class="btn btn-ghost" style="width: 100%; justify-content: center;"><span data-icon="card" data-icon-size="14"></span> Pay in installments</button>
    </div>

    <!-- Breakdown -->
    <div style="padding: 16px 4px 8px;">
      <div class="psh" style="padding: 0 16px;">Term invoice breakdown</div>
    </div>

    <div class="pl" style="margin: 0 16px;" data-parent-slot="fee-items"></div>

    <!-- Payment history quick link -->
    <div style="padding: 18px 16px 8px;">
      <div class="psh" style="padding: 0;">Recent activity<a href="payment-history.html">View all</a></div>
    </div>
    <div style="padding: 0 16px;">
      <a href="payment-history.html" class="pl-row" style="text-decoration: none; color: inherit; border:1px solid var(--border); border-radius:10px; background: var(--surface);">
        <span class="ic-tile brand"><span data-icon="card" data-icon-size="18"></span></span>
        <div><div class="nm">Payment history</div><div class="sb">Every receipt across all children</div></div>
        <span data-icon="chright" style="color: var(--text-subtle);"></span>
      </a>
    </div>

    <div style="height: 32px;"></div>
  </div>

  <div class="ps-tabbar">
    <a class="ps-tab" href="dashboard.html"><span data-icon="home"></span>Home</a>
    <a class="ps-tab active" href="fees.html"><span data-icon="card"></span>Fees</a>
    <a class="ps-tab" href="notice.html"><span data-icon="bell"></span>Notices</a>
    <a class="ps-tab" href="profile.html"><span data-icon="user"></span>Profile</a>
  </div>
</div>
</div>
</div>

</body>
</html>
