<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Notices · Parent portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="../../device-scale.js" defer></script>
<script src="app.js" defer></script>
<style>
  .notice-page { padding: 12px 16px 24px; display: flex; flex-direction: column; gap: 8px; }
  .notice-header {
    padding: 4px 16px 12px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .notice-header .h-lead {
    font: 700 18px/1.2 var(--font-sans);
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .notice-header .h-sub {
    font: 12px/1.3 var(--font-sans);
    color: var(--text-muted);
  }
</style>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-portal-kit="parent" data-portal-screen="notice" data-kit-nav="parent" data-parent-page="notices">

<main class="kit-stage phone-bg">
  <div class="device-phone">
    <div class="screen">
      <div class="ps-screen">

        <div class="ps-statusbar"><span>9:41</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

        <div class="ps-appbar">
          <button class="nav-btn" onclick="history.back()"><span data-icon="back" data-icon-size="20"></span></button>
          <h1>Notices</h1>
          <div class="right">
            <span data-parent-slot="kid-chip"></span>
            <button class="nav-btn" aria-label="Search"><span data-icon="search" data-icon-size="18"></span></button>
          </div>
        </div>

        <div class="ps-scroll">

          <div class="notice-header">
            <div>
              <div class="h-lead">School notices</div>
              <div class="h-sub"><span data-parent-slot="unread-count">0</span> unread</div>
            </div>
          </div>

          <div class="notice-page" data-parent-slot="notice-feed"></div>

        </div>

        <div class="ps-tabbar">
          <a class="ps-tab" href="dashboard.html"><span data-icon="home"></span>Home</a>
          <a class="ps-tab" href="fees.html"><span data-icon="card"></span>Fees</a>
          <a class="ps-tab active" href="notice.html"><span data-icon="bell"></span>Notices</a>
          <a class="ps-tab" href="profile.html"><span data-icon="user"></span>Profile</a>
        </div>

      </div>
    </div>
  </div>
</main>

</body>
</html>
