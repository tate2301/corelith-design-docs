<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Payment history · Parent portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="../../device-scale.js" defer></script>
<script src="app.js" defer></script>
<style>
  .total-card { margin: 12px 16px 4px; padding: 16px 18px; border-radius: 14px; background: linear-gradient(135deg, #166534, #14532D); color: #fff; }
  .total-card .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .total-card .val { font: 700 30px/1 var(--font-sans); margin-top: 8px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .total-card .val .c { font-size: 16px; opacity: 0.85; margin-right: 4px; font-weight: 500; }
  .total-card .ds { font: 13px/1.4 var(--font-sans); opacity: 0.88; margin-top: 6px; }
  .total-card .split { display: flex; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.18); }
  .total-card .split .b { flex: 1; }
  .total-card .split .b .k { font: 11px/1 var(--font-sans); opacity: 0.8; letter-spacing: 0.04em; text-transform: uppercase; }
  .total-card .split .b .v { font: 600 14px/1 var(--font-mono); margin-top: 5px; font-variant-numeric: tabular-nums; }

  .filter-chips { display: flex; gap: 6px; padding: 12px 16px 4px; overflow-x: auto; }
  .filter-chips .ch { padding: 6px 12px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); font: 500 12px/1 var(--font-sans); color: var(--text-muted); white-space: nowrap; cursor: pointer; }
  .filter-chips .ch.active { background: var(--brand-soft); color: var(--brand-strong); border-color: var(--brand-100); }

  .month-h { padding: 14px 16px 6px; font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); display: flex; align-items: center; justify-content: space-between; }
  .month-h .total { font: 600 12px/1 var(--font-mono); color: var(--text-muted); text-transform: none; letter-spacing: 0; }

  .pay-row { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
  .pay-row:last-child { border-bottom: 0; }
  .pay-row .ic-tile { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; }
  .pay-row .ic-tile.cash { background: #FEF3C7; color: #B45309; }
  .pay-row .ic-tile.card { background: #DBEAFE; color: #1D4ED8; }
  .pay-row .ic-tile.momo { background: var(--brand-soft); color: var(--brand-strong); }
  .pay-row .nm { font: 500 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .pay-row .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .pay-row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .pay-row .amt { font: 600 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .pay-row .rcpt { font: 500 11px/1 var(--font-sans); color: var(--brand-strong); text-decoration: none; }
</style>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-portal-kit="parent" data-portal-screen="payment-history" data-kit-nav="parent" data-parent-page="history">

<main class="kit-stage phone-bg">
  <div class="device-phone">
    <div class="screen">
      <div class="ps-screen">

        <div class="ps-statusbar"><span>9:41</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

        <div class="ps-appbar">
          <button class="nav-btn" onclick="history.back()"><span data-icon="back" data-icon-size="20"></span></button>
          <h1>Payment history</h1>
          <div class="right">
            <span data-parent-slot="kid-chip"></span>
            <button class="nav-btn" aria-label="Download statement"><span data-icon="download" data-icon-size="18"></span></button>
          </div>
        </div>

        <div class="ps-scroll">

          <div class="total-card">
            <div class="lbl">Paid year-to-date · 2026</div>
            <div class="val" data-parent-slot="paid-ytd">$0.00</div>
            <div class="ds" data-parent-slot="paid-count">—</div>
          </div>

          <div class="month-h">
            <span>All payments</span>
          </div>

          <div class="pl" style="margin: 0 16px;" data-parent-slot="payment-feed"></div>

          <div style="height: 24px;"></div>

        </div>

        <div class="ps-tabbar">
          <a class="ps-tab" href="dashboard.html"><span data-icon="home"></span>Home</a>
          <a class="ps-tab active" href="fees.html"><span data-icon="card"></span>Fees</a>
          <a class="ps-tab" href="notice.html"><span data-icon="bell"></span>Notices</a>
          <a class="ps-tab" href="profile.html"><span data-icon="user"></span>Profile</a>
        </div>

      </div>
    </div>
  </div>
</main>

</body>
</html>
