<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sales history · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html">Sale</a>
    <a href="item-search.html">Items</a>
    <a href="customer.html" class="active">Receipts</a>
    <a href="refund.html">Refund</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head">
    <h1>Receipts &amp; history</h1>
    <div class="pos-meta" id="meta">All recorded sales for this terminal.</div>
  </div>

  <section class="pos-panel">
    <input id="hist-search" type="search" class="pos-search" placeholder="Search receipt ID, cashier or method…" aria-label="Search history" />
    <div id="hist-list" class="pos-list" style="margin-top:14px;"></div>
  </section>
</main>

<script type="module">
import POS from './app.js';

const search = document.getElementById('hist-search');
const list = document.getElementById('hist-list');
const meta = document.getElementById('meta');
const shiftMeta = document.getElementById('shift-meta');
const s = POS.getCurrentShift();
shiftMeta.innerHTML = `${s.cashier} · ${s.till} · Shift <strong>${s.id}</strong>`;

function render() {
  const q = (search.value || '').trim().toLowerCase();
  const all = POS.getSales().filter((s) => !q
    || s.id.toLowerCase().includes(q)
    || s.cashier.toLowerCase().includes(q)
    || s.payment.method.toLowerCase().includes(q));
  meta.textContent = `${all.length} sale${all.length === 1 ? '' : 's'} stored.`;
  if (!all.length) {
    list.innerHTML = `<div class="pos-empty">No receipts yet. Make a sale on the Sale tab.</div>`;
    return;
  }
  list.innerHTML = all.map((s) => {
    const dt = new Date(s.at).toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
    return `
      <div class="pos-list-row" data-id="${POS.esc(s.id)}" tabindex="0">
        <div>
          <div class="nm">${POS.esc(s.id)} ${s.refunded ? '<span class="badge refunded">Refunded</span>' : ''}</div>
          <div class="sb">${dt} · ${s.lines.length} item${s.lines.length === 1 ? '' : 's'} · ${POS.labelMethod(s.payment.method)} · ${POS.esc(s.cashier)}</div>
        </div>
        <div class="v">${POS.moneyPlain(s.totals.total)}</div>
      </div>
    `;
  }).join('');
  list.querySelectorAll('[data-id]').forEach((r) => {
    const open = () => {
      const sale = POS.getSales().find((s) => s.id === r.dataset.id);
      if (!sale) return;
      POS.openModal(`
        <div class="pos-modal-head"><h2>Receipt ${POS.esc(sale.id)}</h2><button class="pos-modal-close" data-close>×</button></div>
        <div class="pos-modal-body pos-receipt-body">${POS.renderReceipt(sale)}</div>
        <div class="pos-modal-foot">
          <button class="pos-btn pos-btn-quiet" data-close>Close</button>
        </div>
      `);
    };
    r.addEventListener('click', open);
    r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
  });
}
search.addEventListener('input', render);
render();
</script>
</body>
</html>
