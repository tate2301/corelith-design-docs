<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>POS demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<script src="../../portal-kit-nav.js" defer></script>
<style>
  body { background: var(--gray-100); margin: 0; }

  /* === App shell === */
  .pd-app {
    display: grid;
    grid-template-columns: 220px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "side bar" "side main";
    height: calc(100vh - 47px); /* minus pk-nav */
    min-height: 640px;
    background: var(--canvas);
  }
  .pd-bar { grid-area: bar; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 0 18px; font: 500 13px/1 var(--font-sans); color: var(--text-strong); }
  .pd-bar .br { font-weight: 600; }
  .pd-bar .sep { color: var(--text-subtle); }
  .pd-bar .pill { padding: 4px 10px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); background: var(--surface-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .pd-bar .pill.live { background: var(--tone-success-bg); color: var(--tone-success); }
  .pd-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pd-bar .spacer { flex: 1; }
  .pd-bar .cashier { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
  .pd-bar .cashier .av { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); }

  .pd-side { grid-area: side; background: var(--ink); color: rgba(255,255,255,0.85); padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pd-side .pd-brand { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font: 600 14px/1 var(--font-sans); color: #fff; }
  .pd-side .pd-brand .m { color: #fff; }
  .pd-side .pd-h { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 14px 10px 6px; }
  .pd-nav-item {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: 7px;
    color: rgba(255,255,255,0.78); text-decoration: none;
    font: 500 13px/1 var(--font-sans);
    border: 0; background: transparent; cursor: pointer; width: 100%; text-align: left;
  }
  .pd-nav-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
  .pd-nav-item.active { background: var(--brand); color: #fff; }
  .pd-nav-item .ic { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: currentColor; flex: none; }
  .pd-nav-item .tag { margin-left: auto; padding: 1px 6px; border-radius: 9999px; background: rgba(255,255,255,0.12); font: 600 10px/1 var(--font-mono); color: #fff; }
  .pd-side .pd-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,0.08); font: 11.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.5); }
  .pd-side .pd-foot strong { color: rgba(255,255,255,0.85); font-weight: 600; display: block; }

  .pd-main { grid-area: main; min-width: 0; min-height: 0; overflow: hidden; display: flex; }

  /* === Sale screen === */
  .sale {
    display: grid;
    grid-template-columns: 1fr 360px;
    width: 100%; min-width: 0;
  }
  .sale .cat { display: flex; flex-direction: column; min-width: 0; }
  .sale .cat-bar { padding: 14px 18px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .sale .cat-bar .srch { flex: 1; position: relative; }
  .sale .cat-bar .srch input { width: 100%; height: 36px; padding: 0 12px 0 34px; border: 1px solid var(--border); border-radius: 8px; background: var(--canvas); font: 400 14px/1 var(--font-sans); color: var(--text-body); }
  .sale .cat-bar .srch input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .sale .cat-bar .srch [data-icon] { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); }
  .sale .cat-bar .scan { width: 36px; height: 36px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; border: 1px solid var(--border); cursor: pointer; }
  .sale .cat-bar .scan:hover { background: var(--surface-sunken); }

  .sale .chips { display: flex; gap: 6px; padding: 12px 18px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .sale .chips::-webkit-scrollbar { display: none; }
  .sale .chip {
    padding: 6px 12px; border-radius: 9999px;
    background: var(--surface); border: 1px solid var(--border);
    font: 500 12.5px/1 var(--font-sans); color: var(--text-strong);
    white-space: nowrap; cursor: pointer; transition: all 120ms;
  }
  .sale .chip:hover { background: var(--surface-muted); }
  .sale .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }

  .sale .grid {
    flex: 1; overflow-y: auto;
    padding: 14px 18px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; align-content: start;
  }
  .sale .tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 6px;
    text-align: left; cursor: pointer; transition: all 100ms ease;
    position: relative;
  }
  .sale .tile:hover { border-color: var(--brand-200); transform: translateY(-1px); box-shadow: 0 4px 12px -4px rgba(11,93,240,0.18); }
  .sale .tile:active { transform: translateY(0); }
  .sale .tile .sw { height: 70px; border-radius: 6px; background: var(--surface-muted); display: grid; place-items: center; color: var(--text-strong); font: 700 22px/1 var(--font-sans); }
  .sale .tile.bev .sw { background: linear-gradient(135deg, #DCEEFF, #6FA0FF); color: #1E3A8A; }
  .sale .tile.gro .sw { background: linear-gradient(135deg, #FEF4DA, #F4C15B); color: #6B5119; }
  .sale .tile.tob .sw { background: linear-gradient(135deg, #FCE7F3, #EC4899); color: #831843; }
  .sale .tile.cln .sw { background: linear-gradient(135deg, #DCFCE7, #4ADE80); color: #166534; }
  .sale .tile.bak .sw { background: linear-gradient(135deg, #FFE5C8, #E2A458); color: #6B3F19; }
  .sale .tile.snk .sw { background: linear-gradient(135deg, #EDE0FF, #A78BFA); color: #4C1D95; }
  .sale .tile .nm { font: 500 12.5px/1.25 var(--font-sans); color: var(--text-strong); }
  .sale .tile .pr { font: 600 12.5px/1 var(--font-mono); color: var(--text-strong); margin-top: auto; font-variant-numeric: tabular-nums; }
  .sale .tile .stk { position: absolute; top: 6px; right: 6px; padding: 1px 6px; border-radius: 9999px; background: var(--surface-muted); font: 500 9px/1 var(--font-mono); color: var(--text-muted); }
  .sale .tile.low .stk { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .sale .tile.oos { opacity: 0.55; cursor: not-allowed; }
  .sale .tile.oos .stk { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .sale .tile.added { animation: tilePulse 350ms ease; }
  @keyframes tilePulse {
    0% { background: var(--brand-50); border-color: var(--brand); }
    100% { background: var(--surface); border-color: var(--border); }
  }

  /* Cart side */
  .cart { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
  .cart .ch { padding: 14px 16px 10px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 10px; }
  .cart .ch h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0; flex: 1; }
  .cart .ch .cnt { font: 500 11.5px/1 var(--font-mono); color: var(--text-muted); padding: 3px 8px; border-radius: 9999px; background: var(--surface-muted); }
  .cart .ch button { width: 28px; height: 28px; border-radius: 6px; background: transparent; color: var(--text-muted); display: grid; place-items: center; cursor: pointer; }
  .cart .ch button:hover { background: var(--surface-muted); color: var(--text-strong); }

  .cart .cust {
    padding: 8px 16px;
    display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border-subtle);
    cursor: pointer;
  }
  .cart .cust:hover { background: var(--surface-muted); }
  .cart .cust .av { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 11px/1 var(--font-sans); flex: none; }
  .cart .cust .av.b { background: var(--brand-soft); color: var(--brand-strong); }
  .cart .cust .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .cart .cust .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); }
  .cart .cust .ar { margin-left: auto; color: var(--text-subtle); }

  .cart .lines { flex: 1; overflow-y: auto; padding: 6px 0; min-height: 0; }
  .cart .empty { padding: 60px 24px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .cart .empty .lg { font-size: 32px; margin-bottom: 12px; color: var(--text-subtle); }
  .cart .line { padding: 9px 16px; border-bottom: 1px solid var(--border-subtle); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .cart .line.voided { opacity: 0.45; }
  .cart .line.voided .nm { text-decoration: line-through; }
  .cart .line .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .cart .line .total { font: 600 13.5px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; align-self: center; }
  .cart .line .meta { font: 11.5px/1.3 var(--font-mono); color: var(--text-muted); grid-column: 1; display: inline-flex; gap: 6px; align-items: center; }
  .cart .line .ctrl { grid-column: 2; display: inline-flex; gap: 4px; align-items: center; }
  .cart .line .ctrl button { width: 22px; height: 22px; border-radius: 5px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 13px/1 var(--font-mono); cursor: pointer; }
  .cart .line .ctrl button:hover { background: var(--surface-sunken); }
  .cart .line .ctrl .q { padding: 0 6px; font: 500 12px/1 var(--font-mono); color: var(--text-strong); min-width: 16px; text-align: center; }
  .cart .line .more { color: var(--text-subtle); width: 22px; height: 22px; display: grid; place-items: center; cursor: pointer; border-radius: 5px; }
  .cart .line .more:hover { background: var(--surface-muted); color: var(--text-strong); }

  .cart .disc { padding: 10px 16px; background: var(--brand-soft); border-top: 1px solid var(--brand-100); display: flex; align-items: center; gap: 8px; color: var(--brand-strong); font: 500 12.5px/1 var(--font-sans); }
  .cart .disc .v { margin-left: auto; font: 600 13px/1 var(--font-mono); }
  .cart .disc button { color: var(--brand-strong); background: transparent; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
  .cart .disc button:hover { background: rgba(11,93,240,0.12); }

  .cart .totals { padding: 12px 16px 6px; border-top: 1px solid var(--border-subtle); }
  .cart .tr { display: flex; justify-content: space-between; padding: 3px 0; font: 13px/1.4 var(--font-sans); color: var(--text-muted); }
  .cart .tr .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-body); }
  .cart .tr.gr { font: 700 18px/1.2 var(--font-sans); color: var(--text-strong); padding-top: 6px; border-top: 1px solid var(--border-subtle); margin-top: 6px; }
  .cart .tr.gr .v { font: 700 18px/1 var(--font-mono); color: var(--text-strong); }

  .cart .acts { padding: 10px 14px 8px; display: flex; gap: 6px; }
  .cart .acts button { flex: 1; padding: 8px; border-radius: 7px; background: var(--surface-muted); color: var(--text-body); font: 500 12px/1.3 var(--font-sans); display: inline-flex; align-items: center; justify-content: center; gap: 5px; cursor: pointer; }
  .cart .acts button:hover { background: var(--surface-sunken); color: var(--text-strong); }
  .cart .acts button:disabled { opacity: 0.45; cursor: not-allowed; }

  .cart .charge {
    margin: 0 14px 14px;
    padding: 16px;
    background: var(--brand); color: #fff;
    border-radius: 10px;
    font: 700 17px/1 var(--font-sans);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    cursor: pointer; transition: background 120ms;
  }
  .cart .charge:hover:not(:disabled) { background: var(--brand-strong); }
  .cart .charge:disabled { background: var(--surface-muted); color: var(--text-muted); cursor: not-allowed; }
  .cart .charge .v { font: 700 19px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

  /* === Tender === */
  .tender { width: 100%; padding: 28px; display: grid; place-items: center; overflow-y: auto; }
  .tender-wrap { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .tender .due {
    grid-column: 1 / -1;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 24px; text-align: center;
  }
  .tender .due .lbl { font: 500 12px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .tender .due .am { font: 700 56px/1 var(--font-sans); letter-spacing: -0.025em; color: var(--text-strong); margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .tender .due .am .c { font-size: 28px; color: var(--text-muted); font-weight: 500; margin-right: 4px; vertical-align: top; }
  .tender .due .lines-info { font: 13.5px/1.4 var(--font-sans); color: var(--text-muted); }

  .tender .methods { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
  .tender .methods h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 14px; }
  .tender .mgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tender .mbtn {
    padding: 18px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); cursor: pointer;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    transition: all 100ms;
  }
  .tender .mbtn:hover { border-color: var(--brand-200); background: var(--brand-50); }
  .tender .mbtn.on { border-color: var(--brand); background: var(--brand-soft); }
  .tender .mbtn .ic-tile { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; }
  .tender .mbtn .nm { font: 600 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .tender .mbtn .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); }

  .tender .work { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .tender .work h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0; }
  .tender .recv {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .tender .recv .cell { padding: 10px 12px; background: var(--surface-muted); border-radius: 8px; }
  .tender .recv .cell .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .tender .recv .cell .v { font: 600 18px/1 var(--font-mono); color: var(--text-strong); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .tender .recv .cell.due { background: var(--brand-soft); color: var(--brand-strong); }
  .tender .recv .cell.due .lbl, .tender .recv .cell.due .v { color: var(--brand-strong); }
  .tender .recv .cell.chg { background: var(--tone-success-bg); color: var(--tone-success); }
  .tender .recv .cell.chg .lbl, .tender .recv .cell.chg .v { color: var(--tone-success); }
  .tender .recv .cell.short { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .tender .recv .cell.short .lbl, .tender .recv .cell.short .v { color: var(--tone-danger); }
  .tender .quicks { display: flex; gap: 6px; flex-wrap: wrap; }
  .tender .quicks .q { padding: 8px 12px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); cursor: pointer; font: 500 13px/1 var(--font-sans); }
  .tender .quicks .q:hover { background: var(--surface-sunken); }
  .tender .quicks .q.exact { background: var(--brand-soft); color: var(--brand-strong); }
  .tender .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tender .keypad button { height: 44px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); font: 600 16px/1 var(--font-sans); cursor: pointer; }
  .tender .keypad button:hover { background: var(--surface-sunken); }
  .tender .keypad button.fn { background: var(--ink); color: #fff; }
  .tender .keypad button.fn:hover { background: var(--ink-2); }
  .tender .sim { padding: 14px; border: 1px dashed var(--border-strong); border-radius: 10px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .tender .sim strong { color: var(--text-strong); display: block; font-size: 15px; margin-bottom: 4px; }
  .tender .sim .pulse { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--brand); margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; transform: scale(1.3); } }

  .tender .confirm {
    grid-column: 1 / -1;
    display: flex; gap: 8px;
  }
  .tender .confirm button { flex: 1; padding: 14px; border-radius: 10px; cursor: pointer; font: 600 14px/1 var(--font-sans); }
  .tender .confirm .ok { background: var(--brand); color: #fff; }
  .tender .confirm .ok:hover:not(:disabled) { background: var(--brand-strong); }
  .tender .confirm .ok:disabled { opacity: 0.5; cursor: not-allowed; }
  .tender .confirm .cancel { background: var(--surface-muted); color: var(--text-body); }
  .tender .confirm .cancel:hover { background: var(--surface-sunken); color: var(--text-strong); }

  /* === Receipt screen === */
  .receipt-page { width: 100%; padding: 28px; overflow-y: auto; display: grid; place-items: center; }
  .receipt-card {
    width: 100%; max-width: 480px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px;
  }
  .receipt-card .succ { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--tone-success-bg); border-radius: 10px; margin-bottom: 20px; }
  .receipt-card .succ .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--tone-success); color: #fff; display: grid; place-items: center; flex: none; animation: pop 320ms ease; }
  @keyframes pop { 0% { transform: scale(0); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .receipt-card .succ .nm { font: 600 15px/1.2 var(--font-sans); color: var(--tone-success); }
  .receipt-card .succ .sb { font: 12.5px/1.3 var(--font-sans); color: var(--tone-success); opacity: 0.85; margin-top: 2px; }
  .receipt-card h2 { font: 600 18px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; text-align: center; }
  .receipt-card .meta-row { text-align: center; font: 12.5px/1.5 var(--font-sans); color: var(--text-muted); margin-bottom: 18px; }
  .receipt-card .rl { display: flex; justify-content: space-between; font: 13px/1.5 var(--font-sans); padding: 4px 0; }
  .receipt-card .rl .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .receipt-card .rl.head { font-weight: 600; color: var(--text-strong); border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 4px; }
  .receipt-card .rl.foot { border-top: 1px dashed var(--border); margin-top: 6px; padding-top: 8px; font-weight: 700; font-size: 15px; color: var(--text-strong); }
  .receipt-card .rl.foot .v { font-size: 16px; }
  .receipt-card .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 22px; }
  .receipt-card .acts .btn { padding: 12px; border-radius: 8px; font: 500 13px/1 var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .receipt-card .acts .btn.primary { background: var(--brand); color: #fff; grid-column: 1 / -1; padding: 14px; font-weight: 600; font-size: 14px; }
  .receipt-card .acts .btn.primary:hover { background: var(--brand-strong); }
  .receipt-card .acts .btn.alt { background: var(--surface-muted); color: var(--text-strong); }
  .receipt-card .acts .btn.alt:hover { background: var(--surface-sunken); }

  /* === Generic list pages (refund, customer, item) === */
  .page { width: 100%; padding: 22px; overflow-y: auto; min-width: 0; }
  .page-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .page-h h2 { font: 700 22px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .page-h .lede { font: 14px/1.55 var(--font-sans); color: var(--text-muted); margin: 4px 0 0; }

  .splitp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; min-height: 0; }
  .splitp .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
  .splitp .pane .h { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; }
  .splitp .pane .empty { padding: 32px 12px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }

  .input { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font: 14px var(--font-sans); }
  .input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text-body); padding: 0; }
  .input [data-icon] { color: var(--text-subtle); }
  .input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }

  .list-rows .lr { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; align-items: center; }
  .list-rows .lr:hover { background: var(--surface-muted); }
  .list-rows .lr.on { background: var(--brand-soft); }
  .list-rows .lr.on .nm { color: var(--brand-strong); }
  .list-rows .lr .av { width: 34px; height: 34px; border-radius: 50%; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .list-rows .lr.on .av { background: var(--brand); color: #fff; }
  .list-rows .lr .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .list-rows .lr .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .list-rows .lr .vl { font: 500 13px/1 var(--font-mono); color: var(--text-muted); }

  /* Refund-specific */
  .refund-pane .receipt-lines { margin: 12px 0; }
  .refund-pane .rln { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 10px 8px; border-bottom: 1px solid var(--border-subtle); align-items: center; }
  .refund-pane .rln:last-child { border-bottom: 0; }
  .refund-pane .rln input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .refund-pane .rln .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .refund-pane .rln .sb { font: 11px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .refund-pane .rln .v { font: 500 13px/1 var(--font-mono); color: var(--text-strong); }
  .refund-pane .rsn-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
  .refund-pane .rsn-chips button { padding: 6px 12px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--border); font: 500 12.5px/1 var(--font-sans); color: var(--text-strong); cursor: pointer; }
  .refund-pane .rsn-chips button:hover { background: var(--surface-muted); }
  .refund-pane .rsn-chips button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .refund-pane .total-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-top: 1px dashed var(--border); margin-top: 8px; }
  .refund-pane .total-bar .lbl { font: 500 12px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
  .refund-pane .total-bar .v { font: 700 20px/1 var(--font-mono); color: var(--tone-danger); font-variant-numeric: tabular-nums; }

  /* Customer profile pane */
  .cust-prof { padding: 12px; }
  .cust-prof .hero { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .cust-prof .hero .av { width: 48px; height: 48px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 17px/1 var(--font-sans); }
  .cust-prof .hero h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; }
  .cust-prof .hero .sb { font: 12.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .cust-prof .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .cust-prof .stat { padding: 10px; background: var(--surface-muted); border-radius: 8px; text-align: center; }
  .cust-prof .stat .v { font: 600 15px/1 var(--font-sans); color: var(--text-strong); }
  .cust-prof .stat .l { font: 11px/1 var(--font-sans); color: var(--text-muted); margin-top: 4px; letter-spacing: 0.04em; }
  .cust-prof .stat.brand .v { color: var(--brand-strong); }

  /* === Cash-up === */
  .cashup { width: 100%; padding: 22px; overflow-y: auto; }
  .cashup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1200px; margin: 0 auto; }
  .cashup .pane { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .cashup .pane h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 14px; display: flex; align-items: center; justify-content: space-between; }
  .cashup .ex-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); font: 13.5px/1.4 var(--font-sans); }
  .cashup .ex-row:last-of-type { border-bottom: 0; }
  .cashup .ex-row .v { font: 500 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .cashup .ex-row.total { padding-top: 14px; border-top: 2px solid var(--border); margin-top: 6px; font: 600 14.5px/1 var(--font-sans); }
  .cashup .ex-row.total .v { font-size: 16px; }

  .cashup .den { display: grid; grid-template-columns: 80px 1fr 90px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-subtle); }
  .cashup .den .dn { font: 600 13px/1 var(--font-mono); color: var(--text-strong); }
  .cashup .den .ctrl { display: flex; align-items: center; gap: 4px; justify-content: center; }
  .cashup .den .ctrl button { width: 30px; height: 28px; border-radius: 6px; background: var(--surface-muted); cursor: pointer; font: 600 14px/1 var(--font-mono); color: var(--text-strong); }
  .cashup .den .ctrl button:hover { background: var(--surface-sunken); }
  .cashup .den .ctrl input { width: 50px; height: 28px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font: 500 13px var(--font-mono); }
  .cashup .den .ln { text-align: right; font: 500 13.5px/1 var(--font-mono); color: var(--text-strong); }

  .cashup .variance { grid-column: 1 / -1; padding: 16px 20px; border-radius: 12px; display: flex; align-items: center; gap: 14px; }
  .cashup .variance.ok { background: var(--tone-success-bg); color: var(--tone-success); }
  .cashup .variance.warn { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .cashup .variance.bad { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .cashup .variance .ic { width: 36px; height: 36px; border-radius: 8px; background: rgba(255,255,255,0.6); display: grid; place-items: center; flex: none; }
  .cashup .variance .ttl { font: 600 15px/1.3 var(--font-sans); }
  .cashup .variance .sb { font: 13px/1.4 var(--font-sans); opacity: 0.85; margin-top: 2px; }
  .cashup .variance .v { margin-left: auto; font: 700 22px/1 var(--font-mono); }
  .cashup .submit { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .cashup .submit button { padding: 12px 20px; border-radius: 8px; font: 600 14px/1 var(--font-sans); cursor: pointer; }
  .cashup .submit .ok { background: var(--brand); color: #fff; }
  .cashup .submit .ok:hover { background: var(--brand-strong); }
  .cashup .submit .alt { background: var(--surface-muted); color: var(--text-strong); }

  /* === Z-report === */
  .zrep { width: 100%; padding: 22px; overflow-y: auto; }
  .zrep-card { max-width: 1000px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 28px; }
  .zrep h2 { font: 700 22px/1 var(--font-sans); color: var(--text-strong); margin: 0; }
  .zrep .sub { font: 13.5px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .zrep .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
  .zrep .k { padding: 14px; background: var(--surface-muted); border-radius: 10px; }
  .zrep .k.brand { background: var(--brand); color: #fff; }
  .zrep .k .l { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
  .zrep .k.brand .l { color: rgba(255,255,255,0.7); }
  .zrep .k .v { font: 700 22px/1.1 var(--font-mono); margin-top: 8px; font-variant-numeric: tabular-nums; color: var(--text-strong); }
  .zrep .k.brand .v { color: #fff; }
  .zrep .sec { margin-top: 22px; }
  .zrep .sec h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .zrep .sec h3 .meta { font: 11px/1 var(--font-mono); color: var(--text-muted); }
  .zrep .tbl { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); }
  .zrep .tbl th, .zrep .tbl td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  .zrep .tbl th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-muted); }
  .zrep .tbl td.num, .zrep .tbl th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .zrep .tbl tr:last-child td { border-bottom: 0; }
  .zrep .ftr { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; }
  .zrep .ftr button { padding: 10px 16px; border-radius: 7px; font: 500 13px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .zrep .ftr .alt { background: var(--surface-muted); color: var(--text-strong); }
  .zrep .ftr .pri { background: var(--brand); color: #fff; }
  .zrep .ftr .pri:hover { background: var(--brand-strong); }

  /* === Modals === */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(22,24,29,0.6);
    z-index: 100; display: grid; place-items: center; padding: 20px;
    animation: scrimIn 160ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface); border-radius: 14px; padding: 22px;
    width: 100%; max-width: 360px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
    animation: modalIn 220ms cubic-bezier(0.2, 0, 0.1, 1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 4px; }
  .modal .sub { font: 13px/1.4 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .modal .pin {
    display: flex; gap: 8px; justify-content: center; margin: 14px 0 16px;
  }
  .modal .pin .d { width: 40px; height: 48px; border-radius: 8px; background: var(--surface-muted); display: grid; place-items: center; font: 700 22px/1 var(--font-mono); color: var(--text-strong); border: 2px solid transparent; }
  .modal .pin .d.fill { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-strong); }
  .modal .pin .d.err { border-color: var(--tone-danger); background: var(--tone-danger-bg); color: var(--tone-danger); animation: shake 350ms; }
  @keyframes shake { 25%, 75% { transform: translateX(-4px); } 50% { transform: translateX(4px); } }
  .modal .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .modal .pin-pad button { height: 48px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); font: 600 18px/1 var(--font-sans); cursor: pointer; }
  .modal .pin-pad button:hover { background: var(--surface-sunken); }
  .modal .pin-pad button.cancel { background: transparent; color: var(--text-muted); font-weight: 500; font-size: 13px; }
  .modal .pin-pad button.cancel:hover { background: var(--surface-muted); color: var(--text-strong); }
  .modal .pin-pad button.bksp { color: var(--tone-warn); }
  .modal .pin-err { color: var(--tone-danger); font: 500 12px/1.4 var(--font-sans); text-align: center; margin-top: 6px; }

  .modal .row { display: flex; gap: 6px; margin-bottom: 12px; }
  .modal .row input { flex: 1; height: 38px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; font: 500 14px var(--font-sans); }
  .modal .row input:focus { outline: 0; border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }
  .modal .seg { display: inline-flex; padding: 2px; background: var(--surface-muted); border-radius: 7px; }
  .modal .seg button { padding: 6px 12px; border-radius: 5px; font: 500 12px var(--font-sans); color: var(--text-muted); background: transparent; cursor: pointer; }
  .modal .seg button.on { background: var(--surface); color: var(--text-strong); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  .modal .acts { display: flex; gap: 6px; margin-top: 14px; }
  .modal .acts button { flex: 1; padding: 11px; border-radius: 8px; font: 600 13px var(--font-sans); cursor: pointer; }
  .modal .acts .ok { background: var(--brand); color: #fff; }
  .modal .acts .ok:hover { background: var(--brand-strong); }
  .modal .acts .alt { background: var(--surface-muted); color: var(--text-strong); }

  /* === Toast === */
  .toast-host { position: fixed; top: 78px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; padding: 11px 16px;
    border-radius: 8px; font: 500 13.5px/1.4 var(--font-sans);
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.3);
    display: inline-flex; align-items: center; gap: 8px;
    animation: toastIn 240ms ease; pointer-events: auto;
  }
  .toast.success { background: var(--tone-success); }
  .toast.danger { background: var(--tone-danger); }
  .toast.warn { background: var(--tone-warn); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
  .toast.out { animation: toastOut 240ms ease forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translateX(20px); } }

  /* Hidden by default (only used in mobile drill-in) */
  .back-list {
    display: none;
    align-items: center; gap: 6px;
    padding: 7px 10px; margin: -4px -4px 10px;
    background: var(--surface-muted); border-radius: 6px;
    font: 500 12.5px/1 var(--font-sans); color: var(--brand-strong);
    cursor: pointer; border: 0; width: fit-content;
  }

  /* === Mobile bottom tab bar (shown <=720px) === */
  .pd-tabs { display: none; }

  /* === Mobile cart sheet === */
  .cart-sheet-scrim {
    display: none;
    position: fixed; inset: 0; background: rgba(22,24,29,0.55);
    z-index: 60; animation: scrimIn 160ms ease;
  }
  .cart-sheet-scrim.open { display: block; }

  /* === Mobile "view cart" sticky bar === */
  .view-cart-bar { display: none; }

  /* === Responsive === */
  @media (max-width: 1000px) {
    .pd-app { grid-template-columns: 64px 1fr; }
    .pd-side .pd-h, .pd-side .pd-foot, .pd-nav-item span:not(.ic):not(.tag) { display: none; }
    .pd-nav-item { justify-content: center; padding: 9px; }
    .pd-side .pd-brand { justify-content: center; }
    .pd-side .pd-brand > span:last-child { display: none; }
    .pd-nav-item .tag { display: none; }
    .sale { grid-template-columns: 1fr 320px; }
    .tender-wrap { grid-template-columns: 1fr; }
    .splitp { grid-template-columns: 1fr; }
    .cashup-grid { grid-template-columns: 1fr; }
    .zrep .kpis { grid-template-columns: 1fr 1fr; }
  }

  /* Phone */
  @media (max-width: 720px) {
    .pd-app {
      grid-template-columns: 1fr;
      grid-template-rows: 44px 1fr 60px;
      grid-template-areas: "bar" "main" "tabs";
      height: calc(100dvh - 47px); /* minus pk-nav */
      min-height: 0;
    }
    .pd-side { display: none; }

    /* Top bar compresses */
    .pd-bar { padding: 0 12px; gap: 6px; font-size: 12px; height: 44px; }
    .pd-bar .br { font-weight: 600; }
    .pd-bar .cashier > span:not(.av) { display: none; }
    .pd-bar .pill { padding: 3px 7px; font-size: 10.5px; }
    .pd-bar .pill > span:not(.dot) { display: none; }
    .pd-bar .cashier { gap: 4px; }
    .pd-bar > .sep { display: none; }
    .pd-bar > span:not(.br):not(.pill):not(.cashier):not(.spacer) { display: none; } /* hide "Till 02 · Shift S-2841" */

    /* Bottom tab bar */
    .pd-tabs {
      grid-area: tabs;
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0 4px env(safe-area-inset-bottom, 4px);
    }
    .pd-tabs .t {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; padding: 6px 2px;
      color: var(--text-subtle); background: transparent; cursor: pointer;
      font: 500 10px/1 var(--font-sans); border: 0;
      position: relative;
    }
    .pd-tabs .t .ic { width: 22px; height: 22px; display: grid; place-items: center; }
    .pd-tabs .t.active { color: var(--brand); }
    .pd-tabs .t .badge {
      position: absolute; top: 4px; right: 28%;
      min-width: 16px; height: 16px; padding: 0 4px;
      background: var(--brand); color: #fff;
      border-radius: 9999px;
      font: 600 10px/16px var(--font-mono); text-align: center;
    }

    /* Sale: full-width catalog */
    .sale {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto 1fr auto;
      position: relative;
    }
    .sale .cat-bar { padding: 10px 12px; }
    .sale .chips { padding: 8px 12px; }
    .sale .grid {
      padding: 10px 12px 80px; /* bottom space for view-cart bar */
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .sale .tile { padding: 8px; gap: 4px; }
    .sale .tile .sw { height: 60px; font-size: 18px; }
    .sale .tile .nm { font-size: 12px; }
    .sale .tile .pr { font-size: 12px; }

    /* View cart sticky bar */
    .view-cart-bar {
      display: flex; align-items: center; gap: 10px;
      position: absolute; left: 8px; right: 8px; bottom: 8px;
      background: var(--brand); color: #fff;
      padding: 12px 14px; border-radius: 12px;
      box-shadow: 0 10px 24px -6px rgba(11,93,240,0.4);
      cursor: pointer; z-index: 5;
      animation: barIn 240ms ease;
    }
    @keyframes barIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .view-cart-bar .ic-bg { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.18); display: grid; place-items: center; flex: none; }
    .view-cart-bar .lbl { font: 600 14px/1.2 var(--font-sans); flex: 1; }
    .view-cart-bar .meta { font: 500 12px/1.2 var(--font-sans); opacity: 0.85; margin-top: 2px; }
    .view-cart-bar .v { font: 700 16px/1 var(--font-mono); font-variant-numeric: tabular-nums; }

    /* Cart becomes a slide-up sheet */
    .cart {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      top: 18%;
      z-index: 70;
      border-left: 0;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
      box-shadow: 0 -20px 40px -10px rgba(0,0,0,0.25);
      transform: translateY(100%);
      transition: transform 280ms cubic-bezier(0.2, 0, 0.1, 1);
      display: flex;
    }
    .cart.open { transform: translateY(0); }
    .cart::before {
      content: ""; position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 4px; border-radius: 2px;
      background: var(--border-strong);
    }
    .cart .ch { padding-top: 22px; }
    .cart .ch #close-sheet {
      display: grid !important;
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--surface-muted);
      place-items: center;
      color: var(--text-strong); cursor: pointer;
    }

    /* Tender single column */
    .tender { padding: 14px; }
    .tender-wrap { gap: 12px; }
    .tender .due { padding: 18px; }
    .tender .due .am { font-size: 42px; }
    .tender .due .am .c { font-size: 22px; }
    .tender .methods { padding: 14px; }
    .tender .methods h3 { margin-bottom: 10px; }
    .tender .mgrid { gap: 6px; }
    .tender .mbtn { padding: 12px 10px; gap: 4px; }
    .tender .mbtn .ic-tile { width: 28px; height: 28px; }
    .tender .mbtn .nm { font-size: 12.5px; }
    .tender .mbtn .sb { font-size: 11px; }
    .tender .work { padding: 14px; }
    .tender .keypad button { height: 40px; font-size: 15px; }
    .tender .confirm { flex-direction: column-reverse; gap: 6px; }
    .tender .confirm button { padding: 13px; }

    /* Receipt page */
    .receipt-page { padding: 14px; }
    .receipt-card { padding: 20px 16px; }
    .receipt-card h2 { font-size: 16px; }
    .receipt-card .acts { grid-template-columns: 1fr 1fr; gap: 6px; }
    .receipt-card .acts .btn.primary { grid-column: 1 / -1; padding: 13px; }

    /* Generic pages */
    .page { padding: 14px; }
    .page-h { gap: 10px; margin-bottom: 12px; }
    .page-h h2 { font-size: 19px; }
    .page-h .lede { font-size: 13px; }
    .splitp { gap: 10px; }
    .splitp .pane { padding: 12px; }

    /* Customer/refund/item: stack with drill-in navigation */
    .splitp.has-detail { grid-template-rows: auto; }

function isMobile() { return window.innerWidth <= 720; }

const NAV = [

/* === Cart helpers === */
function cartSubtotal() {
  return state.cart.lines.reduce((s, l) => l.voided ? s : s + l.qty * l.price, 0);
}
function cartDiscount() {
  const sub = cartSubtotal();
  if (!state.cart.discount) return 0;
  if (state.cart.discount.type === 'pct') return +(sub * state.cart.discount.value / 100).toFixed(2);
  return Math.min(state.cart.discount.value, sub);
}
function cartTax() {
  return +((cartSubtotal() - cartDiscount()) * 0.145).toFixed(2);
}
function cartTotal() {
  return +(cartSubtotal() - cartDiscount() + cartTax()).toFixed(2);
}
function cartCount() {
  return state.cart.lines.filter(l => !l.voided).reduce((s, l) => s + l.qty, 0);
}
function addToCart(itemId) {
  const item = CATALOG.find(i => i.id === itemId);
  if (!item || item.oos) return;
  const existing = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (existing) existing.qty += 1;
  else state.cart.lines.push({ id: item.id, sku: item.sku, name: item.name, price: item.price, qty: 1, voided: false });
  render();
  // Add flash to tile
  const tile = $(`[data-item="${itemId}"]`);
  if (tile) {
    tile.classList.add('added');
    setTimeout(() => tile.classList.remove('added'), 400);
  }
}
function updateQty(itemId, delta) {
  const line = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (!line) return;
  line.qty = Math.max(0, line.qty + delta);
  if (line.qty === 0) state.cart.lines = state.cart.lines.filter(l => l !== line);
  render();
}
function voidLine(itemId) {
  const line = state.cart.lines.find(l => l.id === itemId && !l.voided);
  if (line) { line.voided = true; render(); }
}
function clearCart() {
  state.cart = { lines: [], customerId: null, discount: null };
  render();
}

/* === Toast === */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2400);
}

/* === Modal === */
function openModal(content) { state.modal = content; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

/* === PIN modal === */
function openPinModal({ title, sub, onAccept, validPin = '4321' }) {
  let pin = '';
  let error = false;
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>${escapeHtml(title)}</h3>
        <p class="sub">${escapeHtml(sub)}</p>
        <div class="pin">
          ${[0,1,2,3].map(i => `<div class="d ${pin.length > i ? 'fill' : ''} ${error ? 'err' : ''}">${pin[i] ? '•' : ''}</div>`).join('')}
        </div>
        ${error ? `<div class="pin-err">Incorrect PIN. Try again.</div>` : ''}
        <div class="pin-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-d="${n}">${n}</button>`).join('')}
          <button class="cancel" data-cancel>Cancel</button>
          <button data-d="0">0</button>
          <button class="bksp" data-bksp>⌫</button>
        </div>
      </div>
    `);
    const modal = $('.modal');
    modal.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
      if (pin.length >= 4) return;
      pin += b.dataset.d;
      error = false;
      if (pin.length === 4) {
        setTimeout(() => {
          if (pin === validPin) { closeModal(); onAccept(); }
          else { error = true; pin = ''; paint(); }
        }, 220);
      }
      paint();
    }));
    modal.querySelector('[data-bksp]').addEventListener('click', () => { pin = pin.slice(0, -1); error = false; paint(); });
    modal.querySelector('[data-cancel]').addEventListener('click', closeModal);
  }
  paint();
}

/* === Discount modal === */
function openDiscountModal() {
  const cur = state.cart.discount;
  let type = cur ? cur.type : 'pct';
  let value = cur ? cur.value : 0;
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Apply discount</h3>
        <p class="sub">Reduces the subtotal before tax. Manager-tracked.</p>
        <div class="row">
          <div class="seg">
            <button class="${type==='pct'?'on':''}" data-t="pct">Percent</button>
            <button class="${type==='amt'?'on':''}" data-t="amt">Amount</button>
          </div>
        </div>
        <div class="row">
          <input type="number" min="0" step="0.5" value="${value}" id="dval" autofocus />

        <div class="acts">
          <button class="alt" data-clear>Remove</button>
          <button class="ok" data-ok>Apply</button>
        </div>
      </div>
    `);
    const modal = $('.modal');
    modal.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => {
      type = b.dataset.t;
      value = +modal.querySelector('#dval').value || 0;
      paint();
    }));
    modal.querySelector('[data-ok]').addEventListener('click', () => {
      const v = +modal.querySelector('#dval').value || 0;
      if (v <= 0) { state.cart.discount = null; }
      else state.cart.discount = { type, value: v };
      closeModal(); render();
      toast(v > 0 ? 'Discount applied' : 'Discount removed', 'success');
    });
    modal.querySelector('[data-clear]').addEventListener('click', () => {
      state.cart.discount = null; closeModal(); render();
    });
  }
  paint();
}

function go(route) {

function wireSale() {
  $$('[data-cat]').forEach(b => b.addEventListener('click', () => { state.category = b.dataset.cat; render(); }));
  $$('[data-item]').forEach(b => b.addEventListener('click', () => addToCart(b.dataset.item)));
  $$('[data-inc]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.inc, +1)));
  $$('[data-dec]').forEach(b => b.addEventListener('click', () => updateQty(b.dataset.dec, -1)));
  $$('[data-void]').forEach(b => b.addEventListener('click', () => openVoidFlow(b.dataset.void)));
  const inp = $('#sale-search');
  if (inp) inp.addEventListener('input', (e) => { state.search = e.target.value; render(); setTimeout(() => { const i = $('#sale-search'); if (i) { i.focus(); i.setSelectionRange(state.search.length, state.search.length); } }, 0); });
  const scan = $('#sale-scan'); if (scan) scan.addEventListener('click', () => go('item'));
  const cclr = $('#cart-clear'); if (cclr) cclr.addEventListener('click', () => { if (state.cart.lines.length === 0) return; clearCart(); toast('Cart cleared'); });
  const cl = $('#cust-link'); if (cl) cl.addEventListener('click', () => go('customer'));
  const ad = $('#act-disc'); if (ad) ad.addEventListener('click', openDiscountModal);
  const ap = $('#act-park'); if (ap) ap.addEventListener('click', () => { toast('Sale parked for later', 'success'); clearCart(); });
  const ac = $('#act-charge'); if (ac) ac.addEventListener('click', () => { state.tender = { method: 'cash', received: 0, processing: false }; go('tender'); });
  const de = $('#disc-edit'); if (de) de.addEventListener('click', openDiscountModal);
}

function openVoidFlow(itemId) {
  const line = state.cart.lines.find(l => l.id === itemId);
  if (!line) return;
  let reason = null;
  const reasons = ['Wrong item', 'Customer changed mind', 'Damaged', 'Other'];
  function paint() {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Void "${escapeHtml(line.name)}"?</h3>
        <p class="sub">Choose a reason. Supervisor PIN required.</p>
        <div class="row" style="flex-wrap: wrap;">
          ${reasons.map(r => `<button class="chip ${reason === r ? 'on' : ''}" data-r="${r}" style="padding: 6px 12px; border-radius: 9999px; background: ${reason===r?'var(--brand)':'var(--surface-muted)'}; color: ${reason===r?'#fff':'var(--text-strong)'}; font: 500 12px var(--font-sans); cursor: pointer;">${r}</button>`).join('')}
        </div>
        <div class="acts">
          <button class="alt" data-cancel>Cancel</button>
          <button class="ok" data-ok ${reason ? '' : 'disabled'} style="${reason ? '' : 'opacity:0.5; cursor:not-allowed;'}">Continue</button>
        </div>
      </div>
    `);
    const m = $('.modal');
    m.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { reason = b.dataset.r; paint(); }));
    m.querySelector('[data-cancel]').addEventListener('click', closeModal);
    m.querySelector('[data-ok]').addEventListener('click', () => {
      if (!reason) return;
      openPinModal({ title: 'Supervisor PIN', sub: 'Use 4321 for the demo.', onAccept: () => { voidLine(itemId); toast('Line voided: ' + reason, 'success'); } });
    });
  }
  paint();
}

            <button class="mbtn ${method==='card'?'on':''}" data-m="card"><span class="ic-tile" data-icon="card" data-icon-size="18"></span><span class="nm">Card</span><span class="sb">Visa · Master · ZimSwitch</span></button>

function wireTender() {
  $$('[data-m]').forEach(b => b.addEventListener('click', () => { state.tender.method = b.dataset.m; state.tender.received = 0; render(); }));
  $$('[data-tq]').forEach(b => b.addEventListener('click', () => {
    const val = b.dataset.tq;
    if (val === 'exact') state.tender.received = cartTotal();
    else state.tender.received = +val;
    render();
  }));
  $$('[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k;
    let cur = state.tender.received.toString();
    if (cur === '0') cur = '';
    if (k === 'clr') cur = '0';
    else if (k === '.' && cur.includes('.')) {}
    else cur += k;
    state.tender.received = +cur || 0;
    render();
  }));
  $$('[data-sim]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.sim === 'card-decline') { toast('Card declined. Try another method.', 'danger'); return; }
    state.tender.processing = true; render();
    setTimeout(() => completeSale(), 900);
  }));
  const cancel = $('[data-cancel]'); if (cancel) cancel.addEventListener('click', () => go('sale'));
  const ok = $('[data-confirm]'); if (ok) ok.addEventListener('click', () => {
    if (state.tender.method === 'cash' && state.tender.received < cartTotal()) return;
    state.tender.processing = true; render();
    setTimeout(() => completeSale(), 900);
  });
}

function completeSale() {
  const total = cartTotal();
  const sub = cartSubtotal();
  const tax = cartTax();
  const disc = cartDiscount();
  const change = state.tender.method === 'cash' ? state.tender.received - total : 0;
  state.lastReceipt = {
    id: 'R-' + (19500 + Math.floor(Math.random() * 100)),
    lines: state.cart.lines.filter(l => !l.voided).map(l => ({...l})),
    customer: state.cart.customerId ? CUSTOMERS.find(c => c.id === state.cart.customerId) : null,
    subtotal: sub, discount: disc, tax, total,
    method: state.tender.method, received: state.tender.received, change,
    ts: new Date().toISOString().slice(0, 16).replace('T', ' '),
  };
  // Reset cart but keep receipt
  state.cart = { lines: [], customerId: null, discount: null };
  state.tender = { method: 'cash', received: 0, processing: false };
  go('receipt');
}

/* === Cash-up === */
const DENOMS = [
  { v: 100, l: '$100' },
  { v: 50,  l: '$50'  },
  { v: 20,  l: '$20'  },
  { v: 10,  l: '$10'  },
  { v: 5,   l: '$5'   },
  { v: 2,   l: '$2'   },
  { v: 1,   l: '$1'   },
  { v: 0.5, l: '$0.50' },
  { v: 0.1, l: '$0.10' },
];
function countedTotal() {
  return DENOMS.reduce((s, d) => s + d.v * (state.shift.counted[String(d.v)] || 0), 0);
}
function renderCashup() {
  const exp = state.shift.expected;
  const expCash = exp.cash;
  const cashCounted = countedTotal();
  const variance = +(cashCounted - expCash).toFixed(2);
  const absVar = Math.abs(variance);
  let varKind = 'ok'; let varTtl = 'Within tolerance';
  if (absVar > 10) { varKind = 'bad'; varTtl = 'Over tolerance — supervisor review'; }
  else if (absVar > 2) { varKind = 'warn'; varTtl = 'Small variance — confirm count'; }
  if (absVar === 0) { varTtl = 'Exact match'; }
  const expTotal = exp.cash + exp.card + exp.mobile + exp.credit;

  return `
    <div class="cashup">
      <div class="page-h" style="margin-bottom: 16px;">
        <div style="flex:1;">
          <h2>Close shift S-2841</h2>
          <p class="lede">Count the till by denomination. Variance is compared against expected cash from receipts.</p>
        </div>
        <div style="display:flex; gap:6px; align-items: center; font: 13px var(--font-sans); color: var(--text-muted);">
          <span data-icon="clock" data-icon-size="13"></span> Opened 07:30 · 7h 14m
        </div>
      </div>
      <div class="cashup-grid">
        <div class="pane">
          <h3>Expected (from receipts) <span style="font: 11px var(--font-mono); color: var(--text-muted);">147 transactions</span></h3>
          <div class="ex-row"><span>Cash · ZWG / USD</span><span class="v">${money(exp.cash)}</span></div>
          <div class="ex-row"><span>Card · ZimSwitch</span><span class="v">${money(exp.card)}</span></div>
          <div class="ex-row"><span>Mobile · EcoCash + OneMoney</span><span class="v">${money(exp.mobile)}</span></div>
          <div class="ex-row"><span>Store credit</span><span class="v">${money(exp.credit)}</span></div>
          <div class="ex-row total"><span>Expected total</span><span class="v">${money(expTotal)}</span></div>
        </div>
        <div class="pane">
          <h3>Cash count <span style="font: 11px var(--font-mono); color: var(--text-muted);">$ counted ${money(cashCounted)}</span></h3>
          ${DENOMS.map(d => {
            const c = state.shift.counted[String(d.v)] || 0;
            const ln = d.v * c;
            return `
              <div class="den">
                <span class="dn">${d.l}</span>
                <div class="ctrl">
                  <button data-cd="dec" data-v="${d.v}">−</button>
                  <input data-ci data-v="${d.v}" type="number" min="0" value="${c}" />
                  <button data-cd="inc" data-v="${d.v}">+</button>
                </div>
                <span class="ln">${money(ln)}</span>
              </div>
            `;
          }).join('')}
        </div>
        <div class="variance ${varKind}">
          <div class="ic"><span data-icon="${varKind==='ok'?'check':varKind==='warn'?'info':'asterisk'}" data-icon-size="18"></span></div>
          <div>
            <div class="ttl">${varTtl}</div>
            <div class="sb">${variance >= 0 ? 'Over' : 'Short'} by ${money(absVar)} · tolerance is ± $10</div>
          </div>
          <div class="v">${variance >= 0 ? '+' : '–'} ${money(absVar)}</div>
        </div>
        <div class="submit">
          <button class="alt" id="cu-reset">Reset count</button>
          <button class="ok" id="cu-close">Close shift</button>
        </div>
      </div>
    </div>
  `;
}
function wireCashup() {
  $$('[data-cd]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v; const cur = state.shift.counted[v] || 0;
    state.shift.counted[v] = Math.max(0, cur + (b.dataset.cd === 'inc' ? 1 : -1));
    render();
  }));
  $$('[data-ci]').forEach(i => i.addEventListener('input', (e) => {
    state.shift.counted[i.dataset.v] = Math.max(0, +e.target.value || 0);
    // don't full re-render on input
    const tot = $('.cashup-grid .pane:nth-of-type(2) h3 span');
    if (tot) tot.textContent = '$ counted ' + money(countedTotal());
  }));
  const rst = $('#cu-reset'); if (rst) rst.addEventListener('click', () => {
    DENOMS.forEach(d => state.shift.counted[String(d.v)] = 0);
    render(); toast('Count reset');
  });
  const cls = $('#cu-close'); if (cls) cls.addEventListener('click', () => {
    const variance = countedTotal() - state.shift.expected.cash;
    if (Math.abs(variance) > 10) {
      openPinModal({ title: 'Supervisor PIN', sub: 'Variance ' + money(Math.abs(variance)) + ' exceeds tolerance. Use 4321 for demo.', onAccept: () => {
        toast('Shift closed with supervisor override', 'warn');
      }});
    } else {
      toast('Shift S-2841 closed cleanly', 'success');
    }
  });
}

function wireRoute() {
  $$('[data-go]').forEach(b => {
    if (!b._goWired) { b.addEventListener('click', (e) => { e.preventDefault(); go(b.dataset.go); }); b._goWired = true; }
  });
  switch (state.route) {
    case 'sale':     wireSale(); break;
    case 'tender':   wireTender(); break;
    case 'receipt':  wireReceipt(); break;
    case 'refund':   wireRefund(); break;
    case 'customer': wireCustomer(); break;
    case 'item':     wireItem(); break;
    case 'cashup':   wireCashup(); break;
    case 'z-report': wireZReport(); break;
  }
}

/* === Init === */
function init() {
  const r = (location.hash.replace(/^#\/?/, '') || 'sale');

    addToCart('I-012');
    addToCart('I-012');

if (document.readyState !== 'loading') init();
