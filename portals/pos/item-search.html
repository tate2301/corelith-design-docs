<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Items · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html">Sale</a>
    <a href="item-search.html" class="active">Items</a>
    <a href="refund.html">Refund</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head">
    <h1>Items</h1>
    <div class="pos-meta">Browse the seed catalog (<span id="cat-size">0</span> items). Tap to add to cart.</div>
    <a href="sale.html" class="pos-btn">Go to sale →</a>
  </div>

  <section class="pos-panel">
    <input id="catalog-search" type="search" class="pos-search"
           placeholder="Search by name, SKU or category"
           aria-label="Search items" autofocus />
    <div id="cat-filter" style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;"></div>
    <div id="catalog-grid" class="pos-cat-grid" role="list" style="margin-top:16px;"></div>
  </section>
</main>

<script type="module">
import POS from './app.js';

const search = document.getElementById('catalog-search');
const grid = document.getElementById('catalog-grid');
const catSize = document.getElementById('cat-size');
const filterRow = document.getElementById('cat-filter');
const shiftMeta = document.getElementById('shift-meta');

const all = POS.getCatalog();
catSize.textContent = all.length;
const cats = ['All', ...Array.from(new Set(all.map((i) => i.cat)))];
let activeCat = 'All';

const s = POS.getCurrentShift();
shiftMeta.innerHTML = `${s.cashier} · ${s.till} · Shift <strong>${s.id}</strong>`;

function renderFilter() {
  filterRow.innerHTML = cats.map((c) => `
    <button class="pos-btn ${c === activeCat ? 'pos-btn-primary' : ''}" data-cat="${POS.esc(c)}" type="button">${POS.esc(c)}</button>
  `).join('');
  filterRow.querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => { activeCat = b.dataset.cat; renderFilter(); render(); });
  });
}

function render() {
  const q = (search.value || '').trim().toLowerCase();
  const items = all.filter((it) => {
    if (activeCat !== 'All' && it.cat !== activeCat) return false;
    if (!q) return true;
    return it.name.toLowerCase().includes(q)
        || it.sku.toLowerCase().includes(q)
        || it.cat.toLowerCase().includes(q);
  });
  if (!items.length) {
    grid.innerHTML = `<div class="pos-empty" style="grid-column: 1 / -1;">No items match "${POS.esc(q)}"</div>`;
    return;
  }
  grid.innerHTML = items.map((it) => `
    <button class="pos-cat-tile" data-sku="${POS.esc(it.sku)}" type="button" role="listitem">
      <span class="cat">${POS.esc(it.cat)} · ${POS.esc(it.sku)}</span>
      <span class="nm">${POS.esc(it.name)}</span>
      <span class="price">$ ${it.price.toFixed(2)}</span>
    </button>
  `).join('');
  grid.querySelectorAll('button').forEach((b) => {
    b.addEventListener('click', () => {
      POS.addToCart(b.dataset.sku);
      POS.toast(`Added ${b.querySelector('.nm').textContent}`, 'success');
    });
  });
}

search.addEventListener('input', render);
renderFilter();
render();
</script>
</body>
</html>
