<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Refund · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html">Sale</a>
    <a href="item-search.html">Items</a>
    <a href="refund.html" class="active">Refund</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head">
    <h1 id="page-h">Refund a sale</h1>
    <div class="pos-meta" id="page-sub">Pick a recent sale to refund. Manager approval required.</div>
    <button class="pos-btn" id="back-btn" type="button" hidden>← Back to list</button>
  </div>

  <section id="sale-list-pane" class="pos-panel">
    <div class="pos-panel-h">
      <h2>Recent sales (last 24h)</h2>
      <span class="sb" id="sale-count"></span>
    </div>
    <div id="sale-list" class="pos-list" role="list"></div>
  </section>

  <section id="refund-pane" class="pos-panel" hidden>
    <div class="pos-panel-h">
      <h2>Pick lines to refund</h2>
      <span class="sb" id="refund-sale-meta"></span>
    </div>
    <div id="refund-lines" style="display:grid; gap:8px;"></div>
    <div class="pos-totals" style="margin-top:14px;">
      <div class="row"><span>Refund amount</span><span class="v" id="refund-total">$ 0.00</span></div>
    </div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:12px;">
      <button class="pos-btn pos-btn-quiet" id="refund-cancel" type="button">Cancel</button>
      <button class="pos-btn pos-btn-primary" id="refund-process" type="button">Process refund</button>
    </div>
  </section>
</main>

<script type="module">
import POS from './app.js';

const shiftMeta = document.getElementById('shift-meta');
const listPane = document.getElementById('sale-list-pane');
const refundPane = document.getElementById('refund-pane');
const saleList = document.getElementById('sale-list');
const saleCount = document.getElementById('sale-count');
const refundLines = document.getElementById('refund-lines');
const refundTotal = document.getElementById('refund-total');
const refundSaleMeta = document.getElementById('refund-sale-meta');
const backBtn = document.getElementById('back-btn');
const pageH = document.getElementById('page-h');
const pageSub = document.getElementById('page-sub');

const s = POS.getCurrentShift();
shiftMeta.innerHTML = `${s.cashier} · ${s.till} · Shift <strong>${s.id}</strong>`;

let pickedSaleId = null;
let pickQty = {};

function recent24h() {
  const cutoff = Date.now() - 24 * 3600 * 1000;
  return POS.getSales().filter((s) => new Date(s.at).getTime() >= cutoff);
}

function renderList() {
  const sales = recent24h();
  saleCount.textContent = `${sales.length} sale${sales.length === 1 ? '' : 's'}`;
  if (!sales.length) {
    saleList.innerHTML = `<div class="pos-empty">No sales in the last 24 hours. Make a sale on the Sale tab first.</div>`;
    return;
  }
  saleList.innerHTML = sales.map((s) => {
    const dt = new Date(s.at).toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
    return `
      <div class="pos-list-row" data-id="${POS.esc(s.id)}" role="listitem" tabindex="0">
        <div>
          <div class="nm">${POS.esc(s.id)} ${s.refunded ? '<span class="badge refunded">Refunded</span>' : ''}</div>
          <div class="sb">${dt} · ${s.lines.length} item${s.lines.length === 1 ? '' : 's'} · ${POS.labelMethod(s.payment.method)} · ${POS.esc(s.cashier)}</div>
        </div>
        <div class="v">${POS.moneyPlain(s.totals.total)}</div>
      </div>
    `;
  }).join('');
  saleList.querySelectorAll('[data-id]').forEach((r) => {
    const onPick = () => pick(r.dataset.id);
    r.addEventListener('click', onPick);
    r.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(); } });
  });
}

function pick(id) {
  const sale = POS.getSales().find((s) => s.id === id);
  if (!sale) return;
  if (sale.refunded) {
    POS.toast('This sale has already been refunded', 'warn');
    return;
  }
  pickedSaleId = id;
  pickQty = {};
  sale.lines.forEach((l) => { pickQty[l.sku] = 0; });
  pageH.textContent = `Refund ${sale.id}`;
  pageSub.textContent = '';
  backBtn.hidden = false;
  listPane.hidden = true;
  refundPane.hidden = false;
  refundSaleMeta.textContent = `${sale.lines.length} item${sale.lines.length === 1 ? '' : 's'} · ${POS.labelMethod(sale.payment.method)} · sold ${new Date(sale.at).toLocaleString('en-GB')}`;
  renderRefund();
}

function renderRefund() {
  const sale = POS.getSales().find((s) => s.id === pickedSaleId);
  if (!sale) return;
  refundLines.innerHTML = sale.lines.map((l) => `
    <div class="refund-line" data-sku="${POS.esc(l.sku)}">
      <div>
        <div class="nm">${POS.esc(l.name)}</div>
        <div class="sb">Sold ${l.qty} × $ ${l.price.toFixed(2)}</div>
      </div>
      <input type="number" min="0" max="${l.qty}" value="${pickQty[l.sku] || 0}" aria-label="Quantity to refund for ${POS.esc(l.name)}" />
      <span class="price" style="font: 600 14px/1 var(--font-mono); font-variant-numeric: tabular-nums; text-align:right; min-width:70px;">$ ${((pickQty[l.sku] || 0) * l.price).toFixed(2)}</span>
    </div>
  `).join('');
  refundLines.querySelectorAll('.refund-line').forEach((row) => {
    const sku = row.dataset.sku;
    const inp = row.querySelector('input');
    inp.addEventListener('input', () => {
      const v = Math.max(0, Math.min(parseInt(inp.value) || 0, parseInt(inp.max)));
      pickQty[sku] = v;
      inp.value = v;
      renderRefundTotal();
      const line = sale.lines.find((l) => l.sku === sku);
      row.querySelector('.price').textContent = '$ ' + (v * line.price).toFixed(2);
    });
  });
  renderRefundTotal();
}

function renderRefundTotal() {
  const sale = POS.getSales().find((s) => s.id === pickedSaleId);
  if (!sale) return;
  const amt = sale.lines.reduce((s, l) => s + (pickQty[l.sku] || 0) * l.price, 0);
  refundTotal.textContent = POS.moneyPlain(amt);
}

backBtn.addEventListener('click', () => {
  pickedSaleId = null;
  backBtn.hidden = true;
  listPane.hidden = false;
  refundPane.hidden = true;
  pageH.textContent = 'Refund a sale';
  pageSub.textContent = 'Pick a recent sale to refund. Manager approval required.';
  renderList();
});

document.getElementById('refund-cancel').addEventListener('click', () => backBtn.click());

document.getElementById('refund-process').addEventListener('click', async () => {
  const sale = POS.getSales().find((s) => s.id === pickedSaleId);
  if (!sale) return;
  const lines = sale.lines
    .map((l) => ({ ...l, qty: pickQty[l.sku] || 0 }))
    .filter((l) => l.qty > 0);
  if (!lines.length) { POS.toast('Pick at least one line to refund', 'warn'); return; }
  const ok = await POS.promptManagerPin();
  if (!ok) return;
  const updated = POS.recordRefund(sale.id, lines, sale.cashier);
  POS.toast(`Refund processed: ${POS.moneyPlain(updated.refunded.amount)}`, 'success');
  backBtn.click();
});

renderList();
</script>
</body>
</html>
