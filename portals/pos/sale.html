<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>New sale · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html" class="active">Sale</a>
    <a href="item-search.html">Items</a>
    <a href="refund.html">Refund</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head">
    <h1>New sale</h1>
    <div class="pos-meta" id="cart-summary">Cart empty</div>
  </div>

  <div class="sale-layout">
    <section class="pos-panel" aria-labelledby="catalog-h">
      <div class="pos-panel-h">
        <h2 id="catalog-h">Find an item</h2>
        <span class="sb" id="catalog-count"></span>
      </div>
      <input id="catalog-search" type="search" class="pos-search"
             placeholder="Search by name, SKU or category (mealie, sugar, oil, bread, milk…)"
             aria-label="Search items" />
      <div id="catalog-grid" class="pos-cat-grid" role="list" aria-label="Catalog"></div>
    </section>

    <aside class="pos-panel" aria-labelledby="cart-h">
      <div class="pos-panel-h">
        <h2 id="cart-h">Cart</h2>
        <button class="pos-btn pos-btn-quiet" id="cart-clear" type="button">Clear</button>
      </div>
      <div id="cart-list" class="pos-cart"></div>
      <div class="pos-totals" id="cart-totals" hidden>
        <div class="row"><span>Subtotal (excl. VAT)</span><span class="v" id="t-net">$ 0.00</span></div>
        <div class="row"><span>VAT 15%</span><span class="v" id="t-vat">$ 0.00</span></div>
        <div class="row b"><span>Total</span><span class="v" id="t-total">$ 0.00</span></div>
      </div>
      <button id="pay-btn" class="pos-pay-btn" type="button" disabled>
        <span>Take payment</span><span id="pay-total">$ 0.00</span>
      </button>
    </aside>
  </div>
</main>

<script type="module">
import POS from './app.js';

const search = document.getElementById('catalog-search');
const grid = document.getElementById('catalog-grid');
const count = document.getElementById('catalog-count');
const cartList = document.getElementById('cart-list');
const totalsBox = document.getElementById('cart-totals');
const tNet = document.getElementById('t-net');
const tVat = document.getElementById('t-vat');
const tTotal = document.getElementById('t-total');
const payTotal = document.getElementById('pay-total');
const payBtn = document.getElementById('pay-btn');
const summary = document.getElementById('cart-summary');
const clearBtn = document.getElementById('cart-clear');
const shiftMeta = document.getElementById('shift-meta');

function renderShift() {
  const s = POS.getCurrentShift();
  shiftMeta.innerHTML = `${s.cashier} · ${s.till} · Shift <strong>${s.id}</strong>`;
}

function renderCatalog() {
  const q = (search.value || '').trim().toLowerCase();
  const items = POS.getCatalog().filter((it) => {
    if (!q) return true;
    return it.name.toLowerCase().includes(q)
        || it.sku.toLowerCase().includes(q)
        || it.cat.toLowerCase().includes(q);
  });
  count.textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
  if (!items.length) {
    grid.innerHTML = `<div class="pos-empty" style="grid-column: 1 / -1;">No items match "${POS.esc(q)}"</div>`;
    return;
  }
  grid.innerHTML = items.map((it) => `
    <button class="pos-cat-tile" data-sku="${POS.esc(it.sku)}" type="button" role="listitem"
            aria-label="Add ${POS.esc(it.name)} ($ ${it.price.toFixed(2)})">
      <span class="cat">${POS.esc(it.cat)}</span>
      <span class="nm">${POS.esc(it.name)}</span>
      <span class="price">$ ${it.price.toFixed(2)}</span>
    </button>
  `).join('');
  grid.querySelectorAll('button[data-sku]').forEach((b) => {
    b.addEventListener('click', () => {
      POS.addToCart(b.dataset.sku);
      renderCart();
      POS.toast(`Added ${b.querySelector('.nm').textContent}`, 'success');
    });
  });
}

function renderCart() {
  const cart = POS.getCart();
  if (!cart.length) {
    cartList.innerHTML = `<div class="pos-empty">Tap an item to add it.</div>`;
    totalsBox.hidden = true;
    payBtn.disabled = true;
    payTotal.textContent = '$ 0.00';
    summary.textContent = 'Cart empty';
    return;
  }
  cartList.innerHTML = cart.map((l) => `
    <div class="pos-cart-line" data-sku="${POS.esc(l.sku)}">
      <div>
        <div class="nm">${POS.esc(l.name)}</div>
        <div class="sb">${POS.esc(l.sku)} · $ ${l.price.toFixed(2)} ea</div>
      </div>
      <div class="pos-qty">
        <button type="button" data-act="dec" aria-label="Decrease quantity">−</button>
        <span class="v">${l.qty}</span>
        <button type="button" data-act="inc" aria-label="Increase quantity">+</button>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <span class="price">$ ${(l.price * l.qty).toFixed(2)}</span>
        <button type="button" class="pos-rm" data-act="rm" aria-label="Remove line">×</button>
      </div>
    </div>
  `).join('');
  cartList.querySelectorAll('.pos-cart-line').forEach((row) => {
    const sku = row.dataset.sku;
    row.querySelector('[data-act="inc"]').addEventListener('click', () => {
      const line = POS.getCart().find((l) => l.sku === sku);
      POS.updateQty(sku, (line?.qty || 0) + 1); renderCart();
    });
    row.querySelector('[data-act="dec"]').addEventListener('click', () => {
      const line = POS.getCart().find((l) => l.sku === sku);
      POS.updateQty(sku, (line?.qty || 0) - 1); renderCart();
    });
    row.querySelector('[data-act="rm"]').addEventListener('click', () => {
      POS.removeFromCart(sku); renderCart();
    });
  });
  const t = POS.cartTotals(cart);
  totalsBox.hidden = false;
  tNet.textContent = POS.moneyPlain(t.net);
  tVat.textContent = POS.moneyPlain(t.vat);
  tTotal.textContent = POS.moneyPlain(t.total);
  payTotal.textContent = POS.moneyPlain(t.total);
  payBtn.disabled = false;
  const itemCount = cart.reduce((s, l) => s + l.qty, 0);
  summary.textContent = `${itemCount} item${itemCount === 1 ? '' : 's'} · ${POS.moneyPlain(t.total)}`;
}

search.addEventListener('input', renderCatalog);
clearBtn.addEventListener('click', () => { POS.clearCart(); renderCart(); });
payBtn.addEventListener('click', () => {
  POS.openPaymentPicker(() => { renderCart(); });
});

renderShift();
renderCatalog();
renderCart();
</script>
</body>
</html>
