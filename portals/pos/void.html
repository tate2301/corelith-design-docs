<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Void cart · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html">Sale</a>
    <a href="item-search.html">Items</a>
    <a href="refund.html">Refund</a>
    <a href="void.html" class="active">Void</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head">
    <h1>Void cart lines</h1>
    <div class="pos-meta">Cancel items from the active cart. Manager approval required.</div>
  </div>

  <section class="pos-panel">
    <div class="pos-panel-h">
      <h2>Active cart</h2>
      <span class="sb" id="cart-summary"></span>
    </div>
    <div id="cart-list" class="pos-cart"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:14px;">
      <a href="sale.html" class="pos-btn pos-btn-quiet">Back to sale</a>
      <button class="pos-btn pos-btn-danger" id="void-all" type="button">Void entire cart</button>
    </div>
  </section>
</main>

<script type="module">
import POS from './app.js';

const cartList = document.getElementById('cart-list');
const summary = document.getElementById('cart-summary');
const shiftMeta = document.getElementById('shift-meta');
const s = POS.getCurrentShift();
shiftMeta.innerHTML = `${s.cashier} · ${s.till} · Shift <strong>${s.id}</strong>`;

function render() {
  const cart = POS.getCart();
  if (!cart.length) {
    cartList.innerHTML = `<div class="pos-empty">The cart is empty. Nothing to void.</div>`;
    summary.textContent = '';
    return;
  }
  summary.textContent = `${cart.length} line${cart.length === 1 ? '' : 's'}`;
  cartList.innerHTML = cart.map((l) => `
    <div class="pos-cart-line" data-sku="${POS.esc(l.sku)}">
      <div>
        <div class="nm">${POS.esc(l.name)}</div>
        <div class="sb">${l.qty} × $ ${l.price.toFixed(2)}</div>
      </div>
      <span class="price">$ ${(l.price * l.qty).toFixed(2)}</span>
      <button class="pos-btn pos-btn-danger" data-act="void" type="button">Void line</button>
    </div>
  `).join('');
  cartList.querySelectorAll('[data-act="void"]').forEach((b) => {
    b.addEventListener('click', async () => {
      const sku = b.closest('.pos-cart-line').dataset.sku;
      const ok = await POS.promptManagerPin();
      if (!ok) return;
      POS.removeFromCart(sku);
      POS.toast('Line voided', 'success');
      render();
    });
  });
}

document.getElementById('void-all').addEventListener('click', async () => {
  if (!POS.getCart().length) return;
  const ok = await POS.promptManagerPin();
  if (!ok) return;
  POS.clearCart();
  POS.toast('Cart voided', 'success');
  render();
});

render();
</script>
</body>
</html>
