<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Z-reports · POS · Corelith</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="app.css" />
</head>
<body class="pos-functional">

<header class="pos-topbar">
  <a class="brand" href="index.html"><span class="mark">C</span> Corelith POS</a>
  <nav class="pos-tabs" style="border: none;">
    <a href="sale.html">Sale</a>
    <a href="item-search.html">Items</a>
    <a href="refund.html">Refund</a>
    <a href="cashup.html">Cash up</a>
    <a href="z-report.html" class="active">Z-reports</a>
  </nav>
  <span class="shift" id="shift-meta"></span>
</header>

<main class="pos-app">
  <div class="pos-app-head" id="head-block">
    <h1 id="page-h">Z-reports</h1>
    <div class="pos-meta">End-of-day summaries for each closed shift.</div>
    <div class="pos-print-actions" id="actions">
      <a href="z-report.html" class="pos-btn" id="back-link" hidden>← All Z-reports</a>
      <button class="pos-btn" id="print-btn" hidden type="button">Print summary</button>
    </div>
  </div>

  <!-- List view -->
  <section class="pos-panel" id="list-pane">
    <div class="pos-panel-h">
      <h2>Closed shifts</h2>
      <span class="sb" id="shift-count"></span>
    </div>
    <div id="shift-list" class="pos-list"></div>
  </section>

  <!-- Detail view -->
  <section id="detail-pane" hidden></section>
</main>

<script type="module">
import POS from './app.js';

const shiftMetaEl = document.getElementById('shift-meta');
const listPane = document.getElementById('list-pane');
const detailPane = document.getElementById('detail-pane');
const shiftList = document.getElementById('shift-list');
const shiftCount = document.getElementById('shift-count');
const pageH = document.getElementById('page-h');
const printBtn = document.getElementById('print-btn');
const backLink = document.getElementById('back-link');

const cur = POS.getCurrentShift();
shiftMetaEl.innerHTML = `${cur.cashier} · ${cur.till} · Shift <strong>${cur.id}</strong>`;

const url = new URL(location.href);
const targetId = url.searchParams.get('id');

function formatDateTime(iso) {
  return new Date(iso).toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function renderList() {
  const shifts = POS.getShifts();
  shiftCount.textContent = `${shifts.length} shift${shifts.length === 1 ? '' : 's'}`;
  if (!shifts.length) {
    shiftList.innerHTML = `<div class="pos-empty">No closed shifts yet. Close a shift from the Cash up tab.</div>`;
    return;
  }
  shiftList.innerHTML = shifts.map((s) => {
    const totalSales = (s.sales || []).reduce((a, r) => a + r.amount, 0);
    const methods = (s.sales || []).filter((r) => r.amount > 0).map((r) => POS.labelMethod(r.method)).join(' · ');
    const vTone = Math.abs(s.variance) < 0.005 ? 'tone-success' : (s.variance >= 0 ? 'tone-success' : 'tone-danger');
    const vLbl = Math.abs(s.variance) < 0.005 ? 'Balanced' : (s.variance >= 0 ? `+ ${POS.moneyPlain(s.variance)}` : `– $ ${Math.abs(s.variance).toFixed(2)}`);
    return `
      <a href="?id=${POS.esc(s.id)}" class="pos-list-row">
        <div>
          <div class="nm">${POS.esc(s.id)} · ${POS.esc(s.cashier)}</div>
          <div class="sb">${POS.esc(s.till)} · ${formatDateTime(s.openedAt)} → ${formatDateTime(s.closedAt)} · ${methods || 'no payments'}</div>
        </div>
        <div>
          <div class="v">${POS.moneyPlain(totalSales)}</div>
          <div class="sb" style="text-align:right; color: var(--text-muted); margin-top:2px;">
            <span class="${vTone}">${vLbl}</span>
          </div>
        </div>
      </a>
    `;
  }).join('');
}

function renderDetail(id) {
  const s = POS.getShifts().find((x) => x.id === id);
  if (!s) { renderList(); return; }
  listPane.hidden = true;
  detailPane.hidden = false;
  pageH.textContent = `Z-report ${s.id}`;
  printBtn.hidden = false;
  backLink.hidden = false;
  const sales = (s.sales || []);
  const refs = (s.refunds || []);
  const totalSales = sales.reduce((a, r) => a + r.amount, 0);
  const totalRefunds = refs.reduce((a, r) => a + r.amount, 0);
  detailPane.innerHTML = `
    <div class="zr-detail">
      <h1>Z-report ${POS.esc(s.id)}</h1>
      <div class="meta">
        ${POS.SHOP.name} · ${POS.SHOP.branch}<br />
        VAT # ${POS.SHOP.vat}<br />
        Cashier: ${POS.esc(s.cashier)} · ${POS.esc(s.till)}<br />
        Opened: ${formatDateTime(s.openedAt)}<br />
        Closed: ${formatDateTime(s.closedAt)}
      </div>

      <h3>Sales by method</h3>
      ${sales.map((r) => `<div class="zr-row"><span>${POS.labelMethod(r.method)}</span><span class="v">${POS.moneyPlain(r.amount)}</span></div>`).join('') || '<div class="zr-row"><span>No sales</span><span class="v">$ 0.00</span></div>'}
      <div class="zr-row b"><span>Total sales</span><span class="v">${POS.moneyPlain(totalSales)}</span></div>

      <h3>Refunds</h3>
      ${refs.length ? refs.map((r) => `<div class="zr-row"><span>${POS.labelMethod(r.method)} refund</span><span class="v">– ${POS.moneyPlain(r.amount)}</span></div>`).join('') : '<div class="zr-row"><span>No refunds</span><span class="v">$ 0.00</span></div>'}
      <div class="zr-row b"><span>Total refunds</span><span class="v">– ${POS.moneyPlain(totalRefunds)}</span></div>

      <h3>Cash drawer</h3>
      <div class="zr-row"><span>Opening float</span><span class="v">${POS.moneyPlain(s.openingFloat)}</span></div>
      <div class="zr-row"><span>Expected in till</span><span class="v">${POS.moneyPlain(s.expected)}</span></div>
      <div class="zr-row"><span>Counted</span><span class="v">${POS.moneyPlain(s.counted)}</span></div>
      <div class="zr-row b"><span>${Math.abs(s.variance) < 0.005 ? 'Balanced' : (s.variance >= 0 ? 'Over by' : 'Short by')}</span>
           <span class="v">${Math.abs(s.variance) < 0.005 ? '$ 0.00' : (s.variance >= 0 ? '+ ' + POS.moneyPlain(s.variance) : '– $ ' + Math.abs(s.variance).toFixed(2))}</span></div>

      <h3>Receipts</h3>
      <div class="zr-row"><span>Receipt count</span><span class="v">${s.receiptsCount || 0}</span></div>

      <div style="margin-top: 24px; text-align: center; font: 12px/1.5 var(--font-sans); color: var(--text-muted);">
        Generated ${formatDateTime(new Date().toISOString())}
      </div>
    </div>
  `;
}

printBtn.addEventListener('click', () => window.print());

if (targetId) {
  renderDetail(targetId);
} else {
  renderList();
}
</script>
</body>
</html>
