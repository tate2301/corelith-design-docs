<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Scrap Operator demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  body { background: var(--gray-100); margin: 0; }

  /* === App shell — tablet-first === */
  .sd-app {
    display: grid;
    grid-template-columns: 240px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas: "side bar" "side main";
    height: calc(100vh - 47px);
    min-height: 640px;
    background: var(--canvas);
  }
  .sd-bar {
    grid-area: bar; background: var(--surface); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; padding: 0 18px;
    font: 500 13px/1 var(--font-sans); color: var(--text-strong);
  }
  .sd-bar .br { font-weight: 600; }
  .sd-bar .sep { color: var(--text-subtle); }
  .sd-bar .pill { padding: 4px 10px; border-radius: 9999px; font: 500 11.5px/1 var(--font-sans); background: var(--surface-muted); color: var(--text-muted); display: inline-flex; align-items: center; gap: 5px; }
  .sd-bar .pill.live { background: var(--tone-success-bg); color: var(--tone-success); }
  .sd-bar .pill.off  { background: var(--tone-warn-bg);   color: var(--tone-warn); }
  .sd-bar .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .sd-bar .spacer { flex: 1; }
  .sd-bar .oper { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); }
  .sd-bar .oper .av { width: 28px; height: 28px; border-radius: 50%; background: #FFE5C8; color: #6B3F19; display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .sd-bar .bar-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 7px;
    background: var(--surface-muted); color: var(--text-strong);
    border: 0; cursor: pointer;
    font: 500 12.5px/1 var(--font-sans);
  }
  .sd-bar .bar-btn:hover { background: var(--surface-sunken); }

  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen { background: var(--ink); }
  body.is-fullscreen .sd-app { height: 100vh; height: 100dvh; }

  /* Side rail */
  .sd-side {
    grid-area: side; background: #2A1F12; color: rgba(255,255,255,0.85);
    padding: 14px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0;
  }
  .sd-side .sd-brand { display: inline-flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font: 600 14px/1 var(--font-sans); color: #fff; }
  .sd-side .sd-brand .m { color: #E2A458; }
  .sd-side .sd-h { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.4); padding: 14px 10px 6px; }
  .sd-nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px; border-radius: 7px;
    color: rgba(255,255,255,0.78); text-decoration: none;
    font: 500 13.5px/1 var(--font-sans);
    border: 0; background: transparent; cursor: pointer; width: 100%; text-align: left;
  }
  .sd-nav-item:hover { background: rgba(255,255,255,0.07); color: #fff; }
  .sd-nav-item.active { background: #E2A458; color: #2A1F12; font-weight: 600; }
  .sd-nav-item .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .sd-nav-item .tag { margin-left: auto; padding: 1px 7px; border-radius: 9999px; background: rgba(255,255,255,0.15); font: 600 10.5px/1 var(--font-mono); color: #fff; }
  .sd-nav-item.active .tag { background: rgba(42,31,18,0.18); color: #2A1F12; }
  .sd-side .sd-foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid rgba(255,255,255,0.08); font: 11.5px/1.4 var(--font-sans); color: rgba(255,255,255,0.5); }
  .sd-side .sd-foot strong { color: rgba(255,255,255,0.85); font-weight: 600; display: block; }

  .sd-main { grid-area: main; min-width: 0; min-height: 0; overflow: hidden; display: flex; }

  /* Offline banner */
  .offline-strip {
    grid-area: bar;
    align-self: end;
    position: absolute; left: 240px; right: 0; top: 47px;
    background: var(--tone-warn-bg); color: var(--tone-warn);
    padding: 5px 14px; font: 500 12px/1.3 var(--font-sans);
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--tone-warn);
    z-index: 4;
  }
  .offline-strip .q { margin-left: auto; padding: 2px 8px; border-radius: 9999px; background: rgba(229,151,18,0.18); color: var(--tone-warn); font: 600 11px/1 var(--font-mono); }
  body.is-fullscreen .offline-strip { top: 0; }

  /* === Generic page === */
  .page { width: 100%; padding: 22px 28px; overflow-y: auto; min-width: 0; }
  .page-h { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .page-h h2 { font: 700 24px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .page-h .lede { font: 14.5px/1.55 var(--font-sans); color: var(--text-muted); margin: 4px 0 0; }
  .page-h .right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; }

  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .stat-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px;
  }
  .stat-tile .lbl { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .stat-tile .v { font: 700 22px/1.15 var(--font-mono); color: var(--text-strong); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stat-tile.brand { background: #2A1F12; color: #fff; border-color: #2A1F12; }
  .stat-tile.brand .lbl { color: rgba(255,255,255,0.7); }
  .stat-tile.brand .v { color: #E2A458; }
  .stat-tile .delta { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); margin-top: 6px; }
  .stat-tile .delta.up { color: var(--tone-success); }
  .stat-tile .delta.dn { color: var(--tone-danger); }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .panel h3 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0 0 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .panel h3 .meta { font: 11.5px/1 var(--font-mono); color: var(--text-muted); }

  /* Big touch button */
  .btn-big {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 14px 18px; border-radius: 10px;
    font: 600 14.5px/1 var(--font-sans);
    background: var(--surface-muted); color: var(--text-strong);
    cursor: pointer; border: 0; min-height: 48px;
    transition: background 120ms;
  }
  .btn-big:hover { background: var(--surface-sunken); }
  .btn-big.primary { background: #E2A458; color: #2A1F12; }
  .btn-big.primary:hover { background: #D08D43; }
  .btn-big.brand { background: var(--brand); color: #fff; }
  .btn-big.brand:hover { background: var(--brand-strong); }
  .btn-big.ghost { background: transparent; border: 1px solid var(--border); }
  .btn-big.danger { background: var(--tone-danger-bg); color: var(--tone-danger); }
  .btn-big:disabled { opacity: 0.5; cursor: not-allowed; }

  .input {
    display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 42px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    font: 14px var(--font-sans);
  }
  .input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; color: var(--text-body); padding: 0; min-width: 0; }
  .input [data-icon] { color: var(--text-subtle); }
  .input:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--focus-ring-soft); }

  /* === Sign-in === */
  .signin-wrap { width: 100%; display: grid; place-items: center; padding: 24px; }
  .signin-card {
    width: 100%; max-width: 460px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px;
    padding: 32px; box-shadow: 0 18px 36px -16px rgba(22,24,29,0.18);
  }
  .signin-card .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #FFE5C8, #E2A458); color: #6B3F19; display: grid; place-items: center; margin-bottom: 18px; }
  .signin-card h2 { font: 700 22px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 6px; }
  .signin-card .sub { font: 14px/1.5 var(--font-sans); color: var(--text-muted); margin: 0 0 22px; }
  .signin-card .lbl { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; margin: 14px 0 6px; }
  .signin-card .otp { display: flex; gap: 10px; justify-content: center; margin: 12px 0; }
  .signin-card .stay { display: flex; align-items: center; gap: 8px; margin: 18px 0 0; color: var(--text-body); font: 13.5px/1.4 var(--font-sans); cursor: pointer; }
  .signin-card .stay input { width: 18px; height: 18px; }

  /* === Intake === */
  .intake { display: grid; grid-template-columns: 1.2fr 1fr; width: 100%; min-width: 0; gap: 0; }
  .intake .left { padding: 20px 22px; overflow-y: auto; min-height: 0; }
  .intake .right { background: var(--surface); border-left: 1px solid var(--border); padding: 20px 22px; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }
  .intake .step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font: 500 12px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .intake .step-head .n { width: 24px; height: 24px; border-radius: 50%; background: #E2A458; color: #2A1F12; display: grid; place-items: center; font: 700 12px/1 var(--font-mono); }
  .intake .step-h { font: 600 18px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 14px; }

  .supplier-pick { display: grid; gap: 0; max-height: 320px; overflow-y: auto; padding-right: 4px; }
  /* Avatar + selected-state additions on top of .b-row-card — kept because the warm cream highlight is the scrap-yard brand */
  .b-row-card .av { width: 38px; height: 38px; border-radius: 50%; background: #FFE5C8; color: #6B3F19; display: grid; place-items: center; font: 600 13px/1 var(--font-sans); flex: none; }
  .b-row-card.on { background: #FFF7EB; border-color: #E2A458; }

  /* Weighbridge */
  .weigh-disp {
    background: #1A1410; color: #E2A458; border-radius: 12px;
    padding: 24px; text-align: center; margin-bottom: 14px;
    font-family: var(--font-mono);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.3);
  }
  .weigh-disp .lbl { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.18em; text-transform: uppercase; color: rgba(226,164,88,0.65); }
  .weigh-disp .val { font: 700 56px/1 var(--font-mono); letter-spacing: -0.02em; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .weigh-disp .val .u { font-size: 22px; color: rgba(226,164,88,0.7); margin-left: 6px; }
  .weigh-disp .sb { font: 11.5px/1.4 var(--font-sans); color: rgba(226,164,88,0.6); }
  .weigh-disp.live .val::after { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--tone-success); margin-left: 12px; vertical-align: middle; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: 0.4; transform: scale(1.3); } }

  .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grade-tile {
    padding: 12px 10px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--border); cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 4px;
  }
  .grade-tile:hover { border-color: var(--brand-200); }
  .grade-tile.on { background: var(--brand-soft); border-color: var(--brand); }
  .grade-tile .gn { font: 600 13px/1.2 var(--font-sans); color: var(--text-strong); }
  .grade-tile .gp { font: 600 12.5px/1 var(--font-mono); color: var(--text-muted); }
  .grade-tile.on .gp { color: var(--brand-strong); }

  .photo-strip { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
  .photo-chip { width: 64px; height: 64px; border-radius: 8px; background: var(--surface-muted); border: 1px dashed var(--border-strong); display: grid; place-items: center; color: var(--text-subtle); position: relative; }
  .photo-chip.has { background: linear-gradient(135deg, #D1B69A, #6B3F19); color: #fff; border-style: solid; border-color: #6B3F19; }
  .photo-chip.has .ph-ic { color: rgba(255,255,255,0.85); }
  .photo-chip .x { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 700 10px/1 var(--font-sans); cursor: pointer; }

  /* Payout preview / receipt */
  .payout-card { background: var(--brand-soft); border: 1px solid var(--brand-200); border-radius: 12px; padding: 18px; margin-top: auto; }
  .payout-card .row { display: flex; justify-content: space-between; padding: 5px 0; font: 13.5px/1.4 var(--font-sans); color: var(--brand-strong); }
  .payout-card .row .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .payout-card .row.gr { font: 700 19px/1.2 var(--font-sans); padding-top: 10px; border-top: 1px solid var(--brand-200); margin-top: 8px; color: var(--brand-strong); }
  .payout-card .row.gr .v { font-size: 22px; }

  /* Payouts queue */
  .pq-grouping { display: grid; gap: 14px; }
  .pq-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .pq-group .gh { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-muted); border-bottom: 1px solid var(--border); }
  .pq-group .gh .nm { font: 600 14px/1 var(--font-sans); color: var(--text-strong); }
  .pq-group .gh .ct { padding: 2px 8px; border-radius: 9999px; background: var(--surface); font: 500 11.5px/1 var(--font-mono); color: var(--text-muted); }
  .pq-group .gh .total { margin-left: auto; font: 600 14px/1 var(--font-mono); color: var(--text-strong); }
  .pq-group .gh button { padding: 7px 12px; border-radius: 7px; background: var(--brand); color: #fff; font: 500 12.5px/1 var(--font-sans); cursor: pointer; border: 0; }
  .pq-group .gh button:hover { background: var(--brand-strong); }
  .pq-row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); }
  .pq-row:last-child { border-bottom: 0; }
  .pq-row input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
  .pq-row .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .pq-row .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .pq-row .ref { font: 500 11.5px/1 var(--font-mono); color: var(--text-muted); }
  .pq-row .amt { font: 600 14px/1 var(--font-mono); color: var(--text-strong); }

  /* Cash payout */
  .denom-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .denom-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; gap: 4px; cursor: pointer; }
  .denom-tile:hover { border-color: var(--brand-200); }
  .denom-tile .v { font: 700 18px/1 var(--font-mono); color: var(--text-strong); }
  .denom-tile .c { font: 500 11.5px/1 var(--font-sans); color: var(--text-muted); }
  .denom-tile .ctrl { display: flex; gap: 4px; align-items: center; margin-top: 8px; }
  .denom-tile .ctrl button { width: 32px; height: 32px; border-radius: 6px; background: var(--surface-muted); cursor: pointer; font: 600 16px/1 var(--font-mono); border: 0; color: var(--text-strong); }
  .denom-tile .ctrl input { flex: 1; height: 32px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; text-align: center; font: 500 14px var(--font-mono); }

  .sig-pad {
    width: 100%; height: 120px;
    background: repeating-linear-gradient(to right, var(--surface) 0, var(--surface) 30px, var(--surface-muted) 30px, var(--surface-muted) 31px),
                repeating-linear-gradient(to bottom, var(--surface) 0, var(--surface) 30px, var(--surface-muted) 30px, var(--surface-muted) 31px);
    border: 1px dashed var(--border-strong); border-radius: 10px;
    position: relative; cursor: crosshair; display: grid; place-items: center;
    font: 500 13px/1.4 var(--font-sans); color: var(--text-subtle);
  }
  .sig-pad.signed {
    background: var(--surface);
    color: var(--text-strong);
  }
  .sig-pad.signed::before {
    content: ''; position: absolute; left: 16px; right: 16px; bottom: 30%;
    height: 50px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 50'><path d='M5,35 Q20,5 35,28 T70,32 Q90,8 110,30 T155,28 Q175,12 195,32' stroke='%232A1F12' stroke-width='2.2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat: no-repeat;
    background-size: contain;
    background-position: center;
  }

  /* Stockpile */
  .stk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .stk-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .stk-tile .gn { font: 600 14.5px/1.2 var(--font-sans); color: var(--text-strong); }
  .stk-tile .pp { font: 12px/1 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .stk-tile .v { font: 700 24px/1 var(--font-mono); color: var(--text-strong); margin-top: 10px; font-variant-numeric: tabular-nums; }
  .stk-tile .by { display: flex; gap: 4px; margin-top: 10px; flex-wrap: wrap; }
  .stk-tile .by span { font: 500 11px/1 var(--font-mono); padding: 3px 7px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-muted); }
  .stk-tile .by span.brand { background: #FFE5C8; color: #6B3F19; }

  .move-table { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); }
  .move-table th, .move-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  .move-table th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-muted); }
  .move-table td.num, .move-table th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .move-table tr:last-child td { border-bottom: 0; }
  .move-table .badge {
    display: inline-block; padding: 2px 8px; border-radius: 9999px;
    font: 500 11px/1 var(--font-sans);
  }
  .move-table .badge.in { background: var(--tone-success-bg); color: var(--tone-success); }
  .move-table .badge.out { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .move-table .badge.mv { background: var(--brand-soft); color: var(--brand-strong); }

  /* Dispatch */
  .dispatch-grid { display: grid; grid-template-columns: 1fr 380px; gap: 16px; }
  @media (max-width: 1100px) { .dispatch-grid { grid-template-columns: 1fr; } }
  .checklist { display: grid; gap: 8px; }
  .check-row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    cursor: pointer;
  }
  .check-row .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border-strong); display: grid; place-items: center; flex: none; color: transparent; }
  .check-row.done .box { background: var(--tone-success); border-color: var(--tone-success); color: #fff; }
  .check-row .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .check-row.done .nm { text-decoration: line-through; color: var(--text-muted); }
  .check-row .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }

  /* Reports */
  .rep-table { width: 100%; border-collapse: collapse; font: 13px var(--font-sans); }
  .rep-table th, .rep-table td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border-subtle); }
  .rep-table th { font: 500 11px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); background: var(--surface-muted); }
  .rep-table td.num, .rep-table th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .rep-bar { height: 6px; background: var(--surface-muted); border-radius: 9999px; overflow: hidden; min-width: 80px; }
  .rep-bar > div { height: 100%; background: #E2A458; }

  /* Disputes */
  .disp-row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px;
    padding: 14px 16px; border-bottom: 1px solid var(--border-subtle);
    align-items: center; cursor: pointer;
  }
  .disp-row:hover { background: var(--surface-muted); }

/* === Toast === */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2400);
}

/* === Modal === */
function openModal(content) { state.modal = content; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="x-bs-scrim open" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
}

/* === PIN modal (uses .x-bottom-sheet) === */
function openPinModal({ title, sub, onAccept, validPin = '4321' }) {
  let pin = '', error = false;
  function paint() {
    openModal(`
      <div class="x-bottom-sheet" onclick="event.stopPropagation()">
        <div class="x-bs-grab"></div>
        <div class="x-bs-head">
          <h3>${escapeHtml(title)}</h3>
          <button class="x-bs-close" data-cancel aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button>
        </div>
        <div class="x-bs-body">
          <p class="sub" style="font: 13.5px/1.5 var(--font-sans); color: var(--text-muted); margin: 0 0 14px;">${escapeHtml(sub)}</p>
          <div class="otp" role="group" aria-label="4-digit PIN" style="display:flex; gap:10px; justify-content:center; margin: 6px 0 6px;">
            ${[0,1,2,3].map(i => `<input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-d="${i}" value="${pin[i] || ''}" aria-label="Digit ${i+1}" ${error ? 'aria-invalid="true"' : ''} style="width:44px; height:52px; text-align:center; font:600 22px var(--font-mono); border:1px solid var(--border); border-radius:10px; background:var(--surface);" />`).join('')}
          </div>
          ${error ? `<div class="pin-err">Incorrect PIN. Try again.</div>` : ''}
        </div>
        <div class="x-bs-foot">
          <button class="alt" data-cancel>Cancel</button>
        </div>
      </div>
    `);
    const m = $('.x-bottom-sheet');
    const cells = m.querySelectorAll('[data-d]');
    const sync = () => { pin = Array.from(cells).map(c => c.value).join('').replace(/\D/g, '').slice(0, 4); };
    cells.forEach((cell, idx) => {
      cell.addEventListener('input', (e) => {
        const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
        e.target.value = v;
        error = false;
        if (v && cells[idx + 1]) cells[idx + 1].focus();
        sync();
        if (pin.length === 4) {
          setTimeout(() => {
            if (pin === validPin) { closeModal(); onAccept(); }
            else { error = true; pin = ''; paint(); }
          }, 220);
        }
      });
      cell.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; }
      });
    });
    if (cells[pin.length] || cells[0]) (cells[pin.length] || cells[0]).focus();
    m.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', closeModal));
  }
  paint();
}

function toggleFullscreen() {
  const isFs = !!document.fullscreenElement;
  if (isFs) {
    document.exitFullscreen().catch(() => {});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen?.().catch(() => {});
  }
  render();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
    document.body.classList.remove('is-fullscreen');
    render();
  }
});

        </button>

function wireSignin() {
  const cells = $$('#signin-pin input');
  const sync = () => { state.pin = cells.map(c => c.value).join('').replace(/\D/g, '').slice(0, 4); };
  cells.forEach((cell, idx) => {
    cell.addEventListener('input', (e) => {
      const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
      e.target.value = v;
      state.pinErr = false;
      if (v && cells[idx + 1]) cells[idx + 1].focus();
      sync();
      const go_ = $('#signin-go'); if (go_) go_.disabled = state.pin.length !== 4;
    });
    cell.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; sync(); const go_ = $('#signin-go'); if (go_) go_.disabled = state.pin.length !== 4; }
      if (e.key === 'ArrowLeft' && cells[idx - 1]) cells[idx - 1].focus();
      if (e.key === 'ArrowRight' && cells[idx + 1]) cells[idx + 1].focus();
    });
    cell.addEventListener('paste', (e) => {
      const text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '').slice(0, 4);
      if (!text) return; e.preventDefault();
      text.split('').forEach((d, k) => { if (cells[k]) cells[k].value = d; });
      const last = cells[Math.min(text.length, cells.length) - 1]; if (last) last.focus();
      sync(); const go_ = $('#signin-go'); if (go_) go_.disabled = state.pin.length !== 4;
    });
  });
  const focusCell = cells[Math.min(state.pin.length, cells.length - 1)];
  if (focusCell) focusCell.focus();
  const st = $('#stay'); if (st) st.addEventListener('change', e => { state.stay = e.target.checked; });
  const go_ = $('#signin-go'); if (go_) go_.addEventListener('click', () => {
    if (state.pin !== '1234') { state.pinErr = true; state.pin = ''; render(); return; }
    state.signedIn = true;
    state.pin = '';
    toast('Signed in · welcome back ' + state.operator.name.split(' ')[0], 'success');
    go('day-open');
  });
}

function renderIntake() {
  const i = state.intake;
  const sup = i.supplierId ? findSupplier(i.supplierId) : null;

  return `
    <div class="intake">

            <p class="lede">Work down the steps. Tap the supplier, take the weight, pick the grade, snap photos, confirm.</p>

              <span class="v" style="margin-top: 4px; font-size: 17px;">${TODAY_INTAKES.length} intakes</span>

function wireIntake() {
  $$('[data-pick-sup]').forEach(b => b.addEventListener('click', () => { state.intake.supplierId = b.dataset.pickSup; render(); }));
  const ss = $('#in-sup-search');
  if (ss) ss.addEventListener('input', e => {
    state.intake.search = e.target.value;
    render();
    setTimeout(() => { const x = $('#in-sup-search'); if (x) { x.focus(); x.setSelectionRange(state.intake.search.length, state.intake.search.length); } }, 0);
  });
  const read = $('#in-read'); if (read) read.addEventListener('click', () => {
    const fake = 800 + Math.floor(Math.random() * 4200);
    state.intake.weight = fake;
    state.intake.weighLive = true;
    toast('Weighbridge steady · ' + kg(fake), 'success');
    render();
  });
  const man = $('#in-manual'); if (man) man.addEventListener('click', () => {
    const v = prompt('Type the weight by hand (kg)', state.intake.weight || '');
    if (v != null && !isNaN(+v)) { state.intake.weight = Math.max(0, +v); state.intake.weighLive = false; render(); toast('Weight saved (typed by hand)', 'warn'); }
  });
  $$('[data-grade]').forEach(b => b.addEventListener('click', () => { state.intake.gradeId = b.dataset.grade; render(); }));
  $$('[data-method]').forEach(b => b.addEventListener('click', () => { state.intake.method = b.dataset.method; render(); }));
  const rj = $('#in-reject'); if (rj) rj.addEventListener('click', () => openRejectModal());
  const ph = $('#in-photo'); if (ph) ph.addEventListener('click', () => {
    state.intake.photos.push(true);
    toast('Photo taken', 'success');
    render();
  });
  $$('[data-rm-photo]').forEach(b => b.addEventListener('click', () => {
    state.intake.photos.splice(+b.dataset.rmPhoto, 1); render();
  }));
  const cf = $('#in-confirm'); if (cf) cf.addEventListener('click', () => confirmIntake());
  const pr = $('#in-print'); if (pr) pr.addEventListener('click', () => toast('Ticket sent to the receipt printer'));
  const sm = $('#in-sms'); if (sm) sm.addEventListener('click', () => toast('SMS sent to supplier', 'success'));
}

function openRejectModal() {
  const reasons = ['Wet load · can\'t weigh', 'Dirty · oil or asbestos', 'Looks stolen', 'Wrong yard · should go to Mutare', 'Other'];
  let picked = null;
  function paint() {
    openModal(`
      <div class="x-bottom-sheet" onclick="event.stopPropagation()">
        <div class="x-bs-grab"></div>
        <div class="x-bs-head">
          <h3>Turn this load away</h3>
          <button class="x-bs-close" data-cancel aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button>
        </div>
        <div class="x-bs-body">
          <p class="sub" style="font: 13.5px/1.5 var(--font-sans); color: var(--text-muted); margin: 0 0 14px;">Goes onto the supplier's record. Boss PIN needed.</p>
          <div class="b-filter-chips" style="padding: 0; flex-wrap: wrap;">
            ${reasons.map(r => `<button type="button" class="b-fc ${picked === r ? 'on' : ''}" data-r="${r}">${escapeHtml(r)}</button>`).join('')}
          </div>
        </div>
        <div class="x-bs-foot">
          <button class="alt" data-cancel>Cancel</button>
          <button class="primary" data-ok ${picked ? '' : 'disabled'}>Turn load away</button>
        </div>
      </div>
    `);
    const m = $('.x-bottom-sheet');
    m.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => { picked = b.dataset.r; paint(); }));
    m.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', closeModal));
    m.querySelector('[data-ok]').addEventListener('click', () => {
      if (!picked) return;
      openPinModal({ title: 'Boss PIN', sub: 'Confirm you are turning this load away. Use 4321 for demo.', onAccept: () => {
        state.intake.rejectReason = picked;
        toast('Load turned away: ' + picked, 'warn'); render();
      }});
    });
  }
  paint();
}

function confirmIntake() {
  const i = state.intake;
  if (!i.supplierId || !i.weight || !i.gradeId) return;
  const grade = findGrade(i.gradeId);
  const sup = findSupplier(i.supplierId);
  const payout = grade.price * i.weight * 0.95;
  if (i.method === 'Cash') {
    state.cash.intakeId = 'IN-' + (2848 + Math.floor(Math.random() * 50));
    toast('Intake saved · take them to the cash counter', 'success');
    go('cash-payout');
  } else {
    toast(`Intake saved · ${sup.name} · ${money(payout)} by ${i.method}`, 'success');
    state.intake = { step: 1, supplierId: null, search: '', weight: 0, weighLive: true, gradeId: null, rejectReason: null, photos: [], method: state.settings.defaultMethod };
    render();
  }
}

                      <div class="nm">${escapeHtml(sup.name)}</div>

                `;
              }).join('')}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}
function wirePayouts() {
  $$('[data-pq-sel]').forEach(c => c.addEventListener('change', e => { state.payouts.selected[c.dataset.pqSel] = e.target.checked; render(); }));

function wireCashPayout() {
  $$('[data-cd]').forEach(b => b.addEventListener('click', () => {

    state.cash.counted[v] = Math.max(0, cur + (b.dataset.cd === 'inc' ? 1 : -1));
    render();
  }));
  $$('[data-ci]').forEach(i => i.addEventListener('input', e => { state.cash.counted[i.dataset.v] = Math.max(0, +e.target.value || 0); render(); }));

    state.cash = { intakeId: 'IN-2844', counted: { '20': 18, '10': 5, '5': 1, '2': 1, '1': 1 }, signed: false };
    go('intake');
  });
}

              <div class="disp-row ${state.disputeSel === d.id ? 'on' : ''}" data-disp="${d.id}">

          ${resolved.map(d => {
            const s = findSupplier(d.sup);
            return `
              <div class="disp-row resolved ${state.disputeSel === d.id ? 'on' : ''}" data-disp="${d.id}">
                <div class="icb"><span data-icon="check" data-icon-size="18"></span></div>
                <div>
                  <div class="nm">${escapeHtml(d.reason)} · ${escapeHtml(s.name)}</div>
                  <div class="sb">${d.id} · ${d.intake} · ${d.opened}</div>

        <div class="panel">

            <div style="font: 14px/1.6 var(--font-sans); color: var(--text-body); margin: 6px 0 14px;">${escapeHtml(sel.notes)}</div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px;">
              <div class="stat-tile"><div class="lbl">Supplier</div><div class="v" style="font-size: 15px; font-family: var(--font-sans);">${escapeHtml(findSupplier(sel.sup).name)}</div></div>
              <div class="stat-tile"><div class="lbl">Intake</div><div class="v">${sel.intake}</div></div>
              <div class="stat-tile"><div class="lbl">Opened</div><div class="v" style="font-size: 15px; font-family: var(--font-sans);">${escapeHtml(sel.opened)}</div></div>
              <div class="stat-tile"><div class="lbl">Status</div><div class="v" style="font-size: 15px; font-family: var(--font-sans); color: ${sel.status==='open'?'var(--tone-warn)':'var(--tone-success)'}">${sel.status}</div></div>
            </div>
            <div class="field"><label style="font: 500 11.5px var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; display:block; margin-bottom: 6px;">Notes on how it was sorted</label><textarea class="input" style="height: 80px; padding: 10px 12px; width: 100%; box-sizing: border-box;" placeholder="Weighed again on the second bridge — 840 kg confirmed. Photos attached."></textarea></div>

function wireDisputes() {
  $$('[data-disp]').forEach(b => b.addEventListener('click', () => { state.disputeSel = b.dataset.disp; render(); }));

/* === Init === */
function init() {
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  const r = (location.hash.replace(/^#\/?/, '') || 'signin');
  state.route = r;
  // Most demos want to land in the app — auto-sign-in if route is anything except signin
  if (r !== 'signin') { state.signedIn = true; }
  render();
}

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
