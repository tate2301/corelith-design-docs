<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Directory · Staff portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="app.js"></script>
<style>
  body { background: var(--gray-100); margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; }
  .device-desktop { width: 1280px; max-width: 100%; border-radius: 12px; background: #1A1D24; padding: 0; box-shadow: 0 30px 60px -20px rgba(22,24,29,0.25), 0 0 0 1px rgba(22,24,29,0.1); overflow: hidden; }
  .chrome { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: #1A1D24; }
  .chrome .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
  .chrome .dot.r { background: #FF5F57; } .chrome .dot.y { background: #FEBC2E; } .chrome .dot.g { background: #28C840; }
  .chrome .url { margin-left: 14px; padding: 4px 12px; background: rgba(255,255,255,0.06); border-radius: 4px; color: #aaa; font: 12px/1 var(--font-mono); }

  .st-app { display: grid; grid-template-columns: 220px 1fr 340px; height: 760px; background: var(--canvas); }

  .st-nav { background: var(--canvas); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .st-nav .brand { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px; font: 600 15px/1 var(--font-sans); color: var(--text-strong); margin-bottom: 12px; text-decoration: none; }
  .st-nav .brand .mark { width: 22px; height: 22px; color: var(--brand); }
  .st-nav nav { display: grid; gap: 2px; }
  .st-nav nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font: 500 13.5px/1 var(--font-sans); color: var(--text-body); text-decoration: none; }
  .st-nav nav a:hover { background: var(--surface-muted); }
  .st-nav nav a.active { background: var(--brand-soft); color: var(--brand-strong); }
  .st-nav .foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .st-nav .foot .av { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .st-nav .foot .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .st-nav .foot .sb { font: 11px/1.2 var(--font-sans); color: var(--text-muted); }

  .st-main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .st-top { padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .st-top h1 { font: 700 20px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search input { width: 100%; height: 38px; padding: 0 12px 0 38px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font: 14px var(--font-sans); outline: none; box-sizing: border-box; }
  .search > [data-icon] { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-subtle); }
  .st-top .pill { padding: 4px 11px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-muted); font: 500 12px/1 var(--font-sans); }

  .group-h { padding: 14px 24px 6px; font: 600 11px/1 var(--font-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--text-subtle); }

  .grid { padding: 6px 24px 24px; flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: start; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--brand-200); transform: translateY(-1px); }
  .card .head { display: flex; align-items: center; gap: 12px; }
  .card .av { width: 44px; height: 44px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 14px/1 var(--font-sans); flex: none; }
  .card .nm { font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .card .rl { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 5px; }
  .card .pill { padding: 3px 8px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-muted); font: 500 11px/1 var(--font-sans); }

  /* Detail */
  .det { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .det-empty { padding: 60px 28px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .det-hero { padding: 24px 22px 18px; background: linear-gradient(135deg, var(--brand-soft) 0%, #FFE5C8 100%); border-bottom: 1px solid var(--border-subtle); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
  .det-hero .av { width: 76px; height: 76px; border-radius: 50%; background: #fff; color: var(--brand-strong); display: grid; place-items: center; font: 600 24px/1 var(--font-sans); border: 3px solid #fff; box-shadow: 0 4px 10px -4px rgba(0,0,0,0.2); }
  .det-hero .nm { font: 700 19px/1.2 var(--font-sans); color: var(--text-strong); }
  .det-hero .rl { font: 13px/1.3 var(--font-sans); color: var(--text-muted); }
  .det-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); }
  .det-acts a { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 6px; border-radius: 10px; background: var(--surface-muted); color: var(--text-strong); text-decoration: none; font: 500 11.5px/1 var(--font-sans); }
  .det-acts a:hover { background: var(--brand-soft); color: var(--brand-strong); }
  .det-section { padding: 14px 22px; border-bottom: 1px solid var(--border-subtle); }
  .det-section:last-child { border-bottom: 0; }
  .det-section .sh { font: 500 10px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 8px; }
  .kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font: 13px/1.4 var(--font-sans); }
  .kv .k { color: var(--text-muted); }
  .kv .v { color: var(--text-strong); font-weight: 500; word-break: break-word; }
  .kv .v.mono { font-family: var(--font-mono); }

  @media (max-width: 720px) {
    .st-app { grid-template-columns: 1fr !important; }
    .det { display: none; }
    .det.mobile-open { display: flex; position: fixed; inset: 0; z-index: 60; background: var(--surface); }
    .det.mobile-open .close-mobile { display: inline-flex; }
  }
  .det .close-mobile { display: none; position: absolute; top: 12px; right: 12px; border: 0; background: rgba(255,255,255,0.85); border-radius: 50%; width: 32px; height: 32px; align-items: center; justify-content: center; cursor: pointer; }
</style>
</head>
<body data-portal-kit="staff" data-portal-screen="directory">

<div class="device-desktop">
  <div class="chrome">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="url">https://staff.huchu.app / Directory</span>
  </div>

  <div class="st-app">

    <aside class="st-nav">
      <a class="brand" href="index.html"><span class="mark" data-icon="corelith"></span> Huchu Staff</a>
      <nav>
        <a href="dashboard.html"><span data-icon="home"></span> Home</a>
        <a href="payslip.html"><span data-icon="card"></span> My pay</a>
        <a href="leave.html"><span data-icon="calendar"></span> Leave</a>
        <a href="time-clock.html"><span data-icon="clock"></span> Time</a>
        <a href="directory.html" class="active"><span data-icon="user"></span> Directory</a>
      </nav>
      <div class="foot">
        <span class="av" id="user-initials">CM</span>
        <div>
          <div class="nm" id="user-name">Chipo Mutasa</div>
          <div class="sb">Branch supervisor</div>
        </div>
      </div>
    </aside>

    <section class="st-main">
      <header class="st-top">
        <h1>Directory</h1>
        <div class="search">
          <span data-icon="search"></span>
          <input id="search-input" placeholder="Search by name, role, department…" autocomplete="off" />
        </div>
        <span class="pill" id="count-pill">0 people</span>
      </header>

      <div id="results"></div>
    </section>

    <aside class="det" id="detail">
      <div class="det-empty">
        Select a colleague to see their contact card.
      </div>
    </aside>
  </div>
</div>

<nav class="staff-mobile-tabs">
  <a href="dashboard.html"><span data-icon="home"></span>Home</a>
  <a href="payslip.html"><span data-icon="card"></span>Pay</a>
  <a href="leave.html"><span data-icon="calendar"></span>Leave</a>
  <a href="time-clock.html"><span data-icon="clock"></span>Time</a>
  <a href="directory.html" class="active"><span data-icon="user"></span>Directory</a>
</nav>

<script>
(function () {
  const $ = (sel) => document.querySelector(sel);

  const user = Staff.user();
  $('#user-initials').textContent = user.initials;
  $('#user-name').textContent = user.name;

  let query = '';
  let selectedId = null;

  function filtered() {
    const all = Staff.directory().slice().sort((a, b) => a.name.localeCompare(b.name));
    if (!query) return all;
    const q = query.toLowerCase();
    return all.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.role.toLowerCase().includes(q) ||
      p.dept.toLowerCase().includes(q) ||
      p.branch.toLowerCase().includes(q)
    );
  }

  function renderList() {
    const list = filtered();
    $('#count-pill').textContent = list.length + (list.length === 1 ? ' person' : ' people');

    const container = $('#results');
    container.innerHTML = '';

    if (!list.length) {
      container.innerHTML = '<div class="empty">No colleagues match "' + (query.replace(/</g,'&lt;')) + '".</div>';
      return;
    }

    // Group alphabetically by first letter
    const grouped = {};
    list.forEach(p => {
      const k = p.name[0].toUpperCase();
      (grouped[k] = grouped[k] || []).push(p);
    });
    const letters = Object.keys(grouped).sort();
    letters.forEach(letter => {
      const groupH = document.createElement('div');
      groupH.className = 'group-h';
      groupH.textContent = letter;
      container.appendChild(groupH);
      const grid = document.createElement('div');
      grid.className = 'grid';
      grouped[letter].forEach(p => {
        const card = document.createElement('div');
        card.className = 'card' + (selectedId === p.id ? ' selected' : '');
        card.innerHTML =
          '<div class="head">' +
          '  <span class="av">' + p.initials + '</span>' +
          '  <div>' +
          '    <div class="nm">' + p.name + '</div>' +
          '    <div class="rl">' + p.role + '</div>' +
          '  </div>' +
          '</div>' +
          '<div class="meta">' +
          '  <span class="pill">' + p.dept + '</span>' +
          '  <span class="pill">' + p.branch + '</span>' +
          '</div>';
        card.addEventListener('click', () => select(p.id));
        grid.appendChild(card);
      });
      container.appendChild(grid);
    });
    if (window.Icons) Icons.render(container);
  }

  function renderDetail() {
    const det = $('#detail');
    if (!selectedId) {
      det.innerHTML = '<div class="det-empty">Select a colleague to see their contact card.</div>';
      return;
    }
    const p = Staff.directoryById(selectedId);
    if (!p) { det.innerHTML = '<div class="det-empty">Not found.</div>'; return; }
    det.innerHTML =
      '<button class="close-mobile" id="close-detail" aria-label="Close">&times;</button>' +
      '<div class="det-hero">' +
      '  <span class="av">' + p.initials + '</span>' +
      '  <div class="nm">' + p.name + '</div>' +
      '  <div class="rl">' + p.role + ' · ' + p.branch + '</div>' +
      '</div>' +
      '<div class="det-acts">' +
      '  <a href="tel:' + p.phone.replace(/\s/g, '') + '"><span data-icon="phone" data-icon-size="16"></span> Call</a>' +
      '  <a href="mailto:' + p.email + '"><span data-icon="mail" data-icon-size="16"></span> Message</a>' +
      '</div>' +
      '<div class="det-section">' +
      '  <div class="sh">Contact</div>' +
      '  <div class="kv">' +
      '    <div class="k">Phone</div><div class="v mono">' + p.phone + '</div>' +
      '    <div class="k">Email</div><div class="v">' + p.email + '</div>' +
      '    <div class="k">Office</div><div class="v">' + p.office + '</div>' +
      '  </div>' +
      '</div>' +
      '<div class="det-section">' +
      '  <div class="sh">Role &amp; reporting</div>' +
      '  <div class="kv">' +
      '    <div class="k">Department</div><div class="v">' + p.dept + '</div>' +
      '    <div class="k">Branch</div><div class="v">' + p.branch + '</div>' +
      '    <div class="k">Manager</div><div class="v">' + p.manager + '</div>' +
      '    <div class="k">Employee ID</div><div class="v mono">' + p.id + '</div>' +
      '  </div>' +
      '</div>';

    det.classList.add('mobile-open');
    const closeBtn = document.getElementById('close-detail');
    if (closeBtn) closeBtn.addEventListener('click', () => {
      selectedId = null;
      det.classList.remove('mobile-open');
      renderDetail(); renderList();
    });
    if (window.Icons) Icons.render(det);
  }

  function select(id) {
    selectedId = id;
    renderList();
    renderDetail();
  }

  $('#search-input').addEventListener('input', (e) => {
    query = e.target.value.trim();
    renderList();
  });

  renderList();
  renderDetail();
})();
</script>

</body>
</html>
