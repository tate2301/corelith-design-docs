<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Payslip · Staff portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="app.js"></script>
<style>
  body { background: var(--gray-100); margin: 0; padding: 24px; min-height: 100vh; display: grid; place-items: center; }
  .device-desktop { width: 1280px; max-width: 100%; border-radius: 12px; background: #1A1D24; padding: 0; box-shadow: 0 30px 60px -20px rgba(22,24,29,0.25), 0 0 0 1px rgba(22,24,29,0.1); overflow: hidden; }
  .chrome { height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 14px; background: #1A1D24; }
  .chrome .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
  .chrome .dot.r { background: #FF5F57; } .chrome .dot.y { background: #FEBC2E; } .chrome .dot.g { background: #28C840; }
  .chrome .url { margin-left: 14px; padding: 4px 12px; background: rgba(255,255,255,0.06); border-radius: 4px; color: #aaa; font: 12px/1 var(--font-mono); }

  .st-app { display: grid; grid-template-columns: 240px 1fr; height: 760px; background: var(--canvas); }
  .st-nav { background: var(--canvas); border-right: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .st-nav .brand { display: inline-flex; align-items: center; gap: 10px; padding: 6px 8px; font: 600 15px/1 var(--font-sans); color: var(--text-strong); margin-bottom: 12px; text-decoration: none; }
  .st-nav .brand .mark { width: 22px; height: 22px; color: var(--brand); }
  .st-nav nav { display: grid; gap: 2px; }
  .st-nav nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; font: 500 13.5px/1 var(--font-sans); color: var(--text-body); text-decoration: none; }
  .st-nav nav a:hover { background: var(--surface-muted); }
  .st-nav nav a.active { background: var(--brand-soft); color: var(--brand-strong); }
  .st-nav .foot { margin-top: auto; padding: 12px 10px 4px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .st-nav .foot .av { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; font: 600 12px/1 var(--font-sans); }
  .st-nav .foot .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .st-nav .foot .sb { font: 11px/1.2 var(--font-sans); color: var(--text-muted); }

  .st-main { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .st-top { padding: 16px 28px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  .st-top .crumbs { font: 500 12px/1 var(--font-sans); color: var(--text-muted); margin-bottom: 4px; }
  .st-top h1 { font: 700 22px/1.2 var(--font-sans); letter-spacing: -0.015em; color: var(--text-strong); margin: 0; }
  .st-top .meta { flex: 1; }

  .st-body { flex: 1; overflow-y: auto; padding: 22px 28px 28px; display: flex; flex-direction: column; gap: 22px; }

  /* List view */
  .ps-list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .ps-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 18px; padding: 14px 20px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; }
  .ps-row:last-child { border-bottom: 0; }
  .ps-row:hover { background: var(--surface-muted); }
  .ps-row .month { font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .ps-row .sub { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .ps-row .net { font: 700 17px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .ps-row .gross { font: 12px/1 var(--font-mono); color: var(--text-muted); margin-top: 3px; }
  .ps-row .badge { padding: 4px 10px; border-radius: 9999px; background: var(--tone-success-bg); color: var(--tone-success); font: 500 11.5px/1 var(--font-sans); }
  .ps-row .arrow { color: var(--text-muted); }

  /* Detail view */
  .meta-strip { display: flex; flex-wrap: wrap; gap: 22px; padding: 14px 18px; background: var(--surface-muted); border-radius: 12px; }
  .meta-strip > div { display: flex; flex-direction: column; gap: 2px; }
  .meta-strip .lb { font: 500 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); }
  .meta-strip .vl { font: 600 13px/1.2 var(--font-sans); color: var(--text-strong); }
  .meta-strip .vl.mono { font-family: var(--font-mono); }

  .big-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .big { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .big .lb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-subtle); }
  .big .vl { font: 700 30px/1 var(--font-sans); font-variant-numeric: tabular-nums; color: var(--text-strong); letter-spacing: -0.02em; }
  .big .sb { font: 12.5px/1.4 var(--font-sans); color: var(--text-muted); }
  .big.net { background: linear-gradient(135deg, var(--brand-strong), var(--brand)); border-color: transparent; color: #fff; }
  .big.net .lb, .big.net .vl, .big.net .sb { color: #fff; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-h { padding: 14px 18px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: center; gap: 10px; }
  .panel-h h2 { font: 600 14px/1 var(--font-sans); color: var(--text-strong); margin: 0; }
  .panel-h .sp { flex: 1; }
  .panel-h .tot { font: 600 14px/1 var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }

  table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.tbl th { background: var(--surface-muted); font: 500 11px/1.2 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); text-align: left; padding: 10px 18px; border-bottom: 1px solid var(--border-subtle); }
  table.tbl th.r, table.tbl td.r { text-align: right; }
  table.tbl td { padding: 11px 18px; border-bottom: 1px solid var(--border-subtle); color: var(--text-body); font: 13px/1.3 var(--font-sans); }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl .nm { font: 500 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  table.tbl .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  table.tbl .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--text-strong); }
  table.tbl tr.foot td { background: var(--surface-muted); font-weight: 600; color: var(--text-strong); }
</style>
</head>
<body data-portal-kit="staff" data-portal-screen="payslip">

<div class="device-desktop">
  <div class="chrome">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="url" id="chrome-url">https://staff.huchu.app / Payslips</span>
  </div>

  <div class="st-app">

    <aside class="st-nav">
      <a class="brand" href="index.html"><span class="mark" data-icon="corelith"></span> Huchu Staff</a>
      <nav>
        <a href="dashboard.html"><span data-icon="home"></span> Home</a>
        <a href="payslip.html" class="active"><span data-icon="card"></span> My pay</a>
        <a href="leave.html"><span data-icon="calendar"></span> Leave</a>
        <a href="time-clock.html"><span data-icon="clock"></span> Time</a>
        <a href="directory.html"><span data-icon="user"></span> Directory</a>
      </nav>
      <div class="foot">
        <span class="av" id="user-initials">CM</span>
        <div>
          <div class="nm" id="user-name">Chipo Mutasa</div>
          <div class="sb" id="user-meta">EMP-00284 · Park Centre</div>
        </div>
      </div>
    </aside>

    <section class="st-main">
      <header class="st-top">
        <div class="meta">
          <div class="crumbs" id="crumbs">Staff · My pay</div>
          <h1 id="page-title">My pay</h1>
        </div>
        <button class="btn btn-secondary" id="back-btn" style="display:none;"><span data-icon="arrow" data-icon-size="14"></span> Back to list</button>
        <button class="btn btn-primary" id="print-btn" style="display:none;"><span data-icon="print" data-icon-size="14"></span> Download PDF</button>
      </header>

      <div class="st-body" id="body">
        <!-- Hydrated by JS: either list or detail -->
      </div>
    </section>
  </div>
</div>

<nav class="staff-mobile-tabs">
  <a href="dashboard.html"><span data-icon="home"></span>Home</a>
  <a href="payslip.html" class="active"><span data-icon="card"></span>Pay</a>
  <a href="leave.html"><span data-icon="calendar"></span>Leave</a>
  <a href="time-clock.html"><span data-icon="clock"></span>Time</a>
  <a href="directory.html"><span data-icon="user"></span>Directory</a>
</nav>

<script>
(function () {
  const $ = (sel) => document.querySelector(sel);
  const body = $('#body');
  const user = Staff.user();
  $('#user-initials').textContent = user.initials;
  $('#user-name').textContent = user.name;
  $('#user-meta').textContent = user.empId + ' · ' + user.branch;

  const params = new URLSearchParams(location.search);
  const id = params.get('id');

  if (id) {
    renderDetail(id);
  } else {
    renderList();
  }

  function renderList() {
    $('#crumbs').textContent = 'Staff · My pay';
    $('#page-title').textContent = 'My pay';
    $('#chrome-url').textContent = 'https://staff.huchu.app / Payslips';
    $('#back-btn').style.display = 'none';
    $('#print-btn').style.display = 'none';

    const slips = Staff.payslips();
    if (!slips.length) {
      body.innerHTML = '<div class="empty">No payslips yet.</div>';
      return;
    }
    body.innerHTML = '<div class="ps-list" id="ps-list"></div>';
    const list = $('#ps-list');
    slips.forEach(p => {
      const row = document.createElement('div');
      row.className = 'ps-row';
      row.innerHTML = '' +
        '<div>' +
        '  <div class="month">' + p.periodLabel + '</div>' +
        '  <div class="sub">Pay date ' + Staff.fmtDate(p.payDate) + ' · ' + user.bank + '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
        '  <div class="net">' + Staff.fmtMoney(p.net) + '</div>' +
        '  <div class="gross">Gross ' + Staff.fmtMoney(p.gross) + '</div>' +
        '</div>' +
        '<span class="badge">' + p.status + '</span>' +
        '<span class="arrow" data-icon="chevron"></span>';
      row.addEventListener('click', () => { location.href = 'payslip.html?id=' + encodeURIComponent(p.id); });
      list.appendChild(row);
    });
    if (window.Icons) Icons.render(body);
  }

  function renderDetail(slipId) {
    const slip = Staff.payslipById(slipId);
    if (!slip) { renderList(); return; }
    $('#crumbs').textContent = 'Staff · My pay · ' + slip.periodLabel;
    $('#page-title').textContent = slip.periodLabel + ' payslip';
    $('#chrome-url').textContent = 'https://staff.huchu.app / Payslips / ' + slip.periodLabel;
    $('#back-btn').style.display = '';
    $('#print-btn').style.display = '';
    $('#back-btn').onclick = () => { location.href = 'payslip.html'; };
    $('#print-btn').onclick = () => { window.print(); };

    const e = slip.earnings, d = slip.deductions;
    body.innerHTML = '' +
      '<div class="meta-strip">' +
      '  <div><span class="lb">Employee</span><span class="vl">' + user.name + ' · ' + user.empId + '</span></div>' +
      '  <div><span class="lb">Period</span><span class="vl">' + Staff.fmtDate(slip.periodStart) + ' – ' + Staff.fmtDate(slip.periodEnd) + '</span></div>' +
      '  <div><span class="lb">Pay date</span><span class="vl">' + Staff.fmtDate(slip.payDate) + '</span></div>' +
      '  <div><span class="lb">Bank</span><span class="vl mono">' + user.bank + '</span></div>' +
      '  <div><span class="lb">Tax code</span><span class="vl mono">PAYE-2026</span></div>' +
      '  <div><span class="lb">Currency</span><span class="vl">USD</span></div>' +
      '</div>' +
      '<div class="big-grid">' +
      '  <div class="big">' +
      '    <span class="lb">Gross earnings</span>' +
      '    <span class="vl">' + Staff.fmtMoney(slip.gross) + '</span>' +
      '    <span class="sb">Basic, allowances' + (e.overtime > 0 ? ', overtime' : '') + '</span>' +
      '  </div>' +
      '  <div class="big">' +
      '    <span class="lb">Total deductions</span>' +
      '    <span class="vl">' + Staff.fmtMoney(d.total) + '</span>' +
      '    <span class="sb">PAYE, NSSA, AIDS levy, medical, pension, union</span>' +
      '  </div>' +
      '  <div class="big net">' +
      '    <span class="lb">Net pay</span>' +
      '    <span class="vl">' + Staff.fmtMoney(slip.net) + '</span>' +
      '    <span class="sb">Pays ' + Staff.fmtDate(slip.payDate) + ' into ' + user.bank + '</span>' +
      '  </div>' +
      '</div>' +
      '<div class="grid-2">' +
      '  <div class="panel">' +
      '    <div class="panel-h"><h2>Earnings</h2><div class="sp"></div><span class="tot">' + Staff.fmtMoney(slip.gross) + '</span></div>' +
      '    <table class="tbl">' +
      '      <thead><tr><th>Item</th><th class="r">Amount</th></tr></thead>' +
      '      <tbody>' +
      '        <tr><td><div class="nm">Basic salary</div><div class="sb">Branch supervisor · grade B4</div></td><td class="r num">' + Staff.fmtMoney(e.basic).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Housing allowance</div><div class="sb">Park Centre band</div></td><td class="r num">' + Staff.fmtMoney(e.housing).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Transport allowance</div><div class="sb">Monthly fixed</div></td><td class="r num">' + Staff.fmtMoney(e.transport).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Lunch allowance</div><div class="sb">Daily meal allowance</div></td><td class="r num">' + Staff.fmtMoney(e.lunch).replace('$ ', '') + '</td></tr>' +
      (e.overtime > 0 ? '        <tr><td><div class="nm">Overtime</div><div class="sb">Approved extra hours</div></td><td class="r num">' + Staff.fmtMoney(e.overtime).replace('$ ', '') + '</td></tr>' : '') +
      '        <tr class="foot"><td>Gross earnings</td><td class="r num">' + Staff.fmtMoney(slip.gross).replace('$ ', '') + '</td></tr>' +
      '      </tbody>' +
      '    </table>' +
      '  </div>' +
      '  <div class="panel">' +
      '    <div class="panel-h"><h2>Deductions</h2><div class="sp"></div><span class="tot" style="color: var(--tone-danger);">– ' + Staff.fmtMoney(d.total) + '</span></div>' +
      '    <table class="tbl">' +
      '      <thead><tr><th>Item</th><th class="r">Amount</th></tr></thead>' +
      '      <tbody>' +
      '        <tr><td><div class="nm">PAYE</div><div class="sb">ZIMRA · tiered bands</div></td><td class="r num">' + Staff.fmtMoney(d.paye).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">NSSA</div><div class="sb">4.5% of basic</div></td><td class="r num">' + Staff.fmtMoney(d.nssa).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">AIDS levy</div><div class="sb">3% of PAYE</div></td><td class="r num">' + Staff.fmtMoney(d.aidsLevy).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Medical aid (PSMAS)</div><div class="sb">Family plan · employee share</div></td><td class="r num">' + Staff.fmtMoney(d.medical).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Pension</div><div class="sb">Old Mutual group · 5% of basic</div></td><td class="r num">' + Staff.fmtMoney(d.pension).replace('$ ', '') + '</td></tr>' +
      '        <tr><td><div class="nm">Union dues</div><div class="sb">Commercial workers union</div></td><td class="r num">' + Staff.fmtMoney(d.union).replace('$ ', '') + '</td></tr>' +
      '        <tr class="foot"><td>Total deductions</td><td class="r num">' + Staff.fmtMoney(d.total).replace('$ ', '') + '</td></tr>' +
      '      </tbody>' +
      '    </table>' +
      '  </div>' +
      '</div>';
    if (window.Icons) Icons.render(body);
  }
})();
</script>

</body>
</html>
