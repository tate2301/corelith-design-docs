<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Stash · Save and track your money</title>
<!-- Stash — mobile-first personal savings + expense tracking. Dark default. Copilot-Money-inspired. -->

<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<script src="app.js" defer></script>
<link rel="stylesheet" href="app.css" />
<style>
  /* ============================================================
     STASH — Personal savings + expense tracking
     Mobile-first. Dark default. Quiet surfaces. Big numbers.
     Inspired by Copilot Money.
     All component CSS reuses the design-system tokens & blocks;
     anything bespoke is scoped to body[data-kit-nav="stash"].
     ============================================================ */

  :root {
    --st-bg:        #0B0D11;
    --st-bg-soft:   #11141A;
    --st-surface:   #15181F;
    --st-surface-2: #1B1F27;
    --st-surface-3: #232832;
    --st-border:    rgba(255,255,255,0.06);
    --st-border-2:  rgba(255,255,255,0.10);
    --st-text:      #E5E8EE;
    --st-text-mute: rgba(229,232,238,0.62);
    --st-text-sub:  rgba(229,232,238,0.38);
    --st-brand:     #7CC4A9;       /* mint / Copilot accent */
    --st-brand-2:   #5BAA8B;
    --st-brand-soft:rgba(124,196,169,0.16);
    --st-good:      #5BAA8B;
    --st-good-soft: rgba(91,170,139,0.14);
    --st-warn:      #E0B45D;
    --st-warn-soft: rgba(224,180,93,0.16);
    --st-bad:       #E07472;
    --st-bad-soft:  rgba(224,116,114,0.14);
    --st-info:      #6FB1E0;
    --st-info-soft: rgba(111,177,224,0.14);
    --st-purple:    #B49CE8;
    --st-purple-soft: rgba(180,156,232,0.14);
    --st-orange:    #E8A56E;
    --st-orange-soft: rgba(232,165,110,0.14);
    --st-pink:      #E08CB5;
    --st-pink-soft: rgba(224,140,181,0.14);
    --tap: 44px;
  }

  html, body { margin: 0; padding: 0; }
  body {
    background: var(--st-bg);
    color: var(--st-text);
    font-family: var(--font-sans);
    -webkit-tap-highlight-color: transparent;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum';
  }

  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .st-app { height: 100vh; height: 100dvh; }

  /* ===== PHONE LAYOUT ===== */
  .st-app {
    display: flex; flex-direction: column;
    background: var(--st-bg); color: var(--st-text);
    min-height: calc(100vh - 47px); min-height: calc(100dvh - 47px);
  }
  body.is-fullscreen .st-app { min-height: 100vh; min-height: 100dvh; }
  .st-side { display: none; }

  /* Top bar */
  .st-bar {
    position: sticky; top: 0; z-index: 40;
    background: var(--st-bg-soft);
    border-bottom: 1px solid var(--st-border);
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
    font: 500 13px/1 var(--font-sans);
    color: var(--st-text);
    min-height: 48px;
  }
  .st-bar .br { font: 600 14px/1.2 var(--font-sans); color: #fff; display:inline-flex; align-items:center; gap:6px; }
  .st-bar .br .mk { color: var(--st-brand); }
  .st-bar .sub { font: 11.5px/1.2 var(--font-sans); color: var(--st-text-mute); margin-top: 2px; }
  .st-bar .who-w { flex: 1; min-width: 0; }
  .st-bar .bar-btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: var(--tap); min-height: var(--tap);
    padding: 8px; border-radius: 9px;
    background: transparent; color: var(--st-text);
    border: 0; cursor: pointer;
  }
  .st-bar .bar-btn:hover { background: rgba(255,255,255,0.06); }
  .st-bar .bar-btn-label { display: none; }

  /* Main scroll area */
  .st-main {
    flex: 1; min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--st-bg);
    padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
  }
  .st-page { padding: 14px 12px 22px; }
  .st-page-head { margin-bottom: 14px; }
  .st-page-head .crumb { font: 500 11px/1 var(--font-sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--st-text-sub); }
  .st-page-head h2 { font: 700 22px/1.15 var(--font-sans); color: #fff; margin: 6px 0 0; letter-spacing: -0.018em; }
  .st-page-head .sub { font: 13.5px/1.5 var(--font-sans); color: var(--st-text-mute); margin-top: 6px; max-width: 640px; }
  .st-page-head .head-acts { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }

  /* Section title between cards */
  .st-sect-h {
    display: flex; align-items: center; gap: 8px;
    margin: 18px 0 8px;
    font: 600 13px/1 var(--font-sans); color: #fff;
  }
  .st-sect-h .lbl { letter-spacing: 0.02em; }
  .st-sect-h .sp { flex: 1; }
  .st-sect-h .lk { font: 500 12px/1 var(--font-sans); color: var(--st-brand); cursor: pointer; background:transparent; border:0; padding:6px 0; }

  /* ===== Bottom tabs — dark-theme overrides for design-system .b-bottom-tabs ===== */
  .b-bottom-tabs {
    background: rgba(11,13,17,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--st-border);
    z-index: 90;
  }
  .b-bottom-tabs button { color: var(--st-text-mute); font-weight: 500; }
  .b-bottom-tabs button:hover { color: #fff; }
  .b-bottom-tabs button.active { color: var(--st-brand); }
  .b-bottom-tabs button.active .b-bt-ic { color: var(--st-brand); }
  .b-bottom-tabs .b-bt-badge { background: var(--st-bad); }
  @media (min-width: 901px) and (max-width: 1023.98px) {
    .b-bottom-tabs { display: flex; }
  }

  /* ===== Dark-theme overrides for shared DS blocks ===== */
  .b-row-card {
    background: var(--st-surface);
    border-color: var(--st-border);
    color: var(--st-text);
    border-radius: 12px;
  }
  .b-row-card:hover, .b-row-card:active {
    background: var(--st-surface-2);
    border-color: var(--st-border-2);
  }
  .b-row-card .b-rc-nm { color: #fff; }
  .b-row-card .b-rc-sb { color: var(--st-text-mute); }
  .b-row-card .b-rc-val { color: #fff; }
  .b-row-card .b-rc-delta { color: var(--st-text-mute); }
  .b-row-card .b-rc-delta.up { color: var(--st-good); }
  .b-row-card .b-rc-delta.dn { color: var(--st-bad); }
  .b-row-card .b-rc-meta .b-rc-m-l { color: var(--st-text-sub); }
  .b-row-card .b-rc-meta .b-rc-m-v { color: var(--st-text); }

  .b-stat-hero .b-sh-lead {
    background: linear-gradient(135deg, #1B2A24 0%, #2C4438 100%);
    border: 1px solid rgba(124,196,169,0.18);
  }
  .b-stat-hero .b-sh-lead .b-sh-l { color: rgba(255,255,255,0.62); }
  .b-stat-hero .b-sh-lead .b-sh-v { color: #fff; }
  .b-stat-hero .b-sh-lead .b-sh-d { color: rgba(255,255,255,0.7); }
  .b-stat-hero .b-sh-s {
    background: var(--st-surface);
    border-color: var(--st-border);
  }
  .b-stat-hero .b-sh-s .b-sh-l { color: var(--st-text-sub); }
  .b-stat-hero .b-sh-s .b-sh-v { color: #fff; }
  .b-stat-hero .b-sh-s .b-sh-sb { color: var(--st-text-mute); }

  .b-day-list .b-dl-l { color: var(--st-text); border-bottom-color: var(--st-border); }
  .b-day-list .b-dl-v { color: #fff; border-bottom-color: var(--st-border); }
  .b-day-list .b-dl-v.up { color: var(--st-good); }
  .b-day-list .b-dl-v.dn { color: var(--st-bad); }

  .b-filter-chips { padding: 0; }
  .b-filter-chips .b-fc {
    background: rgba(255,255,255,0.04);
    border-color: var(--st-border);
    color: var(--st-text);
    min-height: 34px;
    border-radius: 9999px;
  }
  .b-filter-chips .b-fc:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .b-filter-chips .b-fc .b-fc-ct {
    background: rgba(255,255,255,0.08); color: var(--st-text-mute);
  }
  .b-filter-chips .b-fc.on {
    background: var(--st-brand); border-color: var(--st-brand); color: #0B0D11;
  }
  .b-filter-chips .b-fc.on .b-fc-ct { background: rgba(11,13,17,0.18); color: #0B0D11; }

  /* Bottom sheet */
  .x-bs-scrim { background: rgba(0,0,0,0.62); z-index: 100; }
  .x-bottom-sheet {
    background: var(--st-surface-2);
    color: var(--st-text);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
  }
  .x-bottom-sheet .x-bs-grab { background: var(--st-border-2); }
  .x-bottom-sheet .x-bs-head { border-bottom-color: var(--st-border); padding: 14px 18px 12px; }
  .x-bottom-sheet .x-bs-head h3 { color: #fff; font: 600 17px/1.2 var(--font-sans); margin:0; }
  .x-bottom-sheet .x-bs-head .x-bs-close {
    background: rgba(255,255,255,0.06); color: var(--st-text);
    width: 32px; height: 32px; border-radius: 8px; border:0; cursor:pointer;
    display:grid; place-items:center;
  }
  .x-bottom-sheet .x-bs-head .x-bs-close:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .x-bottom-sheet .x-bs-body { padding: 14px 18px; }
  .x-bottom-sheet .x-bs-foot {
    background: var(--st-surface-2);
    border-top-color: var(--st-border);
    padding: 12px 18px calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .x-bottom-sheet .x-bs-foot button.alt {
    background: rgba(255,255,255,0.05);
    color: var(--st-text);
    border: 1px solid var(--st-border);
  }
  .x-bottom-sheet .x-bs-foot button.alt:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .x-bottom-sheet .x-bs-foot button.primary { background: var(--st-brand); color: #0B0D11; border:0; }
  .x-bottom-sheet .x-bs-foot button.primary:hover { background: var(--st-brand-2); }
  .x-bottom-sheet .x-bs-foot button.danger { background: var(--st-bad-soft); color: var(--st-bad); border:1px solid rgba(224,116,114,0.3); }

  /* Buttons */
  .btn {
    min-height: var(--tap);
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,0.05); color: var(--st-text);
    font: 500 13.5px/1 var(--font-sans);
    border: 1px solid var(--st-border);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn.primary { background: var(--st-brand); color: #0B0D11; border-color: var(--st-brand); font-weight:600; }
  .btn.primary:hover { background: var(--st-brand-2); }
  .btn.ghost { background: transparent; border-color: transparent; }
  .btn.danger { background: var(--st-bad-soft); color: var(--st-bad); border-color: rgba(224,116,114,0.3); }
  .btn.sm { min-height: 36px; padding: 6px 10px; font-size: 12px; }
  .btn.block { width: 100%; }

  /* Input + field */
  .input, input[type="text"].input, input[type="email"].input, input[type="password"].input {
    width: 100%; min-height: var(--tap); padding: 0 12px;
    background: var(--st-surface); color: #fff;
    border: 1px solid var(--st-border-2); border-radius: 10px;
    font: 500 15px/1 var(--font-sans); box-sizing: border-box;
  }
  .input:focus { outline: 0; border-color: var(--st-brand); box-shadow: 0 0 0 3px var(--st-brand-soft); }
  .field { display: grid; gap: 6px; margin-bottom: 12px; }
  .field label, .field .lb { font: 500 12px/1 var(--font-sans); color: var(--st-text-mute); }
  .field .help { font: 11.5px/1.4 var(--font-sans); color: var(--st-text-sub); }

  /* Card */
  .st-card {
    background: var(--st-surface);
    border: 1px solid var(--st-border);
    border-radius: 14px; padding: 14px 16px;
    margin-bottom: 12px;
  }
  .st-card .ttl { font: 600 14px/1.2 var(--font-sans); color: #fff; }
  .st-card .sub { font: 12.5px/1.45 var(--font-sans); color: var(--st-text-mute); margin-top: 4px; }
  .st-card .hdr { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .st-card .hdr .spacer { flex: 1; }

  /* ===== Transaction row (custom layout, uses .b-row-card surface) ===== */
  .st-tx-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px;
    background: var(--st-surface);
    border: 1px solid var(--st-border);
    border-radius: 12px;
    margin-bottom: 6px;
    cursor: pointer; min-height: var(--tap);
    transition: background 180ms ease;
  }
  .st-tx-row:hover { background: var(--st-surface-2); }
  .st-tx-row .badge-ic {
    width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center; flex: none;
    font: 600 14px/1 var(--font-sans); color: #fff;
    letter-spacing: 0;
  }
  .st-tx-row .info { flex: 1; min-width: 0; }
  .st-tx-row .info .nm { font: 600 14.5px/1.2 var(--font-sans); color: #fff; text-overflow: ellipsis; overflow:hidden; white-space:nowrap; }
  .st-tx-row .info .sb { font: 12px/1.3 var(--font-sans); color: var(--st-text-mute); margin-top: 3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .st-tx-row .amt { font: 600 14.5px/1 var(--font-sans); color: #fff; flex: none; text-align: right; font-variant-numeric: tabular-nums; white-space:nowrap; }
  .st-tx-row .amt.dn { color: var(--st-bad); }
  .st-tx-row .amt.up { color: var(--st-good); }
  .st-tx-row .amt.transfer { color: var(--st-text-mute); }
  .st-tx-row.unread { border-color: rgba(124,196,169,0.25); }
  .st-tx-row .smart-hint { font: 11px/1.3 var(--font-sans); color: var(--st-text-mute); margin-top: 6px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .st-tx-row .smart-hint .chip { padding: 3px 8px; border-radius: 9999px; background: rgba(255,255,255,0.06); color: var(--st-text); cursor: pointer; font-size:11px; }
  .st-tx-row .smart-hint .chip:hover { background: rgba(124,196,169,0.18); color: var(--st-brand); }

  /* Day group header */
  .st-tx-day {
    position: sticky; top: 0; z-index: 5;
    display: flex; align-items: baseline; gap: 8px;
    padding: 14px 4px 8px;
    background: var(--st-bg);
    font: 600 12px/1 var(--font-sans);
    color: var(--st-text-sub);
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .st-tx-day .total { margin-left: auto; font: 500 12px var(--font-mono); color: var(--st-text-mute); font-variant-numeric: tabular-nums; }

  /* Category pill */
  .cat-pill {
    padding: 2px 8px; border-radius: 9999px;
    font: 500 11px/1.4 var(--font-sans);
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,0.05); color: var(--st-text-mute);
  }
  .cat-pill .dt { width: 7px; height: 7px; border-radius: 50%; flex:none; background: currentColor; }

  /* Pill */
  .pill {
    padding: 3px 9px; border-radius: 9999px;
    font: 500 11px/1.4 var(--font-sans);
    display: inline-block;
    background: rgba(255,255,255,0.07); color: var(--st-text-mute);
  }
  .pill.ok { background: var(--st-good-soft); color: var(--st-good); }
  .pill.warn { background: var(--st-warn-soft); color: var(--st-warn); }
  .pill.bad { background: var(--st-bad-soft); color: var(--st-bad); }
  .pill.info { background: var(--st-info-soft); color: var(--st-info); }

  /* Search bar */
  .st-search {
    position: relative; margin: 4px 0 12px;
  }
  .st-search input {
    width: 100%; min-height: var(--tap); padding: 0 14px 0 38px;
    background: var(--st-surface); color: #fff; border: 1px solid var(--st-border);
    border-radius: 12px; font: 500 14px/1 var(--font-sans); box-sizing: border-box;
  }
  .st-search input:focus { outline:0; border-color: var(--st-brand); box-shadow: 0 0 0 3px var(--st-brand-soft); }
  .st-search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--st-text-sub); pointer-events:none; }

  /* Progress bar */
  .st-progress {
    height: 6px; background: rgba(255,255,255,0.06);
    border-radius: 9999px; overflow: hidden;
  }
  .st-progress .fl { height: 100%; background: var(--st-brand); border-radius: 9999px; transition: width 240ms ease; }
  .st-progress.warn .fl { background: var(--st-warn); }
  .st-progress.bad .fl { background: var(--st-bad); }
  .st-progress.good .fl { background: var(--st-good); }

  /* Chart wrap */
  .chart-wrap { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -2px; }
  .chart-wrap svg { display: block; min-width: 280px; }
  .chart-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .chart-legend .lg { font: 12px/1 var(--font-sans); color: var(--st-text-mute); display: inline-flex; align-items: center; gap: 6px; }
  .chart-legend .lg .sw { width: 10px; height: 10px; border-radius: 2px; }

  /* Sign-in screen */
  .st-login {
    position: fixed; inset: 0; z-index: 50;
    background: radial-gradient(ellipse at top, #16241F 0%, #0B0D11 60%);
    display: grid; place-items: center;
    padding: 20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  }
  body:not(.is-fullscreen) .st-login { top: 47px; }
  .st-login .brand {
    text-align: center; margin-bottom: 22px;
    color: #fff; font: 700 22px/1 var(--font-sans);
    display: inline-flex; align-items: center; gap: 10px; justify-content: center;
    width: 100%; letter-spacing: -0.02em;
  }
  .st-login .brand .mark {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--st-brand), var(--st-brand-2));
    color: #0B0D11; display: grid; place-items: center;
  }
  .st-login .brand .name { font-size: 24px; }
  .st-login .card {
    width: 100%; max-width: 380px;
    background: var(--st-surface-2);
    border: 1px solid var(--st-border);
    border-radius: 16px;
    padding: 24px;
    color: var(--st-text);
    box-shadow: 0 20px 40px -10px rgba(0,0,0,0.55);
  }
  .st-login h1 { font: 700 22px/1.15 var(--font-sans); color: #fff; margin: 0; letter-spacing: -0.015em; }
  .st-login .lead { font: 13.5px/1.5 var(--font-sans); color: var(--st-text-mute); margin-top: 6px; }
  .st-login .field { display: block; margin-top: 14px; }
  .st-login .otp { display: flex; gap: 6px; justify-content: space-between; margin-top:6px; }
  .st-login .otp input {
    flex: 1; padding: 0; box-sizing: border-box; text-align: center;
    min-height: var(--tap); background: var(--st-surface); color: #fff;
    border: 1px solid var(--st-border-2); border-radius: 9px;
    font-size: 20px; font-weight: 600;
  }
  .st-login .otp input:focus { outline: 0; border-color: var(--st-brand); box-shadow: 0 0 0 3px var(--st-brand-soft); }
  .st-login .full {
    width: 100%; margin-top: 16px; min-height: var(--tap);
    background: var(--st-brand); color: #0B0D11;
    border: 0; border-radius: 10px; cursor: pointer;
    font: 600 14px/1 var(--font-sans);
  }
  .st-login .full:hover { background: var(--st-brand-2); }
  .st-login .meta { font: 12px/1.5 var(--font-sans); color: var(--st-text-sub); margin-top: 12px; text-align: center; }
  .st-login .meta a { color: var(--st-brand); text-decoration: none; }
  .st-login .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 9999px;
    background: var(--st-brand-soft); color: var(--st-brand);
    font: 500 11px var(--font-sans); margin-bottom: 12px;
  }

  /* Modal scrim — bottom sheet on phone */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6);
    display: flex; justify-content: center; align-items: flex-end;
    animation: scrimIn 180ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%;
    background: var(--st-surface-2);
    color: var(--st-text);
    border-top-left-radius: 18px;
    border-top-right-radius: 18px;
    padding: 6px 0 calc(16px + env(safe-area-inset-bottom, 0px));
    max-height: 95vh;

<script>
/* ============================================================
   STASH — Personal savings + expense tracking
   Mobile-first. Dark only. Inspired by Copilot Money.
   ============================================================ */

const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => Array.from(p.querySelectorAll(s));
const fmt = (n, d = 0) => {
  if (n === null || n === undefined) return '—';
  const v = Math.abs(n);
  const sign = n < 0 ? '-' : '';
  const s = v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  return sign + s;
};
const usd = (n, d = 0) => '$' + fmt(n, d);
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   SEEDS
   ============================================================ */

const CATEGORIES = [
  { id: 'food',          name: 'Food',          color: '#E8A56E', icon: 'shop'     },
  { id: 'transport',     name: 'Transport',     color: '#6FB1E0', icon: 'truck'    },
  { id: 'bills',         name: 'Bills',         color: '#E0B45D', icon: 'receipt'  },
  { id: 'entertainment', name: 'Entertainment', color: '#B49CE8', icon: 'sparkles' },
  { id: 'shopping',      name: 'Shopping',      color: '#E08CB5', icon: 'tag'      },
  { id: 'gym',           name: 'Gym',           color: '#5BAA8B', icon: 'activity' },
  { id: 'subs',          name: 'Subscriptions', color: '#7CC4A9', icon: 'refresh'  },
  { id: 'income',        name: 'Income',        color: '#5BAA8B', icon: 'arrow'    },
  { id: 'transfer',      name: 'Transfer',      color: '#9CA3AF', icon: 'forward'  },
  { id: 'other',         name: 'Other',         color: '#9CA3AF', icon: 'grid'     },
];
const catById = id => CATEGORIES.find(c => c.id === id) || CATEGORIES[CATEGORIES.length-1];

/* 50+ ZW/SA banks for add-account search */

/* ===== Persistence ===== */
const LS = 'huchu-stash-demo:v1';
const PERSIST = ['signedIn','accounts','transactions','budgets','subs','goals','notifs','settings','_stashExtended'];
function saveState() {
  try {
    const o = {}; PERSIST.forEach(k => o[k] = state[k]);
    localStorage.setItem(LS, JSON.stringify(o));
    if (window.StashSidecar) window.StashSidecar.syncMirror(o);
  } catch(e){}
}
function loadState() {
  try {
    const raw = localStorage.getItem(LS); if (!raw) return;
    const o = JSON.parse(raw);
    PERSIST.forEach(k => { if (o[k] !== undefined) state[k] = o[k]; });
    state.settings = { ...DEFAULT_SETTINGS, ...(state.settings || {}) };
  } catch(e){}
}
function hydrateSeeds() {
  if (!state.accounts) state.accounts = SEED_ACCOUNTS.map(x => ({ ...x }));
  if (!state.transactions) {
    state.transactions = SEED_TX.map((t, i) => ({
      id: 't'+i,
      date: daysAgo(t.d).toISOString(),
      merchant: t.m,
      amt: t.a,
      cat: t.c,
      acctId: t.acct,
      note: t.note || '',
      loc: t.loc || '',
      hidden: false,
      smart: !!t.smart,
      suggestions: t.suggestions || [],
      seen: !t.smart,
    }));
  }
  if (!state.budgets) state.budgets = SEED_BUDGETS.map(b => ({ ...b }));
  if (!state.subs) state.subs = SEED_SUBS.map(s => ({ ...s }));
  if (!state.goals) state.goals = SEED_GOALS.map(g => ({ ...g }));
  if (!state.notifs) state.notifs = SEED_NOTIFS.map((n, i) => ({ id: 'n'+i, ...n, date: daysAgo(n.d).toISOString() }));
  /* Sidecar: extend the seed to 30 days × 3-5/day on first hydrate */
  if (window.StashSidecar && !state._stashExtended) {
    state.transactions = window.StashSidecar.extendSeed(state.transactions);
    state._stashExtended = true;
  }
  /* Sidecar: keep budget.spent honest */
  if (window.StashSidecar) {
    const proxy = { transactions: state.transactions, budgets: state.budgets };
    window.StashSidecar.recomputeBudgets(proxy);
    state.budgets = proxy.budgets;
  }
}
function resetDemo() {
  try { localStorage.removeItem(LS); } catch(e){}
  location.reload();
}

/* ===== Toast / modal ===== */
function toast(msg, kind='default') {
  const host = $('#toast-host');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind!=='default' ? ' '+kind : '');
  const icon = kind==='success' ? 'check' : kind==='danger' ? 'x' : kind==='warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${escapeHtml(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 200); }, 2400);
}
function openModal(html) { state.modal = html; renderModal(); }
function closeModal() { state.modal = null; renderModal(); }
function renderModal() {
  const h = $('#modal-host');
  if (!state.modal) { h.innerHTML = ''; return; }
  if (state.modal === '__bs__') return; // bottom sheet manages its own host
  h.innerHTML = `<div class="modal-scrim" data-scrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(h);
  h.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeModal();
  });
  const cl = h.querySelector('[data-sheet-close]');
  if (cl) cl.addEventListener('click', closeModal);
}
function openConfirm({title, sub, okLabel='Confirm', danger=false, onOk}) {
  openModal(`
    <div class="modal" onclick="event.stopPropagation()">
      <div class="handle"></div>
      <div class="sheet-hd"><h3>${escapeHtml(title)}</h3><p class="sub">${escapeHtml(sub||'')}</p></div>
      <div class="sheet-bd"></div>
      <div class="acts">
        <button class="btn" data-cancel>Cancel</button>
        <button class="btn ${danger?'danger':'primary'}" data-ok>${escapeHtml(okLabel)}</button>
      </div>
    </div>`);
  $('.modal [data-cancel]').addEventListener('click', closeModal);
  $('.modal [data-ok]').addEventListener('click', () => { closeModal(); onOk && onOk(); });
}

/* ===== Bottom sheet (DS .x-bottom-sheet) ===== */
function openSheet(opts) {
  /* opts: { crumb, title, body, primaryLabel, onPrimary, secondaryLabel, onSecondary, dangerLabel, onDanger } */
  state.modal = '__bs__';
  const h = $('#modal-host');
  h.innerHTML = `
    <div class="x-bs-scrim open" data-bs-scrim>
      <div class="x-bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="bs-title">
        <div class="x-bs-grab"></div>
        <div class="x-bs-head">
          <div style="flex:1;min-width:0;">
            ${opts.crumb ? `<div style="font:500 11px/1 var(--font-sans);letter-spacing:0.09em;text-transform:uppercase;color:var(--st-text-sub);margin-bottom:5px;">${escapeHtml(opts.crumb)}</div>` : ''}
            <h3 id="bs-title">${escapeHtml(opts.title || '')}</h3>
          </div>
          <button class="x-bs-close" type="button" data-sheet-close aria-label="Close"><span data-icon="x" data-icon-size="16"></span></button>
        </div>
        <div class="x-bs-body" style="max-height:65vh;overflow-y:auto;">
          ${opts.body || ''}
        </div>
        <div class="x-bs-foot" style="display:flex; gap:8px;">
          ${opts.dangerLabel ? `<button class="danger" type="button" id="sheet-danger">${escapeHtml(opts.dangerLabel)}</button>` : ''}
          <button class="alt" type="button" data-sheet-close>${escapeHtml(opts.secondaryLabel || 'Close')}</button>
          ${opts.primaryLabel ? `<button class="primary" type="button" id="sheet-primary">${escapeHtml(opts.primaryLabel)}</button>` : ''}
        </div>
      </div>
    </div>`;
  if (window.Icons) window.Icons.render(h);
  const scrim = h.querySelector('[data-bs-scrim]');
  scrim.addEventListener('click', (e) => { if (e.target === scrim) closeModal(); });
  h.querySelectorAll('[data-sheet-close]').forEach(b => b.addEventListener('click', () => { closeModal(); if (opts.onSecondary) opts.onSecondary(); }));
  if (opts.onPrimary) {
    const p = $('#sheet-primary');
    if (p) p.addEventListener('click', () => { closeModal(); opts.onPrimary(); });
  }
  if (opts.onDanger) {
    const d = $('#sheet-danger');
    if (d) d.addEventListener('click', () => { closeModal(); opts.onDanger(); });
  }
}

function go(route, extra) {
  state.route = route;
  state.moreSheetOpen = false;
  if (extra) Object.assign(state, extra);
  history.replaceState(null, '', '#/' + route);
  render();
  const m = $('.st-main'); if (m) m.scrollTo(0,0);
}
window.addEventListener('hashchange', () => {
  let r = (location.hash.replace(/^#\/?/, '') || 'home');
  if (state.route !== r) { state.route = r; render(); }
});

/* ===== Fullscreen ===== */
function toggleFullscreen() {
  const isFs = !!document.fullscreenElement || document.body.classList.contains('is-fullscreen');
  if (isFs) {
    document.exitFullscreen && document.exitFullscreen().catch(()=>{});
    document.body.classList.remove('is-fullscreen');
  } else {
    document.body.classList.add('is-fullscreen');
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(()=>{});
  }
  render();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) document.body.classList.remove('is-fullscreen');
  render();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.moreSheetOpen) { state.moreSheetOpen = false; render(); return; }
    if (state.modal) { closeModal(); return; }
    if (document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
      document.body.classList.remove('is-fullscreen'); render();
    }
  }
});

/* ===== SVG charts ===== */
function svgSparkline(values, opts={}) {
  const w = opts.w || 80, h = opts.h || 22;
  const c = opts.color || '#7CC4A9';
  const min = Math.min(...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-3) - 1.5).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function svgArea(values, opts={}) {
  const w = opts.w || 320, h = opts.h || 90;
  const c = opts.color || '#7CC4A9';
  const min = Math.min(0, ...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-8) - 4).toFixed(1)}`);
  const line = pts.join(' ');
  const fill = `0,${h} ` + pts.join(' ') + ` ${w},${h}`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;">
    <polygon points="${fill}" fill="${c}" opacity="0.16"/>
    <polyline points="${line}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}
function svgBars(values, labels, opts={}) {
  const w = opts.w || 320, h = opts.h || 130;
  const c = opts.color || '#7CC4A9';
  const max = Math.max(...values) || 1;
  const bw = w / values.length * 0.6;
  const gap = w / values.length * 0.4;
  let out = `<svg width="${w}" height="${h+20}" viewBox="0 0 ${w} ${h+20}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;">`;
  values.forEach((v,i)=>{
    const bh = (v / max) * (h - 8);
    const x = i*(bw+gap) + gap/2;
    const y = h - bh;
    out += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${c}" rx="3"/>`;
    if (labels && labels[i]) out += `<text x="${(x+bw/2).toFixed(1)}" y="${h+14}" text-anchor="middle" font-size="10" fill="rgba(229,232,238,0.42)" font-family="ui-sans-serif,system-ui">${escapeHtml(labels[i])}</text>`;
  });
  out += '</svg>';
  return out;
}
function svgLine(values, opts={}) {
  const w = opts.w || 320, h = opts.h || 120;
  const c = opts.color || '#7CC4A9';
  const min = Math.min(...values), max = Math.max(...values);
  const rng = max - min || 1;
  const sx = w / (values.length - 1);
  const pts = values.map((v,i) => `${(i*sx).toFixed(1)},${(h - ((v - min)/rng)*(h-12) - 6).toFixed(1)}`).join(' ');
  let out = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;">`;
  for (let i=0;i<4;i++) {
    const y = (h-20) * (i/3) + 10;
    out += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>`;
  }
  out += `<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
  return out;
}
function svgDonut(segments, opts={}) {
  /* segments: [{value, color, label}] */
  const w = opts.w || 180, h = opts.h || 180;
  const cx = w/2, cy = h/2;
  const r = opts.r || 70, thickness = opts.thickness || 22;
  const total = segments.reduce((s, x) => s + x.value, 0) || 1;
  let start = -Math.PI / 2;
  let out = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;">`;
  segments.forEach(seg => {
    const frac = seg.value / total;
    const end = start + frac * Math.PI * 2;
    const x1 = cx + r * Math.cos(start), y1 = cy + r * Math.sin(start);
    const x2 = cx + r * Math.cos(end),   y2 = cy + r * Math.sin(end);
    const large = end - start > Math.PI ? 1 : 0;
    const rin = r - thickness;
    const x3 = cx + rin * Math.cos(end), y3 = cy + rin * Math.sin(end);
    const x4 = cx + rin * Math.cos(start), y4 = cy + rin * Math.sin(start);
    out += `<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${rin} ${rin} 0 ${large} 0 ${x4} ${y4} Z" fill="${seg.color}"/>`;
    start = end;
  });
  if (opts.center) {
    out += `<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" fill="rgba(229,232,238,0.62)" font-family="ui-sans-serif,system-ui">${escapeHtml(opts.centerLabel||'')}</text>`;
    out += `<text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" font-family="ui-sans-serif,system-ui">${escapeHtml(opts.center)}</text>`;
  }
  out += '</svg>';
  return out;
}
function svgRing(pct, opts={}) {
  const w = opts.w || 64, h = opts.h || 64;
  const cx = w/2, cy = h/2, r = (w/2) - 4;
  const color = opts.color || '#7CC4A9';
  const bg = 'rgba(255,255,255,0.08)';
  const c = 2 * Math.PI * r;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${bg}" stroke-width="6"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg>`;
}

function wireSignIn() {
  if (state.step === 'otp') {
    $$('[data-otp]').forEach((inp,i,arr) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
        if (inp.value && i < arr.length - 1) arr[i+1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) arr[i-1].focus();
        if (e.key === 'ArrowLeft' && i > 0) arr[i-1].focus();
        if (e.key === 'ArrowRight' && i < arr.length - 1) arr[i+1].focus();
      });
    });
    $('#otp-go').addEventListener('click', () => {
      state.signedIn = true; state.step = 'creds'; toast('Signed in · welcome back, Chipo', 'success'); render();
    });
    $('#otp-back').addEventListener('click', (e) => { e.preventDefault(); state.step='creds'; render(); });
    return;
  }
  $('#si-go').addEventListener('click', () => { state.step = 'otp'; render(); });
  const ob = $('#si-onb'); if (ob) ob.addEventListener('click', (e) => { e.preventDefault(); state.signedIn = true; state.route = 'onboarding'; state.onboardStep = 0; render(); });
}

function fmtDay(iso) {
  const d = new Date(iso);
  const today = new Date(TODAY);
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, today)) return 'Today';
  const yest = new Date(today); yest.setDate(today.getDate() - 1);
  if (same(d, yest)) return 'Yesterday';
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
}
function fmtShortDate(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function groupTxByDay(list) {
  const groups = {};
  list.forEach(t => {
    const key = new Date(t.date).toDateString();
    (groups[key] = groups[key] || { label: fmtDay(t.date), items: [], total: 0, date: t.date });
    groups[key].items.push(t);
    if (t.cat !== 'transfer') groups[key].total += t.amt;
  });
  return Object.values(groups).sort((a,b) => new Date(b.date) - new Date(a.date));
}
function txInitial(name) {
  const parts = name.replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return name.slice(0, 2).toUpperCase();
}
function renderTxRow(t, opts={}) {

  const amtTxt = (t.amt < 0 ? '−' : (isIn ? '+' : '')) + '$' + fmt(Math.abs(t.amt), 2);

  return `

function cashOnHand() {

function spendingThisMonth() {
  const start = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  return (state.transactions || []).filter(t => new Date(t.date) >= start && t.amt < 0 && t.cat !== 'transfer').reduce((s, t) => s + Math.abs(t.amt), 0);

function incomeThisMonth() {

function renderTransactions() {
  const filter = state.txFilter;
  let list = (state.transactions || []);

  else if (filter === 'spending') list = list.filter(t => t.amt < 0 && t.cat !== 'transfer' && t.cat !== 'bills');
  else if (filter === 'bills') list = list.filter(t => t.cat === 'bills');
  else if (filter === 'hidden') list = list.filter(t => t.hidden);
  else if (filter === 'uncat') list = list.filter(t => t.cat === 'other' || t.smart);
  if (filter !== 'hidden') list = list.filter(t => !t.hidden);
  if (state.txSearch) {

  }
  const groups = groupTxByDay(list);
  const filters = [
    { id: 'all', label: 'All' },

    { id: 'spending', label: 'Spending' },

/* ============================================================

   ============================================================ */
function renderAccountDetail() {
  const a = (state.accounts||[]).find(x => x.id === state.selectedAccount) || (state.accounts||[])[0];
  if (!a) return `<div class="st-page"><div class="empty-st"><div class="ttl">Account not found</div></div></div>`;
  const inst = INSTITUTIONS.find(x => x.id === a.inst);
  /* 90-day trend — fabricate from sparkline */
  const trend = [];
  const base = a.spark[0];
  for (let i = 0; i < 90; i++) {
    const t = i / 89;
    const noise = Math.sin(i*0.3) * (Math.abs(a.bal) * 0.04) + (Math.random()-0.5) * (Math.abs(a.bal) * 0.02);
    trend.push(base + (a.bal - base) * t + noise);
  }
  const recent = (state.transactions||[]).filter(t => t.acctId === a.id).slice(0, 8);
  return `
    <div class="st-page">
      <div class="st-page-head">
        <div class="crumb"><button class="btn ghost sm" data-go="accounts" style="padding:4px 8px;color:var(--st-text-mute);"><span data-icon="chleft" data-icon-size="12"></span> Accounts</button></div>
        <h2>${escapeHtml(a.nick)}</h2>
        <p class="sub">${escapeHtml(inst ? inst.name : '')} · ••${escapeHtml(a.last4)}</p>
      </div>

      <div class="b-stat-hero">
        <div class="b-sh-lead" style="padding:20px;border-radius:14px;color:#fff;">
          <div class="b-sh-l" style="font:500 11px/1 var(--font-sans);letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.62);">Current balance</div>
          <div class="b-sh-v" style="font:700 32px/1 var(--font-sans);margin-top:10px;letter-spacing:-0.02em;">${a.bal < 0 ? '−' : ''}$${fmt(Math.abs(a.bal),2)}</div>
          <div class="b-sh-d" style="font:13px/1.4 var(--font-sans);color:rgba(255,255,255,0.7);margin-top:8px;">${a.status === 'sync' ? 'Syncing…' : 'Updated just now'}</div>
        </div>
      </div>

      <div class="st-card">
        <div class="hdr"><span class="ttl">90-day balance trend</span></div>
        <div class="chart-wrap">${svgArea(trend, { color: a.bal >= 0 ? '#7CC4A9' : '#E07472', w: 320, h: 110 })}</div>
      </div>

      <div class="st-sect-h">
        <span class="lbl">Recent transactions</span>
        <div class="sp"></div>
        <button class="lk" data-go="transactions">All →</button>
      </div>
      ${recent.length === 0 ? `<div class="empty-st"><div class="ttl">No transactions yet</div><div class="ds">New activity will appear here.</div></div>` : recent.map(t => renderTxRow(t)).join('')}

      <div style="display:flex;gap:8px;margin-top:14px;">
        <button class="btn block" id="acct-reconnect"><span data-icon="refresh" data-icon-size="13"></span> Reconnect</button>
        <button class="btn block danger" id="acct-disconnect"><span data-icon="x" data-icon-size="13"></span> Disconnect</button>
      </div>
    </div>
  `;
}
function wireAccountDetail() {
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $$('[data-tx]').forEach(b => b.addEventListener('click', () => openTxDetail(b.dataset.tx)));
  $$('[data-smart]').forEach(b => b.addEventListener('click', (e) => {

/* ============================================================
   ADD EXPENSE — Flow 1 (FAB → bottom sheet → recomputed totals)
   ============================================================ */
function todayIsoDay() {
  const d = TODAY;
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function getCcyPref() { try { return localStorage.getItem('corelith:stash:ccyPref') || 'USD'; } catch(e) { return 'USD'; } }
function setCcyPref(c) { try { localStorage.setItem('corelith:stash:ccyPref', c); } catch(e){} }
function openAddExpense() {
  const pickable = CATEGORIES.filter(c => c.id !== 'income' && c.id !== 'transfer' && c.id !== 'subs');
  const ccyPref = getCcyPref();
  const todayIso = todayIsoDay();
  const accts = state.accounts || [];

  const body = `
    <div class="stash-amt-wrap">
      <div class="stash-ccy" role="tablist" aria-label="Currency">
        <button type="button" class="stash-ccy-btn ${ccyPref==='USD'?'on':''}" data-ccy="USD" role="tab" aria-selected="${ccyPref==='USD'}">USD</button>
        <button type="button" class="stash-ccy-btn ${ccyPref==='ZWL'?'on':''}" data-ccy="ZWL" role="tab" aria-selected="${ccyPref==='ZWL'}">ZWL</button>
      </div>
      <div class="stash-amt-row">
        <span class="stash-amt-sym" id="ax-sym">${ccyPref==='ZWL'?'ZWL':'$'}</span>
        <input class="stash-amt-input" id="ax-amt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autocomplete="off" />
      </div>
      <div class="stash-amt-help" id="ax-help">Tap a category, then save.</div>
    </div>

    <div class="field">
      <label>Category</label>
      <div class="stash-cat-chips" role="radiogroup" aria-label="Category">
        ${pickable.map(c => `
          <button type="button" class="stash-cat-chip" role="radio" aria-checked="false" data-cat="${c.id}" style="--cc:${c.color};">
            <span class="stash-cat-dot"></span>${escapeHtml(c.name)}
          </button>
        `).join('')}
      </div>
    </div>

    <div class="field">
      <label for="ax-merchant">Merchant</label>
      <input class="input" id="ax-merchant" type="text" placeholder="e.g. Pick n Pay" autocomplete="off" />
    </div>

    <div class="stash-row-2">
      <div class="field">
        <label for="ax-date">Date</label>
        <input class="input" id="ax-date" type="date" value="${todayIso}" max="${todayIso}" />
      </div>
      <div class="field">
        <label for="ax-acct">Account</label>
        <select class="input" id="ax-acct">
          ${accts.map(a => `<option value="${a.id}">${escapeHtml(a.nick)}</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="field">
      <label for="ax-note">Note <span style="color:var(--st-text-sub);">(optional)</span></label>
      <input class="input" id="ax-note" type="text" placeholder="Add a note" />
    </div>
  `;

  let selectedCat = null;
  let ccy = ccyPref;

  openSheet({
    crumb: 'New expense',
    title: 'Add expense',
    body,
    primaryLabel: 'Save expense',
    /* We override #sheet-primary's click below so we can validate
       and keep the sheet open on failure. onPrimary stays a no-op. */
    onPrimary: () => {},
  });

  function readForm() {
    return {
      amtRaw:    parseFloat(($('#ax-amt')||{}).value || '0'),
      merchant:  (($('#ax-merchant')||{}).value || '').trim(),
      dateStr:   (($('#ax-date')||{}).value || todayIso),
      acctId:    (($('#ax-acct')||{}).value || (accts[0] && accts[0].id)),
      note:      (($('#ax-note')||{}).value || '').trim(),
    };
  }
  function flashHelp(msg, bad) {
    const help = $('#ax-help');
    if (!help) return;
    help.textContent = msg;
    help.style.color = bad ? 'var(--st-bad)' : 'var(--st-text-mute)';
  }
  function attemptSave() {
    const f = readForm();
    if (!(f.amtRaw > 0)) {
      flashHelp('Enter an amount greater than 0.', true);
      const amt = $('#ax-amt'); if (amt) { amt.focus(); amt.select(); }
      return;
    }
    if (!selectedCat) {
      flashHelp('Pick a category to continue.', true);
      return;
    }
    const merchant = f.merchant || catById(selectedCat).name;
    const rate = (window.StashSidecar && window.StashSidecar.rates[ccy]) || 1;
    const usdAmt = ccy === 'USD' ? f.amtRaw : Math.round(f.amtRaw * rate * 100) / 100;
    const tx = {
      id: 'tx-user-' + Date.now(),
      date: new Date(f.dateStr + 'T12:00:00').toISOString(),
      merchant,
      amt: -Math.round(usdAmt * 100) / 100,
      cat: selectedCat,
      acctId: f.acctId,
      note: f.note,
      loc: '',
      hidden: false,
      smart: false,
      suggestions: [],
      seen: true,
      ccy,
      origAmt: ccy !== 'USD' ? -f.amtRaw : undefined,
    };
    state.transactions.unshift(tx);
    const acct = (state.accounts||[]).find(a => a.id === f.acctId);
    if (acct) acct.bal = Math.round((acct.bal - usdAmt) * 100) / 100;
    if (window.StashSidecar) {
      const proxy = { transactions: state.transactions, budgets: state.budgets };
      window.StashSidecar.recomputeBudgets(proxy);
      state.budgets = proxy.budgets;
    }
    toast('Expense saved · ' + usd(usdAmt, 2), 'success');
    closeModal();
    render();
  }

  // Wire chips + ccy + focus + override primary after the sheet is in the DOM.
  setTimeout(() => {
    $$('.stash-cat-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        $$('.stash-cat-chip').forEach(c => { c.classList.remove('on'); c.setAttribute('aria-checked', 'false'); });
        chip.classList.add('on');
        chip.setAttribute('aria-checked', 'true');
        selectedCat = chip.dataset.cat;
        flashHelp(catById(selectedCat).name + ' selected.', false);
      });
    });
    $$('.stash-ccy-btn').forEach(b => {
      b.addEventListener('click', () => {
        ccy = b.dataset.ccy;
        setCcyPref(ccy);
        $$('.stash-ccy-btn').forEach(x => {
          const on = x === b;
          x.classList.toggle('on', on);
          x.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        const sym = $('#ax-sym'); if (sym) sym.textContent = ccy === 'ZWL' ? 'ZWL' : '$';
      });
    });
    /* Replace openSheet's primary handler with one that validates first. */
    const oldP = $('#sheet-primary');
    if (oldP) {
      const newP = oldP.cloneNode(true);
      oldP.parentNode.replaceChild(newP, oldP);
      newP.addEventListener('click', attemptSave);
    }
    /* Submit-on-Enter from the amount field. */
    const amt = $('#ax-amt');
    if (amt) {
      amt.focus();
      amt.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); attemptSave(); } });
    }
  }, 40);
}

function openAddGoal() {
  const def = new Date(TODAY); def.setMonth(def.getMonth() + 6);
  const todayIso = todayIsoDay();
  const defIso = (() => { const y=def.getFullYear(), m=String(def.getMonth()+1).padStart(2,'0'), d=String(def.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; })();
  openSheet({
    crumb: 'New goal', title: 'What are you saving for?',

    `,
    primaryLabel: 'Create goal',
    onPrimary: () => {},
  });
  setTimeout(() => {
    const recalc = () => {
      const help = $('#g-help'); if (!help) return;
      const tgt = +(($('#g-target')||{}).value || 0);
      const by = ($('#g-by')||{}).value;
      if (tgt > 0 && by) {
        const days = Math.max(7, Math.round((new Date(by+'T12:00:00') - TODAY) / (1000*60*60*24)));
        const weekly = Math.ceil(tgt / Math.max(1, days/7));
        help.textContent = 'About $' + weekly + '/wk to reach ' + usd(tgt,0) + '.';
      }
    };
    const t = $('#g-target'), d = $('#g-by'), n = $('#g-name');
    if (t) t.addEventListener('input', recalc);
    if (d) d.addEventListener('change', recalc);
    if (n) n.focus();
    const oldP = $('#sheet-primary');
    if (oldP) {
      const newP = oldP.cloneNode(true);
      oldP.parentNode.replaceChild(newP, oldP);
      newP.addEventListener('click', () => {
        const name = (($('#g-name')||{}).value || '').trim() || 'New goal';
        const tgt = +(($('#g-target')||{}).value || 0);
        if (!(tgt > 0)) { toast('Enter a target amount', 'warn'); return; }
        const byStr = ($('#g-by')||{}).value || defIso;
        const days = Math.max(7, Math.round((new Date(byStr+'T12:00:00') - TODAY) / (1000*60*60*24)));
        const weeks = Math.max(1, Math.round(days / 7));
        const wk = Math.max(1, Math.ceil(tgt / weeks));
        const months = Math.max(1, Math.round(days / 30));
        state.goals.push({ id: 'g-'+Date.now(), name, target: tgt, saved: 0, weekly: wk, ic: 'target', color: '#7CC4A9', eta: 'about ' + months + ' months', byDate: byStr });
        toast('Goal created · keep going', 'success');
        closeModal();
        render();
      });
    }
  }, 40);
}

/* ============================================================
   INSIGHTS
   ============================================================ */
function renderInsights() {
  const tx = state.transactions || [];
  const range = state.insightsRange;
  let cutoff;
  if (range === '7d') { cutoff = new Date(TODAY); cutoff.setDate(cutoff.getDate() - 7); }
  else if (range === '30d') { cutoff = new Date(TODAY); cutoff.setDate(cutoff.getDate() - 30); }
  else if (range === '90d') { cutoff = new Date(TODAY); cutoff.setDate(cutoff.getDate() - 90); }
  else cutoff = new Date(TODAY.getFullYear(), 0, 1);
  const filtered = tx.filter(t => new Date(t.date) >= cutoff && t.amt < 0 && t.cat !== 'transfer');
  const totalSpent = filtered.reduce((s,t) => s + Math.abs(t.amt), 0);

  /* By category for donut */
  const byCat = {};
  filtered.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + Math.abs(t.amt));
  const segs = Object.entries(byCat).map(([c, v]) => ({ value: v, color: catById(c).color, label: catById(c).name })).sort((a,b)=>b.value-a.value);

  /* Spending by day-of-week */
  const dow = [0,0,0,0,0,0,0];
  filtered.forEach(t => { dow[new Date(t.date).getDay()] += Math.abs(t.amt); });
  const dowLabels = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  /* Largest expenses */
  const largest = [...filtered].sort((a,b)=>Math.abs(b.amt)-Math.abs(a.amt)).slice(0,5);

  /* Spending velocity — cumulative over last 30 days */
  const days = 30;
  const cum = [];
  let run = 0;
  for (let i = days - 1; i >= 0; i--) {
    const day = new Date(TODAY); day.setDate(day.getDate() - i);
    const sd = tx.filter(t => new Date(t.date).toDateString() === day.toDateString() && t.amt < 0 && t.cat !== 'transfer').reduce((s,t)=>s+Math.abs(t.amt),0);
    run += sd;
    cum.push(run);
  }

  return `
    <div class="st-page">
      <div class="st-page-head">
        <div class="crumb">Insights</div>
        <h2>Where it goes</h2>
        <p class="sub">Understand your spending patterns.</p>
      </div>
      <div class="b-filter-chips" style="margin-bottom:12px;">
        ${['7d','30d','90d','ytd'].map(r => `<button class="b-fc ${state.insightsRange===r?'on':''}" type="button" data-range="${r}">${r==='ytd'?'YTD':r}</button>`).join('')}
      </div>

      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="lbl">Total spent</div>
          <div class="v">${usd(totalSpent,0)}</div>
          <div class="d dn">+12% vs prev period</div>
        </div>
        <div class="kpi-card">
          <div class="lbl">Avg per day</div>
          <div class="v">${usd(totalSpent/(range==='7d'?7:range==='30d'?30:90),0)}</div>
          <div class="d">across ${filtered.length} transactions</div>
        </div>
      </div>

      <div class="st-card">
        <div class="hdr"><span class="ttl">Top categories</span></div>
        ${segs.length === 0 ? `<div class="empty-st"><div class="ttl">No spending yet</div></div>` : `
          ${svgDonut(segs, { center: '$'+fmt(totalSpent,0), centerLabel: 'total', r: 64, thickness: 20, w: 170, h: 170 })}
          <div class="chart-legend">${segs.slice(0,6).map(s => `<div class="lg"><span class="sw" style="background:${s.color};"></span>${escapeHtml(s.label)} · ${usd(s.value,0)}</div>`).join('')}</div>
        `}
      </div>

      <div class="st-card">
        <div class="hdr"><span class="ttl">Spending by day of week</span></div>
        <div class="chart-wrap">${svgBars(dow, dowLabels, { color: '#7CC4A9', w: 320, h: 140 })}</div>
      </div>

      <div class="st-card">
        <div class="hdr"><span class="ttl">Spending velocity</span></div>
        <div class="chart-wrap">${svgLine(cum, { color: '#6FB1E0', w: 320, h: 120 })}</div>
        <div class="chart-legend"><div class="lg"><span class="sw" style="background:#6FB1E0;"></span>Cumulative spending · 30 days</div></div>

/* ============================================================
   CASHFLOW (calendar)
   ============================================================ */
function renderCashflow() {
  const month = TODAY.getMonth();
  const year = TODAY.getFullYear();
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  const firstDay = first.getDay();
  const daysInMonth = last.getDate();
  const tx = state.transactions || [];
  const dayMap = {};
  tx.forEach(t => {
    const d = new Date(t.date);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const k = d.getDate();
      (dayMap[k] = dayMap[k] || { in: 0, out: 0 });
      if (t.amt > 0 && t.cat === 'income') dayMap[k].in += t.amt;
      else if (t.amt < 0 && t.cat !== 'transfer') dayMap[k].out += Math.abs(t.amt);
    }
  });
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push({ empty: true });
  for (let d = 1; d <= daysInMonth; d++) cells.push({ n: d, m: dayMap[d] || { in: 0, out: 0 }, today: d === TODAY.getDate() });
  const totalIn = Object.values(dayMap).reduce((s, x) => s + x.in, 0);
  const totalOut = Object.values(dayMap).reduce((s, x) => s + x.out, 0);
  return `
    <div class="st-page">
      <div class="st-page-head">
        <div class="crumb">Insights</div>
        <h2>Cashflow · ${first.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>
        <p class="sub">Each day shows income (green) and spending (red).</p>
      </div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="lbl">In</div><div class="v" style="color:var(--st-good);">+${usd(totalIn,0)}</div></div>
        <div class="kpi-card"><div class="lbl">Out</div><div class="v" style="color:var(--st-bad);">−${usd(totalOut,0)}</div></div>
      </div>

      <div class="cf-cal">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="dow">${d}</div>`).join('')}
        ${cells.map(c => c.empty ? '<div class="day empty"></div>' : `
          <div class="day ${c.today ? 'today' : ''}" data-day="${c.n}">
            <div class="n">${c.n}</div>
            <div class="dots">
              ${c.m.in > 0 ? '<span class="dot in"></span>' : ''}
              ${c.m.out > 0 ? '<span class="dot out"></span>' : ''}
            </div>
          </div>
        `).join('')}
      </div>

      <div style="margin-top:14px;display:flex;gap:14px;font:12px var(--font-sans);color:var(--st-text-mute);">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-good);margin-right:5px;"></span>Income</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--st-bad);margin-right:5px;"></span>Spending</span>
      </div>
    </div>
  `;
}
function wireCashflow() {
  $$('[data-day]').forEach(b => b.addEventListener('click', () => openDaySheet(+b.dataset.day)));
}
function openDaySheet(dayNum) {
  const tx = (state.transactions||[]).filter(t => {
    const d = new Date(t.date);
    return d.getFullYear() === TODAY.getFullYear() && d.getMonth() === TODAY.getMonth() && d.getDate() === dayNum;
  });
  const inT = tx.filter(t => t.amt > 0).reduce((s,t)=>s+t.amt, 0);
  const outT = tx.filter(t => t.amt < 0 && t.cat !== 'transfer').reduce((s,t)=>s+Math.abs(t.amt), 0);
  const dt = new Date(TODAY.getFullYear(), TODAY.getMonth(), dayNum);
  openSheet({
    crumb: dt.toLocaleDateString('en-US',{weekday:'long'}),
    title: dt.toLocaleDateString('en-US',{month:'long',day:'numeric'}),
    body: `
      <div class="stat-row">
        <div class="s"><div class="l">In</div><div class="v" style="color:var(--st-good);">+${usd(inT,2)}</div></div>
        <div class="s"><div class="l">Out</div><div class="v" style="color:var(--st-bad);">−${usd(outT,2)}</div></div>
      </div>
      ${tx.length === 0 ? `<div class="empty-st"><div class="ttl">Nothing on this day</div></div>` : tx.map(t => renderTxRow(t)).join('')}
    `,
    secondaryLabel: 'Close',
  });
}

    <div class="st-page" style="padding-top:24px;">
      <div class="p-stepper" style="display:flex;justify-content:center;">
        ${steps.map((s, idx) => `<div class="p-step ${idx <= i ? (idx === i ? 'current' : 'done') : ''}"></div>`).join('')}
      </div>
      ${renderOnboardStep(i)}
    </div>
  `;
}
function renderOnboardStep(i) {
  if (i === 0) return `
    <div style="text-align:center;padding:24px 16px;">
      <div style="width:80px;height:80px;border-radius:22px;background:var(--st-brand-soft);color:var(--st-brand);display:grid;place-items:center;margin:0 auto 18px;" data-icon="coins" data-icon-size="32"></div>
      <h2 style="font:700 26px var(--font-sans);color:#fff;margin:0;letter-spacing:-0.02em;">Welcome to Stash</h2>
      <p style="font:14px/1.55 var(--font-sans);color:var(--st-text-mute);margin:10px auto 0;max-width:340px;">In 90 seconds we'll connect your first account, set a budget you can actually live with, and start a savings goal.</p>
      <div style="margin-top:24px;display:grid;gap:8px;max-width:280px;margin-left:auto;margin-right:auto;">
        <button class="btn primary block" id="ob-next">Let's go</button>
        <button class="btn ghost block" data-go="home">Skip for now</button>
      </div>
    </div>
  `;
  if (i === 1) return `
    <div style="padding:18px 4px;">
      <h2 style="font:700 22px var(--font-sans);color:#fff;margin:0;">Link your first account</h2>
      <p class="sub" style="margin:6px 0 16px;color:var(--st-text-mute);font:13.5px/1.5 var(--font-sans);">Pick a bank — we'll redirect you to a fake sign-in (this is a demo).</p>
      ${INSTITUTIONS.slice(0,5).map(inst => `
        <button class="bank-row" type="button" data-ob-inst="${inst.id}">
          <div class="lg">${escapeHtml(inst.mono)}</div>
          <div class="nm">${escapeHtml(inst.name)}</div>
          <span class="ar" data-icon="chright" data-icon-size="14"></span>
        </button>
      `).join('')}
      <button class="btn block" style="margin-top:12px;" id="ob-skip-1">Skip — I'll do this later</button>
    </div>
  `;
  if (i === 2) return `
    <div style="padding:18px 4px;">
      <h2 style="font:700 22px var(--font-sans);color:#fff;margin:0;">Set your first budget</h2>
      <p class="sub" style="margin:6px 0 16px;color:var(--st-text-mute);font:13.5px/1.5 var(--font-sans);">Most people start with Food — pick a number you can keep.</p>
      <div class="field"><label>Category</label>
        <select class="input" id="ob-cat">${CATEGORIES.filter(c=>c.id!=='income'&&c.id!=='transfer').map(c=>`<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Monthly limit</label><input class="input" type="number" id="ob-lim" value="320" /></div>
      <div style="display:grid;gap:8px;margin-top:14px;">
        <button class="btn primary block" id="ob-next">Continue</button>
        <button class="btn ghost block" id="ob-skip-2">Skip</button>
      </div>
    </div>
  `;
  return `
    <div style="padding:18px 4px;">
      <h2 style="font:700 22px var(--font-sans);color:#fff;margin:0;">Start a savings goal</h2>
      <p class="sub" style="margin:6px 0 16px;color:var(--st-text-mute);font:13.5px/1.5 var(--font-sans);">What's something you'd love to save for?</p>
      <div class="field"><label>Goal</label><input class="input" id="ob-gname" value="Emergency fund" /></div>
      <div class="field"><label>Target amount</label><input class="input" type="number" id="ob-gtgt" value="3000" /></div>
      <div class="field"><label>Weekly contribution</label><input class="input" type="number" id="ob-gwk" value="60" /></div>
      <div style="display:grid;gap:8px;margin-top:14px;">
        <button class="btn primary block" id="ob-finish">Finish setup</button>
        <button class="btn ghost block" id="ob-skip-3">Skip</button>
      </div>
    </div>
  `;
}
function wireOnboarding() {
  const n = $('#ob-next'); if (n) n.addEventListener('click', () => { state.onboardStep = Math.min(3, (state.onboardStep||0)+1); render(); });
  $$('[data-ob-inst]').forEach(b => b.addEventListener('click', () => { state.onboardStep = 2; toast('Account linked', 'success'); render(); }));
  const s1 = $('#ob-skip-1'); if (s1) s1.addEventListener('click', () => { state.onboardStep = 2; render(); });
  const s2 = $('#ob-skip-2'); if (s2) s2.addEventListener('click', () => { state.onboardStep = 3; render(); });
  const s3 = $('#ob-skip-3'); if (s3) s3.addEventListener('click', () => { go('home'); });
  const f = $('#ob-finish'); if (f) f.addEventListener('click', () => { toast('You\'re all set 🎉', 'success'); go('home'); });
  $$('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */
function renderNotifications() {
  const groups = {};
  (state.notifs||[]).forEach(n => {
    const key = fmtDay(n.date);
    (groups[key] = groups[key] || []).push(n);
  });
  return `
    <div class="st-page">
      <div class="st-page-head">
        <div class="crumb">You</div>
        <h2>Notifications</h2>
        <p class="sub">${(state.notifs||[]).filter(n=>n.unread).length} unread</p>
        <div class="head-acts">
          <button class="btn sm" id="mark-read">Mark all as read</button>
        </div>
      </div>
      ${Object.keys(groups).length === 0 ? `
        <div class="empty-st">
          <div class="ic-bg" data-icon="bell" data-icon-size="22"></div>
          <div class="ttl">All caught up</div>
          <div class="ds">New activity will show up here.</div>
        </div>
      ` : Object.entries(groups).map(([day, items]) => `
        <div class="st-sect-h"><span class="lbl">${escapeHtml(day)}</span></div>
        ${items.map(n => `
          <div class="notif-row ${n.unread?'unread':''}">
            <div class="ic"><span data-icon="${n.ic}" data-icon-size="14"></span></div>
            <div class="bd">
              <div class="ttl">${escapeHtml(n.ttl)}</div>
              <div class="tx">${escapeHtml(n.tx)}</div>
            </div>
            <div class="ts">${escapeHtml(n.ts)}</div>
          </div>
        `).join('')}
      `).join('')}
    </div>
  `;
}
function wireNotifications() {
  const mr = $('#mark-read'); if (mr) mr.addEventListener('click', () => {
    (state.notifs||[]).forEach(n => n.unread = false);
    toast('All notifications marked read', 'success'); render();
  });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  loadState();
  hydrateSeeds();
  if (/[?&]fullscreen=1/.test(location.search)) {
    document.body.classList.add('is-fullscreen');
  }
  let r = (location.hash.replace(/^#\/?/, '') || 'home');
  if (r === 'sign-in' || r === 'signin') { state.signedIn = false; state.step = 'creds'; }
  else if (ROUTES.includes(r)) state.route = r;
  render();
}
if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
