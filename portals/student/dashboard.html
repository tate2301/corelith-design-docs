<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dashboard · Student portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="../../device-scale.js" defer></script>
<script src="app.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-portal-kit="student" data-portal-screen="dashboard" data-kit-nav="student" data-screen="dashboard">

<main class="kit-stage phone-bg">
  <div class="device-phone">
    <div class="screen">
      <div class="ps-screen">

        <div class="ps-statusbar"><span>08:14</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

        <div class="ps-appbar transparent">
          <h1>Hi, Tatenda</h1>
          <div class="right">
            <button class="nav-btn" aria-label="Notifications"><span data-icon="bell" data-icon-size="18"></span></button>
            <button class="nav-btn" aria-label="Profile"><span data-icon="user" data-icon-size="18"></span></button>
          </div>
        </div>

        <div class="ps-scroll">
          <div class="pgreet" style="padding-top: 4px;">
            <div class="hi">St Faith's Park · Form 4 Faraday · Spring term · Week 6</div>
          </div>

          <div class="dash-tiles" style="padding-top: 8px;">
            <a class="dash-tile" href="timetable-app.html" data-dash-next aria-label="Next class"></a>
            <a class="dash-tile" href="assignments.html" data-dash-due aria-label="Assignments status"></a>
            <a class="dash-tile" href="library-app.html" data-dash-borrowed aria-label="Library status"></a>
          </div>

          <div style="height: 24px;"></div>
        </div>

        <div class="ps-tabbar">
          <a class="ps-tab active" href="dashboard.html"><span data-icon="home"></span>Home</a>
          <a class="ps-tab" href="timetable-app.html"><span data-icon="calendar"></span>Timetable</a>
          <a class="ps-tab" href="assignments.html"><span data-icon="check"></span>Tasks</a>
          <a class="ps-tab" href="library-app.html"><span data-icon="book"></span>Library</a>
        </div>
      </div>
    </div>
  </div>
</main>

</body>
</html>
