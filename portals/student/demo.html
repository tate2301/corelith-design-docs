<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Student portal demo · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../shared.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<script src="../../icons.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
<style>
  body { background: var(--gray-100); margin: 0; }

  /* === Outer stage (desktop wraps in a phone device frame) === */
  .sd-stage {
    min-height: calc(100vh - 47px); /* minus pk-nav */
    display: grid; place-items: center;
    padding: 32px 24px;
  }
  .sd-frame {
    width: 390px; height: 780px; border-radius: 48px;
    background: #0F1115; padding: 12px;
    box-shadow: 0 30px 60px -20px rgba(22,24,29,0.25), 0 0 0 1px rgba(22,24,29,0.08);
    position: relative; flex: none;
  }
  .sd-frame::before {
    content: ""; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 30px; background: #0F1115; border-radius: 0 0 18px 18px; z-index: 20;
  }
  .sd-frame .screen {
    width: 100%; height: 100%; border-radius: 36px;
    overflow: hidden; background: var(--canvas);
    position: relative; display: flex; flex-direction: column;
  }

  /* Fullscreen mode — drop the chrome and the device frame, fill viewport */
  body.is-fullscreen { background: var(--ink); }
  body.is-fullscreen .pk-nav { display: none !important; }
  body.is-fullscreen .sd-stage { padding: 0; min-height: 100vh; min-height: 100dvh; }
  body.is-fullscreen .sd-frame { width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; padding: 0; }
  body.is-fullscreen .sd-frame::before { display: none; }
  body.is-fullscreen .sd-frame .screen { border-radius: 0; }

  /* On true phones, also drop the device frame */
  @media (max-width: 720px) {
    .sd-stage { padding: 0; min-height: calc(100dvh - 47px); }
    .sd-frame { width: 100%; height: calc(100dvh - 47px); border-radius: 0; padding: 0; }
    .sd-frame::before { display: none; }
    .sd-frame .screen { border-radius: 0; }
  }

  /* Floating fullscreen toggle (sits on top of frame) */
  .fs-toggle {
    position: fixed; top: 60px; right: 16px; z-index: 80;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 11px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-strong); cursor: pointer;
    font: 500 12px/1 var(--font-sans);
    box-shadow: 0 6px 14px -4px rgba(0,0,0,0.16);
  }
  .fs-toggle:hover { background: var(--surface-muted); }
  body.is-fullscreen .fs-toggle {
    top: 12px; right: 12px;
    background: rgba(255,255,255,0.95);
  }

  /* === Reusable in-screen widgets === */
  .greet { padding: 18px 16px 6px; }
  .greet .hi { font: 500 13px/1.3 var(--font-sans); color: var(--text-muted); }
  .greet h1 { font: 700 24px/1.15 var(--font-sans); letter-spacing: -0.02em; color: var(--text-strong); margin: 4px 0 0; }
  .greet .meta { font: 500 12px/1.3 var(--font-sans); color: var(--text-subtle); margin-top: 6px; }

  .next-class { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; cursor: pointer; transition: border-color 120ms; }
  .next-class:active { border-color: var(--brand-200); }
  .next-class .badge { width: 56px; height: 56px; border-radius: 12px; background: #DDEAFE; color: #0B5DF0; display: grid; place-items: center; }
  .next-class .badge .col { display: grid; gap: 3px; place-items: center; }
  .next-class .badge .t { font: 700 14px/1 var(--font-mono); }
  .next-class .badge .d { font: 500 9px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .next-class .nm { font: 600 15px/1.3 var(--font-sans); color: var(--text-strong); }
  .next-class .sb { font: 12px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .next-class .meta { font: 500 11px/1 var(--font-mono); color: var(--text-subtle); margin-top: 6px; display: inline-flex; gap: 10px; }

  .week-glance { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
  .week-glance .h { font: 600 13px/1 var(--font-sans); color: var(--text-strong); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .week-glance .h .sb { font: 500 11px/1 var(--font-mono); color: var(--text-muted); }
  .week-glance .days { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .week-glance .day { padding: 6px 2px; border-radius: 6px; text-align: center; background: var(--surface-muted); display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .week-glance .day.today { background: var(--brand-soft); }
  .week-glance .day .lbl { font: 600 10px/1 var(--font-sans); color: var(--text-muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .week-glance .day.today .lbl { color: var(--brand-strong); }
  .week-glance .day .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-strong); }
  .week-glance .day .dots { display: inline-flex; gap: 2px; }

  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .kpi .l { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); }
  .kpi .v { font: 700 22px/1 var(--font-sans); color: var(--text-strong); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .kpi .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .kpi.brand { background: var(--ink); color: #fff; border-color: transparent; }
  .kpi.brand .l { color: rgba(255,255,255,0.65); }
  .kpi.brand .v { color: #fff; }
  .kpi.brand .sb { color: rgba(255,255,255,0.75); }
  .kpi .delta { font: 500 11px/1 var(--font-sans); color: var(--tone-success); margin-left: 6px; }
  .kpi .delta.down { color: var(--tone-danger); }

  .grade-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
  .grade-card .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .grade-card .top .lbl { font: 600 13px/1 var(--font-sans); color: var(--text-strong); }
  .grade-card .top .delta { font: 500 12px/1 var(--font-sans); color: var(--tone-success); }
  .spark { display: block; width: 100%; height: 52px; }
  .grade-card .legend { display: flex; justify-content: space-between; font: 500 10.5px/1 var(--font-mono); color: var(--text-muted); margin-top: 6px; }
  .grade-card .recent { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .grade-card .recent .pill { font: 500 11px/1 var(--font-sans); padding: 5px 9px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-strong); }
  .grade-card .recent .pill b { font-weight: 700; margin-left: 4px; color: var(--brand-strong); }

  /* === Timetable === */
  .tt-wk-nav { display: flex; align-items: center; gap: 8px; padding: 12px 16px 4px; }
  .tt-wk-nav .arr { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; cursor: pointer; }
  .tt-wk-nav .arr:hover { background: var(--surface-sunken); }
  .tt-wk-nav .lbl { flex: 1; text-align: center; font: 600 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .tt-wk-nav .lbl .sb { font: 11px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 2px; display: block; }

  .tt-grid { padding: 4px 12px 12px; }
  .tt-grid .ttbl { display: grid; grid-template-columns: 36px repeat(5, 1fr); gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px; }
  .tt-grid .hd { font: 600 10px/1 var(--font-sans); color: var(--text-strong); text-align: center; padding: 6px 0 4px; }
  .tt-grid .hd.today { color: var(--brand-strong); }
  .tt-grid .tm { font: 500 9px/1.2 var(--font-mono); color: var(--text-subtle); text-align: right; padding: 6px 4px 0 0; }
  .tt-grid .cell { padding: 0; min-height: 42px; }
  .tt-grid .pd { background: var(--surface-muted); border-radius: 6px; padding: 5px 5px; height: 100%; min-height: 42px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; transition: transform 100ms; border-left: 3px solid var(--brand); }
  .tt-grid .pd:active { transform: scale(0.97); }
  .tt-grid .pd .nm { font: 600 10px/1.1 var(--font-sans); color: var(--text-strong); }
  .tt-grid .pd .rm { font: 500 9px/1 var(--font-mono); color: var(--text-muted); margin-top: auto; }
  .tt-grid .pd.s-maths   { background: #DDEAFE; border-color: #0B5DF0; }
  .tt-grid .pd.s-english { background: #FAE8FF; border-color: #C026D3; }
  .tt-grid .pd.s-shona   { background: #FEE2E2; border-color: #DC2626; }
  .tt-grid .pd.s-history { background: #FFEDD5; border-color: #EA580C; }
  .tt-grid .pd.s-science { background: #DCFCE7; border-color: #16A34A; }
  .tt-grid .pd.s-rs      { background: #ECFCCB; border-color: #65A30D; }
  .tt-grid .pd.s-geo     { background: #CFFAFE; border-color: #0891B2; }
  .tt-grid .pd.brk { background: transparent; border: 1px dashed var(--border-strong); justify-content: center; }
  .tt-grid .pd.brk .nm { color: var(--text-subtle); font-weight: 500; }
  .tt-grid .pd .test { width: 5px; height: 5px; border-radius: 50%; background: var(--tone-danger); position: absolute; }

  .tt-grid .cell.today .pd { box-shadow: 0 0 0 2px rgba(11,93,240,0.18); }

  .tt-summary { padding: 0 16px; }
  .tt-summary .h { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); padding: 14px 4px 8px; }

  /* === Marks === */
  .term-tabs { display: inline-flex; padding: 4px; background: var(--surface-muted); border-radius: 10px; gap: 2px; }
  .term-tabs button { padding: 7px 14px; border-radius: 8px; font: 500 13px/1 var(--font-sans); color: var(--text-muted); background: transparent; border: 0; cursor: pointer; }
  .term-tabs button.on { background: var(--surface); color: var(--text-strong); box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600; }

  .stats-card { background: var(--ink); color: #fff; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; position: relative; overflow: clip; }
  .stats-card::before { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,0.32), transparent 70%); }
  .stats-card .col .lbl { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.7; }
  .stats-card .col .val { font: 700 30px/1.05 var(--font-sans); letter-spacing: -0.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .stats-card .col .sb { font: 12px/1.3 var(--font-sans); opacity: 0.8; margin-top: 4px; }
  .stats-card .col .val .u { font-size: 14px; opacity: 0.7; margin-left: 4px; }
  .stats-card .pos-pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(251,146,60,0.22); color: #FCD34D; border-radius: 9999px; font: 600 11px/1 var(--font-sans); margin-top: 8px; }

  .subj-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; cursor: pointer; transition: transform 100ms, border-color 120ms; }
  .subj-card:active { transform: scale(0.99); border-color: var(--brand-200); }
  .subj-card .head { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: center; }
  .subj-card .head .tag { width: 8px; height: 36px; border-radius: 4px; }
  .subj-card .head .nm { font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .subj-card .head .sb { font: 11px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .subj-card .head .pct { font: 700 20px/1 var(--font-sans); color: var(--text-strong); font-variant-numeric: tabular-nums; }
  .subj-card .head .pct .of { font: 500 11px/1 var(--font-sans); color: var(--text-subtle); }
  .subj-card .bar { height: 6px; background: var(--surface-muted); border-radius: 9999px; margin: 10px 0 0 20px; overflow: hidden; }
  .subj-card .bar > span { display: block; height: 100%; border-radius: inherit; }

  /* Sheet: marks subject detail */
  .ca-list { display: grid; gap: 4px; margin-top: 8px; }
  .ca-list .row { display: grid; grid-template-columns: 1fr auto; padding: 8px 12px; background: var(--surface-muted); border-radius: 8px; font: 500 13px var(--font-sans); color: var(--text-body); }
  .ca-list .row .v { font-family: var(--font-mono); color: var(--text-strong); font-weight: 600; }
  .histogram { display: flex; align-items: flex-end; gap: 4px; height: 80px; padding: 8px 0; }
  .histogram .b { flex: 1; background: var(--surface-muted); border-radius: 4px 4px 0 0; position: relative; }
  .histogram .b.me { background: var(--brand); }
  .histogram .b .lbl { position: absolute; left: 0; right: 0; bottom: -16px; text-align: center; font: 500 9px/1 var(--font-mono); color: var(--text-subtle); }

  /* === Assignments === */
  .filter-chips { display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto; scrollbar-width: none; }
  .filter-chips::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 9999px; font: 500 12.5px/1 var(--font-sans); color: var(--text-strong); white-space: nowrap; cursor: pointer; }
  .chip .ct { font: 600 11px/1 var(--font-sans); padding: 2px 7px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-muted); }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .chip.on .ct { background: rgba(255,255,255,0.22); color: #fff; }

  .as-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 0 16px 10px; display: grid; grid-template-columns: 6px 1fr; gap: 12px; cursor: pointer; transition: border-color 120ms, transform 100ms; }
  .as-card:active { transform: scale(0.99); border-color: var(--brand-200); }
  .as-card .tag { width: 6px; border-radius: 3px; align-self: stretch; }
  .as-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .as-card .subj { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
  .as-card .nm { font: 600 14.5px/1.35 var(--font-sans); color: var(--text-strong); margin-top: 4px; }
  .as-card .sb { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 4px; }
  .as-card .meta { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .as-card .due { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-strong); font: 500 11px/1 var(--font-sans); }
  .as-card .due.urgent { background: var(--tone-warn-bg); color: var(--tone-warn); }
  .as-card .due.overdue { background: var(--tone-danger); color: #fff; }
  .as-card .due.done { background: var(--tone-success-bg); color: var(--tone-success); }
  .as-card .due.graded { background: var(--brand-soft); color: var(--brand-strong); }

  /* === Library === */
  .lib-search { display: flex; align-items: center; gap: 8px; margin: 12px 16px 6px; padding: 10px 12px; background: var(--surface-muted); border-radius: 12px; }
  .lib-search input { flex: 1; border: 0; background: transparent; outline: 0; font: 500 14px/1 var(--font-sans); color: var(--text-strong); }
  .lib-search input::placeholder { color: var(--text-subtle); }
  .lib-search .ic { color: var(--text-muted); cursor: pointer; }

  .fines-pill { display: flex; align-items: center; gap: 10px; margin: 8px 16px; padding: 10px 12px; background: #FEE2E2; border: 1px solid #FCA5A5; border-radius: 12px; }
  .fines-pill .ic { width: 32px; height: 32px; border-radius: 8px; background: #fff; color: var(--tone-danger); display: grid; place-items: center; }
  .fines-pill .nm { font: 600 13.5px/1.3 var(--font-sans); color: #7F1D1D; }
  .fines-pill .sb { font: 11.5px/1.3 var(--font-sans); color: #991B1B; margin-top: 2px; }
  .fines-pill .val { margin-left: auto; font: 700 14px/1 var(--font-mono); color: #7F1D1D; }
  .fines-pill button { font: 600 11px var(--font-sans); padding: 6px 10px; border-radius: 8px; background: #fff; color: #7F1D1D; cursor: pointer; }

  .borrow-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin: 0 16px 10px; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
  .book-cover { width: 56px; height: 78px; border-radius: 6px; background: linear-gradient(135deg, #C2410C, #7C2D12); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 6px 5px; font: 700 8.5px/1.1 var(--font-sans); position: relative; overflow: hidden; }
  .book-cover::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: rgba(0,0,0,0.2); }
  .book-cover.green { background: linear-gradient(135deg, #166534, #14532D); }
  .book-cover.blue { background: linear-gradient(135deg, #0B5DF0, #1E40AF); }
  .book-cover.purple { background: linear-gradient(135deg, #6B21A8, #4C1D95); }
  .book-cover.pink { background: linear-gradient(135deg, #DB2777, #831843); }
  .book-cover.amber { background: linear-gradient(135deg, #D97706, #78350F); }
  .borrow-card .nm { font: 600 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .borrow-card .sb { font: 11.5px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .borrow-card .due { font: 500 11px/1 var(--font-mono); color: var(--text-muted); margin-top: 6px; display: inline-flex; align-items: center; gap: 4px; }
  .borrow-card .due.urgent { color: var(--tone-warn); }
  .borrow-card .due.overdue { color: var(--tone-danger); font-weight: 700; }
  .borrow-card .renew { padding: 6px 10px; border-radius: 8px; background: var(--surface-muted); font: 600 11px/1 var(--font-sans); color: var(--text-strong); border: 0; cursor: pointer; }
  .borrow-card .renew:hover { background: var(--surface-sunken); }

  .scan-cta { margin: 8px 16px 10px; padding: 14px 16px; background: var(--ink); color: #fff; border-radius: 14px; display: flex; align-items: center; gap: 14px; position: relative; overflow: clip; cursor: pointer; }
  .scan-cta::before { content: ""; position: absolute; right: -30px; top: -30px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(251,146,60,0.32), transparent 70%); }
  .scan-cta .qr { width: 44px; height: 44px; border-radius: 10px; background: rgba(255,255,255,0.12); color: #FCD34D; display: grid; place-items: center; flex: none; }
  .scan-cta .nm { font: 600 14px/1.3 var(--font-sans); }
  .scan-cta .sb { font: 12px/1.4 var(--font-sans); opacity: 0.78; margin-top: 3px; }
  .scan-cta .arrow { margin-left: auto; opacity: 0.7; }

  .catalog-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 0 16px 8px; display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center; cursor: pointer; }
  .catalog-card .cv { width: 42px; height: 58px; }
  .catalog-card .nm { font: 600 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .catalog-card .sb { font: 11px/1.3 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .catalog-card .borrow { font: 600 11px var(--font-sans); padding: 6px 10px; border-radius: 8px; background: var(--brand-soft); color: var(--brand-strong); cursor: pointer; border: 0; }
  .catalog-card .out { font: 500 11px var(--font-sans); padding: 6px 10px; border-radius: 8px; background: var(--surface-muted); color: var(--text-muted); }

  /* === Profile === */
  .id-card { background: linear-gradient(135deg, #7C2D12, #C2410C); color: #fff; border-radius: 16px; padding: 16px; margin: 12px 16px 8px; position: relative; overflow: clip; }
  .id-card::before { content: ""; position: absolute; right: -50px; bottom: -50px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .id-card .top { display: flex; align-items: center; gap: 14px; }
  .id-card .avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #FFE4D3, #FB923C); color: #7C2D12; display: grid; place-items: center; font: 700 22px/1 var(--font-sans); flex: none; }
  .id-card .nm { font: 700 17px/1.2 var(--font-sans); letter-spacing: -0.01em; }
  .id-card .sb { font: 12.5px/1.4 var(--font-sans); opacity: 0.85; margin-top: 3px; }
  .id-card .ids { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
  .id-card .ids .pill { font: 500 11px/1 var(--font-mono); padding: 4px 9px; border-radius: 9999px; background: rgba(255,255,255,0.18); }
  .id-card .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.18); }
  .id-card .stats .s .l { font: 500 10px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
  .id-card .stats .s .v { font: 700 17px/1 var(--font-sans); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .id-card .stats .s .v .u { font: 500 11px/1 var(--font-sans); opacity: 0.7; margin-left: 2px; }

  .toggle { width: 38px; height: 22px; background: var(--brand); border-radius: 9999px; padding: 2px; position: relative; cursor: pointer; transition: background 120ms; }
  .toggle::after { content: ""; width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 2px; right: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.2); transition: all 120ms; }
  .toggle.off { background: var(--surface-sunken); }
  .toggle.off::after { right: auto; left: 2px; }

  .seg { display: inline-flex; padding: 2px; background: var(--surface-muted); border-radius: 8px; }
  .seg button { padding: 6px 12px; border-radius: 6px; font: 500 12px var(--font-sans); color: var(--text-muted); background: transparent; cursor: pointer; border: 0; }
  .seg button.on { background: var(--surface); color: var(--text-strong); box-shadow: 0 1px 2px rgba(0,0,0,0.06); font-weight: 600; }

  .sign-out { margin: 14px 16px 0; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font: 600 14px/1 var(--font-sans); color: var(--tone-danger); cursor: pointer; }
  .sign-out:hover { background: var(--tone-danger-bg); }

  /* === Sheets, modals, toasts === */
  .sheet-scrim {
    position: fixed; inset: 0; background: rgba(22,24,29,0.55);
    z-index: 100;
    display: flex; align-items: flex-end; justify-content: center;
    animation: scrimIn 160ms ease;
  }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: var(--surface); border-top-left-radius: 18px; border-top-right-radius: 18px;
    width: 100%; max-width: 460px;
    max-height: 86%;
    display: flex; flex-direction: column;
    box-shadow: 0 -20px 40px -10px rgba(0,0,0,0.3);
    animation: sheetIn 260ms cubic-bezier(0.2, 0, 0.1, 1);
    overflow: hidden;
  }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet .grab { width: 36px; height: 4px; border-radius: 4px; background: var(--border-strong); margin: 8px auto 0; flex: none; }
  .sheet .sh-head { display: flex; align-items: center; gap: 10px; padding: 10px 18px 6px; flex: none; }
  .sheet .sh-head h2 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; flex: 1; }
  .sheet .sh-head .close { width: 32px; height: 32px; border-radius: 8px; background: var(--surface-muted); display: grid; place-items: center; cursor: pointer; color: var(--text-strong); }
  .sheet .sh-body { padding: 6px 18px 18px; overflow-y: auto; flex: 1; }
  .sheet .sh-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-subtle); display: flex; gap: 8px; flex: none; }
  .sheet .sh-foot button { flex: 1; padding: 12px; border-radius: 10px; font: 600 13.5px/1 var(--font-sans); cursor: pointer; border: 0; }
  .sheet .sh-foot button.primary { background: var(--brand); color: #fff; }
  .sheet .sh-foot button.primary:hover { background: var(--brand-strong); }
  .sheet .sh-foot button.alt { background: var(--surface-muted); color: var(--text-strong); }

  /* Inside sheet contents */
  .key-fact { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .key-fact .kf { padding: 10px 12px; background: var(--surface-muted); border-radius: 8px; }
  .key-fact .kf .l { font: 500 10.5px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); }
  .key-fact .kf .v { font: 600 14px/1.2 var(--font-mono); color: var(--text-strong); margin-top: 5px; }
  .desc { font: 13.5px/1.55 var(--font-sans); color: var(--text-body); margin: 10px 0; }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--surface-muted); border-radius: 8px; margin-bottom: 6px; }
  .file-row .ic { width: 32px; height: 32px; border-radius: 6px; background: var(--surface); color: var(--text-strong); display: grid; place-items: center; }
  .file-row .nm { font: 500 13px/1.3 var(--font-sans); color: var(--text-strong); }
  .file-row .sz { font: 11px/1.3 var(--font-mono); color: var(--text-muted); margin-top: 2px; }
  .ssh { font: 500 11px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); margin: 14px 0 8px; }

  /* Confirm modal (centered) */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(22,24,29,0.6);
    z-index: 120; display: grid; place-items: center; padding: 24px;
    animation: scrimIn 160ms ease;
  }
  .modal {
    background: var(--surface); border-radius: 14px; padding: 20px;
    width: 100%; max-width: 340px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4);
    animation: modalIn 220ms cubic-bezier(0.2, 0, 0.1, 1);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { font: 600 16px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 6px; }
  .modal .sub { font: 13px/1.4 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .modal .acts { display: flex; gap: 6px; }
  .modal .acts button { flex: 1; padding: 11px; border-radius: 8px; font: 600 13px var(--font-sans); cursor: pointer; border: 0; }
  .modal .acts .ok { background: var(--tone-danger); color: #fff; }
  .modal .acts .ok.brand { background: var(--brand); color: #fff; }
  .modal .acts .alt { background: var(--surface-muted); color: var(--text-strong); }

  /* Toast */
  .toast-host { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
  .toast {
    background: var(--ink); color: #fff; padding: 10px 16px;
    border-radius: 9999px; font: 500 13px/1.3 var(--font-sans);
    box-shadow: 0 8px 20px -6px rgba(0,0,0,0.3);
    display: inline-flex; align-items: center; gap: 8px;
    animation: toastIn 240ms ease; pointer-events: auto;
  }
  .toast.success { background: var(--tone-success); }
  .toast.danger { background: var(--tone-danger); }
  .toast.warn { background: var(--tone-warn); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .toast.out { animation: toastOut 240ms ease forwards; }
  @keyframes toastOut { to { opacity: 0; transform: translate(-50%, -10px); } }

  /* Sign-out confirmation success splash */
  .signed-out { display: grid; place-items: center; height: 100%; text-align: center; padding: 40px 24px; }
  .signed-out .ico { width: 60px; height: 60px; border-radius: 50%; background: var(--tone-success-bg); color: var(--tone-success); display: grid; place-items: center; margin-bottom: 16px; }
  .signed-out h2 { font: 700 22px/1.2 var(--font-sans); color: var(--text-strong); margin: 0 0 6px; }
  .signed-out p { font: 13.5px/1.55 var(--font-sans); color: var(--text-muted); margin: 0 0 20px; max-width: 280px; }
  .signed-out button { padding: 11px 18px; border-radius: 9px; background: var(--brand); color: #fff; font: 600 13.5px var(--font-sans); cursor: pointer; border: 0; }

  /* Lightweight psh inside the demo */
  .demo-psh { padding: 14px 4px 8px; font: 500 11.5px/1 var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-subtle); display: flex; align-items: center; justify-content: space-between; }
  .demo-psh a { font: 500 12px/1 var(--font-sans); color: var(--brand-strong); text-decoration: none; letter-spacing: 0; text-transform: none; cursor: pointer; }

  /* Empty state */
  .empty-state { padding: 40px 24px; text-align: center; color: var(--text-muted); font: 13px/1.5 var(--font-sans); }
  .empty-state .lg { color: var(--text-subtle); margin-bottom: 10px; display: inline-block; }

  /* === Sign-in === */
  .signin { display: flex; flex-direction: column; flex: 1; min-height: 0; padding: 22px 22px 14px; background: linear-gradient(180deg, var(--surface) 0%, var(--surface) 50%, var(--brand-soft) 100%); position: relative; overflow-y: auto; }
  .signin .logo { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #FB923C, #C2410C); color: #fff; display: grid; place-items: center; font: 800 22px var(--font-sans); margin-bottom: 18px; box-shadow: 0 8px 20px -6px rgba(194,65,12,0.4); }
  .signin h1 { font: 700 24px/1.2 var(--font-sans); color: var(--text-strong); margin: 0; letter-spacing: -0.02em; }
  .signin .lede { font: 14px/1.45 var(--font-sans); color: var(--text-muted); margin: 6px 0 22px; }
  .signin .field { margin-bottom: 12px; }
  .signin .field label { font: 500 11.5px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-subtle); display: block; margin-bottom: 6px; }
  .signin .field input { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); font: 500 15px/1 var(--font-sans); color: var(--text-strong); outline: 0; }
  .signin .field input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .signin .field .err { font: 500 11.5px/1.3 var(--font-sans); color: var(--tone-danger); margin-top: 5px; min-height: 14px; }
  .signin .otp { display: flex; gap: 8px; justify-content: space-between; }
  .signin .otp input { flex: 1; padding: 0; box-sizing: border-box; }
  .signin .row-act { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 18px; }
  .signin .row-act .remember { display: inline-flex; align-items: center; gap: 6px; font: 500 12.5px var(--font-sans); color: var(--text-muted); cursor: pointer; }
  .signin .row-act .remember .cb { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface); display: grid; place-items: center; color: transparent; }
  .signin .row-act .remember.on .cb { background: var(--brand); border-color: var(--brand); color: #fff; }
  .signin .row-act .forgot { font: 500 12.5px var(--font-sans); color: var(--brand-strong); cursor: pointer; }
  .signin button.primary { width: 100%; padding: 14px; border-radius: 10px; background: var(--ink); color: #fff; font: 600 14.5px var(--font-sans); cursor: pointer; border: 0; box-shadow: 0 8px 18px -6px rgba(22,24,29,0.3); }
  .signin button.primary:hover { background: #0b0d11; }
  .signin button.primary[disabled] { opacity: 0.55; cursor: not-allowed; }
  .signin .or { display: flex; align-items: center; gap: 10px; margin: 18px 0; font: 500 11px var(--font-sans); color: var(--text-subtle); letter-spacing: 0.1em; }
  .signin .or::before, .signin .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .signin .biometric { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text-strong); font: 600 14px var(--font-sans); cursor: pointer; }
  .signin .biometric:hover { background: var(--surface-muted); }
  .signin .biometric .ic { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; }
  .signin .foot { margin-top: 18px; padding-top: 14px; text-align: center; font: 500 11.5px/1.5 var(--font-sans); color: var(--text-subtle); border-top: 1px dashed var(--border); }
  .signin .foot strong { color: var(--text-muted); font-weight: 600; }

  /* === Onboarding tour === */
  .tour-scrim { position: fixed; inset: 0; background: rgba(11,13,16,0.78); z-index: 130; display: flex; flex-direction: column; justify-content: flex-end; padding: 24px; animation: scrimIn 200ms ease; }
  .tour-card { background: var(--surface); border-radius: 16px; padding: 22px; max-width: 360px; margin: 0 auto; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5); }
  .tour-card .step { font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--brand-strong); }
  .tour-card h3 { font: 700 18px/1.25 var(--font-sans); color: var(--text-strong); margin: 6px 0 8px; letter-spacing: -0.01em; }
  .tour-card p { font: 13.5px/1.55 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .tour-card .dots { display: flex; gap: 4px; margin: 0 0 14px; }
  .tour-card .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--surface-sunken); }
  .tour-card .dots span.on { width: 22px; background: var(--brand); border-radius: 9999px; }
  .tour-card .acts { display: flex; gap: 8px; }
  .tour-card .acts button { flex: 1; padding: 11px; border-radius: 9px; font: 600 13px var(--font-sans); cursor: pointer; border: 0; }
  .tour-card .acts .skip { background: transparent; color: var(--text-muted); flex: 0 0 auto; padding: 11px 14px; }
  .tour-card .acts .next { background: var(--brand); color: #fff; }

  /* === Offline banner === */
  .offline-banner { background: #FEF3C7; color: #78350F; padding: 7px 14px; font: 500 12px/1.3 var(--font-sans); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #FCD34D; flex: none; }
  .offline-banner .dot { width: 7px; height: 7px; border-radius: 50%; background: #B45309; animation: blink 1.4s infinite; }
  @keyframes blink { 0%, 60% { opacity: 1; } 30% { opacity: 0.35; } }

  /* === Notifications === */
  .notif-row { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border-subtle); cursor: pointer; background: var(--surface); }
  .notif-row.unread { background: var(--brand-soft); }
  .notif-row.unread::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); align-self: center; flex: none; margin-right: -4px; }
  .notif-row .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; }
  .notif-row .ic.grade { background: #DCFCE7; color: #16A34A; }
  .notif-row .ic.assign { background: #FFEDD5; color: #EA580C; }
  .notif-row .ic.broadcast { background: #DDEAFE; color: #0B5DF0; }
  .notif-row .ic.fee { background: #F3E8FF; color: #7E22CE; }
  .notif-row .ic.library { background: #FEE2E2; color: #DC2626; }
  .notif-row .nm { font: 600 13.5px/1.3 var(--font-sans); color: var(--text-strong); }
  .notif-row .sb { font: 12.5px/1.45 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .notif-row .tm { font: 500 11px/1 var(--font-mono); color: var(--text-subtle); margin-top: 5px; }
  .notif-row .body { flex: 1; min-width: 0; }

  /* === Goals === */
  .goal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 8px; }
  .goal-card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .goal-card .tag { width: 8px; height: 26px; border-radius: 4px; flex: none; }
  .goal-card .nm { font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .goal-card .sb { font: 11.5px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 3px; }
  .goal-card .target { font: 600 12.5px/1 var(--font-mono); color: var(--text-strong); }
  .goal-card .target .of { color: var(--text-subtle); font-weight: 500; }
  .goal-card .bar { height: 8px; background: var(--surface-muted); border-radius: 9999px; margin: 12px 0 4px; overflow: hidden; position: relative; }
  .goal-card .bar > span { display: block; height: 100%; border-radius: inherit; }
  .goal-card .bar .marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .goal-card .delta { font: 500 11.5px/1 var(--font-sans); color: var(--tone-success); display: inline-flex; align-items: center; gap: 4px; }
  .goal-card .delta.down { color: var(--tone-danger); }

  .week-progress { background: linear-gradient(135deg, #C2410C, #7C2D12); color: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; position: relative; overflow: clip; }
  .week-progress::before { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
  .week-progress .lbl { font: 500 11px var(--font-sans); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.78; }
  .week-progress .val { font: 700 28px/1.05 var(--font-sans); margin-top: 6px; }
  .week-progress .sb { font: 12.5px/1.45 var(--font-sans); opacity: 0.86; margin-top: 4px; }
  .week-progress .bars { display: flex; gap: 4px; margin-top: 12px; height: 32px; align-items: flex-end; }
  .week-progress .bars .b { flex: 1; background: rgba(255,255,255,0.22); border-radius: 4px 4px 0 0; position: relative; }
  .week-progress .bars .b.fill { background: #FCD34D; }
  .week-progress .bars .lbl-row { display: flex; gap: 4px; margin-top: 4px; }
  .week-progress .bars .lbl-row span { flex: 1; text-align: center; font: 500 9px/1 var(--font-mono); opacity: 0.7; }

  /* === Help & how-to === */
  .help-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 8px; cursor: pointer; }
  .help-card .h { display: flex; align-items: center; gap: 10px; }
  .help-card .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--brand-soft); color: var(--brand-strong); display: grid; place-items: center; flex: none; }
  .help-card .nm { font: 600 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .help-card .sb { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 3px; }

  /* === Settings rows === */
  .setting-row { display: flex; gap: 12px; padding: 12px 14px; align-items: center; background: var(--surface); border-bottom: 1px solid var(--border-subtle); }
  .setting-row:first-child { border-radius: 12px 12px 0 0; }
  .setting-row:last-child { border-bottom: 0; border-radius: 0 0 12px 12px; }
  .setting-row:only-child { border-radius: 12px; }
  .setting-row .ic-tile { width: 34px; height: 34px; border-radius: 9px; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; flex: none; }
  .setting-row .nm { font: 500 14px/1.3 var(--font-sans); color: var(--text-strong); }
  .setting-row .sb { font: 12px/1.4 var(--font-sans); color: var(--text-muted); margin-top: 2px; }
  .setting-row .body { flex: 1; min-width: 0; }
  .setting-group { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }

  /* === Plagiarism notice === */
  .plagiarism { display: flex; gap: 10px; padding: 10px 12px; background: #FEF3C7; border: 1px solid #FCD34D; color: #78350F; border-radius: 10px; font: 500 12px/1.45 var(--font-sans); margin: 10px 0; }
  .plagiarism .ic { color: #B45309; flex: none; }

  /* === Submit progress / receipt === */
  .submit-progress { padding: 16px; text-align: center; }
  .submit-progress .ring { width: 80px; height: 80px; border-radius: 50%; border: 6px solid var(--brand-soft); border-top-color: var(--brand); margin: 0 auto 14px; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .submit-progress .nm { font: 600 14px var(--font-sans); color: var(--text-strong); }
  .submit-progress .sb { font: 12.5px/1.45 var(--font-sans); color: var(--text-muted); margin-top: 5px; }
  .submit-progress .barwrap { height: 6px; background: var(--surface-muted); border-radius: 9999px; overflow: hidden; margin: 14px auto 0; max-width: 220px; }
  .submit-progress .barwrap > span { display: block; height: 100%; background: var(--brand); width: 0%; transition: width 200ms linear; border-radius: inherit; }
  .submit-receipt { padding: 6px 0 0; text-align: center; }
  .submit-receipt .check { width: 64px; height: 64px; border-radius: 50%; background: var(--tone-success-bg); color: var(--tone-success); display: grid; place-items: center; margin: 0 auto 14px; }
  .submit-receipt h3 { font: 700 18px var(--font-sans); color: var(--text-strong); margin: 0 0 4px; }
  .submit-receipt .sb { font: 13px/1.5 var(--font-sans); color: var(--text-muted); margin: 0 0 14px; }
  .submit-receipt .id { display: inline-block; padding: 7px 14px; border-radius: 9999px; background: var(--surface-muted); color: var(--text-strong); font: 600 12.5px/1 var(--font-mono); }

  /* === Comments === */
  .comment { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-subtle); }
  .comment:last-child { border-bottom: 0; }
  .comment .av { width: 32px; height: 32px; border-radius: 50%; background: var(--surface-muted); color: var(--text-strong); display: grid; place-items: center; font: 600 12px var(--font-sans); flex: none; }
  .comment .nm { font: 600 13px var(--font-sans); color: var(--text-strong); }
  .comment .tm { font: 500 11px var(--font-mono); color: var(--text-subtle); margin-left: 6px; }
  .comment .txt { font: 13px/1.5 var(--font-sans); color: var(--text-body); margin-top: 3px; }

const STORAGE_KEY = 'huchu.student.demo.v1';
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...DEFAULT_STATE };
    const saved = JSON.parse(raw);
    // Merge defensively
    return { ...DEFAULT_STATE, ...saved,
      prefs: { ...DEFAULT_STATE.prefs, ...(saved.prefs || {}) },
      notifs: Array.isArray(saved.notifs) && saved.notifs.length ? saved.notifs : DEFAULT_STATE.notifs.map(n => ({ ...n })),
    };
  } catch (e) { return { ...DEFAULT_STATE }; }
}
function persistState() {
  try {
    const { sheet, modal, sheetWire, modalWire, ...persistable } = state;

  } catch (e) { /* ignore */ }

/* === Toast === */
function toast(msg, kind = 'default') {
  const host = $('#toast-host');
  const el = document.createElement('div');
  el.className = 'toast' + (kind !== 'default' ? ' ' + kind : '');
  const icon = kind === 'success' ? 'check' : kind === 'danger' ? 'x' : kind === 'warn' ? 'info' : 'check';
  el.innerHTML = `<span data-icon="${icon}" data-icon-size="14"></span>${esc(msg)}`;
  host.appendChild(el);
  if (window.Icons) window.Icons.render(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 240); }, 2200);
}

/* === Sheet === */
function openSheet(html) { state.sheet = html; renderSheet(); }
function closeSheet() { state.sheet = null; renderSheet(); }
function renderSheet() {
  const host = $('#sheet-host');
  if (!state.sheet) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="sheet-scrim" data-scrim>${state.sheet}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-scrim]').addEventListener('click', (e) => {
    if (e.target.dataset.scrim !== undefined) closeSheet();
  });
  host.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheet));
  // Re-wire any in-sheet hooks the caller registered
  if (state.sheetWire) state.sheetWire();
}

/* === Modal === */
function openModal(html, wireFn) {
  state.modal = html;
  state.modalWire = wireFn || null;
  renderModal();
}
function closeModal() { state.modal = null; state.modalWire = null; renderModal(); }
function renderModal() {
  const host = $('#modal-host');
  if (!state.modal) { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="modal-scrim" data-mscrim>${state.modal}</div>`;
  if (window.Icons) window.Icons.render(host);
  host.querySelector('[data-mscrim]').addEventListener('click', (e) => {
    if (e.target.dataset.mscrim !== undefined) closeModal();
  });
  if (state.modalWire) state.modalWire();
}

/* === Routing === */
function go(route) {
  state.route = route;
  history.replaceState(null, '', '#/' + route);
  render();
  // Scroll the inner screen up
  const scr = $('.ps-scroll');
  if (scr) scr.scrollTop = 0;
}
window.addEventListener('hashchange', () => {
  const r = (location.hash.replace(/^#\/?/, '') || 'home');
  if (state.route !== r) { state.route = r; render(); }
});

/* === Top-level render === */
function render() {
  const isDark = state.prefs.theme === 'dark' || (state.prefs.theme === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.classList.toggle('is-dark', isDark);
  const app = $('#app');
  app.className = 'ps-screen' + (isDark ? ' is-dark' : '');
  let body;
  if (state.signedOut) {
    body = renderSignedOut();
  } else if (!state.signedIn) {
    body = renderSignIn();
  } else {
    body = (state.offline ? renderOfflineBanner() : '') + renderRoute();
  }
  app.innerHTML = `<div class="ps-screen ${isDark ? 'is-dark' : ''}" style="position:relative; height:100%; display:flex; flex-direction:column;">${body}</div>`;
  if (window.Icons) window.Icons.render($('#app'));
  if (state.signedOut) wireSignedOut();
  else if (!state.signedIn) wireSignIn();
  else { wireRoute(); maybeShowTour(); }
  persistState();
}

function renderOfflineBanner() {
  return `<div class="offline-banner"><span class="dot"></span><span data-icon="wifi" data-icon-size="13"></span> You are offline — viewing cached data. Submissions will queue.</div>`;
}

function renderRoute() {
  let body;
  switch (state.route) {
    case 'home':          body = renderHome(); break;
    case 'timetable':     body = renderTimetable(); break;
    case 'marks':         body = renderMarks(); break;
    case 'assignments':   body = renderAssignments(); break;
    case 'library':       body = renderLibrary(); break;
    case 'profile':       body = renderProfile(); break;
    case 'notifications': body = renderNotifications(); break;
    case 'goals':         body = renderGoals(); break;
    case 'help':          body = renderHelp(); break;
    case 'settings':      body = renderSettings(); break;
    default:              body = renderHome();
  }
  return body + renderTabbar();
}

function renderTabbar() {
  const tabs = [
    { route: 'home',        label: 'Home',      icon: 'home' },
    { route: 'timetable',   label: 'Timetable', icon: 'calendar' },
    { route: 'marks',       label: 'Marks',     icon: 'chart' },
    { route: 'profile',     label: 'Profile',   icon: 'user' },
  ];
  return `
    <div class="ps-tabbar">
      ${tabs.map(t => `
        <a class="ps-tab ${state.route === t.route ? 'active' : ''}" data-go="${t.route}">
          <span data-icon="${t.icon}"></span>${t.label}
        </a>
      `).join('')}
    </div>
  `;
}

/* === Status bar (reusable) === */
function renderStatusBar(opts = {}) {

function renderAssignments() {
  const counts = {
    upcoming: ASSIGNMENTS.filter(a => a.status === 'upcoming' && !state.asSubmitted[a.id]).length,
    overdue:  ASSIGNMENTS.filter(a => a.status === 'overdue'  && !state.asSubmitted[a.id]).length,
    submitted: ASSIGNMENTS.filter(a => a.status === 'submitted' || state.asSubmitted[a.id]).length,
    graded:   ASSIGNMENTS.filter(a => a.status === 'graded').length,
  };
  const filt = state.asFilter;
  const filtered = ASSIGNMENTS.filter(a => {
    const submittedNow = state.asSubmitted[a.id];
    if (filt === 'upcoming')  return a.status === 'upcoming' && !submittedNow;
    if (filt === 'overdue')   return a.status === 'overdue' && !submittedNow;
    if (filt === 'submitted') return a.status === 'submitted' || submittedNow;
    if (filt === 'graded')    return a.status === 'graded';
    return true;
  });

  return `
    ${renderStatusBar()}
    ${renderAppbar('Assignments', { actions: `
      <button class="nav-btn" data-act="search"><span data-icon="search" data-icon-size="18"></span></button>
      <button class="nav-btn" data-act="filter"><span data-icon="filter" data-icon-size="18"></span></button>
    `})}
    <div class="ps-scroll">
      <div class="filter-chips">
        ${[
          ['upcoming','Upcoming', counts.upcoming],
          ['overdue', 'Overdue',  counts.overdue],
          ['submitted','Submitted',counts.submitted],
          ['graded',  'Graded',   counts.graded],
        ].map(([id, lbl, c]) => `
          <button class="chip ${filt === id ? 'on' : ''}" data-filter="${id}">${lbl} <span class="ct">${c}</span></button>
        `).join('')}
      </div>

      <div style="padding: 8px 0 0;">
        ${filtered.length === 0 ? `
          <div class="empty-state">
            <span class="lg" data-icon="check" data-icon-size="32"></span>
            <div>Nothing in this list.</div>
            <div style="margin-top: 4px; font-size: 12px;">Check another filter above.</div>
          </div>
        ` : filtered.map(a => {
          const s = SUBJ[a.subject];
          const submittedNow = state.asSubmitted[a.id];
          const status = submittedNow ? 'submitted' : a.status;
          const dueLabel = submittedNow ? 'Submitted just now' : a.dueLabel;
          return `
            <div class="as-card" data-as="${a.id}">
              <div class="tag" style="background: ${s.colour};"></div>
              <div>
                <div class="top">
                  <div>
                    <div class="subj">${esc(s.name)}</div>
                    <div class="nm">${esc(a.title)}</div>
                    <div class="sb">${esc(s.teacher)} · ${esc(a.sub)}</div>
                  </div>
                </div>
                <div class="meta">
                  <span class="due ${status}">
                    <span data-icon="${status === 'graded' ? 'check' : status === 'submitted' ? 'check' : 'clock'}" data-icon-size="11"></span>
                    ${esc(dueLabel)}
                  </span>
                  ${a.grade ? `<span style="font: 600 12px var(--font-mono); color: var(--brand-strong);">${esc(a.grade)}</span>` : ''}
                </div>
              </div>
            </div>
          `;
        }).join('')}
      </div>

      <div style="height: 24px;"></div>
    </div>
  `;
}

/* Submit flow with upload progress + receipt */
function runSubmitSequence(id, a) {
  if (state.offline) {
    toast('Offline — submission queued. Will send when online.', 'warn');
    return;
  }
  const html = `
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="grab"></div>
      <div class="sh-head">
        <h2>Submitting…</h2>
      </div>
      <div class="sh-body">
        <div class="submit-progress">
          <div class="ring"></div>
          <div class="nm">Uploading ${esc(state.asUploadedFile[id] || 'file')}</div>
          <div class="sb" id="sp-stage">Encrypting on device…</div>
          <div class="barwrap"><span id="sp-bar"></span></div>
        </div>
      </div>
    </div>
  `;
  state.sheetWire = null;
  openSheet(html);
  let p = 0;
  const stages = ['Encrypting on device…', 'Uploading to school cloud…', 'Running Turnitin similarity check…', 'Notifying teacher…', 'Finalising…'];
  const tick = () => {
    p += 8 + Math.random() * 10;
    if (p > 100) p = 100;
    const bar = $('#sp-bar'); const stg = $('#sp-stage');
    if (bar) bar.style.width = p + '%';
    if (stg) stg.textContent = stages[Math.min(Math.floor(p / 22), stages.length - 1)];
    if (p < 100) setTimeout(tick, 220);
    else setTimeout(() => showSubmitReceipt(id, a), 320);
  };
  setTimeout(tick, 180);
}

function showSubmitReceipt(id, a) {
  state.asSubmitted[id] = true;
  delete state.asUploadedFile[id];
  const subId = 'SUB-' + Date.now().toString(36).toUpperCase().slice(-6);
  // Add notification
  const s = SUBJ[a.subject];
  state.notifs.unshift({
    id: 'n-sub-' + Date.now(),
    kind: 'assign',
    icon: 'check',
    title: 'Submitted · ' + a.title,
    body: 'Receipt ' + subId + ' — ' + s.teacher + ' will be notified.',
    time: 'just now',
    unread: true,
  });
  persistState();
  const html = `
    <div class="sheet" onclick="event.stopPropagation()">
      <div class="grab"></div>
      <div class="sh-head"><h2>Submission received</h2><span class="close" data-close><span data-icon="x" data-icon-size="16"></span></span></div>
      <div class="sh-body">
        <div class="submit-receipt">
          <div class="check"><span data-icon="check" data-icon-size="28"></span></div>
          <h3>Thanks, ${esc(STUDENT.short)}!</h3>
          <p class="sb">Your work for "${esc(a.title)}" is in. ${esc(s.teacher)} will mark and return it.</p>
          <div class="id">Receipt · ${esc(subId)}</div>
          <div style="font: 500 11.5px/1.4 var(--font-mono); color: var(--text-subtle); margin-top: 14px;">${new Date().toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}<br>St Faith's Park · ${esc(STUDENT.id)}</div>
        </div>
      </div>
      <div class="sh-foot">
        <button class="alt" data-close>Close</button>
        <button class="primary" data-share-receipt>Share receipt</button>
      </div>
    </div>
  `;
  state.sheetWire = () => {
    $('[data-share-receipt]')?.addEventListener('click', () => { closeSheet(); render(); toast('Receipt copied', 'success'); });
  };
  openSheet(html);
  render();
}

function wireSignIn() {
  const pins = $$('[data-pin]');
  // auto-advance
  pins.forEach((inp, i) => {
    inp.addEventListener('input', (e) => {
      const v = e.target.value.replace(/\D/g,'');
      e.target.value = v.slice(0,1);
      if (v && i < pins.length - 1) pins[i+1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && i > 0) pins[i-1].focus();
      if (e.key === 'Enter') doSignIn();
    });
  });
  if (pins[0]) setTimeout(() => pins[0].focus(), 60);
  const idInp = $('#si-id');
  if (idInp) idInp.addEventListener('input', (e) => { state._signinId = e.target.value; });

  $('#si-remember')?.addEventListener('click', () => {
    state._signinRemember = !state._signinRemember;
    render();
  });
  $('#si-forgot')?.addEventListener('click', () => {
    openModal(`
      <div class="modal" onclick="event.stopPropagation()">
        <h3>Reset your PIN</h3>
        <p class="sub">Visit your form teacher, Mrs Mlilo (Form 3B), with your student card. She will issue a one-time reset code.</p>
        <div class="acts">
          <button class="alt" data-cancel>Close</button>
          <button class="ok brand" data-ok>Open help</button>
        </div>
      </div>
    `, () => {
      $('[data-cancel]').addEventListener('click', closeModal);
      $('[data-ok]').addEventListener('click', () => { closeModal(); state.signedIn = true; go('help'); });
    });
  });
  $('#si-biometric')?.addEventListener('click', () => {
    toast('Touch sensor… (demo placeholder)', 'default');
    setTimeout(() => {
      state.signedIn = true;
      state._signinErr = null;
      toast('Welcome back, ' + STUDENT.short, 'success');
      render();
    }, 700);
  });
  $('#si-submit')?.addEventListener('click', doSignIn);

  function doSignIn() {
    const pin = pins.map(p => p.value).join('');
    const id = ($('#si-id')?.value || '').trim();
    if (!id) { state._signinErr = 'Enter your student ID.'; render(); return; }
    if (pin.length !== 4) { state._signinErr = 'Enter your 4-digit PIN.'; render(); return; }
    if (pin !== state.pin) { state._signinErr = 'PIN did not match. Try ' + state.pin + ' for the demo.'; render(); return; }
    state.signedIn = true;
    state._signinErr = null;
    toast('Welcome back, ' + STUDENT.short, 'success');
    render();
  }
}

function renderTour() {
  if (state.tourSeen) { $('#tour-host').innerHTML = ''; return; }
  const s = TOUR_STEPS[state.tourStep] || TOUR_STEPS[0];
  const last = state.tourStep === TOUR_STEPS.length - 1;
  const host = $('#tour-host');
  host.innerHTML = `
    <div class="tour-scrim">
      <div class="tour-card">
        <div class="step">${esc(s.step)}</div>
        <h3>${esc(s.h)}</h3>

        </div>
      </div>
    </div>
  `;
  if (window.Icons) window.Icons.render(host);
  $('#tour-skip').addEventListener('click', () => {
    state.tourSeen = true; state.tourStep = 0;
    persistState();
    renderTour();
  });
  $('#tour-next').addEventListener('click', () => {
    if (last) { state.tourSeen = true; state.tourStep = 0; renderTour(); toast('Tour finished · enjoy!', 'success'); }

  });
}

  });
  const met = goals.filter(g => g.current >= g.target).length;
  const wdSum = WEEK_PROGRESS.reduce((a, b) => a + b, 0);
  const wdAvg = Math.round(wdSum / 7);
  return `
    ${renderStatusBar()}

        ${goals.map(({s, target, current}) => {
          const pct = Math.min(100, Math.round(current/target*100));
          const on = current >= target;
          return `
            <div class="goal-card" data-goal="${s.id}">
              <div class="head">
                <span class="tag" style="background: ${s.colour};"></span>

function openChangePinSheet() {
  state._pinStep = 'current';
  state._pinDigits = '';
  state._pinNew = '';
  state._pinErr = '';
  function pinScreen() {
    const headByStep = {
      current: { h: 'Enter current PIN', sb: 'Confirm it\'s really you.' },
      new:     { h: 'Choose a new PIN',  sb: '4 digits · not your birthday.' },
      confirm: { h: 'Re-enter new PIN',   sb: 'Make sure you can remember it.' },
    };
    const cur = headByStep[state._pinStep];
    const html = `
      <div class="sheet" onclick="event.stopPropagation()">
        <div class="grab"></div>
        <div class="sh-head">
          <span class="ic-tile" style="background:var(--brand-soft); color:var(--brand-strong); width:36px; height:36px; display:grid; place-items:center; border-radius:8px;"><span data-icon="lock" data-icon-size="16"></span></span>
          <h2>Change PIN</h2>
          <span class="close" data-close><span data-icon="x" data-icon-size="16"></span></span>
        </div>
        <div class="sh-body">
          <div style="font: 600 16px var(--font-sans); color: var(--text-strong);">${esc(cur.h)}</div>
          <div style="font: 13px/1.45 var(--font-sans); color: var(--text-muted); margin-top: 4px;">${esc(cur.sb)}</div>
          <div class="otp" role="group" aria-label="4-digit PIN" style="justify-content: center; margin: 22px 0 6px;">
            ${[0,1,2,3].map(i => `<input type="password" inputmode="numeric" maxlength="1" autocomplete="one-time-code" data-pin-cell="${i}" value="${state._pinDigits[i] || ''}" aria-label="Digit ${i+1}" ${state._pinErr ? 'aria-invalid="true"' : ''} />`).join('')}
          </div>
          <div style="text-align:center; font: 500 12px var(--font-sans); color: var(--tone-danger); min-height: 16px;">${esc(state._pinErr || '')}</div>
        </div>
      </div>
    `;
    state.sheetWire = () => {
      const cells = $$('.sheet [data-pin-cell]');
      const sync = () => { state._pinDigits = cells.map(c => c.value).join('').replace(/\D/g, '').slice(0, 4); };
      cells.forEach((cell, idx) => {
        cell.addEventListener('input', (e) => {
          const v = (e.target.value || '').replace(/\D/g, '').slice(-1);
          e.target.value = v;
          state._pinErr = '';
          if (v && cells[idx + 1]) cells[idx + 1].focus();
          sync();
          if (state._pinDigits.length === 4) {
            setTimeout(() => {
              if (state._pinStep === 'current') {
                if (state._pinDigits === state.pin) { state._pinStep = 'new'; state._pinDigits = ''; pinScreen(); }
                else { state._pinErr = 'Wrong PIN — try ' + state.pin + ' (demo).'; state._pinDigits = ''; pinScreen(); }
              } else if (state._pinStep === 'new') {
                state._pinNew = state._pinDigits; state._pinStep = 'confirm'; state._pinDigits = ''; pinScreen();
              } else if (state._pinStep === 'confirm') {
                if (state._pinDigits === state._pinNew) {
                  state.pin = state._pinNew;
                  closeSheet(); toast('PIN updated', 'success'); persistState();
                } else {
                  state._pinErr = 'PINs did not match. Try again.';
                  state._pinStep = 'new'; state._pinDigits = ''; pinScreen();
                }
              }
            }, 180);
          }
        });
        cell.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !cell.value && cells[idx - 1]) { cells[idx - 1].focus(); cells[idx - 1].value = ''; sync(); }
        });
      });
      const focusCell = cells[Math.min(state._pinDigits.length, cells.length - 1)];
      if (focusCell) setTimeout(() => focusCell.focus(), 50);
    };
    openSheet(html);
  }
  pinScreen();
}

function wireRoute() {
  // Generic
  $$('[data-go]').forEach(b => b.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); go(b.dataset.go); }));
  $$('[data-back]').forEach(b => b.addEventListener('click', () => {
    const backRoutes = { notifications: 'home', goals: 'profile', help: 'profile', settings: 'profile', library: 'home', profile: 'home' };
    go(backRoutes[state.route] || 'home');
  }));
  $$('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'download' && state.route === 'marks') return openReportCardSheet();
    if (a === 'download' && state.route === 'timetable') return openTimetableExport();
    if (a === 'search') return toast('Search · type in the search bar');
    if (a === 'filter') return openAssignmentsFilterSheet();
    if (a === 'mark-all-read') { state.notifs.forEach(n => n.unread = false); render(); toast('All marked as read', 'success'); return; }
    if (a === 'clear-all') { state.notifs = []; render(); toast('Inbox cleared', 'success'); return; }
    if (a === 'goal-reset') { state.goalsOverride = {}; render(); toast('Targets reset to defaults', 'warn'); return; }
    if (a === 'goal-info') return toast('Targets help you focus per subject');
    if (a === 'change-pin') return openChangePinSheet();
    if (a === 'reset-tour') { state.tourSeen = false; state.tourStep = 0; go('home'); return; }
    if (a === 'reset-app') return openResetConfirm();
    if (a === 'edit-profile') return openEditProfileSheet();
    if (a === 'password') return openChangePinSheet();
    if (a === 'privacy') return go('settings');
    if (a === 'help-call') return toast('Calling Mrs Mlilo… (demo)');
    if (a === 'help-email') return toast('Mail draft opened');
    if (a === 'help-chat') return toast('Live chat queued');
    const messages = {
      bell: 'No new notifications',
      heart: 'Saved to favourites',
      history: 'Loan history opens here',
      'edit-list': 'Reading list editor opens here',
    };
    if (messages[a]) toast(messages[a]);
  }));

  switch (state.route) {
    case 'home':          wireHome(); break;
    case 'timetable':     wireTimetable(); break;
    case 'marks':         wireMarks(); break;
    case 'assignments':   wireAssignments(); break;
    case 'library':       wireLibrary(); break;
    case 'profile':       wireProfile(); break;
    case 'notifications': wireNotifications(); break;
    case 'goals':         wireGoals(); break;
    case 'help':          wireHelp(); break;
    case 'settings':      wireSettings(); break;
  }
}

let swipeStartX = null;
function wireTimetable() {
  $$('[data-open-class]').forEach(b => b.addEventListener('click', () => {
    const [d, p] = b.dataset.openClass.split('-').map(Number);
    openClassSheet(d, p);
  }));
  $$('[data-week]').forEach(b => b.addEventListener('click', () => {
    state.weekOffset += parseInt(b.dataset.week, 10);
    render();
    toast(state.weekOffset === 0 ? 'This week' : (state.weekOffset > 0 ? `Week +${state.weekOffset}` : `Week ${state.weekOffset}`));
  }));
  // Swipe between weeks on the timetable grid
  const grid = $('#tt-grid');
  if (grid) {
    grid.addEventListener('touchstart', (e) => { swipeStartX = e.touches[0].clientX; }, { passive: true });
    grid.addEventListener('touchend', (e) => {
      if (swipeStartX === null) return;
      const dx = e.changedTouches[0].clientX - swipeStartX;
      swipeStartX = null;
      if (Math.abs(dx) > 60) {
        state.weekOffset += dx < 0 ? 1 : -1;
        render();
        toast(state.weekOffset === 0 ? 'This week' : (state.weekOffset > 0 ? `Week +${state.weekOffset}` : `Week ${state.weekOffset}`));
      }
    });
  }
}

/* ============================================================
   FULLSCREEN
   ============================================================ */
function setFullscreen(on) {
  document.body.classList.toggle('is-fullscreen', on);
  const lbl = $('#fs-label');
  if (lbl) lbl.textContent = on ? 'Exit' : 'Fullscreen';
  const ic = $('#fs-toggle [data-icon]');
  if (ic) {
    ic.dataset.icon = on ? 'x' : 'grid';
    if (window.Icons) window.Icons.render($('#fs-toggle'));
  }
}
$('#fs-toggle').addEventListener('click', () => {
  const on = !document.body.classList.contains('is-fullscreen');
  setFullscreen(on);
  if (on) {
    document.documentElement.requestFullscreen?.().catch(() => {});
  } else if (document.fullscreenElement) {
    document.exitFullscreen().catch(() => {});
  }
});
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) setFullscreen(document.body.classList.contains('is-fullscreen'));
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && document.body.classList.contains('is-fullscreen') && !document.fullscreenElement) {
    setFullscreen(false);
  }
});

/* === Init === */
function init() {
  if (/[?&]fullscreen=1/.test(location.search)) setFullscreen(true);
  const r = (location.hash.replace(/^#\/?/, '') || 'home');
  state.route = r;
  // Bypass sign-in via query param ?demo=1
  if (/[?&]demo=1/.test(location.search)) state.signedIn = true;
  render();
}

if (document.readyState !== 'loading') init();
else document.addEventListener('DOMContentLoaded', init);
</script>
