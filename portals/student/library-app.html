<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Library · Student portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="../../device-scale.js" defer></script>
<script src="app.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-portal-kit="student" data-portal-screen="library" data-kit-nav="student" data-screen="library">

<main class="kit-stage phone-bg">
  <div class="device-phone">
    <div class="screen">
      <div class="ps-screen">

        <div class="ps-statusbar"><span>08:14</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

        <div class="ps-appbar">
          <button class="nav-btn" onclick="history.back()" aria-label="Back"><span data-icon="back" data-icon-size="20"></span></button>
          <h1>Library</h1>
        </div>

        <div class="ps-scroll">
          <div class="lib-actions">
            <button type="button" class="lib-borrow-btn" data-lib-scan>
              <span data-icon="qr" data-icon-size="18"></span> Borrow a book
            </button>
          </div>
          <div class="lib-borrows" data-lib-borrows></div>
          <div style="height: 24px;"></div>
        </div>

        <div class="ps-tabbar">
          <a class="ps-tab" href="dashboard.html"><span data-icon="home"></span>Home</a>
          <a class="ps-tab" href="timetable-app.html"><span data-icon="calendar"></span>Timetable</a>
          <a class="ps-tab" href="assignments.html"><span data-icon="check"></span>Tasks</a>
          <a class="ps-tab active" href="library-app.html"><span data-icon="book"></span>Library</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="lib-modal" data-lib-modal role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="lib-modal-title">
  <div class="lib-modal-inner">
    <h2 id="lib-modal-title">Scan barcode</h2>
    <p class="helper">Tap the scan window to simulate reading the barcode on the inside of the front cover.</p>
    <button type="button" class="lib-scan-target" data-lib-modal-scan aria-label="Simulate barcode scan">
      <span>Tap here<br>to scan</span>
    </button>
    <div data-lib-modal-result aria-live="polite"></div>
    <div class="lib-modal-actions">
      <button type="button" class="btn-sec" data-lib-modal-close>Close</button>
    </div>
  </div>
</div>

</body>
</html>
