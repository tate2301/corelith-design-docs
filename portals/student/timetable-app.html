<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Timetable · Student portal · Huchu</title>
<link rel="stylesheet" href="../../tokens.css" />
<link rel="stylesheet" href="../../components.css" />
<link rel="stylesheet" href="../../portal-shell.css" />
<link rel="stylesheet" href="app.css" />
<script src="../../icons.js" defer></script>
<script src="../../device-scale.js" defer></script>
<script src="app.js" defer></script>
<link rel="stylesheet" href="../../huchu-nav.css" />
<script src="../../huchu-nav.js" defer></script>
</head>
<body data-portal-kit="student" data-portal-screen="timetable" data-kit-nav="student" data-screen="timetable">

<main class="kit-stage phone-bg">
  <div class="device-phone">
    <div class="screen">
      <div class="ps-screen">

        <div class="ps-statusbar"><span>08:14</span><span class="right"><span data-icon="signal"></span><span data-icon="wifi"></span><span data-icon="battery"></span></span></div>

        <div class="ps-appbar">
          <button class="nav-btn" onclick="history.back()" aria-label="Back"><span data-icon="back" data-icon-size="20"></span></button>
          <h1>Timetable</h1>
        </div>

        <div class="ps-scroll">
          <div class="tt-tabs" role="tablist" data-tt-tabs aria-label="Timetable day selector">
            <button type="button" role="tab" aria-selected="false" data-tt-tab="today">Today</button>
            <button type="button" role="tab" aria-selected="false" data-tt-tab="tomorrow">Tomorrow</button>
            <button type="button" role="tab" aria-selected="false" data-tt-tab="week">Next week</button>
          </div>

          <div class="tt-day-label" data-tt-day-label aria-live="polite"></div>
          <div class="tt-list" data-tt-list></div>
          <div style="height: 24px;"></div>
        </div>

        <div class="ps-tabbar">
          <a class="ps-tab" href="dashboard.html"><span data-icon="home"></span>Home</a>
          <a class="ps-tab active" href="timetable-app.html"><span data-icon="calendar"></span>Timetable</a>
          <a class="ps-tab" href="assignments.html"><span data-icon="check"></span>Tasks</a>
          <a class="ps-tab" href="library-app.html"><span data-icon="book"></span>Library</a>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="tt-drawer" data-tt-drawer role="dialog" aria-modal="true" aria-hidden="true" aria-label="Period detail">
  <div class="tt-drawer-inner">
    <button class="tt-drawer-close" type="button" data-tt-drawer-close aria-label="Close">Close</button>
    <div data-tt-drawer-body></div>
  </div>
</div>

</body>
</html>
